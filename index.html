<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HexaSort Web</title>
<style>
  /* Канвас по центру окна. Пропорции больше не заданы в CSS: логическую высоту
     ставит layoutUi() по форме окна (Phase 24), иначе на телефоне 9:19.5 игра
     шла в полосе посреди экрана. Браузер берёт пропорцию из атрибутов канваса. */
  html, body {
    height: 100%;
    margin: 0;
    background: #1E2A3A;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    /* вырез и «шторка» телефона: кнопки не должны уезжать под них */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;          /* нужно для Pointer Events на телефоне (Phase 2) */
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="game" width="720" height="900"></canvas>
<script>
'use strict';

// ============================================================================
// CONFIG — все игровые числа и палитра. Баланс крутится только отсюда.
// ============================================================================
const CONFIG = {
  canvas:    { width: 720, height: 900 },
  // Текущий язык интерфейса (Phase 23). Ставится по браузеру в init и
  // переопределяется выбором игрока; сами тексты — в секции I18N.
  lang:      'ru',
  // Поле растёт кольцами по счёту: 19 -> 37 -> 61 ячейки (ADR-0004).
  // Гексы при этом уменьшаются, чтобы поле целиком помещалось в канвас.
  board:     { startFillPercent: 0.30,
               // Лестница сложности (ADR-0007, пересмотрена по замерам Phase 21).
               // Цвета добавляются по одному, а не по три: замер показал, что
               // число цветов — единственный настоящий рычаг сложности, и скачок
               // +3 обрывал партию сразу после порога, где бы тот ни стоял.
               // Радиус в соседних ступенях повторяется намеренно: и рост поля,
               // и набор цветов берут последнюю подходящую ступень, поэтому
               // промежуточные ступени — это числа, а не правка логики.
               // Пересмотрена в Phase 25 по первому внешнему playtest: «проиграть
               // невозможно, скучно после 40 минут». Замер подтверждал — сильная
               // игра шла 957 ходов. Стало пять цветов на старте и вдвое более
               // тесная лестница: партия мастера 514 ходов, счёт 5150 → 2508.
               radiusSteps: [
                 { fromScore: 0,    radius: 2, colors: 5  },
                 { fromScore: 500,  radius: 3, colors: 6  },   // второе кольцо
                 { fromScore: 900,  radius: 3, colors: 7  },
                 { fromScore: 1400, radius: 4, colors: 8  },   // третье кольцо
                 { fromScore: 2000, radius: 4, colors: 9  },
                 { fromScore: 2600, radius: 4, colors: 10 }
               ] },
  hex:       { orientation: 'flat', maxSize: 55 },
  // Ступени стопок. Состав руки за партию **переворачивается**: начинается с
  // простых одноцветных, заканчивается четырёхцветными (схема пользователя,
  // Phase 28). Раньше лестница замирала на 500 очках навсегда, и вторая половина
  // партии не усложнялась вообще — отсюда «дохожу до 3000 без напряжения».
  //
  // Сколько блоков у типа — в blocksByType: добавить пятиблочные стопки станет
  // строчкой в конфиге, а не правкой логики. Высота подбирается под выпавший тип
  // (quad нужно >= 8 фишек при minBlockSize 2), поэтому веса соблюдаются точно
  // и тип не «проседает» (ADR-0004).
  stack:     { minBlockSize: 2,
               blocksByType: { mono: 1, duo: 2, tri: 3, quad: 4 },
               stages: [
                 { fromScore: 0,    weights: { mono: 50, duo: 30, tri: 15, quad: 5  }, minHeight: 2, maxHeight: 5 },
                 { fromScore: 800,  weights: { mono: 35, duo: 30, tri: 25, quad: 10 }, minHeight: 3, maxHeight: 6 },
                 { fromScore: 2500, weights: { mono: 20, duo: 25, tri: 30, quad: 25 }, minHeight: 4, maxHeight: 7 },
                 { fromScore: 7500, weights: { mono: 5,  duo: 15, tri: 30, quad: 50 }, minHeight: 5, maxHeight: 9 }
               ],
               // Стартовое поле раскладывается отдельно и всегда простыми стопками.
               // Ступени выше — про руку: если раздать ими ещё и доску, партия
               // иногда обрывается в первые полминуты (замер: 3 % партий до 250
               // очков), а первые секунды решают, останется ли новичок.
               startBoard: { weights: { mono: 100 }, minHeight: 2, maxHeight: 4 } },
  // Порог сгорания тоже растёт (Phase 28): к концу партии собрать блок труднее.
  // Очки при этом по-прежнему считаются от scoring.burnBaseTiles, поэтому
  // сгорание при поднятом пороге сразу даёт больше базовой ставки.
  merge:     { thresholdSteps: [
                 { fromScore: 0,    threshold: 10 },
                 { fromScore: 1500, threshold: 11 },
                 { fromScore: 3000, threshold: 12 }
               ],
               maxWaveIterations: 100 },
  // Набор цветов расширяется вместе с полем (см. board.radiusSteps): 4 -> 7 -> 10.
  // Порядок важен: первые четыре — самые контрастные.
  colors:    { palette: [
                 '#E74C3C',   // 1 красный
                 '#3498DB',   // 2 синий
                 '#2ECC71',   // 3 зелёный
                 '#F1C40F',   // 4 жёлтый
                 '#9B59B6',   // 5 фиолетовый
                 '#E67E22',   // 6 оранжевый
                 '#1ABC9C',   // 7 бирюзовый
                 '#E84393',   // 8 розовый
                 '#ECF0F1',   // 9 белый
                 '#8D6E63'    // 10 коричневый (осветлён — на тёмном фоне читается)
               ] },
  // Очки начисляются только за сгоревшие фишки — перелив сам по себе ничего не даёт.
  // Первые burnBaseTiles фишек по базовой ставке, каждая сверх — по повышенной
  // (10 -> 10, 13 -> 16, 20 -> 30). Множителя цепочки нет (ADR-0004).
  // Комбо платит монетами, а не очками: второе звено цепочки даёт +comboCoinBonus,
  // третье +2×, и так далее. Множитель очков остаётся отменённым.
  //
  // Монеты платят только за фишки СВЕРХ порога сгорания (ADR-0007): блок из 10
  // не даёт ничего, 13 даёт 3, 25 даёт 15. Раньше платили за каждую фишку, и за
  // партию набегало полторы тысячи монет при цене буста 25 — кошелёк ничего не
  // ограничивал. Теперь монета — награда за крупный блок, а не за факт игры.
  // Phase 25: за партию набегало 937 монет при цене буста 25 — тридцать семь
  // покупок, то есть бустами вытаскивалась любая позиция. Порог поднят, комбо
  // платит вдвое меньше: около 180 монет за партию, шесть покупок.
  scoring:   { burnBaseTiles: 10, pointsPerTileBase: 1, pointsPerTileOver: 2,
               coinsPerBurnedTile: 1, coinsFreeTiles: 12, comboCoinBonus: 5 },
  // Драма-менеджер выдачи (Phase 25, ADR-0008). Пришёл на смену «милосердию»,
  // которое подыгрывало в начале партии: замер показал, что на выживаемость оно
  // не влияет вовсе, а ощущение «игра поддакивает новичку» давало.
  //
  // Теперь подыгрывание работает там, где оно драматургически уместно — когда
  // поле почти забито, — и **ограничено**: не больше maxRescuesPerGame раз за
  // партию, не два раза подряд и только пока счёт ниже rescueUntilScore. Без
  // ограничений вернулась бы ровно та жалоба, с которой началась фаза:
  // «проиграть невозможно».
  //
  // Обратная сторона — давление: после pressureFromScore очков первая стопка
  // раздачи иногда нарочно не подходит ни к одной стопке поля.
  drama:     { rescueFreeCells: 3,      // столько свободных ячеек и меньше — беда
               maxRescuesPerGame: 3,
               rescueUntilScore: 1500,  // дальше игрок выплывает сам
               rescueSlots: 2,          // сколько стопок раздачи подчиняется выручке:
                                        // одной мало — замер показал, что на исход
                                        // партии она почти не влияет (ADR-0008)
               pressureFromScore: 700,
               pressureChance: 0.35,
               pressureSlots: 1 },      // давить всей рукой нельзя: рука перестанет
                                        // быть выбором и станет наказанием
  // Анимации. Всё, что ниже пустой строки, — juice (Phase 15): обнуление любого
  // числа гасит соответствующий эффект, логика игры от них не зависит.
  animation: { waveStepMs: 340, burnFlashMs: 280, landingMs: 150,
               landingScale: 1.22, burnFlashGrow: 0.45, ringGrowMs: 420,
               snapMs: 200,          // доворот поля до грани — должен быть отзывчивым
               // Слияние стопок: фишки летят дугой, по одной, с задержкой
               flowStagger: 0.07,    // сдвиг старта соседних фишек, доли шага
               flowArc: 34,          // высота дуги, px
               flowLift: 0.14,       // приближение фишки на вершине дуги
               flowFlutter: 0.16,    // покачивание бумаги в полёте, радианы
               flowShadow: 0.35,     // плотность тени под летящей фишкой
               // Бусты: стопка летит целиком, «убрать» рассыпает её на осколки,
               // «пересдача» меняет руку — старые стопки уезжают, новые падают
               boostMoveMs: 320, boostArc: 46, boostScatterPerTile: 3,
               handSwapMs: 300, handSwapRise: 60,

               particlesPerBurn: 14, particleMs: 620, particleSpeed: 190,
               particleGravity: 520, particleSize: 5,
               floatMs: 820, floatRise: 86,     // всплывающее «+N очков»
               counterMs: 420,                  // счёт и кошелёк догоняют значение
               shakeMs: 260, shakeAmp: 9, shakeFromTiles: 15,
               overlayFadeMs: 260 },
  // Звук. Синтезируется кодом: внешних файлов в проекте быть не может (ADR-0001).
  // master: 0 глушит игру целиком, gain: 0 у голоса гасит один звук — как у juice.
  //
  // volumeSfx и music.volume — это регуляторы экрана настроек (Phase 19), а не
  // калибровка: множители 0…1 поверх master и music.gain. Единица означает
  // «как задумано», поэтому подбор тембра и подбор громкости игроком не спорят.
  audio:     { master: 0.35, volumeSfx: 1,
               maxFlowTicks: 6,      // длинный перелив не строчит очередью
               minGapMs: 30,         // одинаковые звуки ближе этого сливаются в один
               comboSteps: [0, 2, 4, 7, 9, 12],   // пентатоника, полутоны

               // Тембр «бумага и дерево» под стиль «Бумажный крафт». Дерево — это
               // короткая атака и падающий питч; бумага — полоса шума, а не тон.
               // Значения по умолчанию: их берёт голос, который своих не задал.
               woodDrop: 0.45,       // во сколько раз питч падает за время звука
               woodDecay: 0.18,      // затухание «тука», с
               paperBand: 2600,      // центр полосы шороха бумаги, Гц
               paperQ: 0.9,          // ширина полосы: меньше — шире и глуше
               paperDecay: 0.13,     // затухание шороха, с

               // Голос каждого события — единственное место, где правится тембр.
               // gain — громкость; freq/drop/decay/type — тон дерева (drop больше
               // единицы значит, что питч не падает, а растёт); band/q — полоса
               // шороха бумаги; noiseGain/harmonic — громкость доп. слоя.
               voices: {
                 // Два самых частых коротких звука. Низкая широкая полоса даёт
                 // шорох картона; высокая узкая давала щелчок (правка по playtest).
                 // Взятие стопки звучало щелчком не из-за частоты, а из-за
                 // мгновенной атаки (правка по playtest, Phase 23). Теперь
                 // громкость нарастает за attack — это вздох, а не «чик».
                 pick:   { gain: 0.30, band: 600, q: 0.40, decay: 0.28, attack: 0.03 },
                 snap:   { gain: 0.20, band: 750, q: 0.55, decay: 0.16 },

                 place:  { gain: 0.80, freq: 300, decay: 0.14,
                           noiseGain: 0.5, band: 1800, noiseDelay: 0.01 },
                 flow:   { gain: 0.35, freq: 450, step: 36, decay: 0.07,
                           drop: 0.7, type: 'sine' },
                 burn:   { gain: 1.00, freq: 300, decay: 0.26, drop: 0.5,
                           sizeCurve: 0.4,     // насколько питч падает с размером блока
                           decayPerSize: 0.06, // крупный блок звучит ещё и дольше
                           harmonic: 0.35, harmonicRatio: 2, harmonicDecay: 0.12,
                           noiseGain: 0.6, band: 1400, noiseDecay: 0.22, noiseDelay: 0.02 },
                 combo:  { gain: 0.90, freq: 600, decay: 0.30, drop: 0.85,
                           harmonic: 0.4, harmonicRatio: 1.5,
                           harmonicDecay: 0.22, harmonicDelay: 0.05 },
                 ring:   { gain: 0.80, freq: 150, decay: 0.60, drop: 2, type: 'sine',
                           noiseGain: 0.5, band: 900, noiseDecay: 0.5 },
                 boost:  { gain: 0.70, freq: 480, decay: 0.22, drop: 1.6, type: 'sine',
                           removeBand: 1200, removeQ: 0.5, removeDecay: 0.4,
                           rerollTicks: 3, rerollGain: 0.7, rerollBand: 2400,
                           rerollStep: 400, rerollDecay: 0.1, rerollDelay: 0.06 },
                 deny:   { gain: 0.60, freq: 165, decay: 0.12, drop: 0.9, type: 'sine' },
                 deal:   { gain: 0.45, ticks: 3, band: 2800, step: -300,
                           decay: 0.09, delay: 0.05 },
                 // полутоны финальной фразы: вверх при рекорде, иначе вниз
                 over:   { gain: 0.90, freq: 300, decay: 0.40, drop: 0.8, delay: 0.16,
                           record: [0, 4, 7], lost: [0, -3, -8] }
               },

               // Отправка эффектов в ту же комнату, что и музыка. Ноль — прежний
               // сухой звук; много — эффекты «уплывают» и теряют читаемость.
               roomSend: 0.18,

               // Музыка (Phase 18, переписана по docs/music-brief.md).
               // Не петля, а аранжировка: секции включают и выключают партии,
               // аккорды меняются сами, у партий по нескольку рисунков. Главное
               // требование брифа — музыка не стоит на месте и «дышит» каждые
               // 15–30 секунд, оставаясь при этом фоном, а не событием.
               //
               // Бесшовности добиваться не нужно: музыка синтезируется непрерывно,
               // а не склеивается из файла, поэтому точки склейки не существует.
               // Последняя секция просто возвращает набор партий к вступлению.
               music: { gain: 0.20,        // фон заметно тише эффектов
                        volume: 1,         // регулятор игрока (Phase 19), см. volumeSfx
                        tuning: 440,       // обычный строй
                        // Phase 26: тестировщики просят темп и динамику, и бриф
                        // пересмотрен под них (см. music-brief.md, раздел «Правка
                        // по playtest»). Прежний потолок 108 снят: 112 — всё ещё
                        // спокойный темп, но пульс уже слышен.
                        bpm: 112,
                        stepsPerBar: 8,    // восьмые в 4/4; шаг 0.268 с, такт 2.14 с
                        varyBars: 8,       // рисунок партии меняется раз в 8 тактов (17 с)

                        // Против «дёшево». Сухой одинокий осциллятор всегда звучит
                        // пищалкой; лечится тремя приёмами, и все бесплатные:
                        // комната (импульс генерируем кодом — файлов быть не может),
                        // пара расстроенных голосов вместо одного,
                        // и фильтр, который закрывается вместе с нотой.
                        reverbSec: 2.8, reverbDecay: 2.4, reverbMix: 0.55,
                        detuneCents: 7,     // уже — стерильно, шире — расстроенно
                        filterQ: 0.9,
                        filterOpen: 4.5,    // во сколько раз выше тона открыт фильтр в атаке
                        filterClose: 1.3,   // и до чего закрывается к концу ноты
                        filterTension: 0.8, // на тесном поле заметно ярче (Phase 26:
                                            // «стало опаснее» должно быть слышно)
                        panSpread: 0.55,    // разброс по стерео
                        velocityVary: 0.35, // разброс громкости: ровные ноты звучат механически

                        lookaheadMs: 220,  // как часто просыпается планировщик
                        scheduleAhead: 0.7,// на сколько секунд вперёд кладутся ноты
                        maxStepsPerPump: 8,// потолок: часы могут прыгнуть вперёд
                        roomyFrom: 8,      // свободных ячеек столько и больше — натяжение 0
                        tightAt: 3,        // столько и меньше — натяжение 1

                        // Гармония: тёплый мажор без тревоги, аккорд держится
                        // chordBars такта. Мелодические партии берут ноты из
                        // текущего аккорда, поэтому диссонансов нет по построению,
                        // а гармония меняется сама («меняется гармония» из брифа).
                        chordBars: 2,
                        chords: [
                          [0, 4, 7, 11],      // Imaj7
                          [9, 12, 16, 19],    // vi7
                          [5, 9, 12, 16],     // IVmaj7
                          [7, 11, 14, 18]     // Vmaj7
                        ],

                        // Мотивы — «несколько коротких, постоянно меняющихся между
                        // собой». at — шаг внутри такта, deg — ступень аккорда.
                        motifs: [
                          [{ at: 0, deg: 0 }, { at: 3, deg: 2 }, { at: 6, deg: 1 }],
                          [{ at: 2, deg: 1 }, { at: 5, deg: 3 }],
                          [{ at: 0, deg: 2 }, { at: 4, deg: 0 }, { at: 7, deg: 1 }],
                          [{ at: 1, deg: 3 }, { at: 6, deg: 2 }]
                        ],

                        // Аранжировка на 104 такта ≈ 4:20 — структура из брифа.
                        // Партии включаются и выключаются сами: инструмент
                        // появляется и исчезает, и это половина «дыхания».
                        // Phase 26: вступление вчетверо короче (12 → 4 такта) —
                        // тестировщики слышали начало партии как пустоту, — а грув
                        // (kick, brush, bass) вступает почти сразу и уходит только
                        // в последней секции.
                        arrangement: [
                          { bars: 4,  parts: ['texture', 'pad', 'piano'] },
                          { bars: 24, parts: ['texture', 'pad', 'piano', 'shaker', 'bass',
                                              'kick'] },
                          { bars: 28, parts: ['texture', 'pad', 'piano', 'shaker', 'bass',
                                              'kick', 'brush', 'kalimba', 'click'] },
                          { bars: 28, parts: ['texture', 'pad', 'marimba', 'shaker', 'bass',
                                              'kick', 'brush', 'kalimba', 'click'] },
                          { bars: 16, parts: ['texture', 'pad', 'piano', 'shaker', 'bass'] }
                        ],

                        // Партии. tone — щипковые и пад (musicVoice), noise —
                        // перкуссия и фактура (musicRustle). steps — рисунок внутри
                        // такта, несколько вариантов: раз в varyBars берётся
                        // следующий, и рисунок обновляется незаметно.
                        //
                        // Перкуссия стоит на слабых долях и заметно тише
                        // мелодических партий: бриф требует «почти незаметную»,
                        // без сильных ударов и без ощущения танца. Кика и малого
                        // нет вовсе — «Loud Drums» в списке запрещённого.
                        parts: {
                          // тепло под всем; фон, а не голос — потому и тихо,
                          // и фильтр открыт совсем немного
                          pad:     { kind: 'chord', level: 0.10, octave: -1,
                                     type: 'triangle', attack: 1.8, decay: 6.0, drop: 1,
                                     filterOpen: 1.6, every: 2 },
                          // «улыбка»: мягкая атака, без обертона — фетровое пианино
                          piano:   { kind: 'motif', level: 0.30, octave: 0,

// пустая надпись на экране хуже, чем видимое имя ключа.
function t(key) {
  const dict = I18N[CONFIG.lang] || I18N.ru;
  return dict[key] !== undefined ? dict[key] : key;
}

// Язык браузера: всё, кроме русского, получает английский
function detectLang() {
  try {
    const lang = (navigator.language || '').toLowerCase();
    return lang.indexOf('ru') === 0 ? 'ru' : 'en';
  } catch (e) {
    return 'ru';
  }
}

function setLang(lang) {
  if (!I18N[lang]) return false;
  CONFIG.lang = lang;
  return true;
}

// themes — визуальный стиль (Phase 12/14). Тема задаёт палитру, цвета интерфейса
// и три функции отрисовки: фон, пустая ячейка, фишка. Остальной render не знает,
// какой стиль включён, — он работает через CONFIG.ui и THEME.
//
// Из восьми вариантов пользователь выбрал «Бумажный крафт», остальные удалены.
// Структура на несколько тем оставлена: добавить стиль — это дописать объект,
// ничего не меняя в рендере (историю вариантов см. в git и styles-preview.html).
// ============================================================================
const THEMES = {

  // --- Бумажный крафт: фактура бумаги, неровные вырезанные края --------------
  paper: {
    name: 'Бумажный крафт',
    palette: ['#D1495B', '#3A7CA5', '#5B8C5A', '#E9C46A', '#8E7DBE',
              '#E07A5F', '#5AA9A3', '#C97BA0', '#F7F3E8', '#9C7A5B'],
    geometry: { scale: 0.84, layerOffset: 9 },
    ui: {
      bg: '#EFE6D5', cellFill: '#E2D6BF', cellStroke: '#C7B393',
      text: '#3B3226', textDim: '#8A7A63',
      highlightFill: '#F6EDD8', highlightStroke: '#8A7A63',
      overlayBg: 'rgba(239, 230, 213, 0.92)', overlayText: '#3B3226',
      cardFill: '#F6EDD8', cardShadow: 'rgba(90, 72, 48, 0.16)',
      buttonFill: '#3A7CA5', buttonFillDark: '#2C5F7F', buttonText: '#F7F3E8',
      coinColor: '#E9C46A'
    },
    boostBar: { fill: '#E2D6BF', fillActive: '#F6EDD8',
                stroke: '#C7B393', strokeActive: '#8A7A63' },

    // Матовая поверхность (Phase 22). Глянец на бумаге читается как пластик,
    // поэтому тень мягкая и почти без смещения.
    // Зерно на самих фишках было и убрано по playtest (Phase 23): крупинки
    // читались как случайные белые точки, а не как фактура. Фактура осталась
    // там, где работает, — на фоне.
    matte: { shadow: 'rgba(60, 45, 30, 0.18)', blur: 5, offsetY: 2 },

    // фон рисуется один раз и кэшируется: 7000 крупинок каждый кадр — дорого
    background(ctx) {
      ctx.fillStyle = '#EFE6D5';
      ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);
      for (let i = 0; i < 7000; i++) {
        ctx.fillStyle = render.noise(i, 3) > 0.5
          ? 'rgba(120,100,70,0.06)' : 'rgba(255,255,255,0.5)';
        ctx.fillRect(render.noise(i, 1) * CONFIG.canvas.width,
          render.noise(i, 2) * CONFIG.canvas.height, 2, 2);
      }
    },

    // края «вырезаны ножницами»: вершины гекса чуть дрожат по детерминированному шуму
    wobbleHex(ctx, cx, cy, size, seed) {
      const points = hexMath.hexCorners(cx, cy, size);
      ctx.beginPath();
      points.forEach((point, i) => {
        const dx = (render.noise(seed + i, 7) - 0.5) * 4.5;
        const dy = (render.noise(seed + i, 9) - 0.5) * 4.5;
        if (i === 0) ctx.moveTo(point.x + dx, point.y + dy);
        else ctx.lineTo(point.x + dx, point.y + dy);
      });
      ctx.closePath();
    },

    emptyCell(ctx, cell, size, fill, stroke) {
      const seed = cell.q * 17 + cell.r * 43;
      THEMES.paper.wobbleHex(ctx, cell.pixelX, cell.pixelY, size, seed);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    },

    tile(ctx, x, y, size, color, isTop, seed) {
      const m = THEMES.paper.matte;
      ctx.save();
      ctx.shadowColor = m.shadow;
      ctx.shadowBlur = m.blur;
      ctx.shadowOffsetY = m.offsetY;
      THEMES.paper.wobbleHex(ctx, x, y, size, seed);
      ctx.fillStyle = isTop ? color : render.shade(color, -0.12);
      ctx.fill();
      ctx.restore();
      THEMES.paper.wobbleHex(ctx, x, y, size, seed);
      ctx.strokeStyle = render.shade(color, -0.35);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
};

let THEME = THEMES.paper;

// ============================================================================
// Platform — единственная точка доступа к сохранению и будущим SDK.
// Игра нигде не обращается к localStorage напрямую.
// ============================================================================
const Platform = {
  // Общая работа с хранилищем: приватный режим или отключённое хранилище не должны
  // ломать игру — просто живём без сохранений.
  save(key, value) {
    try {
      localStorage.setItem(key, String(value));
    } catch (e) {
      /* нет доступа к хранилищу — игнорируем */
    }
  },
  loadNumber(key) {
    try {
      const value = parseInt(localStorage.getItem(key), 10);
      return Number.isFinite(value) ? value : 0;
    } catch (e) {
      return 0;
    }
  },

  saveBest(value) { Platform.save(CONFIG.storage.bestKey, value); },
  loadBest() { return Platform.loadNumber(CONFIG.storage.bestKey); },

  // Кошелёк живёт между партиями, как рекорд
  saveCoins(value) { Platform.save(CONFIG.storage.coinsKey, value); },
  loadCoins() { return Platform.loadNumber(CONFIG.storage.coinsKey); },

  // Настройки игрока (Phase 19) — единственное, что хранится объектом, поэтому
  // JSON, а не loadNumber. Битое или отсутствующее значение не должно ронять игру:
  // возвращаем null, а значения по умолчанию решает вызывающий (applySettings).
  saveSettings(values) {
    Platform.save(CONFIG.storage.settingsKey, JSON.stringify(values));
  },
  loadSettings() {
    try {
      const raw = localStorage.getItem(CONFIG.storage.settingsKey);
      const parsed = raw ? JSON.parse(raw) : null;
      return parsed && typeof parsed === 'object' ? parsed : null;
    } catch (e) {
      return null;
    }
  },

  // Смена экономики обесценивает прежний прогресс: в первой шкале сгорание
  // давало 100 очков, во второй — 10, а в третьей изменилась ещё и формула
  // монет (ADR-0007). Сбрасываем **и рекорд, и кошелёк**: сравнивать их с
  // новыми числами нельзя, а копившиеся тысячи монет обесценили бы бусты.
  migrateEconomy() {
    const stored = Platform.loadNumber(CONFIG.storage.economyKey);
    if (stored >= CONFIG.storage.economyVersion) return false;
    Platform.saveBest(0);
    Platform.saveCoins(0);
    Platform.save(CONFIG.storage.economyKey, CONFIG.storage.economyVersion);
    return true;
  },
  showAd() { /* заглушка под SDK Яндекс/CrazyGames (v2) */ },

  // --- Обязательная разметка для платформы (Phase 20) -----------------------
  // Всё ниже молча ничего не делает без SDK: локально и на Pages его нет вовсе.

  // «Игра загрузилась, можно играть». Без этого вызова модерация Яндекса игру
  // не пропускает, а у игрока висит прелоадер платформы поверх готовой игры.
  gameReady() {
    try {
      const features = Platform.sdk && Platform.sdk.features;
      if (!features || !features.LoadingAPI) return false;
      features.LoadingAPI.ready();
      return true;
    } catch (e) {
      return false;
    }
  },

  // Язык игрока на платформе (Phase 23). Уважаем ручной выбор: если игрок уже
  // ткнул RU или EN в настройках, платформа его не переопределяет.
  applyPlatformLang(sdk) {
    const saved = Platform.loadSettings();
    if (saved && saved.lang) return false;
    try {
      const lang = sdk && sdk.environment && sdk.environment.i18n &&
        sdk.environment.i18n.lang;
      if (!lang) return false;
      const applied = setLang(lang.indexOf('ru') === 0 ? 'ru' : 'en');
      if (applied) requestRender();
      return applied;
    } catch (e) {
      return false;
    }
  },

  // Идёт ли партия прямо сейчас. Платформа требует строгого чередования
  // start/stop, поэтому повторное событие того же вида не отправляется.
  // Оверлей конца, экран настроек и рейтинг — это «партия не идёт».
  gameplayRunning: false,
  gameplay(running) {
    if (Platform.gameplayRunning === running) return false;
    Platform.gameplayRunning = running;
    try {
      const features = Platform.sdk && Platform.sdk.features;
      if (!features || !features.GameplayAPI) return false;
      if (running) features.GameplayAPI.start();
      else features.GameplayAPI.stop();
      return true;
    } catch (e) {
      return false;
    }
  },

  // Пауза приходит от платформы (реклама, уход со вкладки). Игра пошаговая,
  // останавливать нечего — но звук замолчать обязан, иначе музыка продолжит
  // играть поверх рекламы.
  onPause() {
    Platform.gameplay(false);
    Audio.stopMusic();
    return true;
  },
  onResume() {
    Audio.startMusic();
    if (!GameState.isGameOver && !GameState.settings &&
        !(GameState.leaderboard && GameState.leaderboard.open)) {
      Platform.gameplay(true);
    }
    return true;
  },

  // Вибрация (Phase 18). На десктопе гаптики нет, и это не ошибка — просто
  // тихо ничего не делаем, как и с недоступным хранилищем.
  vibrate(pattern) {
    if (!CONFIG.haptics.enabled) return false;
    try {
      if (typeof navigator === 'undefined' || !navigator.vibrate) return false;
      navigator.vibrate(pattern);
      return true;
    } catch (e) {
      return false;
    }
  },

  // --- Глобальный рейтинг через SDK платформы (ADR-0005) --------------------
  // Игра остаётся одним файлом: SDK не входит в артефакт и подгружается только
  // на домене Яндекса. Любая ошибка платформы не должна ломать партию.
  sdk: null,
  leaderboards: null,

  onYandexHost() {
    try {
      return CONFIG.platform.yandexHosts.some(host => location.host.endsWith(host));
    } catch (e) {
      return false;
    }
  },

  initPlatform() {
    if (!Platform.onYandexHost()) return false;
    const script = document.createElement('script');
    script.src = CONFIG.platform.sdkUrl;
    script.onload = () => {
      // YaGames появляется глобально после загрузки скрипта
      if (typeof YaGames === 'undefined') return;
      YaGames.init()
        .then(sdk => {
          Platform.sdk = sdk;
          Platform.gameReady();        // обязательный сигнал: игра готова
          Platform.applyPlatformLang(sdk);
          // SDK появляется позже первой партии, и флаг к этому моменту уже
          // поднят — сбрасываем, иначе start() платформе так и не уйдёт
          Platform.gameplayRunning = false;
          Platform.gameplay(true);
          // платформа сама просит паузу — на рекламе и при уходе со вкладки
          if (sdk.on) {
            sdk.on('game_api_pause', Platform.onPause);
            sdk.on('game_api_resume', Platform.onResume);
          }
          return sdk.getLeaderboards();
        })
        .then(leaderboards => { Platform.leaderboards = leaderboards; })
        .catch(() => { /* платформа недоступна — играем без рейтинга */ });
    };
    document.head.appendChild(script);
    return true;
  },

  // Отправить результат. Молча ничего не делает, если рейтинга нет.
  submitScore(score) {
    if (!Platform.leaderboards || score <= 0) return false;
    try {
      Platform.leaderboards.setLeaderboardScore(CONFIG.platform.leaderboardName, score);
      return true;
    } catch (e) {
      return false;
    }
  },

  // Прочитать топ и место игрока. Возвращает промис с данными или с признаком,
  // что рейтинг недоступен (локальная версия).
  fetchLeaderboard() {
    if (!Platform.leaderboards) {
      return Promise.resolve({ available: false, entries: [] });
    }
    return Platform.leaderboards
      .getLeaderboardEntries(CONFIG.platform.leaderboardName, {
        quantityTop: CONFIG.platform.leaderboardTop,
        includeUser: true
      })
      .then(result => ({
        available: true,
        playerRank: result.userRank || 0,
        entries: (result.entries || []).map(entry => ({
          rank: entry.rank,
          score: entry.score,
          name: (entry.player && entry.player.publicName) || t('player')
        }))
      }))
      .catch(() => ({ available: false, entries: [] }));
  }
};

// ============================================================================
// Audio — единственная точка доступа к Web Audio API. Игра нигде не создаёт
// контекст сама и не знает, из чего сложен звук: наружу торчат события, а не
// синтез. Всё синтезируется кодом — внешних файлов в проекте быть не может
// (ADR-0001). Ошибка звука не должна ломать партию, поэтому throw наружу нет.
// Имя перекрывает встроенный конструктор Audio (элемент audio): он не нужен,
// загружать через него всё равно нечего.
// ============================================================================
const Audio = {
  ctx: null,
  master: null,
  noise: null,     // буфер шума под «бумажные» звуки, готовится один раз
  lastAt: {},      // когда в последний раз играл звук с таким именем

  // Контекст создаётся только по жесту пользователя — раньше браузер его не даст.
  // Зовётся из pointerdown и keydown; повторный вызов лишь будит уснувший контекст.
  unlock() {
    if (Audio.ctx) {
      try {
        if (Audio.ctx.state === 'suspended') Audio.ctx.resume();
      } catch (e) {
        /* контекст уже живой — будить нечего */
      }
      return true;
    }
    try {
      const Ctor = typeof AudioContext !== 'undefined' ? AudioContext
        : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if (!Ctor) return false;
      Audio.ctx = new Ctor();
      Audio.master = Audio.ctx.createGain();
      Audio.master.gain.value = CONFIG.audio.master;
      Audio.master.connect(Audio.ctx.destination);
      // Шина эффектов отдельно от музыки (Phase 19): иначе регулятор «Звуки»
      // приглушал бы и фон, ведь master общий для всего.
      Audio.sfxOut = Audio.ctx.createGain();
      Audio.sfxOut.gain.value = CONFIG.audio.volumeSfx;
      Audio.sfxOut.connect(Audio.master);
      Audio.buildRoom();
      Audio.noise = Audio.makeNoise();
      Audio.startMusic();      // фон заводится тем же первым жестом
      return true;
    } catch (e) {
      Audio.ctx = null;   // без звука играть можно, без игры — нет
      return false;
    }
  },

  // Комната. Сухой синтез звучит дёшево: без отражений ухо слышит пищалку, а не
  // инструмент в помещении. Импульс генерируем кодом — звуковых файлов в проекте
  // быть не может (ADR-0001). Музыка уходит сюда целиком, эффекты — долей roomSend:
  // им нужна читаемость, расплывшийся щелчок хуже сухого.
  buildRoom() {
    const ctx = Audio.ctx;
    const m = CONFIG.audio.music;
    Audio.room = ctx.createConvolver();
    Audio.room.buffer = Audio.makeImpulse(m.reverbSec, m.reverbDecay);
    Audio.roomMix = ctx.createGain();
    Audio.roomMix.gain.value = m.reverbMix;
    Audio.room.connect(Audio.roomMix);
    Audio.roomMix.connect(Audio.master);
    Audio.sfxSend = ctx.createGain();
    Audio.sfxSend.gain.value = CONFIG.audio.roomSend;
    Audio.sfxSend.connect(Audio.room);
    // отражения эффектов идут после их регулятора: выключенные звуки не должны
    // оставлять после себя реверб
    Audio.sfxOut.connect(Audio.sfxSend);
  },

  // Импульс комнаты — затухающий шум в двух каналах. Каналы разные, иначе
  // отражения сойдутся в точку посередине и стерео пропадёт.
  makeImpulse(seconds, decay) {
    const ctx = Audio.ctx;
    const length = Math.max(1, Math.floor(ctx.sampleRate * seconds));
    const buffer = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const data = buffer.getChannelData(channel);
      let seed = 7 + channel;
      for (let i = 0; i < data.length; i++) {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        data[i] = (seed / 2147483648 - 1) * Math.pow(1 - i / data.length, decay);
      }
    }
    return buffer;
  },

  // Полсекунды шума хватает на любой шорох. Генерируем один раз: делать буфер
  // в момент события — это аллокация на каждый звук.
  // Свой генератор, а не Math.random: в логике игры его быть не должно.
  makeNoise() {
    const ctx = Audio.ctx;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let seed = 1;
    for (let i = 0; i < data.length; i++) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      data[i] = seed / 2147483648 - 1;
    }
    return buffer;
  },

  // Общая громкость игры. Экран настроек её не трогает: игроку даны раздельные
  // регуляторы эффектов и музыки, а master остаётся калибровкой.
  setMaster(value) {
    CONFIG.audio.master = value;
    if (Audio.master) Audio.master.gain.value = value;
  },

  // Регуляторы экрана настроек (Phase 19). Это множители 0…1 поверх калибровки,
  // поэтому 1 звучит ровно так, как было до фазы. Меняются на живом контексте:
  // игрок должен слышать результат, не дожидаясь следующего звука.
  setSfxVolume(value) {
    CONFIG.audio.volumeSfx = value;
    if (Audio.sfxOut) Audio.sfxOut.gain.value = value;
    return CONFIG.audio.volumeSfx;
  },

  // У музыки регулятор ещё и выключатель: на нуле планировщик незачем крутить
  // впустую, а при возврате громкости он заводится снова.
  setMusicVolume(value) {
    const m = CONFIG.audio.music;
    m.volume = value;
    if (Audio.music.out) Audio.music.out.gain.value = m.gain * m.volume;
    if (!value) {
      Audio.stopMusic();
    } else if (!Audio.music.timer) {
      Audio.startMusic();
    }
    return m.volume;
  },

  // --- Примитивы синтеза ----------------------------------------------------

  // Все числа тембра лежат в CONFIG.audio.voices — здесь только их применение
  voice(name) {
    return CONFIG.audio.voices[name] || {};
  },

  // Громкость звука с учётом общей. Ноль означает «не играть вовсе».
  gainFor(name) {
    return CONFIG.audio.master * (Audio.voice(name).gain || 0);
  },

  // Регулятор «Звуки» на нуле — узлы не строим вовсе: они всё равно прозвучали
  // бы в тишину, а на слабом телефоне это лишняя работа на каждое событие.
  sfxOn() {
    return CONFIG.audio.volumeSfx > 0;
  },

  // Одинаковый звук не чаще, чем раз в minGapMs: за один waveCommit может
  // сгореть несколько ячеек, а три одинаковых «тука» в один сэмпл дают щелчок.
  ready(name) {
    if (!Audio.ctx || !Audio.sfxOn() || !Audio.gainFor(name)) return false;
    const now = Audio.ctx.currentTime * 1000;
    const last = Audio.lastAt[name];
    if (last !== undefined && now - last < CONFIG.audio.minGapMs) return false;
    Audio.lastAt[name] = now;
    return true;
  },

  // «Дерево»: короткая атака, падающий питч, экспоненциальное затухание.
  // drop больше единицы означает, что питч не падает, а растёт.
  // mul (а не gain) — множитель для дополнительных слоёв: так объект голоса
  // целиком можно передать сюда, и его собственный gain не удвоится.
  tone(name, freq, opts) {
    const o = opts || {};
    const gain = Audio.gainFor(name) * (o.mul || 1);
    if (!Audio.ctx || !gain || !Audio.sfxOn()) return false;
    const ctx = Audio.ctx;
    const at = ctx.currentTime + (o.delay || 0);
    const dur = o.decay || CONFIG.audio.woodDecay;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(freq, at);
    osc.frequency.exponentialRampToValueAtTime(freq * (o.drop || CONFIG.audio.woodDrop), at + dur);
    // до нуля экспонентой нельзя, поэтому гасим до тысячной доли
    env.gain.setValueAtTime(gain, at);
    env.gain.exponentialRampToValueAtTime(gain * 0.001, at + dur);
    osc.connect(env);
    env.connect(Audio.sfxOut);      // регулятор «Звуки», а за ним доля в комнату
    osc.start(at);
    osc.stop(at + dur);
    return true;
  },

  // «Бумага»: полоса шума вместо тона — этим шорох и отличается от «тука»
  rustle(name, opts) {
    const o = opts || {};
    const gain = Audio.gainFor(name) * (o.mul || 1);
    if (!Audio.ctx || !gain || !Audio.sfxOn()) return false;
    const a = CONFIG.audio;
    const ctx = Audio.ctx;
    const at = ctx.currentTime + (o.delay || 0);
    const dur = o.decay || a.paperDecay;
    const band = o.band || a.paperBand;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const env = ctx.createGain();
    src.buffer = Audio.noise;
    filter.type = 'bandpass';
    filter.Q.value = o.q || a.paperQ;
    // полоса едет вниз: у бумаги призвук темнеет к концу движения
    filter.frequency.setValueAtTime(band * 1.4, at);
    filter.frequency.exponentialRampToValueAtTime(band, at + dur);
    // attack есть не у всех голосов: ноль означает прежнее поведение — сразу на
    // пик. Ненулевая атака превращает щелчок во вздох (тот же приём, что у
    // шейкера в музыке).
    if (o.attack) {
      env.gain.setValueAtTime(gain * 0.001, at);
      env.gain.exponentialRampToValueAtTime(gain, at + o.attack);
    } else {
      env.gain.setValueAtTime(gain, at);
    }
    env.gain.exponentialRampToValueAtTime(gain * 0.001, at + dur);
    src.connect(filter);
    filter.connect(env);
    env.connect(Audio.sfxOut);      // регулятор «Звуки», а за ним доля в комнату
    src.start(at);
    src.stop(at + dur);
    return true;
  },

  // --- События игры ---------------------------------------------------------
  // Ноты планируются от ctx.currentTime, а не по кадрам: звук не держит RAF и
  // не участвует в цикле эффектов, поэтому правило «juice < 1000 мс» его не
  // касается. Вызывать эти методы можно только из input и драйверов main —
  // mergeEngine обязан оставаться беззвучным (там же живёт синхронный путь).

  pick() {
    if (!Audio.ready('pick')) return false;
    return Audio.rustle('pick', Audio.voice('pick'));
  },

  place() {
    if (!Audio.ready('place')) return false;
    const v = Audio.voice('place');
    Audio.tone('place', v.freq, v);
    Audio.rustle('place', { mul: v.noiseGain, band: v.band, delay: v.noiseDelay });
    return true;
  },

  // Перелив: по щелчку на фишку, питч растёт вместе с высотой будущей стопки.
  // Длинный перелив подрезан maxFlowTicks — иначе выйдет очередь.
  flow(count, stepSec) {
    if (!Audio.ready('flow')) return false;
    const v = Audio.voice('flow');
    const ticks = Math.min(count || 1, CONFIG.audio.maxFlowTicks);
    for (let i = 0; i < ticks; i++) {
      Audio.tone('flow', v.freq + i * v.step,
        Object.assign({}, v, { delay: i * (stepSec || 0.05) }));
    }
    return true;
  },

  // Чем крупнее сгоревший блок, тем ниже и длиннее голос: десятку от двадцатки
  // слышно, не глядя на счёт.
  burn(tiles) {
    if (!Audio.ready('burn')) return false;
    const v = Audio.voice('burn');
    // мерка размера — базовый порог, а не текущий: тембр сгорания не должен
    // ползти вместе с прогрессией (Phase 28)
    const base = CONFIG.merge.thresholdSteps[0].threshold;
    const size = Math.min(tiles || base, 30) / base;
    const freq = v.freq / Math.pow(size, v.sizeCurve);
    Audio.tone('burn', freq, Object.assign({}, v, { decay: v.decay + size * v.decayPerSize }));
    // призвук октавой выше — всегда синус, иначе он спорит с основным тоном
    Audio.tone('burn', freq * v.harmonicRatio,
      { mul: v.harmonic, decay: v.harmonicDecay, type: 'sine' });
    Audio.rustle('burn', { mul: v.noiseGain, band: v.band,
                           decay: v.noiseDecay, delay: v.noiseDelay });
    return true;
  },

  // Звено цепочки: та же деревянная нота, но ступенью выше по пентатонике
  combo(link) {
    if (!Audio.ready('combo')) return false;
    const v = Audio.voice('combo');
    const steps = CONFIG.audio.comboSteps;
    const semitones = steps[Math.max(0, Math.min(link - 1, steps.length - 1))];
    const freq = v.freq * Math.pow(2, semitones / 12);
    Audio.tone('combo', freq, v);
    Audio.tone('combo', freq * v.harmonicRatio,
      { mul: v.harmonic, decay: v.harmonicDecay, drop: v.drop,
        delay: v.harmonicDelay, type: 'sine' });
    return true;
  },

  // Новое кольцо: низкое восходящее скольжение — поле стало больше
  ring() {
    if (!Audio.ready('ring')) return false;
    const v = Audio.voice('ring');
    Audio.tone('ring', v.freq, v);
    Audio.rustle('ring', { mul: v.noiseGain, band: v.band, decay: v.noiseDecay });
    return true;
  },

  boost(kind) {
    if (!Audio.ready('boost')) return false;
    const v = Audio.voice('boost');
    if (kind === 'remove') {                            // стопка рассыпается
      Audio.rustle('boost', { band: v.removeBand, q: v.removeQ, decay: v.removeDecay });
    } else if (kind === 'reroll') {                     // рука тасуется
      for (let i = 0; i < v.rerollTicks; i++) {
        Audio.rustle('boost', { mul: v.rerollGain, band: v.rerollBand + i * v.rerollStep,
                                decay: v.rerollDecay, delay: i * v.rerollDelay });
      }
    } else {                                            // дуга переноса
      Audio.tone('boost', v.freq, v);
    }
    return true;
  },

  // Отказ: глухой «тук» почти без падения питча — ничего не произошло
  deny() {
    if (!Audio.ready('deny')) return false;
    const v = Audio.voice('deny');
    return Audio.tone('deny', v.freq, v);
  },

  snap() {
    if (!Audio.ready('snap')) return false;
    return Audio.rustle('snap', Audio.voice('snap'));
  },

  deal() {
    if (!Audio.ready('deal')) return false;
    const v = Audio.voice('deal');
    for (let i = 0; i < v.ticks; i++) {
      Audio.rustle('deal', { band: v.band + i * v.step, decay: v.decay, delay: i * v.delay });
    }
    return true;
  },

  // Конец партии: три ноты вниз, а при новом рекорде — вверх
  over(isRecord) {
    if (!Audio.ready('over')) return false;
    const v = Audio.voice('over');
    (isRecord ? v.record : v.lost).forEach((semitones, i) => {
      Audio.tone('over', v.freq * Math.pow(2, semitones / 12),
        Object.assign({}, v, { delay: i * v.delay }));
    });
    return true;
  },

  // --- Музыка ---------------------------------------------------------------
  // У фона свой планировщик, и это обязательно: RAF в затишье останавливается
  // совсем, и петля, повешенная на кадры, рвалась бы каждый раз, когда игрок
  // думает над ходом. Раз в lookaheadMs просыпаемся и раскладываем ноты на
  // scheduleAhead секунд вперёд по часам AudioContext — они идут сами по себе.
  //
  // Именно setInterval, а не setTimeout: в тестах setTimeout выполняется
  // немедленно, и петля, перезаводящая саму себя, ушла бы в бесконечную
  // рекурсию. Здесь тик просто не вызывают, и всё стоит.

  room: null, roomMix: null, sfxSend: null, sfxOut: null,
  music: { timer: null, nextAt: 0, step: 0, tension: 0, out: null },

  startMusic() {
    const m = CONFIG.audio.music;
    if (!Audio.ctx || Audio.music.timer || !m.gain || !m.volume) return false;
    const ctx = Audio.ctx;
    // Узел переживает выключение музыки: игрок может вернуть громкость, и второй
    // выход к тому же master дал бы лишний узел на каждое переключение.
    if (!Audio.music.out) {
      Audio.music.out = ctx.createGain();
      Audio.music.out.connect(Audio.master);
      if (Audio.room) Audio.music.out.connect(Audio.room);  // музыка в комнате целиком
    }
    Audio.music.out.gain.value = m.gain * m.volume;
    Audio.music.nextAt = ctx.currentTime;
    Audio.music.step = 0;
    Audio.music.timer = setInterval(Audio.pumpMusic, m.lookaheadMs);
    Audio.pumpMusic();
    return true;
  },

  stopMusic() {
    if (Audio.music.timer === null) return false;
    clearInterval(Audio.music.timer);
    Audio.music.timer = null;
    return true;
  },

  // Разложить ноты вперёд. Потолок обязателен: часы могут прыгнуть (в тестах они
  // прыгают на секунду за кадр), и цикл без предела крутился бы вечно.
  pumpMusic() {
    if (!Audio.ctx || !Audio.music.out) return false;
    const m = CONFIG.audio.music;
    const stepSec = Audio.stepSec();
    const until = Audio.ctx.currentTime + m.scheduleAhead;
    let placed = 0;
    while (Audio.music.nextAt < until && placed < m.maxStepsPerPump) {
      Audio.musicStep(Audio.music.step, Audio.music.nextAt);
      Audio.music.step++;
      Audio.music.nextAt += stepSec;
      placed++;
    }
    return placed > 0;
  },

  // --- Аранжировка ----------------------------------------------------------

  // Длительность шага: stepsPerBar долей на такт в размере 4/4
  stepSec() {
    const m = CONFIG.audio.music;
    return 60 / m.bpm / (m.stepsPerBar / 4);
  },

  // Тактов в полном цикле аранжировки
  loopBars() {
    return CONFIG.audio.music.arrangement.reduce((sum, section) => sum + section.bars, 0);
  },

  // Какая секция играет на этом такте цикла
  sectionAt(loopBar) {
    const arrangement = CONFIG.audio.music.arrangement;
    let from = 0;
    for (let i = 0; i < arrangement.length; i++) {
      if (loopBar < from + arrangement[i].bars) return arrangement[i];
      from += arrangement[i].bars;
    }
    return arrangement[arrangement.length - 1];
  },

  // Аккорд держится chordBars такта, дальше цикл идёт по кругу
  chordAt(loopBar) {
    const m = CONFIG.audio.music;
    return m.chords[Math.floor(loopBar / m.chordBars) % m.chords.length];
  },

  // Шаг аранжировки: секция решает, какие инструменты сейчас звучат, аккорд —
  // какими нотами. Точки склейки у цикла нет: музыка синтезируется непрерывно,
  // а последняя секция просто возвращает набор партий к вступлению.
  musicStep(step, at) {
    const m = CONFIG.audio.music;
    const bars = Audio.loopBars();
    const bar = Math.floor(step / m.stepsPerBar);
    const beat = step - bar * m.stepsPerBar;
    const loopBar = ((bar % bars) + bars) % bars;
    const chord = Audio.chordAt(loopBar);
    Audio.sectionAt(loopBar).parts.forEach(name => {
      Audio.playPart(m.parts[name], loopBar, beat, chord, at, step);
    });
  },

  // Один инструмент на одном шаге. Рисунок берётся по номеру такта и обновляется
  // раз в varyBars — это и есть «дыхание»: изменение раз в 15–30 секунд, которое
  // игрок чувствует, но не опознаёт.
  playPart(part, loopBar, beat, chord, at, step) {
    if (!part) return false;
    const m = CONFIG.audio.music;
    const out = Audio.music.out;
    const cycle = Math.floor(loopBar / m.varyBars);
    if (part.every && loopBar % part.every !== 0) return false;

    if (part.kind === 'chord') {          // пад: весь аккорд разом, только с такта
      if (beat !== 0) return false;
      chord.forEach((semitones, i) => {
        Audio.musicNote(part, semitones, part.octave, part.level, part.attack,
          part.decay, at, out, step + i * 13, part.drop, part.filterOpen);
      });
      return true;
    }
    if (part.kind === 'root') {           // бас: корень аккорда по своему рисунку
      if (part.steps[cycle % part.steps.length].indexOf(beat) === -1) return false;
      Audio.musicNote(part, chord[0], part.octave, part.level, part.attack,
        part.decay, at, out, step, part.drop);
      return true;
    }
    if (part.kind === 'drum') {           // удар: своя частота, гармония ему не указ
      if (part.steps[cycle % part.steps.length].indexOf(beat) === -1) return false;
      Audio.musicVoice(part.type, part.freq, part.drop, part.level, part.attack,
        part.decay, at, out, 0, part.filterOpen);
      return true;
    }
    if (part.kind === 'motif') {          // мелодия: ступени текущего аккорда
      const motif = m.motifs[part.motifs[cycle % part.motifs.length]];
      const hits = motif.filter(note => note.at === beat);
      hits.forEach(note => {
        Audio.musicNote(part, chord[note.deg % chord.length], part.octave, part.level,
          part.attack, part.decay, at, out, step + note.deg);
      });
      return hits.length > 0;
    }
    // шум: перкуссия и фактура. tensionSteps — вся адаптивность, которая
    // осталась: на тесном поле шейкер получает пару лишних позиций, и только.
    let steps = part.steps[cycle % part.steps.length];
    if (part.tensionSteps && Audio.music.tension >= 0.5) {
      steps = steps.concat(part.tensionSteps);
    }
    if (steps.indexOf(beat) === -1) return false;
    Audio.musicRustle(part, at, out);
    return true;
  },

  // Нота-деревяшка: щипок с падающим питчем плюс нецелый обертон. Именно
  // нецелая доля (2.76 — обертон свободного бруска) отличает удар по дереву
  // от синтезатора: у струны обертоны кратные, у бруска нет.
  musicNote(cfg, semitones, octave, peak, attack, decay, at, out, seed, dropOverride, filterOpen) {
    const m = CONFIG.audio.music;
    const drop = dropOverride || cfg.drop;
    const freq = m.tuning * Math.pow(2, octave + semitones / 12);
    // Живой инструмент каждый раз чуть другой: ровные по громкости и всегда
    // центральные ноты и создают ощущение дешёвой машины. Шум детерминированный
    // (тот же render.noise, что и у бумажной фактуры) — партия остаётся повторяемой.
    const key = seed || 0;
    const level = peak * (1 - m.velocityVary * render.noise(key, 17));
    const pan = (render.noise(key, 29) - 0.5) * 2 * m.panSpread;
    Audio.musicVoice(cfg.type, freq, drop, level, attack, decay, at, out, pan, filterOpen);
    if (cfg.overtone) {
      Audio.musicVoice('sine', freq * cfg.overtoneRatio, drop, level * cfg.overtone,
        attack, decay * cfg.overtoneDecay, at, out, pan * 0.6, filterOpen);
    }
  },

  // Голос музыки: пара расстроенных осцилляторов через фильтр, конверт и панораму.
  // Пара — против «дёшево»: один осциллятор всегда звучит тонко и стерильно,
  // а расстройка в несколько центов даёт биения, которые ухо слышит как объём.
  musicVoice(type, freq, drop, peak, attack, decay, at, out, pan, filterOpen) {
    const ctx = Audio.ctx;
    const m = CONFIG.audio.music;
    const filter = ctx.createBiquadFilter();
    const env = ctx.createGain();
    const panner = ctx.createStereoPanner();

    // Фильтр закрывается вместе с нотой: дерево тускнеет, а не звенит ровно до
    // конца. На тесном поле открыт чуть шире — на грани заметного, без драмы.
    // Пад передаёт свой filterOpen: ему нужен заваленный верх, иначе он вылезет
    // на первый план, а бриф отводит ему роль воздуха под инструментами.
    filter.type = 'lowpass';
    filter.Q.value = m.filterQ;
    filter.frequency.setValueAtTime(
      freq * (filterOpen || m.filterOpen) * (1 + Audio.music.tension * m.filterTension), at);
    filter.frequency.exponentialRampToValueAtTime(freq * m.filterClose, at + decay);

    panner.pan.value = pan;
    // экспонентой до нуля нельзя, гасим до тысячной доли
    env.gain.setValueAtTime(peak * 0.001, at);
    env.gain.exponentialRampToValueAtTime(peak, at + attack);
    env.gain.exponentialRampToValueAtTime(peak * 0.001, at + decay);

    filter.connect(env);
    env.connect(panner);
    panner.connect(out);

    for (let i = 0; i < 2; i++) {
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.detune.value = i ? m.detuneCents : -m.detuneCents;
      osc.frequency.setValueAtTime(freq, at);
      osc.frequency.exponentialRampToValueAtTime(freq * drop, at + decay);
      osc.connect(filter);
      osc.start(at);
      osc.stop(at + decay);
    }
  },

  // Бумажный слой музыки — тот же приём, что и у эффектов: полоса шума, не тон.
  // Им же сделаны хэт и малый барабан: у них те же поля, только числа другие.
  musicRustle(spec, at, out) {
    const ctx = Audio.ctx;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const env = ctx.createGain();
    src.buffer = Audio.noise;
    filter.type = 'bandpass';
    filter.Q.value = spec.q;
    filter.frequency.setValueAtTime(spec.band * 1.5, at);
    filter.frequency.exponentialRampToValueAtTime(spec.band, at + spec.decay);
    env.gain.setValueAtTime(spec.gain * 0.001, at);
    env.gain.exponentialRampToValueAtTime(spec.gain, at + spec.attack);
    env.gain.exponentialRampToValueAtTime(spec.gain * 0.001, at + spec.decay);
    src.connect(filter);
    filter.connect(env);
    env.connect(out);
    src.start(at);
    src.stop(at + spec.decay);
  },

  // Натяжение 0…1: 0 — спокойный слой, 1 — динамичный. Что именно считать
  // тревогой, решает игра (updateMusicTension), здесь только число.
  // Натяжение 0…1. Слоями оно больше не переключает: бриф запрещает музыке
  // требовать внимания, поэтому теснота поля лишь чуть уплотняет перкуссию
  // (tensionSteps) и чуть приоткрывает фильтр. Что считать тревогой, по-прежнему
  // решает updateMusicTension в main.
  setTension(value) {
    Audio.music.tension = Math.max(0, Math.min(1, value));
    return Audio.music.out !== null;
  }
};

// ============================================================================
// hexMath — axial-математика flat-top гексов (главный техриск, см. спеку §19)
// ============================================================================
const hexMath = {
  // Текущая геометрия поля: размер гекса и центр. Пересчитывается при росте поля.
  layout: { size: CONFIG.hex.maxSize, centerX: 360, centerY: 350, radius: 2 },

  // Вписать поле радиуса R в отведённый коридор: по ширине нужно size*(3R+2),
  // по высоте size*√3*(2R+1). Берём меньшее, но не больше hex.maxSize.
  fitLayout(radius) {
    const area = CONFIG.ui.boardArea;
    const availWidth = CONFIG.canvas.width - area.sideMargin * 2;
    // над полем резервируем место под высокие стопки: они растут вверх от ячейки
    const availHeight = (area.bottom - area.top) - CONFIG.tile.maxRise;
    const size = Math.min(
      CONFIG.hex.maxSize,
      availWidth / (3 * radius + 2),
      availHeight / (Math.sqrt(3) * (2 * radius + 1))
    );
    const halfHeight = Math.sqrt(3) / 2 * size * (2 * radius + 1);
    // размер гекса сменился — спрайты прежнего размера больше не понадобятся
    if (Math.abs(size - hexMath.layout.size) > 0.01 && render.tileCache) {
      render.tileCache.clear();
    }
    hexMath.layout = {
      size,
      centerX: CONFIG.canvas.width / 2,
      // поле прижато к низу области, сверху остаётся зазор ровно под стопки
      centerY: area.top + CONFIG.tile.maxRise + halfHeight,
      radius
    };
    return hexMath.layout;
  },

  // Ключ ячейки для Map
  key(q, r) {
    return q + ',' + r;
  },

  // Центр ячейки в пикселях. flat-top: x = size*3/2*q, y = size*sqrt(3)*(r + q/2)
  axialToPixel(q, r) {
    const L = hexMath.layout;
    return {
      x: L.centerX + L.size * 1.5 * q,
      y: L.centerY + L.size * Math.sqrt(3) * (r + q / 2)
    };
  },

  // Обратное преобразование: пиксель → ячейка (нужно для перетаскивания, Phase 2)
  pixelToAxial(x, y) {
    const s = hexMath.layout.size;
    const px = x - hexMath.layout.centerX;
    const py = y - hexMath.layout.centerY;
    const qf = (2 / 3) * px / s;
    const rf = (-1 / 3) * px / s + (Math.sqrt(3) / 3) * py / s;
    return hexMath.cubeRound(qf, rf);
  },

  // Округление дробных axial-координат через куб-координаты (иначе на границах врёт)
  cubeRound(qf, rf) {
    const sf = -qf - rf;
    let q = Math.round(qf);
    let r = Math.round(rf);
    let s = Math.round(sf);
    const dq = Math.abs(q - qf);
    const dr = Math.abs(r - rf);
    const ds = Math.abs(s - sf);
    if (dq > dr && dq > ds) {
      q = -r - s;
    } else if (dr > ds) {
      r = -q - s;
    }
    return { q, r };
  },

  // Ячейки поля радиуса R: 3R²+3R+1 штук, условие max(|q|, |r|, |q+r|) <= R
  generateCells(radius) {
    return hexMath.expandCells(new Map(), radius);
  },

  // Дорастить поле до нужного радиуса: существующие ячейки (и их стопки) остаются,
  // недостающие добавляются пустыми. Пиксели пересчитываются у всех — размер гекса
  // после роста меняется.
  expandCells(cells, radius) {
    for (let q = -radius; q <= radius; q++) {
      for (let r = -radius; r <= radius; r++) {
        if (Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)) > radius) continue;
        const key = hexMath.key(q, r);
        if (!cells.has(key)) cells.set(key, { q, r, stack: null, pixelX: 0, pixelY: 0 });
      }
    }
    cells.forEach(cell => {
      const p = hexMath.axialToPixel(cell.q, cell.r);
      cell.pixelX = p.x;
      cell.pixelY = p.y;
    });
    return cells;
  },

  // 6 соседей flat-top гекса (диагоналей у гексов нет)
  NEIGHBOR_OFFSETS: [
    { q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 },
    { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 }
  ],
  neighbors(q, r) {
    return hexMath.NEIGHBOR_OFFSETS.map(o => ({ q: q + o.q, r: r + o.r }));
  },

  // Вершины flat-top гекса: углы 0°, 60°, ... 300°
  hexCorners(cx, cy, size) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i);
      pts.push({ x: cx + size * Math.cos(a), y: cy + size * Math.sin(a) });
    }
    return pts;
  }
};

// ============================================================================
// generators — генерация стопок (mono/duo/tri по весам), стартовое заполнение
// ============================================================================
const generators = {
  // Источник случайности. По умолчанию Math.random; QA может зафиксировать seed
  // (ADR-0002) — тогда партия воспроизводится ход в ход.
  rng: {
    next: Math.random,
    seed(value) {
      let s = value >>> 0;
      this.next = () => {                       // mulberry32 — короткий детерминированный PRNG
        s = (s + 0x6D2B79F5) | 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
  },

  randInt(min, max) {
    return min + Math.floor(generators.rng.next() * (max - min + 1));
  },

  // Случайный цвет из активного набора
  randomColor(activeColors) {
    return generators.randInt(0, activeColors - 1);
  },

  // Текущая ступень сложности стопок по счёту (последняя подходящая)
  stageFor(score) {
    const stages = CONFIG.stack.stages;
    let current = stages[0];
    stages.forEach(stage => { if (score >= stage.fromScore) current = stage; });
    return current;
  },

  // Тип стопки по весам ступени. Перебор идёт по blocksByType, а не по трём
  // именам вручную: новый тип — это строчка в CONFIG, а не правка логики.
  pickStackType(weights) {
    const types = Object.keys(CONFIG.stack.blocksByType);
    const total = types.reduce((sum, type) => sum + (weights[type] || 0), 0);
    let roll = generators.rng.next() * total;
    for (let i = 0; i < types.length; i++) {
      roll -= weights[types[i]] || 0;
      if (roll < 0) return types[i];
    }
    return types[0];
  },

  // Стопка = массив цветов снизу вверх. Многоблочные типы собираются
  // из блоков не меньше minBlockSize, соседние блоки разного цвета.
  // Веса типов и диапазон высоты берутся из ступени по текущему счёту.
  makeStack(activeColors, score, forcedTopColor, stageOverride) {
    const stage = stageOverride || generators.stageFor(score || 0);
    const type = generators.pickStackType(stage.weights);
    const blocks = CONFIG.stack.blocksByType[type];
    const minBlock = CONFIG.stack.minBlockSize;
    // Высота подбирается под тип: на N блоков нужно минимум N * minBlockSize фишек,
    // иначе выпавший duo/tri молча превращался бы в стопку попроще
    const needed = blocks * minBlock;
    const minH = Math.max(stage.minHeight, needed);
    const maxH = Math.max(stage.maxHeight, needed);
    const height = generators.randInt(minH, maxH);

    // Размеры блоков: каждому по минимуму, остаток раздаётся случайным блокам.
    // Раньше весь остаток доставался верхнему блоку — и многоблочная стопка
    // приходила с крупной «шапкой» одного цвета, то есть почти не усложняла игру
    // (Phase 28: верхний блок держался на 2.9 фишки при любом составе).
    const sizes = new Array(blocks).fill(minBlock);
    for (let extra = height - blocks * minBlock; extra > 0; extra--) {
      sizes[generators.randInt(0, blocks - 1)]++;
    }

    const tiles = [];
    const usedColors = new Set();       // цвет не повторяется во всей стопке, а не
    for (let b = 0; b < blocks; b++) {  // только в соседних блоках (правило пользователя)
      const size = sizes[b];
      let color = generators.randomColor(activeColors);
      let guard = 0;
      while (usedColors.has(color) && usedColors.size < activeColors && guard++ < 50) {
        color = generators.randomColor(activeColors);
      }
      usedColors.add(color);
      for (let i = 0; i < size; i++) tiles.push(color);
    }
    // Милосердный генератор навязывает цвет верхнего блока
    if (forcedTopColor !== undefined && forcedTopColor !== null) {
      const top = tiles[tiles.length - 1];
      for (let i = tiles.length - 1; i >= 0 && tiles[i] === top; i--) {
        tiles[i] = forcedTopColor;
      }
    }
    return { tiles, cell: null };
  },

  // Стартовое заполнение: round(19 * 0.30) = 6 случайных ячеек
  fillStartBoard(state) {
    const keys = Array.from(state.cells.keys());
    const count = Math.round(keys.length * CONFIG.board.startFillPercent);
    // перемешивание Фишера—Йетса, чтобы выбрать ячейки без повторов
    for (let i = keys.length - 1; i > 0; i--) {
      const j = generators.randInt(0, i);
      const t = keys[i]; keys[i] = keys[j]; keys[j] = t;
    }
    for (let i = 0; i < count; i++) {
      const cell = state.cells.get(keys[i]);
      // стартовое поле всегда простое — своя ступень, только одноцветные стопки
      const stack = generators.makeStack(state.activeColors, 0, undefined,
        CONFIG.stack.startBoard);
      stack.cell = { q: cell.q, r: cell.r };
      cell.stack = stack;
    }
  },

  // Свободные ячейки поля
  freeCells(state) {
    const free = [];
    state.cells.forEach(cell => { if (!cell.stack) free.push(cell); });
    return free;
  },

  // Цвета, лежащие наверху стопок поля. По ним решается и спасение (дать такой
  // цвет), и давление (дать какой угодно, кроме них).
  topColorsOnBoard(state) {
    const tops = [];
    state.cells.forEach(cell => {
      if (cell.stack) tops.push(cell.stack.tiles[cell.stack.tiles.length - 1]);
    });
    return tops;
  },

  // Цвет, которым в текущей позиции можно собрать больше всего фишек: для каждой
  // свободной ячейки складываются верхние блоки соседей одного цвета, берётся
  // лучшая пара «ячейка + цвет».
  //
  // Просто «цвет, который лежит наверху» для выручки не годится, и это показал
  // замер: игрок проигрывает от нехватки МЕСТА, а не цвета — стопку и так можно
  // поставить в любую свободную ячейку. Спасает только сгорание, поэтому выручка
  // обязана давать цвет, которым сгорание реально собирается (ADR-0008).
  bestMergeColor(state) {
    let best = null;
    generators.freeCells(state).forEach(cell => {
      const sums = new Map();
      hexMath.neighbors(cell.q, cell.r).forEach(n => {
        const nb = state.cells.get(hexMath.key(n.q, n.r));
        if (!nb || !nb.stack) return;
        const run = mergeEngine.topRun(nb.stack);
        sums.set(run.color, (sums.get(run.color) || 0) + run.length);
      });
      sums.forEach((sum, color) => {
        if (!best || sum > best.sum) best = { color, sum };
      });
    });
    return best;
  },

  // Активный цвет, которого нет ни на одной вершине. undefined, если такого нет:
  // давить нечем, и раздача идёт обычная — насильно портить игру не нужно.
  absentTopColor(state) {
    const busy = new Set(generators.topColorsOnBoard(state));
    const free = [];
    for (let color = 0; color < state.activeColors; color++) {
      if (!busy.has(color)) free.push(color);
    }
    if (!free.length) return undefined;
    return free[generators.randInt(0, free.length - 1)];
  },

  // Нужна ли раздаче помощь или, наоборот, давление (ADR-0008). Решение вынесено
  // из dealHand отдельно, потому что его же меряет tools/balance.js.
  dramaFor(state) {
    const drama = CONFIG.drama;
    const free = generators.freeCells(state).length;
    const canRescue = state.score < drama.rescueUntilScore &&
      state.rescuesUsed < drama.maxRescuesPerGame &&
      !state.rescuedLastDeal;               // два раза подряд — уже поддавки
    if (canRescue && free <= drama.rescueFreeCells) {
      const best = generators.bestMergeColor(state);
      if (best) return { kind: 'rescue', color: best.color, slots: drama.rescueSlots };
    }
    if (state.score >= drama.pressureFromScore &&
        generators.rng.next() < drama.pressureChance) {
      const color = generators.absentTopColor(state);
      if (color !== undefined) return { kind: 'pressure', color, slots: drama.pressureSlots };
    }
    return { kind: 'plain', slots: 0 };
  },

  // Новая раздача из 3 стопок. Сколько из них подчиняется драма-менеджеру, решает
  // он сам (rescueSlots / pressureSlots): хотя бы одна стопка всегда остаётся
  // честным случаем, иначе рука перестала бы быть выбором.
  dealHand(state) {
    const drama = generators.dramaFor(state);
    if (drama.kind === 'rescue') {
      state.rescuesUsed++;
      state.rescuedLastDeal = true;
    } else {
      state.rescuedLastDeal = false;
    }
    const forcedSlots = Math.min(2, drama.slots || 0);
    for (let i = 0; i < 3; i++) {
      state.hand.slots[i] = generators.makeStack(
        state.activeColors, state.score, i < forcedSlots ? drama.color : undefined);
    }
  }
};

// ============================================================================
// mergeEngine — перелив, сгорание, волна BFS (ядро, Phase 3).
// Сейчас реализована только вспомогательная topRun.
// ============================================================================
const mergeEngine = {
  // Верхний одноцветный блок стопки: цвет и длина
  topRun(stack) {
    if (!stack || !stack.tiles.length) return { color: -1, length: 0 };
    const color = stack.tiles[stack.tiles.length - 1];
    let length = 0;
    for (let i = stack.tiles.length - 1; i >= 0 && stack.tiles[i] === color; i--) length++;
    return { color, length };
  },

  // Куда собирать блок после установки стопки в cell (правило пользователя):
  //   • рядом две и больше одноцветных стопок — собираем в поставленную ячейку, потому
  //     что только она соседствует со всеми, и объединятся сразу все;
  //   • рядом ровно одна — новая стопка вливается в неё, а ячейка игрока освобождается;
  //   • рядом ни одной — стопка просто остаётся на месте.
  mergeTargetFor(state, cell) {
    if (!cell.stack) return cell;
    const color = mergeEngine.topRun(cell.stack).color;
    const sameColorNeighbors = [];
    hexMath.neighbors(cell.q, cell.r).forEach(n => {
      const nb = state.cells.get(hexMath.key(n.q, n.r));
      if (!nb || !nb.stack) return;
      if (mergeEngine.topRun(nb.stack).color === color) sameColorNeighbors.push(nb);
    });
    if (sameColorNeighbors.length >= 2) return cell;
    return sameColorNeighbors[0] || cell;
  },

  // Что перельётся в cell: верхние блоки соседей того же цвета, что верх cell.
  // Порядок соседей фиксирован — от него зависит детерминизм волны.
  computeFlows(state, cell) {
    if (!cell.stack) return [];
    const run = mergeEngine.topRun(cell.stack);
    const flows = [];
    hexMath.neighbors(cell.q, cell.r).forEach(n => {
      const nb = state.cells.get(hexMath.key(n.q, n.r));
      if (!nb || !nb.stack) return;
      const nbRun = mergeEngine.topRun(nb.stack);
      if (nbRun.color !== run.color) return;
      flows.push({ from: nb, to: cell, color: nbRun.color, count: nbRun.length });
    });
    return flows;
  },

  // Снять верхние блоки с отдающих соседей; опустевшая ячейка освобождается
  applyFlowRemoval(state, flows) {
    flows.forEach(f => {
      const stack = f.from.stack;
      stack.tiles.length -= f.count;
      if (!stack.tiles.length) f.from.stack = null;
    });
  },

  // Долить фишки в целевую стопку; возвращает число перетёкших фишек
  applyFlowArrival(state, cell, flows) {
    let flowed = 0;
    flows.forEach(f => {
      for (let i = 0; i < f.count; i++) cell.stack.tiles.push(f.color);
      flowed += f.count;
    });
    return flowed;
  },

  // Очки за сгоревший блок из N фишек: первые burnBaseTiles по базовой ставке,
  // каждая сверх — по повышенной. Номер волны на очки не влияет (ADR-0004).
  burnPointsFor(tiles) {
    const s = CONFIG.scoring;
    const base = Math.min(tiles, s.burnBaseTiles);
    const over = Math.max(0, tiles - s.burnBaseTiles);
    return base * s.pointsPerTileBase + over * s.pointsPerTileOver;
  },

  // Монеты за сгоревший блок: платят только фишки сверх coinsFreeTiles
  // (ADR-0007). Блок ровно в порог — ноль монет, и это намеренно: иначе доход
  // идёт за сам факт игры, а не за то, что игрок собрал блок крупнее нужного.
  burnCoinsFor(tiles) {
    const s = CONFIG.scoring;
    return Math.max(0, tiles - s.coinsFreeTiles) * s.coinsPerBurnedTile;
  },

  // Порог сгорания растёт со счётом (Phase 28): последняя подходящая ступень —
  // тот же приём, что у radiusForScore и generators.stageFor.
  thresholdFor(score) {
    const steps = CONFIG.merge.thresholdSteps;
    let threshold = steps[0].threshold;
    steps.forEach(step => { if ((score || 0) >= step.fromScore) threshold = step.threshold; });
    return threshold;
  },

  // Сгорание: верхний блок дорос до порога — горит целиком (13 → горят 13)
  burnIfReady(state, cell, waveNumber) {
    if (!cell.stack) return { burned: false };
    const run = mergeEngine.topRun(cell.stack);
    if (run.length < mergeEngine.thresholdFor(state.score)) return { burned: false };
    cell.stack.tiles.length -= run.length;
    if (!cell.stack.tiles.length) cell.stack = null;
    return {
      burned: true, cell, color: run.color, count: run.length,
      wave: waveNumber,                                  // нужен анимации, не очкам
      points: mergeEngine.burnPointsFor(run.length),
      coins: mergeEngine.burnCoinsFor(run.length)
    };
  },

  // Контекст цепочки: очередь центров притяжения текущей волны.
  // Принимает одну ячейку или сразу несколько: буст может задеть больше одной.
  createWave(start) {
    return {
      queue: Array.isArray(start) ? start.slice() : [start],
      wave: 1,
      iterations: 0,
      combo: 0        // сколько звеньев цепочки уже дали сгорание (Phase 16)
    };
  },

  // Шаг волны, часть 1: посчитать переливы и снять фишки с соседей.
  // Разделено на plan/commit, чтобы между ними проигралась анимация полёта.
  planWave(state, ctx) {
    const plan = { wave: ctx.wave, groups: [], flows: [] };
    ctx.queue.forEach(cell => {
      if (!cell.stack) return;
      const flows = mergeEngine.computeFlows(state, cell);
      if (flows.length) mergeEngine.applyFlowRemoval(state, flows);
      plan.groups.push({ cell, flows });
      flows.forEach(f => plan.flows.push(f));
    });
    return plan;
  },

  // Шаг волны, часть 2: долить фишки, сжечь дозревшие блоки, собрать
  // изменённые ячейки в очередь следующей волны
  commitWave(state, plan, ctx) {
    let burnPoints = 0;
    let burnCoins = 0;
    let flowedTiles = 0;
    const burns = [];
    const changed = new Map();
    const mark = (cell) => changed.set(hexMath.key(cell.q, cell.r), cell);

    plan.groups.forEach(g => {
      if (g.flows.length) {
        // перелив только собирает блок; очки и монеты придут, когда он сгорит
        flowedTiles += mergeEngine.applyFlowArrival(state, g.cell, g.flows);
        mark(g.cell);
        g.flows.forEach(f => mark(f.from));   // сосед открыл следующий цвет
      }
      const burn = mergeEngine.burnIfReady(state, g.cell, plan.wave);
      if (burn.burned) {
        burnPoints += burn.points;
        burnCoins += burn.coins;              // монета за каждую сгоревшую фишку
        burns.push(burn);
        mark(g.cell);
      }
    });

    // Комбо — число звеньев цепочки со сгоранием внутри одного хода. Платит
    // только монетами: очки остаются читаемыми, множитель цепочки по-прежнему
    // отменён (ADR-0004). Счёт ведётся здесь, а не в драйвере, иначе
    // синхронный resolveWave и анимационный путь разошлись бы по монетам.
    let comboCoins = 0;
    if (burns.length) {
      ctx.combo++;
      comboCoins = CONFIG.scoring.comboCoinBonus * (ctx.combo - 1);
      burnCoins += comboCoins;
    }

    // в следующую волну идут только ячейки, где после всех сгораний осталась стопка
    ctx.queue = Array.from(changed.values()).filter(c => c.stack);
    ctx.wave++;
    return { burnPoints, burnCoins, flowedTiles, burns, combo: ctx.combo, comboCoins };
  },

  // Синхронное разрешение цепочки без анимации — источник правды по детерминизму
  // (тот же набор примитивов, что и у анимационного драйвера в main)
  resolveWave(state, startCell) {
    const ctx = mergeEngine.createWave(startCell);
    const steps = [];
    let totalPoints = 0;
    let totalCoins = 0;
    while (ctx.queue.length && ctx.iterations < CONFIG.merge.maxWaveIterations) {
      ctx.iterations++;
      const plan = mergeEngine.planWave(state, ctx);
      const res = mergeEngine.commitWave(state, plan, ctx);
      totalPoints += res.burnPoints;
      totalCoins += res.burnCoins;
      steps.push({
        wave: plan.wave, flows: plan.flows.length, burns: res.burns.length,
        points: res.burnPoints, coins: res.burnCoins, combo: res.combo
      });
    }
    return { steps, totalPoints, totalCoins, waves: ctx.iterations };
  }
};

// ============================================================================
// render — гексы, псевдо-3D стопки, рука, HUD, оверлей
// ============================================================================
const render = {
  ctx: null,
  backgroundCache: null,     // фон темы рисуется один раз и копируется

  // Кривые сглаживания (Phase 15). Раньше smoothstep был заинлайнен в двух местах,
  // а половина анимаций шла линейно — отсюда ощущение дёрганости.
  ease: {
    smooth: (t) => t * t * (3 - 2 * t),
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    // с перелётом: стопка «доезжает» чуть дальше и возвращается
    outBack: (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2)
  },

  // Детерминированный шум — фактура бумаги, полутон, дизеринг
  noise(x, y) {
    const v = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return v - Math.floor(v);
  },

  // Затемнение/осветление цвета: amount < 0 темнее, > 0 светлее
  shade(hex, amount) {
    if (hex[0] !== '#') return hex;       // rgba(...) из темы оставляем как есть
    const num = parseInt(hex.slice(1), 16);
    const ch = [num >> 16 & 255, num >> 8 & 255, num & 255].map(c => {
      const v = amount < 0 ? c * (1 + amount) : c + (255 - c) * amount;
      return Math.max(0, Math.min(255, Math.round(v)));
    });
    return 'rgb(' + ch[0] + ',' + ch[1] + ',' + ch[2] + ')';
  },

  // Контур гекса как path
  hexPath(cx, cy, size) {
    const ctx = render.ctx;
    const pts = hexMath.hexCorners(cx, cy, size);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < 6; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
  },

  // Пустая ячейка поля
  drawHex(cx, cy, size, fill, stroke) {
    const ctx = render.ctx;
    render.hexPath(cx, cy, size);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  },

  // Псевдо-3D стопка: слои снизу вверх, каждый следующий выше на layerOffset.
  // Нижние слои перекрыты — видны только их «бока», верхняя фишка целиком.
  // Стопка рисуется в ЭКРАННЫХ координатах: слои всегда идут вверх экрана, как бы ни
  // было повёрнуто поле. Сама фишка при этом поворачивается вокруг своего центра,
  // чтобы совпадать с ячейкой под ней.
