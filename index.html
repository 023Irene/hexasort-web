<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papercomb</title>
<style>
  /* Канвас по центру окна. Пропорции больше не заданы в CSS: логическую высоту
     ставит layoutUi() по форме окна (Phase 24), иначе на телефоне 9:19.5 игра
     шла в полосе посреди экрана. Браузер берёт пропорцию из атрибутов канваса. */
  html, body {
    height: 100%;
    margin: 0;
    /* цвет бумаги — запасной на время до выполнения скрипта: дальше его ставит
       applyTheme из палитры темы, чтобы поля вокруг канваса не жили отдельной
       жизнью от стиля игры (Phase 41) */
    background: #EFE6D5;
    overflow: hidden;
    /* без этого на Android остаётся жест «потянуть вниз — обновить страницу»
       поверх игры: требование площадки 1.10.2 */
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    /* выделение текста по долгому нажатию — требования 1.6.1.8 и 1.6.2.7 */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    /* вырез и «шторка» телефона: кнопки не должны уезжать под них */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;          /* нужно для Pointer Events на телефоне (Phase 2) */
    -webkit-user-select: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="game" width="720" height="900"></canvas>
<script>
'use strict';

// ============================================================================
// CONFIG — все игровые числа и палитра. Баланс крутится только отсюда.
// ============================================================================
const CONFIG = {
  canvas:    { width: 720, height: 900 },
  // Текущий язык интерфейса (Phase 23). Ставится по браузеру в init и
  // переопределяется выбором игрока; сами тексты — в секции I18N.
  lang:      'ru',
  // Поле растёт кольцами по счёту: 19 -> 37 -> 61 ячейки (ADR-0004).
  // Гексы при этом уменьшаются, чтобы поле целиком помещалось в канвас.
  board:     { startFillPercent: 0.30,
               // Лестница сложности (ADR-0007, пересмотрена по замерам Phase 21).
               // Цвета добавляются по одному, а не по три: замер показал, что
               // число цветов — единственный настоящий рычаг сложности, и скачок
               // +3 обрывал партию сразу после порога, где бы тот ни стоял.
               // Радиус в соседних ступенях повторяется намеренно: и рост поля,
               // и набор цветов берут последнюю подходящую ступень, поэтому
               // промежуточные ступени — это числа, а не правка логики.
               // Пересмотрена в Phase 25 по первому внешнему playtest: «проиграть
               // невозможно, скучно после 40 минут». Замер подтверждал — сильная
               // игра шла 957 ходов. Стало пять цветов на старте и вдвое более
               // тесная лестница: партия мастера 514 ходов, счёт 5150 → 2508.
               // Phase 29: рост поля стал редкой наградой — просьба пользователя
               // «новые ячейки не на 500, а на 2000». Буквальный сдвиг делал рост
               // недостижимым (замер: партия кончалась на 935 очках, до кольца не
               // доживала ни одна), поэтому цвета добавляются медленнее: до 2000
               // очков поле остаётся стартовым, но и палитра почти не растёт.
               radiusSteps: [
                 { fromScore: 0,    radius: 2, colors: 5  },
                 { fromScore: 1000, radius: 2, colors: 6  },   // цвет без роста поля
                 { fromScore: 2000, radius: 3, colors: 7  },   // второе кольцо
                 { fromScore: 3000, radius: 3, colors: 8  },
                 { fromScore: 4500, radius: 4, colors: 9  },   // третье кольцо
                 { fromScore: 6000, radius: 4, colors: 10 }
               ] },
  // maxSize — предохранитель, а не рабочее ограничение: реально размер гекса задаёт
  // ширина коридора (availWidth / (3R+2) — это 85 при R=2). Пока потолок стоял на 55,
  // на высоком экране телефона поле переставало расти и под ним висела пустота.
  hex:       { orientation: 'flat', maxSize: 88 },
  // Ступени стопок. Состав руки за партию **переворачивается**: начинается с
  // простых одноцветных, заканчивается четырёхцветными (схема пользователя,
  // Phase 28). Раньше лестница замирала на 500 очках навсегда, и вторая половина
  // партии не усложнялась вообще — отсюда «дохожу до 3000 без напряжения».
  //
  // Сколько блоков у типа — в blocksByType: добавить пятиблочные стопки станет
  // строчкой в конфиге, а не правкой логики. Высота подбирается под выпавший тип
  // (quad нужно >= 8 фишек при minBlockSize 2), поэтому веса соблюдаются точно
  // и тип не «проседает» (ADR-0004).
  stack:     { minBlockSize: 2,
               blocksByType: { mono: 1, duo: 2, tri: 3, quad: 4 },
               stages: [
                 { fromScore: 0,    weights: { mono: 50, duo: 30, tri: 15, quad: 5  }, minHeight: 2, maxHeight: 5 },
                 { fromScore: 700,  weights: { mono: 35, duo: 30, tri: 25, quad: 10 }, minHeight: 3, maxHeight: 6 },
                 { fromScore: 1800, weights: { mono: 20, duo: 25, tri: 30, quad: 25 }, minHeight: 4, maxHeight: 7 },
                 { fromScore: 5000, weights: { mono: 5,  duo: 15, tri: 30, quad: 50 }, minHeight: 5, maxHeight: 9 }
               ],
               // Стартовое поле раскладывается отдельно и всегда простыми стопками.
               // Ступени выше — про руку: если раздать ими ещё и доску, партия
               // иногда обрывается в первые полминуты (замер: 3 % партий до 250
               // очков), а первые секунды решают, останется ли новичок.
               startBoard: { weights: { mono: 100 }, minHeight: 2, maxHeight: 4 } },
  // Порог сгорания тоже растёт (Phase 28): к концу партии собрать блок труднее.
  // Очки при этом по-прежнему считаются от scoring.burnBaseTiles, поэтому
  // сгорание при поднятом пороге сразу даёт больше базовой ставки.
  //
  // Phase 36: лестница сдвинута на ступень вверх. Замер показал, что до 1000 очков
  // поле держало 9-10 свободных ячеек само собой («в тесноте» 2-3 % ходов), то есть
  // первая половина партии проходилась на автомате. Порог — единственный рычаг,
  // который бьёт по НАЧАЛУ: цвета обваливают медиану вчетверо, а плотность старта и
  // ступени стопок на тесноту не влияют вовсе (лишние стопки просто быстрее сгорают).
  // Порог сгорания растёт ступенями. Ступени **не должны совпадать** с порогами
  // цвета из board.radiusSteps: на 3000 туда же приходил 8-й цвет, два рычага
  // били в одну точку, и игрок упирался в стену (playtest Phase 41). Это та же
  // ошибка, что чинили в Phase 29 для кольца и цвета.
  merge:     { thresholdSteps: [
                 { fromScore: 0,    threshold: 11 },
                 { fromScore: 1500, threshold: 12 },
                 { fromScore: 4000, threshold: 13 }
               ],
               maxWaveIterations: 100 },
  // Набор цветов расширяется вместе с полем (см. board.radiusSteps): 4 -> 7 -> 10.
  // Порядок важен: первые четыре — самые контрастные.
  colors:    { palette: [
                 '#E74C3C',   // 1 красный
                 '#3498DB',   // 2 синий
                 '#2ECC71',   // 3 зелёный
                 '#F1C40F',   // 4 жёлтый
                 '#9B59B6',   // 5 фиолетовый
                 '#E67E22',   // 6 оранжевый
                 '#1ABC9C',   // 7 бирюзовый
                 '#E84393',   // 8 розовый
                 '#ECF0F1',   // 9 белый
                 '#8D6E63'    // 10 коричневый (осветлён — на тёмном фоне читается)
               ] },
  // Очки начисляются только за сгоревшие фишки — перелив сам по себе ничего не даёт.
  // Первые burnBaseTiles фишек по базовой ставке, каждая сверх — по повышенной
  // (10 -> 10, 13 -> 16, 20 -> 30). Множителя цепочки нет (ADR-0004).
  // Комбо платит монетами, а не очками: второе звено цепочки даёт +comboCoinBonus,
  // третье +2×, и так далее. Множитель очков остаётся отменённым.
  //
  // Монеты платят только за фишки СВЕРХ порога сгорания (ADR-0007): блок из 10
  // не даёт ничего, 13 даёт 3, 25 даёт 15. Раньше платили за каждую фишку, и за
  // партию набегало полторы тысячи монет при цене буста 25 — кошелёк ничего не
  // ограничивал. Теперь монета — награда за крупный блок, а не за факт игры.
  // Phase 25: за партию набегало 937 монет при цене буста 25 — тридцать семь
  // покупок, то есть бустами вытаскивалась любая позиция. Порог поднят, комбо
  // платит вдвое меньше: около 180 монет за партию, шесть покупок.
  scoring:   { burnBaseTiles: 10, pointsPerTileBase: 1, pointsPerTileOver: 2,
               coinsPerBurnedTile: 1, coinsFreeTiles: 12, comboCoinBonus: 5 },
  // Возрождение после поражения (Phase 37). Убирает половину стопок — начиная с
  // самых высоких, они мешают больше всего; случайный выбор давал бы «повезло /
  // не повезло» на ровном месте. Счёт, кольца и рекорд сохраняются.
  //
  // Каждое следующее возрождение в партии дороже предыдущего: иначе накопленный
  // кошелёк делал бы партию бесконечной. Дальше последней ступени цена не растёт.
  revive:    { costs: [200, 500, 1000], clearShare: 0.5 },
  // Драма-менеджер выдачи (Phase 25, ADR-0008). Пришёл на смену «милосердию»,
  // которое подыгрывало в начале партии: замер показал, что на выживаемость оно
  // не влияет вовсе, а ощущение «игра поддакивает новичку» давало.
  //
  // Теперь подыгрывание работает там, где оно драматургически уместно — когда
  // поле почти забито, — и **ограничено**: не больше maxRescuesPerGame раз за
  // партию, не два раза подряд и только пока счёт ниже rescueUntilScore. Без
  // ограничений вернулась бы ровно та жалоба, с которой началась фаза:
  // «проиграть невозможно».
  //
  // Обратная сторона — давление: после pressureFromScore очков первая стопка
  // раздачи иногда нарочно не подходит ни к одной стопке поля.
  // Phase 36: выручка ужата, давление начинается втрое раньше. Совсем убирать
  // выручку нельзя — замер показал, что на начало она не влияет вовсе (там теснит
  // порог сгорания), зато середину делает жёстче, а новичка теряют на первых партиях.
  drama:     { rescueFreeCells: 3,      // столько свободных ячеек и меньше — беда
               maxRescuesPerGame: 2,
               rescueUntilScore: 800,   // дальше игрок выплывает сам
               rescueSlots: 2,          // сколько стопок раздачи подчиняется выручке:
                                        // одной мало — замер показал, что на исход
                                        // партии она почти не влияет (ADR-0008)
               pressureFromScore: 250,
               pressureChance: 0.5,
               pressureSlots: 1 },      // давить всей рукой нельзя: рука перестанет
                                        // быть выбором и станет наказанием
  // Анимации. Всё, что ниже пустой строки, — juice (Phase 15): обнуление любого
  // числа гасит соответствующий эффект, логика игры от них не зависит.
  animation: { burnFlashMs: 280, landingMs: 150,
               landingScale: 1.22, burnFlashGrow: 0.45, ringGrowMs: 420,
               // отдельной длительности у доворота больше нет (Phase 34): угол
               // всегда догоняет camera.target, и доворот — это просто новая цель
               // Слияние стопок: фишки летят дугой по очереди, а не комом.
               // Задержка задана в миллисекундах, а не в долях шага (Phase 34):
               // в долях она сжималась числом фишек, и блок из пяти улетал за 24 мс
               // на фишку — глазом это и была «куча».
               flowTravelMs: 260,    // полёт одной фишки
               flowStepMs: 70,       // задержка между соседними фишками
               // потолок обязателен: в тестах часы прыгают на 1000 мс за кадр, и
               // анимация длиннее секунды рискует не завершиться
               flowMaxMs: 900,
               flowArc: 34,          // высота дуги, px
               flowLift: 0.14,       // приближение фишки на вершине дуги
               flowFlutter: 0.16,    // покачивание бумаги в полёте, радианы
               flowShadow: 0.35,     // плотность тени под летящей фишкой
               // Бусты: стопка летит целиком, «убрать» рассыпает её на осколки,
               // «пересдача» меняет руку — старые стопки уезжают, новые падают
               dragFollowMs: 55,     // за сколько стопка догоняет палец
               boostMoveMs: 320, boostArc: 46, boostScatterPerTile: 3,
               handSwapMs: 300, handSwapRise: 60,

               // Сила сгорания (Phase 35): осколки, кольцо, тряска и вспышка
               // берут её одним числом, иначе картинка разъезжается.
               burnPowerMax: 3,      // потолок силы: 30 фишек при пороге 10
               particlesPerBurn: 14, particlesMax: 60,
               particleMs: 620, particleSpeed: 190,
               particleGravity: 520, particleSize: 5,
               ringMs: 420,          // ударная волна от сгоревшего блока
               ringGrow: 1.9,        // во сколько раз кольцо расходится
               ringWidth: 7,
               floatMs: 820, floatRise: 86,     // всплывающее «+N очков»
               counterMs: 420,                  // счёт и кошелёк догоняют значение
               shakeMs: 260, shakeAmp: 9, shakeAmpMax: 22, shakeFromTiles: 15,
               overlayFadeMs: 260,
               pressMs: 140,        // отклик нажатия: кнопка вдавливается и отходит
               pressScale: 0.94,
               quickPanelMs: 190 }, // выезд быстрой панели настроек (Phase 41)
  // Звук. Синтезируется кодом: внешних файлов в проекте быть не может (ADR-0001).
  // master: 0 глушит игру целиком, gain: 0 у голоса гасит один звук — как у juice.
  //
  // volumeSfx и music.volume — это регуляторы экрана настроек (Phase 19), а не
  // калибровка: множители 0…1 поверх master и music.gain. Единица означает
  // «как задумано», поэтому подбор тембра и подбор громкости игроком не спорят.
  audio:     { master: 0.35, volumeSfx: 1,
               maxFlowTicks: 6,      // длинный перелив не строчит очередью
               minGapMs: 30,         // одинаковые звуки ближе этого сливаются в один
               comboSteps: [0, 2, 4, 7, 9, 12],   // пентатоника, полутоны

               // Тембр «бумага и дерево» под стиль «Бумажный крафт». Дерево — это
               // короткая атака и падающий питч; бумага — полоса шума, а не тон.
               // Значения по умолчанию: их берёт голос, который своих не задал.
               woodDrop: 0.45,       // во сколько раз питч падает за время звука
               woodDecay: 0.18,      // затухание «тука», с
               paperBand: 2600,      // центр полосы шороха бумаги, Гц
               paperQ: 0.9,          // ширина полосы: меньше — шире и глуше
               paperDecay: 0.13,     // затухание шороха, с

               // Голос каждого события — единственное место, где правится тембр.
               // gain — громкость; freq/drop/decay/type — тон дерева (drop больше
               // единицы значит, что питч не падает, а растёт); band/q — полоса
               // шороха бумаги; noiseGain/harmonic — громкость доп. слоя.
               voices: {
                 // Два самых частых коротких звука. Низкая широкая полоса даёт
                 // шорох картона; высокая узкая давала щелчок (правка по playtest).
                 // Взятие стопки звучало щелчком не из-за частоты, а из-за
                 // мгновенной атаки (правка по playtest, Phase 23). Теперь
                 // громкость нарастает за attack — это вздох, а не «чик».
                 pick:   { gain: 0.30, band: 600, q: 0.40, decay: 0.28, attack: 0.03 },
                 snap:   { gain: 0.20, band: 750, q: 0.55, decay: 0.16 },

                 place:  { gain: 0.80, freq: 300, decay: 0.14,
                           noiseGain: 0.5, band: 1800, noiseDelay: 0.01 },
                 flow:   { gain: 0.35, freq: 450, step: 36, decay: 0.07,
                           drop: 0.7, type: 'sine' },
                 burn:   { gain: 1.00, freq: 300, decay: 0.26, drop: 0.5,
                           sizeCurve: 0.4,     // насколько питч падает с размером блока
                           decayPerSize: 0.06, // крупный блок звучит ещё и дольше
                           harmonic: 0.35, harmonicRatio: 2, harmonicDecay: 0.12,
                           noiseGain: 0.6, band: 1400, noiseDecay: 0.22, noiseDelay: 0.02 },
                 combo:  { gain: 0.90, freq: 600, decay: 0.30, drop: 0.85,
                           harmonic: 0.4, harmonicRatio: 1.5,
                           harmonicDecay: 0.22, harmonicDelay: 0.05 },
                 ring:   { gain: 0.80, freq: 150, decay: 0.60, drop: 2, type: 'sine',
                           noiseGain: 0.5, band: 900, noiseDecay: 0.5 },
                 boost:  { gain: 0.70, freq: 480, decay: 0.22, drop: 1.6, type: 'sine',
                           removeBand: 1200, removeQ: 0.5, removeDecay: 0.4,
                           rerollTicks: 3, rerollGain: 0.7, rerollBand: 2400,
                           rerollStep: 400, rerollDecay: 0.1, rerollDelay: 0.06 },
                 deny:   { gain: 0.60, freq: 165, decay: 0.12, drop: 0.9, type: 'sine' },
                 deal:   { gain: 0.45, ticks: 3, band: 2800, step: -300,
                           decay: 0.09, delay: 0.05 },
                 // полутоны финальной фразы: вверх при рекорде, иначе вниз
                 over:   { gain: 0.90, freq: 300, decay: 0.40, drop: 0.8, delay: 0.16,
                           record: [0, 4, 7], lost: [0, -3, -8] }
               },

               // Отправка эффектов в ту же комнату, что и музыка. Ноль — прежний
               // сухой звук; много — эффекты «уплывают» и теряют читаемость.
               roomSend: 0.18,

               // Музыка (Phase 18, переписана по docs/music-brief.md).
               // Не петля, а аранжировка: секции включают и выключают партии,
               // аккорды меняются сами, у партий по нескольку рисунков. Главное
               // требование брифа — музыка не стоит на месте и «дышит» каждые
               // 15–30 секунд, оставаясь при этом фоном, а не событием.
               //
               // Бесшовности добиваться не нужно: музыка синтезируется непрерывно,
               // а не склеивается из файла, поэтому точки склейки не существует.
               // Последняя секция просто возвращает набор партий к вступлению.
               music: { gain: 0.20,        // фон заметно тише эффектов
                        volume: 1,         // регулятор игрока (Phase 19), см. volumeSfx
                        tuning: 440,       // обычный строй
                        // Phase 26: тестировщики просят темп и динамику, и бриф
                        // пересмотрен под них (см. music-brief.md, раздел «Правка
                        // по playtest»). Прежний потолок 108 снят: 112 — всё ещё
                        // спокойный темп, но пульс уже слышен.
                        bpm: 112,
                        stepsPerBar: 8,    // восьмые в 4/4; шаг 0.268 с, такт 2.14 с
                        varyBars: 8,       // рисунок партии меняется раз в 8 тактов (17 с)

                        // Против «дёшево». Сухой одинокий осциллятор всегда звучит
                        // пищалкой; лечится тремя приёмами, и все бесплатные:
                        // комната (импульс генерируем кодом — файлов быть не может),
                        // пара расстроенных голосов вместо одного,
                        // и фильтр, который закрывается вместе с нотой.
                        reverbSec: 2.8, reverbDecay: 2.4, reverbMix: 0.55,
                        detuneCents: 7,     // уже — стерильно, шире — расстроенно
                        filterQ: 0.9,
                        filterOpen: 4.5,    // во сколько раз выше тона открыт фильтр в атаке
                        filterClose: 1.3,   // и до чего закрывается к концу ноты
                        filterTension: 0.8, // на тесном поле заметно ярче (Phase 26:
                                            // «стало опаснее» должно быть слышно)
                        panSpread: 0.55,    // разброс по стерео
                        velocityVary: 0.35, // разброс громкости: ровные ноты звучат механически

                        lookaheadMs: 220,  // как часто просыпается планировщик
                        scheduleAhead: 0.7,// на сколько секунд вперёд кладутся ноты
                        maxStepsPerPump: 8,// потолок: часы могут прыгнуть вперёд
                        roomyFrom: 8,      // свободных ячеек столько и больше — натяжение 0
                        tightAt: 3,        // столько и меньше — натяжение 1

                        // Гармония: тёплый мажор без тревоги, аккорд держится
                        // chordBars такта. Мелодические партии берут ноты из
                        // текущего аккорда, поэтому диссонансов нет по построению,
                        // а гармония меняется сама («меняется гармония» из брифа).
                        chordBars: 2,
                        chords: [
                          [0, 4, 7, 11],      // Imaj7
                          [9, 12, 16, 19],    // vi7
                          [5, 9, 12, 16],     // IVmaj7
                          [7, 11, 14, 18]     // Vmaj7
                        ],

                        // Мотивы — «несколько коротких, постоянно меняющихся между
                        // собой». at — шаг внутри такта, deg — ступень аккорда.
                        motifs: [
                          [{ at: 0, deg: 0 }, { at: 3, deg: 2 }, { at: 6, deg: 1 }],
                          [{ at: 2, deg: 1 }, { at: 5, deg: 3 }],
                          [{ at: 0, deg: 2 }, { at: 4, deg: 0 }, { at: 7, deg: 1 }],
                          [{ at: 1, deg: 3 }, { at: 6, deg: 2 }]
                        ],

                        // Аранжировка на 104 такта ≈ 4:20 — структура из брифа.
                        // Партии включаются и выключаются сами: инструмент
                        // появляется и исчезает, и это половина «дыхания».
                        // Phase 26: вступление вчетверо короче (12 → 4 такта) —
                        // тестировщики слышали начало партии как пустоту, — а грув
                        // (kick, brush, bass) вступает почти сразу и уходит только
                        // в последней секции.
                        arrangement: [
                          { bars: 4,  parts: ['texture', 'pad', 'piano'] },
                          { bars: 24, parts: ['texture', 'pad', 'piano', 'shaker', 'bass',
                                              'kick'] },
                          { bars: 28, parts: ['texture', 'pad', 'piano', 'shaker', 'bass',
                                              'kick', 'brush', 'kalimba', 'click'] },
                          { bars: 28, parts: ['texture', 'pad', 'marimba', 'shaker', 'bass',
                                              'kick', 'brush', 'kalimba', 'click'] },
                          { bars: 16, parts: ['texture', 'pad', 'piano', 'shaker', 'bass'] }
                        ],

                        // Партии. tone — щипковые и пад (musicVoice), noise —
                        // перкуссия и фактура (musicRustle). steps — рисунок внутри
                        // такта, несколько вариантов: раз в varyBars берётся
                        // следующий, и рисунок обновляется незаметно.
                        //
                        // Перкуссия стоит на слабых долях и заметно тише
                        // мелодических партий: бриф требует «почти незаметную»,
                        // без сильных ударов и без ощущения танца. Кика и малого
                        // нет вовсе — «Loud Drums» в списке запрещённого.
                        parts: {
                          // тепло под всем; фон, а не голос — потому и тихо,
                          // и фильтр открыт совсем немного
                          pad:     { kind: 'chord', level: 0.10, octave: -1,
                                     type: 'triangle', attack: 1.8, decay: 6.0, drop: 1,
                                     filterOpen: 1.6, every: 2 },
                          // «улыбка»: мягкая атака, без обертона — фетровое пианино
                          piano:   { kind: 'motif', level: 0.30, octave: 0,
                                     type: 'triangle', attack: 0.02, decay: 1.6, drop: 0.995,
                                     motifs: [0, 1, 2] },
                          // короткие ответы; нецелый обертон 2.76 — обертон
                          // свободного бруска, им дерево и отличается от синтезатора
                          kalimba: { kind: 'motif', level: 0.20, octave: 1,
                                     type: 'sine', attack: 0.004, decay: 0.9, drop: 0.99,
                                     overtone: 0.25, overtoneRatio: 2.76, overtoneDecay: 0.4,
                                     motifs: [1, 3] },
                          marimba: { kind: 'motif', level: 0.26, octave: 0,
                                     type: 'triangle', attack: 0.004, decay: 1.1, drop: 0.99,
                                     overtone: 0.2, overtoneRatio: 2.76, overtoneDecay: 0.35,
                                     motifs: [2, 3, 0] },
                          // опора; в Phase 26 бас стал ходить по долям, а не
                          // отмечать такт: без него пульс держать нечем
                          bass:    { kind: 'root', level: 0.34, octave: -2,
                                     type: 'sine', attack: 0.012, decay: 0.9, drop: 0.98,
                                     steps: [[0, 4], [0, 3, 6], [0, 4, 6]] },
                          // Ритм (Phase 26). Мягкий, но слышимый: дерево ~62 Гц
                          // БЕЗ обертона — с обертоном 2.76 это был бы том, а не
                          // удар. Играет фиксированную ноту, а не корень аккорда,
                          // поэтому у него свой kind.
                          kick:    { kind: 'drum', freq: 62, level: 0.26,
                                     type: 'sine', attack: 0.004, decay: 0.24, drop: 0.55,
                                     steps: [[0, 4], [0, 4, 6], [0, 3, 4]] },
                          // «малый» из бумаги: щётка по картону на 2-й и 4-й доле,
                          // никогда не вместе с киком на первой
                          brush:   { kind: 'noise', gain: 0.09, band: 3200, q: 0.7,
                                     attack: 0.006, decay: 0.16,
                                     steps: [[2, 6], [2, 6, 7], [2, 6]],
                                     tensionSteps: [3, 7] },
                          // движение: атака 0.02 — это выдох, а не щелчок
                          shaker:  { kind: 'noise', gain: 0.13, band: 6200, q: 0.6,
                                     attack: 0.02, decay: 0.12,
                                     steps: [[1, 3, 5, 7], [1, 5, 7], [1, 3, 5, 6, 7]],
                                     tensionSteps: [0, 2, 4] },
                          // «неидеальность» ручной работы
                          click:   { kind: 'noise', gain: 0.07, band: 2400, q: 0.8,
                                     attack: 0.003, decay: 0.07,
                                     steps: [[2], [6], [2, 6], []] },
                          // бумага и плёнка под всем: длинный тихий шум внахлёст
                          texture: { kind: 'noise', gain: 0.05, band: 1000, q: 0.4,
                                     attack: 1.2, decay: 3.2, steps: [[0]] }
                        } } },
  // Камера: панорама и зум поля. Игра работает и без них — поле всегда вписано.
  // Поворот поля: перетаскивание по полю вращает его вокруг центра, при отпускании
  // угол примагничивается к ближайшему кратному 60° (симметрия гекса).
  camera:    { snapStepDeg: 60,
               minDragToRotate: 14,   // сколько нужно протащить, чтобы жест начался
               minSpinRadius: 70,     // ближе к центру палец поле не крутит:
                                      // там на пиксель приходятся десятки градусов
               spinSensitivity: 0.85, // отклик чуть мягче, чем 1:1
               // Сглаживание жеста (Phase 34). Палец задаёт camera.target, а

               // читался ступеньками.
               followMs: 70,          // за сколько угол догоняет палец

  // Три буста решают три разные задачи: где лежит стопка, что лежит в руке,
  // сколько на поле места. instant — буст без выбора ячейки, срабатывает сразу.
  // label и hint — ключи в I18N, а не готовые строки (Phase 23): подписи на
  // кнопках больше не рисуются, но подсказка активного буста переводится.
  boosts:    [
               { kind: 'move',   cost: 30, label: 'boostMove',   hint: 'hintMove' },

               { kind: 'remove', cost: 60, label: 'boostRemove', hint: 'hintRemove' }

  // Вибрация (Phase 18, набор событий пересмотрен в Phase 35). Порог крупного
  // сгорания общий с тряской экрана (animation.shakeFromTiles): отдача должна
  // совпадать с картинкой. Массив — это чередование «вибрируем / пауза», мс.

  // До Phase 35 отдача была только на блоке от 15 фишек, и при пороге сгорания

               deny: 8 },                        // отказ действия
  // Сохранения. Всё лежит одним JSON-объектом под одним ключом: так снимок
  // прогресса один в один ложится в player.setData() площадки, когда до неё

  // Площадка (Phase 40). sdkSrc — относительный путь: на серверах Яндекса он

  platform:  { sdkSrc: '/sdk.js', cloudMinMs: 4000,
               leaderboardName: 'hexasort_score' },
  // Лидерборд (Phase 43). Числа взяты под лимиты площадки: getEntries — 20

  leaderboard: { topCount: 8, aroundCount: 1, cacheMs: 20000,

// Единственная точка доступа к текстам. Неизвестный ключ возвращается как есть —
// пустая надпись на экране хуже, чем видимое имя ключа.
function t(key) {
  const dict = I18N[CONFIG.lang] || I18N.ru;
  return dict[key] !== undefined ? dict[key] : key;
}

// Словарей два, а кодов языка у площадки десятки (ISO 639-1: tr, de, …).
// Свёртка одна на оба источника — и на браузер, и на environment площадки.
function normalizeLang(code) {
  return String(code || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
}

// Язык браузера: всё, кроме русского, получает английский
function detectLang() {
  try {
    return normalizeLang(navigator.language);
  } catch (e) {
    return 'ru';
  }
}

function setLang(lang) {
  if (!I18N[lang]) return false;
  CONFIG.lang = lang;
  return true;
}

// themes — визуальный стиль (Phase 12/14). Тема задаёт палитру, цвета интерфейса
// и три функции отрисовки: фон, пустая ячейка, фишка. Остальной render не знает,
// какой стиль включён, — он работает через CONFIG.ui и THEME.
//
// Из восьми вариантов пользователь выбрал «Бумажный крафт», остальные удалены.
// Структура на несколько тем оставлена: добавить стиль — это дописать объект,
// ничего не меняя в рендере (историю вариантов см. в git и styles-preview.html).
// ============================================================================
const THEMES = {

  // --- Бумажный крафт: фактура бумаги, неровные вырезанные края --------------
  paper: {
    name: 'Бумажный крафт',
    palette: ['#D1495B', '#3A7CA5', '#5B8C5A', '#E9C46A', '#8E7DBE',
              '#E07A5F', '#5AA9A3', '#C97BA0', '#F7F3E8', '#9C7A5B'],
    geometry: { scale: 0.84, layerOffset: 9 },
    ui: {
      bg: '#EFE6D5', cellFill: '#E2D6BF', cellStroke: '#C7B393',
      text: '#3B3226', textDim: '#8A7A63',
      highlightFill: '#F6EDD8', highlightStroke: '#8A7A63',
      overlayBg: 'rgba(239, 230, 213, 0.92)', overlayText: '#3B3226',
      cardFill: '#F6EDD8', cardShadow: 'rgba(90, 72, 48, 0.16)',
      buttonFill: '#3A7CA5', buttonFillDark: '#2C5F7F', buttonText: '#F7F3E8',
      coinColor: '#E9C46A'
    },
    boostBar: { fill: '#E2D6BF', fillActive: '#F6EDD8',
                stroke: '#C7B393', strokeActive: '#8A7A63' },

    // Матовая поверхность (Phase 22). Глянец на бумаге читается как пластик,
    // поэтому тень мягкая и почти без смещения.
    // Зерно на самих фишках было и убрано по playtest (Phase 23): крупинки
    // читались как случайные белые точки, а не как фактура. Фактура осталась
    // там, где работает, — на фоне.
    matte: { shadow: 'rgba(60, 45, 30, 0.18)', blur: 5, offsetY: 2 },

    // фон рисуется один раз и кэшируется: 7000 крупинок каждый кадр — дорого
    background(ctx) {
      ctx.fillStyle = '#EFE6D5';
      ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);
      for (let i = 0; i < 7000; i++) {
        ctx.fillStyle = render.noise(i, 3) > 0.5
          ? 'rgba(120,100,70,0.06)' : 'rgba(255,255,255,0.5)';
        ctx.fillRect(render.noise(i, 1) * CONFIG.canvas.width,
          render.noise(i, 2) * CONFIG.canvas.height, 2, 2);
      }
    },

    // края «вырезаны ножницами»: вершины гекса чуть дрожат по детерминированному шуму
    wobbleHex(ctx, cx, cy, size, seed) {
      const points = hexMath.hexCorners(cx, cy, size);
      ctx.beginPath();
      points.forEach((point, i) => {
        const dx = (render.noise(seed + i, 7) - 0.5) * 4.5;
        const dy = (render.noise(seed + i, 9) - 0.5) * 4.5;
        if (i === 0) ctx.moveTo(point.x + dx, point.y + dy);
        else ctx.lineTo(point.x + dx, point.y + dy);
      });
      ctx.closePath();
    },

    emptyCell(ctx, cell, size, fill, stroke) {
      const seed = cell.q * 17 + cell.r * 43;
      THEMES.paper.wobbleHex(ctx, cell.pixelX, cell.pixelY, size, seed);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    },

    tile(ctx, x, y, size, color, isTop, seed) {
      const m = THEMES.paper.matte;
      ctx.save();
      ctx.shadowColor = m.shadow;
      ctx.shadowBlur = m.blur;
      ctx.shadowOffsetY = m.offsetY;
      THEMES.paper.wobbleHex(ctx, x, y, size, seed);
      ctx.fillStyle = isTop ? color : render.shade(color, -0.12);
      ctx.fill();
      ctx.restore();
      THEMES.paper.wobbleHex(ctx, x, y, size, seed);
      ctx.strokeStyle = render.shade(color, -0.35);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
};

let THEME = THEMES.paper;

// ============================================================================
// Storage — единственная точка доступа к сохранениям. Игра нигде не обращается
// к localStorage напрямую, это закрыто тестом-сканером.
//
// Наружу торчит синхронный объект `Storage.data`: читать сохранённое посреди
// кадра нужно постоянно, а ждать промиса кадр не может. Асинхронной остаётся
// только запись — и позже, когда под flush() ляжет облако площадки, игра этого
// не заметит (требование 1.9: прогресс переживает перезагрузку страницы).
// ============================================================================
const Storage = {
  data: null,
  pending: false,      // запись уже отложена — второй таймер заводить незачем

  defaults() {
    // langChosen поднимается только переключателем языка в настройках: по
    // settings.lang этого не понять — persistSettings пишет туда текущий язык
    // при любом изменении громкости, а язык площадки не должен спорить с
    // выбором игрока (Phase 40).
    return { version: CONFIG.storage.version, best: 0, coins: 0,
             settings: null, langChosen: false, stats: null, seen: {} };
  },

  // Целое неотрицательное или ноль: в хранилище мог оказаться мусор
  num(value) {
    return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
  },

  // Прочитать сохранение. Битое значение, приватный режим и отключённое
  // хранилище дают умолчания — играть можно, просто без сохранений.
  // Возвращает true, если прежний прогресс подошёл и был поднят.
  load() {
    Storage.data = Storage.defaults();
    let saved = null;
    try {
      const raw = localStorage.getItem(CONFIG.storage.key);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed === 'object') saved = parsed;
    } catch (e) {
      saved = null;
    }
    if (!saved) return false;
    // настройки и показанные подсказки переживают смену версии экономики
    if (saved.settings && typeof saved.settings === 'object') {
      Storage.data.settings = saved.settings;
    }
    if (saved.langChosen === true) Storage.data.langChosen = true;
    if (saved.seen && typeof saved.seen === 'object') Storage.data.seen = saved.seen;
    if (Storage.num(saved.version) < CONFIG.storage.version) return false;
    Storage.data.best = Storage.num(saved.best);
    Storage.data.coins = Storage.num(saved.coins);
    if (saved.stats && typeof saved.stats === 'object') Storage.data.stats = saved.stats;
    return true;
  },

  // Изменить сохранённое. Запись откладывается: за одну волну кошелёк меняется
  // несколько раз, и каждое изменение писать незачем.
  put(patch) {
    Object.assign(Storage.data, patch);
    Storage.flushSoon();
  },

  // Таймер держится флагом, а не идентификатором: в тестах setTimeout выполняется
  // немедленно и возвращает undefined, и по идентификатору отложенная запись
  // залипла бы навсегда.
  flushSoon() {
    if (Storage.pending) return false;
    Storage.pending = true;
    setTimeout(Storage.onTimer, CONFIG.storage.flushMs);
    return true;
  },
  onTimer() {
    Storage.pending = false;
    Storage.flush();
  },

  // Записать немедленно. Зовётся при уходе со вкладки: отложенная запись до
  // закрытия могла и не успеть. С Phase 40 тот же снимок уходит в облако
  // площадки — оно принимает его как есть, потому что всё лежит одним объектом.
  flush() {
    Platform.saveCloud(Storage.data);
    try {
      localStorage.setItem(CONFIG.storage.key, JSON.stringify(Storage.data));
      return true;
    } catch (e) {
      return false;   // нет доступа к хранилищу — просто живём без сохранений
    }
  },

  // Снимок из облака приезжает уже после старта партии: ждать сеть игра не
  // должна. Поэтому не «загрузка», а слияние, и спорные места решаются в пользу
  // игрока — иначе прогресс, набранный офлайн, пропал бы при первом же выходе в
  // сеть, а это ровно то, от чего облако должно защищать.
  mergeCloud(remote) {
    if (!remote || typeof remote !== 'object') return false;
    let changed = false;

    // Настройки берём облачные только на чистом устройстве: локальные игрок
    // видел последними, и подменять их под ним нельзя.
    if (!Storage.data.settings && remote.settings && typeof remote.settings === 'object') {
      Storage.data.settings = remote.settings;
      if (remote.langChosen === true) Storage.data.langChosen = true;
      applySettings(Storage.data.settings);
      changed = true;
    }
    // Показанная подсказка остаётся показанной на любом устройстве
    if (remote.seen && typeof remote.seen === 'object') {
      Object.keys(remote.seen).forEach((key) => {
        if (remote.seen[key] && !Storage.data.seen[key]) {
          Storage.data.seen[key] = remote.seen[key];
          changed = true;
        }
      });
    }
    // Прогресс прежней экономики обесценен так же, как локальный (ADR-0004)
    if (Storage.num(remote.version) < CONFIG.storage.version) {
      if (changed) Storage.flushSoon();
      return changed;
    }

    const best = Storage.num(remote.best);
    if (best > Storage.data.best) { Storage.data.best = best; changed = true; }
    const coins = Storage.num(remote.coins);
    if (coins > Storage.data.coins) { Storage.data.coins = coins; changed = true; }
    if (Storage.mergeStats(remote.stats)) changed = true;

    if (changed) Storage.flushSoon();
    return changed;
  },

  // Счётчики сливаются по одному: они накапливаются на каждом устройстве
  // отдельно, и общий максимум по объекту тут ничего не значит.
  mergeStats(remote) {
    if (!remote || typeof remote !== 'object') return false;
    const local = Storage.data.stats || emptyStats();
    let changed = false;
    ['games', 'burns', 'coins', 'biggestBlock', 'longestCombo'].forEach((key) => {
      const value = Storage.num(remote[key]);
      if (value > Storage.num(local[key])) { local[key] = value; changed = true; }
    });
    // Таблица лучших забегов — объединение с обрезкой по той же длине, что и на
    // экране статистики; одинаковые забеги с двух устройств не различить, но
    // дубликат в топ-5 безобиднее потерянного рекорда.
    if (Array.isArray(remote.best) && remote.best.length) {
      const runs = (local.best || []).concat(remote.best)
        .filter(run => run && Number.isFinite(run.score))
        .sort((a, b) => b.score - a.score)
        .slice(0, CONFIG.ui.stats.topRuns);
      if (JSON.stringify(runs) !== JSON.stringify(local.best || [])) {
        local.best = runs;
        changed = true;
      }
    }
    Storage.data.stats = local;
    return changed;
  }
};

// ============================================================================
// Platform — единственная точка доступа к SDK площадки (Phase 40, ADR-0011).
// Слово YaGames встречается только здесь, это закрыто тестом-сканером.
//
// Три правила, которые определяют вид этого кода:
//
// 1. Игра обязана работать без SDK. Двойной клик по файлу, GitHub Pages,
//    tools/balance.js — везде /sdk.js не загрузится. Поэтому наружу торчат
//    намерения («геймплей идёт», «сохрани снимок»), а не вызовы SDK, и каждое
//    из них молча ничего не делает, пока площадки нет.
// 2. Только .then(), никаких async/await. Тесты синхронные: они подсовывают
//    thenable, который зовёт колбэк немедленно, и весь путь отрабатывает внутри
//    проверки. С await пришлось бы заводить асинхронный блок тестов, а такой
//    уже удаляли в Phase 38.
// 3. Ошибки площадки не должны ломать партию: у каждого промиса есть catch,
//    и он молчит — играть можно и без сети.
// ============================================================================
const Platform = {
  ysdk: null,
  player: null,
  gameReady: false,      // игра догрузилась (у нас — конец init)
  readySent: false,      // LoadingAPI.ready() уходит ровно один раз
  playing: false,        // GameplayAPI: идёт ли сейчас размеченный геймплей
  lastCloudMs: 0,
  cloudPending: false,
  lastSent: null,        // последний отправленный снимок: одинаковое не шлём дважды
  lastAdMs: 0,           // когда показывали межстраничную (Phase 42)
  reviewAsked: false,    // оценку просят один раз за сессию
  lastScoreMs: 0,        // setScore: лимит площадки 1 запрос в секунду (Phase 43)
  rankCache: null,       // последний ответ таблицы: {ms, data}

  hasSdk() {
    return !!Platform.ysdk;
  },

  // Загрузка скрипта площадки. Доки дают два равноправных способа; берём
  // динамический, потому что тег в <head> с onload требовал бы глобальной
  // функции — игровой скрипт лежит в конце <body> и мог бы не успеть.
  load() {
    try {
      if (typeof document === 'undefined' || !document.createElement) return false;
      // Двойной клик по файлу и демо на GitHub Pages: площадки там нет заведомо, а
      // запрос дал бы 404 в консоли — по чеклисту DoD она должна быть чистой.
      // Список закрытый, а не открытый: не угадать хост площадки означало бы
      // остаться на модерации без SDK, то есть получить отказ.
      if (typeof location !== 'undefined' &&
          (location.protocol === 'file:' ||
           String(location.host || '').indexOf('github.io') !== -1)) return false;
      if (Platform.sdkGlobal()) { Platform.boot(); return true; }
      const script = document.createElement('script');
      script.src = CONFIG.platform.sdkSrc;
      script.async = true;
      script.onload = Platform.boot;
      script.onerror = () => {};      // нет площадки — нет и ошибки, это норма
      document.body.appendChild(script);
      return true;
    } catch (e) {
      return false;
    }
  },

  // SDK кладёт себя в глобальную область, то есть в window: так его не нужно
  // передавать отдельным аргументом в тестовую обёртку.
  sdkGlobal() {
    return (typeof window !== 'undefined' && window.YaGames) ? window.YaGames : null;
  },

  boot() {
    const api = Platform.sdkGlobal();
    if (!api || !api.init) return false;
    try {
      api.init().then(Platform.attach, () => {});
    } catch (e) {
      return false;
    }
    return true;
  },

  // Площадка приехала. Порядок вызовов важен: сначала язык и готовность
  // (их ждёт модерация), потом игрок с его облаком.
  attach(ysdk) {
    if (!ysdk) return false;
    Platform.ysdk = ysdk;
    Platform.applyLang();
    Platform.listen();
    Platform.sendReady();
    Platform.loadPlayer();
    return true;
  },

  // Язык интерфейса площадки (п. 2.14). Выбор игрока важнее: его ставит
  // applySettings, и тогда langChosen уже поднят.
  applyLang() {
    try {
      const env = Platform.ysdk && Platform.ysdk.environment;
      const code = env && env.i18n && env.i18n.lang;
      if (!code || Storage.data.langChosen) return false;
      if (!setLang(normalizeLang(code))) return false;
      requestRender();     // SDK приезжает после первого кадра: он уже нарисован
      return true;
    } catch (e) {
      return false;
    }
  },

  // Пауза площадки: реклама, окно покупок, уход со вкладки. Единственная связка,
  // про которую доки прямо пишут, что она закрывает требования 1.3 и 4.7.
  // Платформа показывает межстраничную рекламу на старте всех игр, и колбэков
  // у неё нет — глушить звук можно только отсюда.
  listen() {
    try {
      if (!Platform.ysdk.on) return false;
      Platform.ysdk.on('game_api_pause', () => setPageActive(false));
      Platform.ysdk.on('game_api_resume', () => setPageActive(true));
      return true;
    } catch (e) {
      return false;
    }
  },

  // Игра готова к игроку. Ресурсов у нас нет вовсе, поэтому готовность наступает
  // в конце init(); SDK может приехать и раньше, и позже — вызов делает тот, кто
  // пришёл вторым.
  markGameReady() {
    Platform.gameReady = true;
    return Platform.sendReady();
  },

  sendReady() {
    if (Platform.readySent || !Platform.gameReady || !Platform.ysdk) return false;
    try {
      const features = Platform.ysdk.features;
      const api = features && features.LoadingAPI;
      if (api && api.ready) api.ready();
      Platform.readySent = true;
      return true;
    } catch (e) {
      return false;
    }
  },

  // Разметка геймплея (п. 1.19.3). Площадка требует строгого чередования: два
  // start подряд — уже замечание. Поэтому наружу торчит «идёт / не идёт», а
  // парность держит флаг здесь, а не расставленные по коду вызовы.
  setPlaying(active) {
    if (Platform.playing === active) return false;
    Platform.playing = active;
    try {
      const features = Platform.ysdk && Platform.ysdk.features;
      const api = features && features.GameplayAPI;
      if (!api) return true;
      if (active && api.start) api.start();
      if (!active && api.stop) api.stop();
    } catch (e) {
      // разметка не критична: партия продолжается
    }
    return true;
  },

  // Игрок и его облако. getPlayer работает и без авторизации: платформа хранит
  // прогресс и анонимному игроку.
  loadPlayer() {
    try {
      if (!Platform.ysdk.getPlayer) return false;
      Platform.ysdk.getPlayer().then((player) => {
        Platform.player = player;
        if (!player || !player.getData) return;
        player.getData().then(Platform.receiveCloud, () => {});
      }, () => {});
      return true;
    } catch (e) {
      return false;
    }
  },

  receiveCloud(remote) {
    if (!Storage.mergeCloud(remote)) return false;
    adoptStorageProgress();   // партия уже идёт: рекорд и кошелёк в ней живые
    return true;
  },

  // Снимок в облако. Два предохранителя поверх отложенной записи Storage: flush()
  // зовётся ещё и в конце партии, и при уходе со вкладки, а лимит площадки —
  // 100 записей за 5 минут. Возвращает, что случилось с вызовом: тесты смотрят
  // именно на это, потому что setTimeout в них выполняется немедленно.
  //
  // Первый предохранитель — не слать одно и то же. Площадка шлёт
  // game_api_pause/resume на каждую потерю фокуса вкладки, а каждая пауза делает
  // flush(): без этой проверки переключение вкладок туда-сюда съедало бы лимит,
  // ничего при этом не сохраняя.
  saveCloud(data) {
    if (!Platform.player || !Platform.player.setData) return 'no-sdk';
    const json = JSON.stringify(data);
    if (json === Platform.lastSent) return 'same';
    const now = Date.now();
    if (now - Platform.lastCloudMs < CONFIG.platform.cloudMinMs) {
      if (Platform.cloudPending) return 'queued';
      Platform.cloudPending = true;
      setTimeout(Platform.flushCloud, CONFIG.platform.cloudMinMs);
      return 'queued';
    }
    return Platform.send(data);
  },

  flushCloud() {
    Platform.cloudPending = false;
    if (JSON.stringify(Storage.data) === Platform.lastSent) return;
    Platform.send(Storage.data);
  },

  send(data) {
    Platform.lastCloudMs = Date.now();
    Platform.lastSent = JSON.stringify(data);
    try {
      const promise = Platform.player.setData(data);
      if (promise && promise.then) promise.then(() => {}, () => {});
      return 'sent';
    } catch (e) {
      return 'failed';
    }
  },

  // --- Реклама и оценка (Phase 42) ------------------------------------------
  // Наружу и здесь торчат намерения: «партия кончилась, покажи если положено»,
  // «игрок хочет буст за ролик», «сейчас удачный момент попросить оценку».
  // Решение «показывать или нет» принимает Platform, а не вызывающий код: иначе
  // счётчики и кулдаун расползлись бы по input и main.
  //
  // Общее правило всех трёх: без площадки колбэк завершения зовётся немедленно и
  // синхронно. Иначе двойной клик по файлу давал бы мёртвую кнопку «Заново».

  // Полноэкранная реклама между партиями. Частоту режет и сама площадка (наш
  // вызов может ничего не показать и прислать onClose(false)) — свой кулдаун
  // нужен, чтобы не долбить её на каждый быстрый проигрыш.
  //
  // Условие одно — время. Первый показ за сессию проходит сразу: lastAdMs = 0,
  // то есть «с прошлого раза прошла вечность». Это верно по смыслу — партию до
  // этого «Заново» игрок уже доиграл.
  showInterstitial(done) {
    const finish = Platform.once(done);
    const adv = Platform.advApi();
    if (!adv || !adv.showFullscreenAdv) { finish(); return 'no-sdk'; }
    if (Date.now() - Platform.lastAdMs < CONFIG.ads.interstitialMinMs) { finish(); return 'cooldown'; }
    Platform.lastAdMs = Date.now();
    try {
      adv.showFullscreenAdv({ callbacks: {
        onOpen: () => Platform.adPause(true),
        onClose: () => { Platform.adPause(false); finish(); },
        onError: () => { Platform.adPause(false); finish(); }
      } });
      return 'shown';
    } catch (e) {
      finish();
      return 'failed';
    }
  },

  // Ролик за вознаграждение. Награда приходит в onRewarded и только в нём:
  // onClose срабатывает и когда игрок закрыл ролик на середине.
  showRewarded(onReward, done) {
    const finish = Platform.once(done);
    const adv = Platform.advApi();
    if (!adv || !adv.showRewardedVideo) { finish(); return 'no-sdk'; }
    try {
      adv.showRewardedVideo({ callbacks: {
        onOpen: () => Platform.adPause(true),
        onRewarded: () => { if (onReward) onReward(); },
        onClose: () => { Platform.adPause(false); finish(); },
        onError: () => { Platform.adPause(false); finish(); }
      } });
      return 'shown';
    } catch (e) {
      finish();
      return 'failed';
    }
  },

  // Требование 4.7: на время полноэкранной рекламы звук и геймплей на паузу.
  // Работу делает setPageActive — та же, что у сворачивания вкладки. Свои вызовы
  // нужны потому, что game_api_pause присылает площадка, а полагаться на чужое
  // событие там, где отказ модерации, — плохая ставка; повторный вызов безвреден.
  adPause(active) {
    setPageActive(!active);
    return active;
  },

  // Запрос оценки (п. 2.13). Спросить можно один раз за сессию, и доки требуют
  // сперва canReview: без него requestReview вернёт отказ с ошибкой в консоли.
  askReview() {
    if (Platform.reviewAsked) return 'asked-before';
    const api = Platform.ysdk && Platform.ysdk.feedback;
    if (!api || !api.canReview) return 'no-sdk';
    Platform.reviewAsked = true;
    try {
      api.canReview().then((res) => {
        if (!res || !res.value || !api.requestReview) return;
        const promise = api.requestReview();
        if (promise && promise.then) promise.then(() => {}, () => {});
      }, () => {});
      return 'asked';
    } catch (e) {
      return 'failed';
    }
  },

  advApi() {
    return Platform.ysdk ? Platform.ysdk.adv : null;
  },

  // Созрел ли автопоказ (Phase 42.2). Нулевой lastAdMs — это «первая партия»:
  // пока игрок не нажал «Заново» ни разу, реклама сама не приходит вовсе.
  adReady() {
    if (!Platform.advApi()) return false;
    if (!Platform.lastAdMs) return false;
    return Date.now() - Platform.lastAdMs >= CONFIG.ads.interstitialMinMs;
  },

  // --- Лидерборд (Phase 43) --------------------------------------------------
  // Наружу и здесь торчат намерения: «запиши мой рекорд», «дай таблицу», «игрок
  // нажал Войти». Актуальный вход — ysdk.leaderboards; getLeaderboards() доки
  // объявили устаревшим.
  //
  // Права у методов разные, и это определяет весь экран: getEntries работает и
  // анониму, а setScore с getPlayerEntry требуют авторизации. Поэтому таблицу
  // видят все, а своя строка появляется только после входа.

  lbApi() {
    return Platform.ysdk ? Platform.ysdk.leaderboards : null;
  },

  // Авторизован ли игрок. Синхронно: ответ нужен посреди кадра, а промис кадр
  // не ждёт. getMode() из старых доков объявлен устаревшим — берём isAuthorized.
  isAuthorized() {
    try {
      return !!(Platform.player && Platform.player.isAuthorized &&
                Platform.player.isAuthorized());
    } catch (e) {
      return false;
    }
  },

  // Рекорд в таблицу. Зовётся только на личном рекорде: таблица хранит лучший
  // результат, а лимит площадки — один запрос в секунду.
  submitScore(score) {
    const api = Platform.lbApi();
    if (!api || !api.setScore) return 'no-sdk';
    if (!Platform.isAuthorized()) return 'no-auth';
    if (Date.now() - Platform.lastScoreMs < CONFIG.leaderboard.submitMinMs) return 'too-soon';
    Platform.lastScoreMs = Date.now();
    try {
      Platform.ifAvailable('leaderboards.setScore', () => {
        const promise = api.setScore(CONFIG.platform.leaderboardName, score);
        if (promise && promise.then) promise.then(() => {}, () => {});
      });
      return 'sent';
    } catch (e) {
      return 'failed';
    }
  },

  // Доки требуют спрашивать доступность метода перед вызовом: на части устройств
  // лидерборда нет, и прямой вызов уходит в ошибку. Если спросить не у кого,
  // просто зовём — хуже уже не будет.
  ifAvailable(name, fn) {
    const ysdk = Platform.ysdk;
    if (!ysdk || !ysdk.isAvailableMethod) { fn(); return 'assumed'; }
    ysdk.isAvailableMethod(name).then((ok) => { if (ok) fn(); }, () => {});
    return 'asked';
  },

  // Таблица. Колбэк получает {entries, userRank} или null, если не сложилось.
  // Кэш обязателен: лимит getEntries — 20 запросов за 5 минут, а экран
  // открывается с оверлея конца, куда игрок возвращается после каждой партии.
  fetchTop(done) {
    const api = Platform.lbApi();
    if (!api || !api.getEntries) {
      if (Platform.demoActive()) {
        if (done) done(Platform.demoTop());
        return 'demo';
      }
      if (done) done(null);
      return 'no-sdk';
    }
    const cache = Platform.rankCache;
    if (cache && Date.now() - cache.ms < CONFIG.leaderboard.cacheMs) {
      if (done) done(cache.data);
      return 'cached';
    }
    const cfg = CONFIG.leaderboard;
    try {
      api.getEntries(CONFIG.platform.leaderboardName, {
        quantityTop: cfg.topCount,
        includeUser: Platform.isAuthorized(),
        quantityAround: cfg.aroundCount
      }).then((res) => {
        const data = Platform.readEntries(res);
        Platform.rankCache = { ms: Date.now(), data };
        if (done) done(data);
      }, () => { if (done) done(null); });
      return 'asked';
    } catch (e) {
      if (done) done(null);
      return 'failed';
    }
  },

  // Идёт ли сейчас демо-показ таблицы. Флаг сам по себе ничего не значит: на
  // площадке таблица настоящая, и подменять её выдумкой нельзя ни при каких
  // обстоятельствах.
  demoActive() {
    return !Platform.lbApi() && !!CONFIG.leaderboard.demoRows;
  },

  // ВРЕМЕННО (Phase 43.1): выдуманная таблица, чтобы посмотреть вёрстку списка
  // до того, как лидерборд заведут в Консоли. Форма ответа ровно та же, что у
  // readEntries, — иначе демо показывало бы не то, что будет на площадке.
  // Снимается вместе с CONFIG.leaderboard.demoRows.
  demoTop() {
    const names = ['Хвоя', 'Мотылёк', 'Тихоня', 'Гербарий', 'Сойка',
                   'Бумажный лис', 'Компас', 'Северянка'];
    const entries = names.map((name, i) => ({
      rank: i + 1, score: 4820 - i * 310, name, me: false
    }));
    const myRank = 41;
    entries.push({ rank: myRank - 1, score: 1310, name: 'Пилигрим', me: false });
    entries.push({ rank: myRank, score: 1270, name: 'Вы', me: true });
    entries.push({ rank: myRank + 1, score: 1240, name: 'Ветка', me: false });
    return { userRank: myRank, entries };
  },

  // Ответ площадки разбирается здесь, а не в рендере: наружу должны уходить
  // простые строки и числа, иначе объект SDK разъехался бы по всему коду.
  // Имя пустое у игрока, который скрыл профиль, — так и предупреждают доки.
  readEntries(res) {
    const list = (res && res.entries) || [];
    return {
      userRank: (res && res.userRank) || 0,
      entries: list.map(e => ({
        rank: e.rank,
        score: e.score,
        name: (e.player && e.player.publicName) || '',
        me: !!(res && res.userRank && e.rank === res.userRank)
      }))
    };
  },

  // Окно входа. Требование 1.2.1: открывается только по осознанному нажатию
  // кнопки «Войти», и нигде больше. После успеха доки требуют заново получить
  // Player — прежний объект остаётся анонимным.
  openAuth(done) {
    const finish = Platform.once(() => { if (done) done(Platform.isAuthorized()); });
    const auth = Platform.ysdk && Platform.ysdk.auth;
    if (!auth || !auth.openAuthDialog) { finish(); return 'no-sdk'; }
    try {
      auth.openAuthDialog().then(() => {
        Platform.rankCache = null;        // после входа таблица другая: своя строка
        Platform.ysdk.getPlayer().then((player) => {
          if (player) Platform.player = player;
          finish();
        }, finish);
      }, finish);
      return 'asked';
    } catch (e) {
      finish();
      return 'failed';
    }
  },

  // Колбэк завершения обязан сработать ровно один раз: onClose и onError могут
  // прийти оба, а вторая партия подряд с одного нажатия — это потерянная первая.
  once(fn) {
    let called = false;
    return () => {
      if (called || !fn) return false;
      called = true;
      fn();
      return true;
    };
  }
};

// ============================================================================
// Haptics — вибрация (Phase 18). Отдельно от Storage: к сохранениям и площадкам
// вибрация отношения не имеет, а `navigator` больше нигде не трогается.
// ============================================================================
const Haptics = {
  // На десктопе гаптики нет, и это не ошибка — просто тихо ничего не делаем.
  vibrate(pattern) {
    if (!CONFIG.haptics.enabled) return false;
    try {
      if (typeof navigator === 'undefined' || !navigator.vibrate) return false;
      navigator.vibrate(pattern);
      return true;
    } catch (e) {
      return false;
    }
  }
};

// ============================================================================
// Audio — единственная точка доступа к Web Audio API. Игра нигде не создаёт
// контекст сама и не знает, из чего сложен звук: наружу торчат события, а не
// синтез. Всё синтезируется кодом — внешних файлов в проекте быть не может
// (ADR-0001). Ошибка звука не должна ломать партию, поэтому throw наружу нет.
// Имя перекрывает встроенный конструктор Audio (элемент audio): он не нужен,
// загружать через него всё равно нечего.
// ============================================================================
const Audio = {
  ctx: null,
  master: null,
  noise: null,     // буфер шума под «бумажные» звуки, готовится один раз
  lastAt: {},      // когда в последний раз играл звук с таким именем

  // Контекст создаётся только по жесту пользователя — раньше браузер его не даст.
  // Зовётся из pointerdown и keydown; повторный вызов лишь будит уснувший контекст.
  unlock() {
    if (Audio.ctx) {
      try {
        if (Audio.ctx.state === 'suspended') Audio.ctx.resume();
      } catch (e) {
        /* контекст уже живой — будить нечего */
      }
      return true;
    }
    try {
      const Ctor = typeof AudioContext !== 'undefined' ? AudioContext
        : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if (!Ctor) return false;
      Audio.ctx = new Ctor();
      Audio.master = Audio.ctx.createGain();
      Audio.master.gain.value = CONFIG.audio.master;
      Audio.master.connect(Audio.ctx.destination);
      // Шина эффектов отдельно от музыки (Phase 19): иначе регулятор «Звуки»
      // приглушал бы и фон, ведь master общий для всего.
      Audio.sfxOut = Audio.ctx.createGain();
      Audio.sfxOut.gain.value = CONFIG.audio.volumeSfx;
      Audio.sfxOut.connect(Audio.master);
      Audio.buildRoom();
      Audio.noise = Audio.makeNoise();
      Audio.startMusic();      // фон заводится тем же первым жестом
      return true;
    } catch (e) {
      Audio.ctx = null;   // без звука играть можно, без игры — нет
      return false;
    }
  },

  // Комната. Сухой синтез звучит дёшево: без отражений ухо слышит пищалку, а не
  // инструмент в помещении. Импульс генерируем кодом — звуковых файлов в проекте
  // быть не может (ADR-0001). Музыка уходит сюда целиком, эффекты — долей roomSend:
  // им нужна читаемость, расплывшийся щелчок хуже сухого.
  buildRoom() {
    const ctx = Audio.ctx;
    const m = CONFIG.audio.music;
    Audio.room = ctx.createConvolver();
    Audio.room.buffer = Audio.makeImpulse(m.reverbSec, m.reverbDecay);
    Audio.roomMix = ctx.createGain();
    Audio.roomMix.gain.value = m.reverbMix;
    Audio.room.connect(Audio.roomMix);
    Audio.roomMix.connect(Audio.master);
    Audio.sfxSend = ctx.createGain();
    Audio.sfxSend.gain.value = CONFIG.audio.roomSend;
    Audio.sfxSend.connect(Audio.room);
    // отражения эффектов идут после их регулятора: выключенные звуки не должны
    // оставлять после себя реверб
    Audio.sfxOut.connect(Audio.sfxSend);
  },

  // Импульс комнаты — затухающий шум в двух каналах. Каналы разные, иначе
  // отражения сойдутся в точку посередине и стерео пропадёт.
  makeImpulse(seconds, decay) {
    const ctx = Audio.ctx;
    const length = Math.max(1, Math.floor(ctx.sampleRate * seconds));
    const buffer = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const data = buffer.getChannelData(channel);
      let seed = 7 + channel;
      for (let i = 0; i < data.length; i++) {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        data[i] = (seed / 2147483648 - 1) * Math.pow(1 - i / data.length, decay);
      }
    }
    return buffer;
  },

  // Полсекунды шума хватает на любой шорох. Генерируем один раз: делать буфер
  // в момент события — это аллокация на каждый звук.
  // Свой генератор, а не Math.random: в логике игры его быть не должно.
  makeNoise() {
    const ctx = Audio.ctx;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let seed = 1;
    for (let i = 0; i < data.length; i++) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      data[i] = seed / 2147483648 - 1;
    }
    return buffer;
  },

  // Общая громкость игры. Экран настроек её не трогает: игроку даны раздельные
  // регуляторы эффектов и музыки, а master остаётся калибровкой.
  setMaster(value) {
    CONFIG.audio.master = value;
    if (Audio.master) Audio.master.gain.value = value;
  },

  // Регуляторы экрана настроек (Phase 19). Это множители 0…1 поверх калибровки,
  // поэтому 1 звучит ровно так, как было до фазы. Меняются на живом контексте:
  // игрок должен слышать результат, не дожидаясь следующего звука.
  setSfxVolume(value) {
    CONFIG.audio.volumeSfx = value;
    if (Audio.sfxOut) Audio.sfxOut.gain.value = value;
    return CONFIG.audio.volumeSfx;
  },

  // У музыки регулятор ещё и выключатель: на нуле планировщик незачем крутить
  // впустую, а при возврате громкости он заводится снова.
  setMusicVolume(value) {
    const m = CONFIG.audio.music;
    m.volume = value;
    if (Audio.music.out) Audio.music.out.gain.value = m.gain * m.volume;
    if (!value) {
      Audio.stopMusic();
    } else if (!Audio.music.timer) {
      Audio.startMusic();
    }
    return m.volume;
  },

  // --- Примитивы синтеза ----------------------------------------------------

  // Все числа тембра лежат в CONFIG.audio.voices — здесь только их применение
  voice(name) {
    return CONFIG.audio.voices[name] || {};
  },

  // Громкость звука с учётом общей. Ноль означает «не играть вовсе».
  gainFor(name) {
    return CONFIG.audio.master * (Audio.voice(name).gain || 0);
  },

  // Регулятор «Звуки» на нуле — узлы не строим вовсе: они всё равно прозвучали
  // бы в тишину, а на слабом телефоне это лишняя работа на каждое событие.
  sfxOn() {
    return CONFIG.audio.volumeSfx > 0;
  },

  // Одинаковый звук не чаще, чем раз в minGapMs: за один waveCommit может
  // сгореть несколько ячеек, а три одинаковых «тука» в один сэмпл дают щелчок.
  ready(name) {
    if (!Audio.ctx || !Audio.sfxOn() || !Audio.gainFor(name)) return false;
    const now = Audio.ctx.currentTime * 1000;
    const last = Audio.lastAt[name];
    if (last !== undefined && now - last < CONFIG.audio.minGapMs) return false;
    Audio.lastAt[name] = now;
    return true;
  },

  // «Дерево»: короткая атака, падающий питч, экспоненциальное затухание.
  // drop больше единицы означает, что питч не падает, а растёт.
  // mul (а не gain) — множитель для дополнительных слоёв: так объект голоса
  // целиком можно передать сюда, и его собственный gain не удвоится.
  tone(name, freq, opts) {
    const o = opts || {};
    const gain = Audio.gainFor(name) * (o.mul || 1);
    if (!Audio.ctx || !gain || !Audio.sfxOn()) return false;
    const ctx = Audio.ctx;
    const at = ctx.currentTime + (o.delay || 0);
    const dur = o.decay || CONFIG.audio.woodDecay;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(freq, at);
    osc.frequency.exponentialRampToValueAtTime(freq * (o.drop || CONFIG.audio.woodDrop), at + dur);
    // до нуля экспонентой нельзя, поэтому гасим до тысячной доли
    env.gain.setValueAtTime(gain, at);
    env.gain.exponentialRampToValueAtTime(gain * 0.001, at + dur);
    osc.connect(env);
    env.connect(Audio.sfxOut);      // регулятор «Звуки», а за ним доля в комнату
    osc.start(at);
    osc.stop(at + dur);
    return true;
  },

  // «Бумага»: полоса шума вместо тона — этим шорох и отличается от «тука»
  rustle(name, opts) {
    const o = opts || {};
    const gain = Audio.gainFor(name) * (o.mul || 1);
    if (!Audio.ctx || !gain || !Audio.sfxOn()) return false;
    const a = CONFIG.audio;
    const ctx = Audio.ctx;
    const at = ctx.currentTime + (o.delay || 0);
    const dur = o.decay || a.paperDecay;
    const band = o.band || a.paperBand;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const env = ctx.createGain();
    src.buffer = Audio.noise;
    filter.type = 'bandpass';
    filter.Q.value = o.q || a.paperQ;
    // полоса едет вниз: у бумаги призвук темнеет к концу движения
    filter.frequency.setValueAtTime(band * 1.4, at);
    filter.frequency.exponentialRampToValueAtTime(band, at + dur);
    // attack есть не у всех голосов: ноль означает прежнее поведение — сразу на
    // пик. Ненулевая атака превращает щелчок во вздох (тот же приём, что у
    // шейкера в музыке).
    if (o.attack) {
      env.gain.setValueAtTime(gain * 0.001, at);
      env.gain.exponentialRampToValueAtTime(gain, at + o.attack);
    } else {
      env.gain.setValueAtTime(gain, at);
    }
    env.gain.exponentialRampToValueAtTime(gain * 0.001, at + dur);
    src.connect(filter);
    filter.connect(env);
    env.connect(Audio.sfxOut);      // регулятор «Звуки», а за ним доля в комнату
    src.start(at);
    src.stop(at + dur);
    return true;
  },

  // --- События игры ---------------------------------------------------------
  // Ноты планируются от ctx.currentTime, а не по кадрам: звук не держит RAF и
  // не участвует в цикле эффектов, поэтому правило «juice < 1000 мс» его не
  // касается. Вызывать эти методы можно только из input и драйверов main —
  // mergeEngine обязан оставаться беззвучным (там же живёт синхронный путь).

  pick() {
    if (!Audio.ready('pick')) return false;
    return Audio.rustle('pick', Audio.voice('pick'));
  },

  place() {
    if (!Audio.ready('place')) return false;
    const v = Audio.voice('place');
    Audio.tone('place', v.freq, v);
    Audio.rustle('place', { mul: v.noiseGain, band: v.band, delay: v.noiseDelay });
    return true;
  },

  // Перелив: по щелчку на фишку, питч растёт вместе с высотой будущей стопки.
  // Длинный перелив подрезан maxFlowTicks — иначе выйдет очередь.
  flow(count, stepSec) {
    if (!Audio.ready('flow')) return false;
    const v = Audio.voice('flow');
    const ticks = Math.min(count || 1, CONFIG.audio.maxFlowTicks);
    for (let i = 0; i < ticks; i++) {
      Audio.tone('flow', v.freq + i * v.step,
        Object.assign({}, v, { delay: i * (stepSec || 0.05) }));
    }
    return true;
  },

  // Чем крупнее сгоревший блок, тем ниже и длиннее голос: десятку от двадцатки
  // слышно, не глядя на счёт.
  burn(tiles) {
    if (!Audio.ready('burn')) return false;
    const v = Audio.voice('burn');
    // мерка размера — базовый порог, а не текущий: тембр сгорания не должен
    // ползти вместе с прогрессией (Phase 28)
    const base = CONFIG.merge.thresholdSteps[0].threshold;
    const size = Math.min(tiles || base, 30) / base;
    const freq = v.freq / Math.pow(size, v.sizeCurve);
    Audio.tone('burn', freq, Object.assign({}, v, { decay: v.decay + size * v.decayPerSize }));
    // призвук октавой выше — всегда синус, иначе он спорит с основным тоном
    Audio.tone('burn', freq * v.harmonicRatio,
      { mul: v.harmonic, decay: v.harmonicDecay, type: 'sine' });
    Audio.rustle('burn', { mul: v.noiseGain, band: v.band,
                           decay: v.noiseDecay, delay: v.noiseDelay });
    return true;
  },

  // Звено цепочки: та же деревянная нота, но ступенью выше по пентатонике
  combo(link) {
    if (!Audio.ready('combo')) return false;
    const v = Audio.voice('combo');
    const steps = CONFIG.audio.comboSteps;
    const semitones = steps[Math.max(0, Math.min(link - 1, steps.length - 1))];
    const freq = v.freq * Math.pow(2, semitones / 12);
    Audio.tone('combo', freq, v);
    Audio.tone('combo', freq * v.harmonicRatio,
      { mul: v.harmonic, decay: v.harmonicDecay, drop: v.drop,
        delay: v.harmonicDelay, type: 'sine' });
    return true;
  },

  // Новое кольцо: низкое восходящее скольжение — поле стало больше
  ring() {
    if (!Audio.ready('ring')) return false;
    const v = Audio.voice('ring');
    Audio.tone('ring', v.freq, v);
    Audio.rustle('ring', { mul: v.noiseGain, band: v.band, decay: v.noiseDecay });
    return true;
  },

  boost(kind) {
    if (!Audio.ready('boost')) return false;
    const v = Audio.voice('boost');
    if (kind === 'remove') {                            // стопка рассыпается
      Audio.rustle('boost', { band: v.removeBand, q: v.removeQ, decay: v.removeDecay });
    } else if (kind === 'reroll') {                     // рука тасуется
      for (let i = 0; i < v.rerollTicks; i++) {
        Audio.rustle('boost', { mul: v.rerollGain, band: v.rerollBand + i * v.rerollStep,
                                decay: v.rerollDecay, delay: i * v.rerollDelay });
      }
    } else {                                            // дуга переноса
      Audio.tone('boost', v.freq, v);
    }
    return true;
  },

  // Отказ: глухой «тук» почти без падения питча — ничего не произошло
  deny() {
    if (!Audio.ready('deny')) return false;
    const v = Audio.voice('deny');
    return Audio.tone('deny', v.freq, v);
  },

  snap() {
    if (!Audio.ready('snap')) return false;
    return Audio.rustle('snap', Audio.voice('snap'));
  },

  deal() {
    if (!Audio.ready('deal')) return false;
    const v = Audio.voice('deal');
    for (let i = 0; i < v.ticks; i++) {
      Audio.rustle('deal', { band: v.band + i * v.step, decay: v.decay, delay: i * v.delay });
    }
    return true;
  },

  // Конец партии: три ноты вниз, а при новом рекорде — вверх
  over(isRecord) {
    if (!Audio.ready('over')) return false;
    const v = Audio.voice('over');
    (isRecord ? v.record : v.lost).forEach((semitones, i) => {
      Audio.tone('over', v.freq * Math.pow(2, semitones / 12),
        Object.assign({}, v, { delay: i * v.delay }));
    });
    return true;
  },

  // --- Музыка ---------------------------------------------------------------
  // У фона свой планировщик, и это обязательно: RAF в затишье останавливается
  // совсем, и петля, повешенная на кадры, рвалась бы каждый раз, когда игрок
  // думает над ходом. Раз в lookaheadMs просыпаемся и раскладываем ноты на
  // scheduleAhead секунд вперёд по часам AudioContext — они идут сами по себе.
  //
  // Именно setInterval, а не setTimeout: в тестах setTimeout выполняется
  // немедленно, и петля, перезаводящая саму себя, ушла бы в бесконечную
  // рекурсию. Здесь тик просто не вызывают, и всё стоит.

  room: null, roomMix: null, sfxSend: null, sfxOut: null,
  music: { timer: null, nextAt: 0, step: 0, tension: 0, out: null },

  startMusic() {
    const m = CONFIG.audio.music;
    if (!Audio.ctx || Audio.music.timer || !m.gain || !m.volume) return false;
    // Контекст может быть ещё не разрешён браузером: ctx.resume() асинхронный, а
    // до его конца планировать ноты нельзя — Chrome пишет в консоль «AudioContext
    // was not allowed to start» на каждую (Phase 40, найдено на playtest под SDK).
    if (Audio.ctx.state !== 'running') return false;
    const ctx = Audio.ctx;
    // Узел переживает выключение музыки: игрок может вернуть громкость, и второй
    // выход к тому же master дал бы лишний узел на каждое переключение.
    if (!Audio.music.out) {
      Audio.music.out = ctx.createGain();
      Audio.music.out.connect(Audio.master);
      if (Audio.room) Audio.music.out.connect(Audio.room);  // музыка в комнате целиком
    }
    Audio.music.out.gain.value = m.gain * m.volume;
    Audio.music.nextAt = ctx.currentTime;
    Audio.music.step = 0;
    Audio.music.timer = setInterval(Audio.pumpMusic, m.lookaheadMs);
    Audio.pumpMusic();
    return true;
  },

  stopMusic() {
    if (Audio.music.timer === null) return false;
    clearInterval(Audio.music.timer);
    Audio.music.timer = null;
    return true;
  },

  // Вкладка ушла из виду. Площадка требует, чтобы звук замолкал при сворачивании
  // (требование 1.3), и это же правильно само по себе: планировщик музыки —
  // setInterval, который в фоне продолжал бы класть ноты, а браузер троттлит
  // таймеры, и после возврата вывалилась бы накопленная очередь.
  //
  // Одного stopMusic() мало: эффекты и уже разложенные ноты запланированы вперёд
  // по часам контекста и прозвучат сами. Гасит их только suspend() контекста.
  suspend() {
    Audio.stopMusic();
    try {
      if (Audio.ctx && Audio.ctx.state === 'running') Audio.ctx.suspend();
    } catch (e) {
      /* контекста нет или он уже спит — гасить нечего */
    }
    return true;
  },

  // Пробуждение асинхронно, и это важно: ctx.resume() возвращает промис, а до его
  // выполнения контекст ещё спит. Заводить музыку сразу нельзя — ноты уйдут в
  // спящий контекст, и браузер отругается на каждую.
  resume() {
    try {
      if (Audio.ctx && Audio.ctx.state === 'suspended') {
        const waking = Audio.ctx.resume();
        if (waking && waking.then) {
          waking.then(Audio.afterResume, () => {});
          return true;
        }
      }
    } catch (e) {
      /* контекста нет — будить нечего */
    }
    return Audio.afterResume();
  },

  afterResume() {
    // Контекст мог и не проснуться: без жеста игрока браузер держит его спящим.
    // Тогда музыку заведёт следующий unlock() из касания.
    if (!Audio.ctx || Audio.ctx.state !== 'running') return false;
    // планировщик заводится заново: пока вкладка спала, его часы ушли вперёд
    Audio.music.nextAt = Audio.ctx.currentTime;
    Audio.startMusic();
    return true;
  },

  // Разложить ноты вперёд. Потолок обязателен: часы могут прыгнуть (в тестах они
  // прыгают на секунду за кадр), и цикл без предела крутился бы вечно.
  pumpMusic() {
    if (!Audio.ctx || !Audio.music.out) return false;
    // Вкладку могли усыпить мимо нашего suspend(): в спящий контекст ноты не кладём
    if (Audio.ctx.state !== 'running') return false;
    const m = CONFIG.audio.music;
    const stepSec = Audio.stepSec();
    const until = Audio.ctx.currentTime + m.scheduleAhead;
    let placed = 0;
    while (Audio.music.nextAt < until && placed < m.maxStepsPerPump) {
      Audio.musicStep(Audio.music.step, Audio.music.nextAt);
      Audio.music.step++;
      Audio.music.nextAt += stepSec;
      placed++;
    }
    return placed > 0;
  },

  // --- Аранжировка ----------------------------------------------------------

  // Длительность шага: stepsPerBar долей на такт в размере 4/4
  stepSec() {
    const m = CONFIG.audio.music;
    return 60 / m.bpm / (m.stepsPerBar / 4);
  },

  // Тактов в полном цикле аранжировки
  loopBars() {
    return CONFIG.audio.music.arrangement.reduce((sum, section) => sum + section.bars, 0);
  },

  // Какая секция играет на этом такте цикла
  sectionAt(loopBar) {
    const arrangement = CONFIG.audio.music.arrangement;
    let from = 0;
    for (let i = 0; i < arrangement.length; i++) {
      if (loopBar < from + arrangement[i].bars) return arrangement[i];
      from += arrangement[i].bars;
    }
    return arrangement[arrangement.length - 1];
  },

  // Аккорд держится chordBars такта, дальше цикл идёт по кругу
  chordAt(loopBar) {
    const m = CONFIG.audio.music;
    return m.chords[Math.floor(loopBar / m.chordBars) % m.chords.length];
  },

  // Шаг аранжировки: секция решает, какие инструменты сейчас звучат, аккорд —
  // какими нотами. Точки склейки у цикла нет: музыка синтезируется непрерывно,
  // а последняя секция просто возвращает набор партий к вступлению.
  musicStep(step, at) {
    const m = CONFIG.audio.music;
    const bars = Audio.loopBars();
    const bar = Math.floor(step / m.stepsPerBar);
    const beat = step - bar * m.stepsPerBar;
    const loopBar = ((bar % bars) + bars) % bars;
    const chord = Audio.chordAt(loopBar);
    Audio.sectionAt(loopBar).parts.forEach(name => {
      Audio.playPart(m.parts[name], loopBar, beat, chord, at, step);
    });
  },

  // Один инструмент на одном шаге. Рисунок берётся по номеру такта и обновляется
  // раз в varyBars — это и есть «дыхание»: изменение раз в 15–30 секунд, которое
  // игрок чувствует, но не опознаёт.
  playPart(part, loopBar, beat, chord, at, step) {
    if (!part) return false;
    const m = CONFIG.audio.music;
    const out = Audio.music.out;
