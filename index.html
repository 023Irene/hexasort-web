  // Высота слоя над центром ячейки. Вынесена отдельно, потому что по ней же
  // целятся летящие фишки: иначе они падают в центр, а стопка потом «дёргается».
  // Высокая стопка сжимает шаг, поэтому позиция зависит от итоговой высоты.
  layerRise(total, index) {
    const t = CONFIG.tile;
    const visible = Math.min(total, t.maxVisibleLayers);
    const step = visible > 1
      ? Math.min(t.layerOffset, t.maxRise / (visible - 1))
      : t.layerOffset;
    return Math.max(0, index - (total - visible)) * step;
  },

  // Спрайт фишки (Phase 24). THEME.tile() ставит тень с размытием — самую дорогую
  // операцию Canvas 2D, — а кадр рисует до 61 ячейки на 12 слоёв. Рисуем фишку один
  // раз в offscreen и дальше копируем; стиль по-прежнему знает только тема.
  // Кэш той же природы, что backgroundCache: сбрасывается в applyTheme и при смене
  // размера гекса (fitLayout) — размер входит в ключ, но копить мусор незачем.
  tileCache: new Map(),
  tileSprite(color, isTop, variant, size) {
    const key = color + '|' + (isTop ? 1 : 0) + '|' + variant + '|' + Math.round(size);
    let sprite = render.tileCache.get(key);
    if (sprite) return sprite;
    const half = Math.ceil(size + CONFIG.tile.spritePad);
    const buffer = document.createElement('canvas');
    buffer.width = half * 2;
    buffer.height = half * 2;
    const bufferCtx = buffer.getContext('2d');
    const previous = render.ctx;
    render.ctx = bufferCtx;                 // тема рисует через render.*
    THEME.tile(bufferCtx, half, half, size, color, isTop, variant);
    render.ctx = previous;
    sprite = { canvas: buffer, half };
    render.tileCache.set(key, sprite);
    return sprite;
  },

  // Одна фишка с центром в (x, y) — единственная точка, через которую идут все
  // фишки игры: стопки на поле, рука, перетаскивание и летящие в волне.
  drawTile(x, y, size, color, isTop, seed) {
    const t = CONFIG.tile;
    const variants = t.spriteVariants;
    const variant = ((Math.round(seed || 0) % variants) + variants) % variants;
    // спрайт строится в округлённом размере, а до нужного дотягивается drawImage:
    // разница не больше половины шага и на глаз незаметна
    const baseSize = Math.max(t.spriteStep, Math.round(size / t.spriteStep) * t.spriteStep);
    const sprite = render.tileSprite(color, isTop, variant, baseSize);
    const half = sprite.half * (size / baseSize);
    render.ctx.drawImage(sprite.canvas, x - half, y - half, half * 2, half * 2);
  },

  drawStack(stack, cx, cy, cellSize, seed, rotation) {
    const ctx = render.ctx;
    const t = CONFIG.tile;
    const size = cellSize * t.scale;
    const total = stack.tiles.length;
    const visible = Math.min(total, t.maxVisibleLayers);
    const skipped = total - visible;
    const angle = rotation || 0;

    for (let i = 0; i < visible; i++) {
      const color = CONFIG.colors.palette[stack.tiles[skipped + i]];
      const y = cy - render.layerRise(total, skipped + i);
      const isTop = i === visible - 1;
      if (angle) {
        ctx.save();
        ctx.translate(cx, y);
        ctx.rotate(angle);
        ctx.translate(-cx, -y);
      }
      // саму фишку рисует активная тема (Phase 12), но через кэш спрайтов (Phase 24)
      render.drawTile(cx, y, size, color, isTop, (seed || 0) + i * 5);
      if (angle) ctx.restore();
    }
  },

  // Поле: сначала пустые ячейки, потом стопки сверху вниз по экрану,
  // чтобы верхние ряды не перекрывали растущие стопки нижних
  drawBoard(state) {
    const ctx = render.ctx;
    const size = hexMath.layout.size;
    state.cells.forEach(cell => {
      const key = hexMath.key(cell.q, cell.r);
      // ячейка под перетаскиваемой стопкой подсвечивается
      const isHover = state.hoverKey === key;
      // ячейки только что открывшегося кольца проявляются и подрастают
      const ring = state.newRing;
      const fresh = ring && ring.keys.has(key);
      if (fresh) ctx.globalAlpha = ring.t;
      THEME.emptyCell(ctx, cell, fresh ? size * (0.6 + 0.4 * ring.t) : size,
        isHover ? CONFIG.ui.highlightFill : CONFIG.ui.cellFill,
        isHover ? CONFIG.ui.highlightStroke : CONFIG.ui.cellStroke);
      if (fresh) ctx.globalAlpha = 1;
    });
  },

  // Стопки — отдельным слоем в экранных координатах (см. drawStack).
  // Порядок — по экранному Y, иначе при повороте перекрытие пойдёт наоборот.
  drawStacks(state) {
    const size = hexMath.layout.size;
    const rotation = state.camera.rotation;
    // стопки, которые сейчас летят бустом, рисует drawBoostAnim
    const hidden = state.boostAnim ? state.boostAnim.hide : null;
    const occupied = [];
    state.cells.forEach(cell => {
      if (!cell.stack) return;
      if (hidden && hidden.has(hexMath.key(cell.q, cell.r))) return;
      const screen = input.worldToScreen(state, cell.pixelX, cell.pixelY);
      occupied.push({ cell, screen });
    });
    occupied.sort((a, b) => a.screen.y - b.screen.y);
    occupied.forEach(({ cell, screen }) => {
      // «приземление»: только что поставленная стопка приходит из увеличенного масштаба
      const land = state.landing;
      const scale = land && land.cell === cell
        ? 1 + (CONFIG.animation.landingScale - 1) * (1 - land.t)
        : 1;
      render.drawStack(cell.stack, screen.x, screen.y, size * scale,
        cell.q * 31 + cell.r * 57, rotation);
    });
  },

  // Вспышка на месте сгоревшего блока: гекс расходится и гаснет (экранные координаты)
  drawBurns(state) {
    const anim = state.burnAnim;
    if (!anim) return;
    const ctx = render.ctx;
    const t = anim.t;
    anim.burns.forEach(b => {
      const screen = input.worldToScreen(state, b.cell.pixelX, b.cell.pixelY);
      const size = hexMath.layout.size * (1 + CONFIG.animation.burnFlashGrow * t);
      ctx.globalAlpha = 1 - t;
      render.hexPath(screen.x, screen.y, size);
      ctx.fillStyle = render.shade(CONFIG.colors.palette[b.color], 0.65);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  },

  // Перелёт стопки бустом «перенос»: летит целиком, поэтому переиспользуем drawStack
  drawBoostAnim(state) {
    const anim = state.boostAnim;
    if (!anim) return;
    const a = CONFIG.animation;
    const size = hexMath.layout.size;
    const rotation = state.camera.rotation;
    const eased = render.ease.smooth(anim.t);
    const lift = Math.sin(Math.PI * anim.t);
    anim.moves.forEach(m => {
      const from = input.worldToScreen(state, m.from.pixelX, m.from.pixelY);
      const to = input.worldToScreen(state, m.to.pixelX, m.to.pixelY);
      render.drawStack({ tiles: m.tiles },
        from.x + (to.x - from.x) * eased,
        from.y + (to.y - from.y) * eased - lift * a.boostArc,
        size, m.from.q * 31 + m.from.r * 57, rotation);
    });
  },

  // Осколки сгоревшего блока: разлетаются, падают и гаснут (экранные координаты)
  drawParticles(state) {
    const list = state.fx.particles;
    if (!list.length) return;
    const ctx = render.ctx;
    const a = CONFIG.animation;
    list.forEach(p => {
      const t = p.age / a.particleMs;
      const sec = p.age / 1000;
      const origin = input.worldToScreen(state, p.cell.pixelX, p.cell.pixelY);
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = CONFIG.colors.palette[p.color];
      const size = a.particleSize * (1 - t * 0.5);
      ctx.fillRect(origin.x + p.vx * sec - size / 2,
        origin.y + p.vy * sec + a.particleGravity * sec * sec / 2 - size / 2,
        size, size);
    });
    ctx.globalAlpha = 1;
  },

  // «+N очков» всплывает от сгоревшего блока к счёту
  drawFloats(state) {
    const list = state.fx.floats;
    if (!list.length) return;
    const ctx = render.ctx;
    const a = CONFIG.animation;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    list.forEach(f => {
      const t = f.age / a.floatMs;
      const origin = input.worldToScreen(state, f.cell.pixelX, f.cell.pixelY);
      ctx.globalAlpha = 1 - render.ease.smooth(t);
      // надпись комбо крупнее, акцентным цветом и выше, чтобы не села на «+N»
      ctx.font = (f.accent ? 'bold 26px' : 'bold 28px') + ' system-ui, sans-serif';
      ctx.fillStyle = f.accent ? CONFIG.ui.buttonFill : CONFIG.ui.text;
      const rise = render.ease.outCubic(t) * a.floatRise + (f.accent ? 42 : 0);
      ctx.fillText(f.text, origin.x, origin.y - rise);
    });
    ctx.globalAlpha = 1;
  },

  // Смещение тряски: затухает к концу и меняет знак каждый кадр
  shakeOffset(state) {
    const shake = state.fx.shake;
    if (!shake) return { x: 0, y: 0 };
    const a = CONFIG.animation;
    const decay = 1 - shake.age / a.shakeMs;
    const phase = shake.age / 26;
    return {
      x: Math.sin(phase) * a.shakeAmp * decay,
      y: Math.cos(phase * 1.4) * a.shakeAmp * decay * 0.6
    };
  },

  // Центр слота руки — геометрия нужна и отрисовке, и вводу
  handSlotCenter(index) {
    const ui = CONFIG.ui;
    return {
      x: CONFIG.canvas.width / 2 + (index - 1) * ui.handSlotSpacing,
      y: ui.handY
    };
  },

  // Рука: 3 слота внизу, пустой слот — рамка. При пересдаче старые стопки
  // уезжают вниз и гаснут, новые падают сверху.
  drawHand(state) {
    const ctx = render.ctx;
    const size = CONFIG.ui.handHexSize;
    const a = CONFIG.animation;
    const anim = state.handAnim;
    const eased = anim ? render.ease.outCubic(anim.t) : 1;
    for (let i = 0; i < 3; i++) {
      const c = render.handSlotCenter(i);
      if (anim && anim.old[i]) {
        ctx.globalAlpha = 1 - anim.t;
        render.drawStack({ tiles: anim.old[i] }, c.x, c.y + eased * a.handSwapRise, size);
        ctx.globalAlpha = 1;
      }
      const stack = state.hand.slots[i];
      if (stack) {
        if (anim) ctx.globalAlpha = anim.t;
        render.drawStack(stack, c.x, c.y - (1 - eased) * a.handSwapRise, size);
        if (anim) ctx.globalAlpha = 1;
      } else if (!anim) {
        render.drawHex(c.x, c.y, size, 'transparent', CONFIG.ui.cellStroke);
      }
    }
  },

  // HUD: счёт по центру сверху, рекорд мельче в углу, подсказка под полем
  drawHUD(state) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.text;
    ctx.font = 'bold 52px system-ui, sans-serif';
    // на экране счёт догоняет настоящий, иначе он прыгает скачком
    ctx.fillText(String(Math.round(state.scoreShown)), CONFIG.canvas.width / 2, ui.scoreY);

    ctx.textAlign = 'right';
    ctx.fillStyle = ui.textDim;
    ctx.font = '20px system-ui, sans-serif';
    // строка кончается левее шестерёнки настроек, поэтому край задан числом
    const bestText = t('record') + state.best;
    ctx.fillText(bestText, ui.bestX, ui.bestY);
    // кубок слева от строки: её ширина зависит от величины рекорда
    render.trophyIcon(ui.bestX - render.textWidth(bestText, 10) - ui.trophyGap,
      ui.bestY, ui.trophySize);

    render.drawCoins(state);

    // активный буст объясняет, что выбирать; иначе стартовая подсказка
    const boostHintKey = state.boost ? input.boostConfig(state.boost.kind).hint : null;
    const boostHint = boostHintKey ? t(boostHintKey) : null;
    if (boostHint || state.showHint) {
      ctx.textAlign = 'center';
      ctx.fillStyle = boostHint ? ui.text : ui.textDim;
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText(boostHint || t('hint'), CONFIG.canvas.width / 2, ui.hintY);
    }
  },

  // Слияние стопок: фишки снимаются с соседа по одной сверху и перелетают дугой,
  // ложась ровно на свои будущие места. Раньше весь блок ехал одним комком по прямой
  // и в конце скачком превращался в выросшую стопку.
  drawFlows(state) {
    const anim = state.anim;
    if (!anim) return;
    const ctx = render.ctx;
    const a = CONFIG.animation;
    const tileSize = hexMath.layout.size * CONFIG.tile.scale;
    const rotation = state.camera.rotation;

    anim.flows.forEach(f => {
      const from = input.worldToScreen(state, f.from.pixelX, f.from.pixelY);
      const to = input.worldToScreen(state, f.to.pixelX, f.to.pixelY);
      // фишки уже сняты с соседа (planWave), поэтому исходную высоту восстанавливаем
      const leftBehind = f.from.stack ? f.from.stack.tiles.length : 0;
      const fromTotal = leftBehind + f.count;
      // вся стая занимает span «шагов»: соседние фишки стартуют с задержкой
      const span = 1 + (f.count - 1) * a.flowStagger;
      const color = CONFIG.colors.palette[f.color];

      for (let i = 0; i < f.count; i++) {
        // верхняя фишка снимается первой — у неё нулевая задержка
        const delay = (f.count - 1 - i) * a.flowStagger;
        const local = Math.max(0, Math.min(1, anim.t * span - delay));
        const eased = render.ease.smooth(local);
        const lift = Math.sin(Math.PI * local);

        const startY = from.y - render.layerRise(fromTotal, leftBehind + i);
        const endY = to.y - render.layerRise(f.finalTotal, f.baseLayer + i);
        const x = from.x + (to.x - from.x) * eased;
        const y = startY + (endY - startY) * eased - lift * a.flowArc;

        // тень на поле под фишкой: пока она в воздухе, тень мельче и слабее
        if (lift > 0.02) {
          ctx.save();
          ctx.globalAlpha = a.flowShadow * (1 - lift * 0.55);
          ctx.fillStyle = CONFIG.ui.cardShadow;
          ctx.beginPath();
          ctx.ellipse(x, y + lift * a.flowArc, tileSize * (0.72 - lift * 0.18),
            tileSize * (0.30 - lift * 0.08), 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(x, y);
        // бумага чуть покачивается в полёте и приближается на вершине дуги
        ctx.rotate(rotation + lift * a.flowFlutter * (i % 2 ? -1 : 1));
        const grow = 1 + lift * a.flowLift;
        ctx.scale(grow, grow);
        render.drawTile(0, 0, tileSize, color, i === f.count - 1,
          f.from.q * 31 + f.from.r * 57 + i * 5);
        ctx.restore();
      }
    });
  },

  // Перетаскиваемая стопка — поверх всего, в размере ячейки поля (экранные координаты)
  drawDrag(state) {
    const d = state.drag;
    if (!d) return;
    const screen = input.worldToScreen(state, d.x, d.y);
    render.drawStack(d.stack, screen.x, screen.y, hexMath.layout.size, 0,
      state.camera.rotation);
  },

  // --- Значки: векторные пути (Phase 22, переписаны на Path2D в Phase 23) ----
  // Отдельных SVG-файлов быть не может (ADR-0001: один файл, работает офлайн),
  // но язык путей SVG доступен и без файлов: Path2D принимает ту же строку «M…»,
  // что и атрибут d. Системные эмодзи отвергнуты: они разные на каждой ОС и
  // глянцевые поверх матовой бумаги.
  //
  // Все пути нарисованы в квадрате 24×24 — как принято в любом наборе иконок.
  // Метафоры выбраны узнаваемые: подписи с кнопок бустов убраны, и значок
  // должен объяснять действие сам.
  iconPaths: {
    coin: { fill: 'M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18z',
            stroke: 'M12 7.6a4.4 4.4 0 1 0 0 8.8 4.4 4.4 0 0 0 0-8.8z',
            lineWidth: 1.4 },
    trophy: { fill: 'M7 4h10v4.5a5 5 0 0 1-10 0zM11 13.5h2V17h-2zM8 18h8v2.2H8z',
              stroke: 'M7 5.4H4.6v1.8a3.2 3.2 0 0 0 2.8 3.2M17 5.4h2.4v1.8a3.2 3.2 0 0 1-2.8 3.2',
              lineWidth: 1.6 },
    // перенос: гекс уезжает вправо
    move: { fill: 'M9.6 12l-1.8 3.1H4.2L2.4 12l1.8-3.1h3.6z',
            stroke: 'M12.4 12h7.2M16.8 8.8L20 12l-3.2 3.2',
            lineWidth: 2 },
    // пересдача: круговая стрелка — общепринятый «обновить»
    reroll: { stroke: 'M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.8 4.4v3.6h-3.6',
              lineWidth: 2.2 },
    // убрать: корзина
    remove: { stroke: 'M4.6 6.8h14.8M9.8 6.8V4.6h4.4v2.2M6.4 6.8l1 12.6h9.2l1-12.6M10.2 10.4v6M13.8 10.4v6',
              lineWidth: 2 }
  },

  // Path2D строится один раз на путь: кнопок три, а кадров шестьдесят в секунду.
  // Кэш той же природы, что backgroundCache и gradientCache.
  iconCache: new Map(),
  iconPath(d) {
    let path = render.iconCache.get(d);
    if (!path) {
      path = new Path2D(d);
      render.iconCache.set(d, path);
    }
    return path;
  },

  // Нарисовать значок с центром в (x, y). Цвета приходят снаружи, поэтому
  // значки меняются вместе с темой.
  drawIcon(name, x, y, size, fill, stroke) {
    const icon = render.iconPaths[name];
    if (!icon || typeof Path2D === 'undefined') return false;
    const ctx = render.ctx;
    const k = size / 24;
    ctx.save();
    ctx.translate(x - size / 2, y - size / 2);
    ctx.scale(k, k);
    ctx.lineWidth = icon.lineWidth || 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (icon.fill) {
      ctx.fillStyle = fill;
      ctx.fill(render.iconPath(icon.fill));
    }
    if (icon.stroke) {
      ctx.strokeStyle = stroke || fill;
      ctx.stroke(render.iconPath(icon.stroke));
    }
    ctx.restore();
    return true;
  },

  // Монета: тень остаётся мягкой — та же матовость, что и у фишек
  coinIcon(x, y, r) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    ctx.save();
    ctx.shadowColor = ui.cardShadow;
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 2;
    render.drawIcon('coin', x, y, r * 2.4, ui.coinColor,
      render.shade(ui.coinColor, -0.32));
    ctx.restore();
  },

  trophyIcon(x, y, size) {
    render.drawIcon('trophy', x, y, size, CONFIG.ui.coinColor,
      render.shade(CONFIG.ui.coinColor, -0.3));
  },

  boostIcon(kind, x, y, size) {
    render.drawIcon(kind, x, y, size, CONFIG.ui.text, CONFIG.ui.text);
  },

  // Ширина строки: measureText есть не во всяком контексте (в тестах канвас —
  // заглушка), поэтому на этот случай считаем по средней ширине символа.
  textWidth(text, perChar) {
    const ctx = render.ctx;
    const measured = ctx.measureText ? ctx.measureText(text) : null;
    return measured && measured.width ? measured.width : text.length * perChar;
  },

  // Кошелёк: монетка и число слева сверху
  drawCoins(state) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cx = ui.coinsX + ui.coinRadius;

    render.coinIcon(cx, ui.coinsY, ui.coinRadius);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.text;
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(String(Math.round(state.coinsShown)), cx + ui.coinRadius + 8, ui.coinsY);
  },

  // Прямоугольник кнопки «Заново» — геометрия нужна и отрисовке, и вводу
  restartButtonRect() {
    const ui = CONFIG.ui;
    return {
      x: CONFIG.canvas.width / 2 - ui.buttonW / 2,
      y: CONFIG.canvas.height / 2 + ui.buttonOffsetY,
      w: ui.buttonW,
      h: ui.buttonH
    };
  },

  // Кнопка «Рейтинг» на оверлее конца — над кнопкой «Заново»
  leaderboardButtonRect() {
    const btn = render.restartButtonRect();
    return { x: btn.x, y: btn.y - btn.h - 8, w: btn.w, h: btn.h - 12 };
  },

  // Экран рейтинга поверх оверлея конца партии
  drawLeaderboard(state) {
    const board = state.leaderboard;
    if (!board || !board.open) return;
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const W = CONFIG.canvas.width;
    const H = CONFIG.canvas.height;

    // тот же приём, что и на оверлее конца: заливка цветом темы, а не тёмная
    ctx.globalAlpha = board.t === undefined ? 1 : board.t;
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.overlayText;
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(t('leaderboard'), W / 2, 120);

    if (board.loading) {
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillStyle = ui.textDim;
      ctx.fillText(t('loading'), W / 2, H / 2);
    } else if (!board.available) {
      // локальная версия: сети нет и быть не должно (ADR-0005)
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillStyle = ui.textDim;
      ctx.fillText(t('lbUnavailable1'), W / 2, H / 2 - 40);
      ctx.fillText(t('lbUnavailable2'), W / 2, H / 2 - 12);
      ctx.fillStyle = ui.overlayText;
      ctx.font = 'bold 30px system-ui, sans-serif';
      ctx.fillText(t('yourRecord') + state.best, W / 2, H / 2 + 34);
    } else {
      ctx.font = '20px system-ui, sans-serif';
      board.entries.forEach((entry, i) => {
        const y = 190 + i * 36;
        const isPlayer = board.playerRank && entry.rank === board.playerRank;
        ctx.fillStyle = isPlayer ? ui.buttonFill : ui.overlayText;
        ctx.textAlign = 'left';
        ctx.fillText(entry.rank + '.', 120, y);
        ctx.fillText(entry.name.slice(0, 18), 170, y);
        ctx.textAlign = 'right';
        ctx.fillText(String(entry.score), W - 120, y);
      });
      if (board.playerRank) {
        ctx.textAlign = 'center';
        ctx.fillStyle = ui.buttonFill;
        ctx.font = '22px system-ui, sans-serif';
        ctx.fillText(t('yourPlace') + board.playerRank, W / 2,
          190 + board.entries.length * 36 + 28);
      }
    }

    const back = render.restartButtonRect();
    render.paperCard(back.x, back.y, back.w, back.h, ui.buttonRadius, ui.buttonFill);
    ctx.textAlign = 'center';
    ctx.fillStyle = ui.buttonText;
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(t('back'), back.x + back.w / 2, back.y + back.h / 2 + 1);
    ctx.globalAlpha = 1;
  },

  // Бумажный лист: заливка и тень, обводка — только если нужна акцентная рамка.
  // Главный приём стиля «Слои бумаги»: глубину даёт тень, а не контур.
  paperCard(x, y, w, h, r, fill, stroke) {
    const ctx = render.ctx;
    ctx.save();
    // тень мягкая и почти без смещения: матовая бумага лежит на столе,
    // а не парит над ним (Phase 22)
    ctx.shadowColor = CONFIG.ui.cardShadow;
    ctx.shadowBlur = 9;
    ctx.shadowOffsetY = 4;
    render.roundRectPath(x, y, w, h, r);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
    if (stroke) {
      render.roundRectPath(x, y, w, h, r);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }
  },

  // Скруглённый прямоугольник (roundRect есть не везде — рисуем сами)
  roundRectPath(x, y, w, h, r) {
    const ctx = render.ctx;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },

  // Оверлей конца игры: счёт, рекорд, кнопка «Заново»
  drawGameOver(state) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const W = CONFIG.canvas.width;
    const H = CONFIG.canvas.height;

    ctx.globalAlpha = state.overlayT;      // оверлей проявляется, а не выпрыгивает
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.overlayText;
    ctx.font = 'bold 46px system-ui, sans-serif';
    ctx.fillText(t('gameOver'), W / 2, H / 2 - 120);

    ctx.font = 'bold 64px system-ui, sans-serif';
    ctx.fillText(String(state.score), W / 2, H / 2 - 55);
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillStyle = ui.textDim;
    ctx.fillText(t('points'), W / 2, H / 2 - 12);

    // новый рекорд отмечаем явно — это единственная мета-прогрессия в игре
    const isRecord = state.score >= state.best && state.score > 0;
    ctx.font = '24px system-ui, sans-serif';
    ctx.fillStyle = isRecord ? ui.overlayText : ui.textDim;
    ctx.fillText(t(isRecord ? 'newRecord' : 'record') + state.best, W / 2, H / 2 + 26);

    ctx.font = '20px system-ui, sans-serif';
    ctx.fillStyle = ui.textDim;
    ctx.fillText(t('wallet') + state.coins, W / 2, H / 2 + 58);

    const rating = render.leaderboardButtonRect();
    render.roundRectPath(rating.x, rating.y, rating.w, rating.h, ui.buttonRadius);
    ctx.lineWidth = 2;
    ctx.strokeStyle = ui.overlayText;
    ctx.stroke();
    ctx.fillStyle = ui.overlayText;
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(t('leaderboard'), rating.x + rating.w / 2, rating.y + rating.h / 2 + 1);

    const btn = render.restartButtonRect();
    render.paperCard(btn.x, btn.y, btn.w, btn.h, ui.buttonRadius, ui.buttonFill);
    ctx.fillStyle = ui.buttonText;
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillText(t('restart'), btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
    ctx.globalAlpha = 1;
  },

  // Прямоугольник кнопки буста по индексу — нужен и отрисовке, и вводу
  boostButtonRect(index) {
    const bar = CONFIG.ui.boostBar;
    const count = CONFIG.boosts.length;
    const totalWidth = count * bar.w + (count - 1) * bar.gap;
    const left = (CONFIG.canvas.width - totalWidth) / 2;
    return { x: left + index * (bar.w + bar.gap), y: bar.y, w: bar.w, h: bar.h };
  },

  // Панель бустов: название, цена и монетка. Недоступный буст приглушён,
  // активный — подсвечен.
  drawBoostBar(state) {
    const ctx = render.ctx;
    const bar = CONFIG.ui.boostBar;
    CONFIG.boosts.forEach((boost, index) => {
      const rect = render.boostButtonRect(index);
      const active = state.boost && state.boost.kind === boost.kind;
      const affordable = state.coins >= boost.cost;

      // активный буст выделяется акцентной рамкой, обычный — только тенью
      render.paperCard(rect.x, rect.y, rect.w, rect.h, bar.radius,
        active ? bar.fillActive : bar.fill, active ? bar.strokeActive : null);

      ctx.globalAlpha = affordable ? 1 : 0.4;
      // значок крупно по центру: три буста различаются с одного взгляда
      render.boostIcon(boost.kind, rect.x + rect.w / 2, rect.y + bar.iconY, bar.iconSize);

      // цена с монеткой под значком, вся группа по центру кнопки
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '17px system-ui, sans-serif';
      const priceText = String(boost.cost);
      const priceW = render.textWidth(priceText, 9);
      const groupX = rect.x + rect.w / 2 - (priceW + 20) / 2;
      render.coinIcon(groupX + 7, rect.y + bar.priceY, 7);
      ctx.fillStyle = affordable ? CONFIG.ui.text : CONFIG.ui.textDim;
      ctx.fillText(priceText, groupX + 20, rect.y + bar.priceY);
      ctx.globalAlpha = 1;
    });
  },

  // Подсветка ячеек, доступных для выбора активным бустом
  drawBoostTargets(state) {
    const boost = state.boost;
    if (!boost) return;
    const ctx = render.ctx;
    const size = hexMath.layout.size;
    state.cells.forEach(cell => {
      if (!input.isBoostTarget(state, cell)) return;
      render.hexPath(cell.pixelX, cell.pixelY, size * 0.97);
      ctx.lineWidth = 3;
      ctx.strokeStyle = CONFIG.ui.highlightStroke;
      ctx.stroke();
    });
    // уже выбранная ячейка отмечается ярче
    if (boost.from) {
      render.hexPath(boost.from.pixelX, boost.from.pixelY, size * 0.97);
      ctx.lineWidth = 4;
      ctx.strokeStyle = CONFIG.ui.text;
      ctx.stroke();
    }
  },

  // Кнопка возврата обзора — в правом нижнем углу игрового поля
  resetCameraButtonRect() {
    const c = CONFIG.camera.resetButton;
    return {
      x: CONFIG.canvas.width - c.size - c.margin,
      y: CONFIG.ui.boardArea.bottom - c.size,
      w: c.size,
      h: c.size
    };
  },

  // Значок возврата: виден только когда поле повёрнуто
  drawResetCameraButton(state) {
    if (Math.abs(state.camera.rotation) < 1e-6) return;
    const ctx = render.ctx;
    const b = render.resetCameraButtonRect();
    render.paperCard(b.x, b.y, b.w, b.h, 10, CONFIG.ui.cardFill);
    render.hexPath(b.x + b.w / 2, b.y + b.h / 2, b.w * 0.26);
    ctx.fillStyle = CONFIG.ui.text;
    ctx.fill();
  },

  // --- Экран настроек (Phase 19) --------------------------------------------
  // Своих цветов у экрана нет: всё из палитры темы, иначе стиль пришлось бы
  // поддерживать в двух местах. Геометрия — в CONFIG.ui.settings.

  // Кнопка-шестерёнка в правом верхнем углу. Строка рекорда заканчивается левее
  // (CONFIG.ui.bestX), поэтому они не наезжают друг на друга.
  settingsButtonRect() {
    const c = CONFIG.ui.settings.button;
    return {
      x: CONFIG.canvas.width - c.size - c.margin,
      y: c.top,
      w: c.size,
      h: c.size
    };
  },

  // Значок: гекс с вырезанной серединой — та же геометрия, что у всей игры,
  // и рисуется двумя операциями вместо зубцов настоящей шестерёнки
  drawSettingsButton(state) {
    const ctx = render.ctx;
    const b = render.settingsButtonRect();
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    render.paperCard(b.x, b.y, b.w, b.h, 10, CONFIG.ui.cardFill);
    render.hexPath(cx, cy, b.w * 0.30);
    ctx.fillStyle = CONFIG.ui.text;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, b.w * 0.12, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.ui.cardFill;
    ctx.fill();
  },

  // Дорожка ползунка: 0 — звуки, 1 — музыка
  settingsSliderRect(index) {
    const cfg = CONFIG.ui.settings;
    return {
      x: cfg.sliderX,
      y: cfg.rowY[index] - cfg.sliderH / 2,
      w: cfg.sliderW,
      h: cfg.sliderH
    };
  },

  // Зона попадания заметно шире самой дорожки: пальцем в полоску 10 px не попасть
  settingsSliderHitRect(index) {
    const cfg = CONFIG.ui.settings;
    const rect = render.settingsSliderRect(index);
    return {
      x: rect.x - cfg.knob,
      y: rect.y - cfg.knob * 2,
      w: rect.w + cfg.knob * 2,
      h: rect.h + cfg.knob * 4
    };
  },

  settingsToggleRect() {
    const cfg = CONFIG.ui.settings;
    return {
      x: cfg.sliderX,
      y: cfg.rowY[2] - cfg.toggleH / 2,
      w: cfg.toggleW,
      h: cfg.toggleH
    };
  },

  // Текущее значение регулятора. Регуляторы правят CONFIG напрямую — своего
  // состояния у экрана нет, и рассинхрону взяться неоткуда.
  settingsValue(index) {
    return index === 0 ? CONFIG.audio.volumeSfx : CONFIG.audio.music.volume;
  },

  // Экранный X → значение 0…1. Шаг делает попадание предсказуемым и убирает
  // дробный мусор из хранилища.
  settingsValueAt(index, x) {
    const cfg = CONFIG.ui.settings;
    const rect = render.settingsSliderRect(index);
    const raw = (x - rect.x) / rect.w;
    const stepped = Math.round(raw / cfg.step) * cfg.step;
    return Math.min(1, Math.max(0, Math.round(stepped * 100) / 100));
  },

  drawSlider(index) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.settings;
    const rect = render.settingsSliderRect(index);
    const value = render.settingsValue(index);
    const radius = rect.h / 2;

    render.roundRectPath(rect.x, rect.y, rect.w, rect.h, radius);
    ctx.fillStyle = ui.cellFill;
    ctx.fill();
    if (value > 0) {
      render.roundRectPath(rect.x, rect.y, Math.max(rect.h, rect.w * value), rect.h, radius);
      ctx.fillStyle = ui.buttonFill;
      ctx.fill();
    }

    // ручка — вырезанный кружок с тенью, тем же приёмом, что и монета в HUD
    ctx.save();
    ctx.shadowColor = ui.cardShadow;
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    ctx.arc(rect.x + rect.w * value, rect.y + radius, cfg.knob, 0, Math.PI * 2);
    ctx.fillStyle = ui.cardFill;
    ctx.fill();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = ui.textDim;
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(Math.round(value * 100) + ' %', rect.x + rect.w + cfg.knob + 10,
      rect.y + radius);
  },

  drawToggle() {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.settings;
    const rect = render.settingsToggleRect();
    const on = CONFIG.haptics.enabled;

    render.roundRectPath(rect.x, rect.y, rect.w, rect.h, cfg.toggleRadius);
    ctx.fillStyle = on ? ui.buttonFill : ui.cellFill;
    ctx.fill();

    ctx.save();
    ctx.shadowColor = ui.cardShadow;
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    const knobX = on ? rect.x + rect.w - rect.h / 2 : rect.x + rect.h / 2;
    ctx.arc(knobX, rect.y + rect.h / 2, cfg.toggleKnob, 0, Math.PI * 2);
    ctx.fillStyle = ui.cardFill;
    ctx.fill();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = ui.textDim;
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(t(on ? 'on' : 'off'), rect.x + rect.w + cfg.knob + 10, rect.y + rect.h / 2);
  },

  // Кнопки выбора языка (Phase 23). Подписи — сами коды языков, они не
  // переводятся: «RU» и «EN» понятны на любом языке.
  langButtonRect(index) {
    const cfg = CONFIG.ui.settings;
    return {
      x: cfg.sliderX + index * (cfg.langW + cfg.langGap),
      y: cfg.rowY[3] - cfg.langH / 2,
      w: cfg.langW,
      h: cfg.langH
    };
  },

  drawLangButtons() {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    Object.keys(I18N).forEach((lang, i) => {
      const rect = render.langButtonRect(i);
      const active = CONFIG.lang === lang;
      render.paperCard(rect.x, rect.y, rect.w, rect.h, ui.settings.langRadius,
        active ? ui.buttonFill : ui.cellFill);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = active ? ui.buttonText : ui.textDim;
      ctx.font = 'bold 18px system-ui, sans-serif';
      ctx.fillText(lang.toUpperCase(), rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
    });
  },

  // Экран целиком: проявляется, как оверлей конца и экран рейтинга
  drawSettings(state) {
    const settings = state.settings;
    if (!settings || !settings.open) return;
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.settings;
    const W = CONFIG.canvas.width;

    ctx.globalAlpha = settings.t === undefined ? 1 : settings.t;
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, W, CONFIG.canvas.height);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.overlayText;
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(t('settings'), W / 2, cfg.titleY);

    ['sfx', 'music', 'haptics', 'language'].forEach((key, i) => {
      ctx.textAlign = 'left';
      ctx.fillStyle = ui.text;
      ctx.font = '24px system-ui, sans-serif';
      ctx.fillText(t(key), cfg.labelX, cfg.rowY[i]);
    });
    render.drawSlider(0);
    render.drawSlider(1);
    render.drawToggle();
    render.drawLangButtons();

    const back = render.restartButtonRect();
    render.paperCard(back.x, back.y, back.w, back.h, ui.buttonRadius, ui.buttonFill);
    ctx.textAlign = 'center';
    ctx.fillStyle = ui.buttonText;
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(t('back'), back.x + back.w / 2, back.y + back.h / 2 + 1);
    ctx.globalAlpha = 1;
  },

  // Поворот мира вокруг центра поля — общая трансформация для всех мировых слоёв
  applyWorldTransform(state) {
    const ctx = render.ctx;
    const L = hexMath.layout;
    ctx.translate(L.centerX, L.centerY);
    ctx.rotate(state.camera.rotation);
    ctx.translate(-L.centerX, -L.centerY);
  },

  // Фон темы: рисуется один раз в отдельный канвас и дальше просто копируется —
  // бумажная крошка и полутон стоят тысяч операций и не должны идти каждый кадр
  drawBackground(state) {
    const ctx = render.ctx;
    if (!render.backgroundCache) {
      const buffer = document.createElement('canvas');
      buffer.width = CONFIG.canvas.width;
      buffer.height = CONFIG.canvas.height;
      const bufferCtx = buffer.getContext('2d');
      const previous = render.ctx;
      render.ctx = bufferCtx;                 // тема рисует через render.*
      THEME.background(bufferCtx);
      render.ctx = previous;
      render.backgroundCache = buffer;
    }
    ctx.drawImage(render.backgroundCache, 0, 0);
  },

  // Замер кадра (Phase 24), включается адресом `?fps=1`. Инструмент разработки:
  // в обычной партии выключен и ничего не стоит. Непрерывный RAF нужен потому,
  // что игра рисует по событию и в затишье кадров нет вовсе.
  fpsMeter: { on: false, last: 0, times: [] },
  drawFps() {
    const meter = render.fpsMeter;
    if (!meter.on) return;
    const now = performance.now();
    if (meter.last) {
      meter.times.push(now - meter.last);
      if (meter.times.length > 30) meter.times.shift();
    }
    meter.last = now;
    if (!meter.times.length) return;
    const avg = meter.times.reduce((sum, ms) => sum + ms, 0) / meter.times.length;
    const ctx = render.ctx;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = CONFIG.ui.text;
    ctx.fillText(Math.round(1000 / avg) + ' fps  ' + avg.toFixed(1) + ' ms',
      14, CONFIG.canvas.height - 32);
  },

  // Полный кадр: сначала мир под трансформом камеры, затем экранный слой поверх
  drawAll(state) {
    const ctx = render.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    render.drawBackground(state);

    // --- сетка поля: живёт в мировых координатах и поворачивается вместе с полем.
    // Обрезка по игровой области не даёт наезжать на HUD и руку.
    const area = CONFIG.ui.boardArea;
    const clipBoard = () => {
      ctx.beginPath();
      ctx.rect(0, area.top, CONFIG.canvas.width, area.bottom - area.top);
      ctx.clip();
    };
    // тряска двигает только поле: фон — картинка во весь канвас, при сдвиге
    // у краёв открылись бы полосы, а интерфейс дёргать незачем
    const shake = render.shakeOffset(state);

    ctx.save();
    clipBoard();
    ctx.translate(shake.x, shake.y);
    render.applyWorldTransform(state);
    render.drawBoard(state);
    render.drawBoostTargets(state);
    ctx.restore();

    // --- стопки и эффекты: экранные координаты, поэтому слои всегда растут вверх
    // экрана, а не вбок при повороте поля
    ctx.save();
    clipBoard();
    ctx.translate(shake.x, shake.y);
    render.drawStacks(state);
    render.drawBoostAnim(state);
    render.drawFlows(state);
    render.drawBurns(state);
    render.drawParticles(state);
    ctx.restore();

    // «+N очков» летит к счёту и выходит за игровую область — рисуем без обрезки
    render.drawFloats(state);

    // Перетаскиваемая стопка — без обрезки: её ведут от руки, которая лежит ниже
    // игровой области
    render.drawDrag(state);

    // --- экран: интерфейс не зависит от камеры ---
    render.drawHand(state);
    render.drawHUD(state);
    render.drawBoostBar(state);
    render.drawResetCameraButton(state);
    render.drawSettingsButton(state);
    if (state.isGameOver) render.drawGameOver(state);
    render.drawLeaderboard(state);
    render.drawSettings(state);      // настройки лежат поверх всего
    render.drawFps();                // dev-замер, включается адресом ?fps=1
  }
};

// ============================================================================
// input — Pointer Events: взять / тащить / положить / отменить (Phase 2)
// ============================================================================
const input = {
  // Координаты события → координаты канваса (канвас растянут CSS, поэтому масштабируем)
  toCanvasCoords(canvas, event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * (CONFIG.canvas.width / rect.width),
      y: (event.clientY - rect.top) * (CONFIG.canvas.height / rect.height)
    };
  },

  // Какой слот руки под точкой. Зона слота — прямоугольник вокруг гекса,
  // расширенный вверх на высоту псевдо-3D слоёв, чтобы попадать по всей стопке.
  hitHandSlot(state, x, y) {
    const size = CONFIG.ui.handHexSize;
    for (let i = 0; i < 3; i++) {
      const stack = state.hand.slots[i];
      if (!stack) continue;
      const c = render.handSlotCenter(i);
      const layers = Math.min(stack.tiles.length, CONFIG.tile.maxVisibleLayers);
      const top = c.y - size - (layers - 1) * CONFIG.tile.layerOffset;
      if (x >= c.x - size && x <= c.x + size && y >= top && y <= c.y + size) return i;
    }
    return -1;
  },

  // Экран → мир и обратно: мир повёрнут вокруг центра поля, поэтому точку ввода
  // нужно повернуть в обратную сторону. Интерфейс (рука, HUD, кнопки) — в экранных.
  rotatePoint(x, y, angle) {
    const L = hexMath.layout;
    const dx = x - L.centerX;
    const dy = y - L.centerY;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    return { x: L.centerX + dx * cos - dy * sin, y: L.centerY + dx * sin + dy * cos };
  },
  screenToWorld(state, x, y) {
    return input.rotatePoint(x, y, -state.camera.rotation);
  },
  worldToScreen(state, x, y) {
    return input.rotatePoint(x, y, state.camera.rotation);
  },

  // Угол от центра поля до точки — основа жеста вращения
  angleFromCenter(x, y) {
    const L = hexMath.layout;
    return Math.atan2(y - L.centerY, x - L.centerX);
  },

  // Расстояние от центра поля: у самого центра градус на пиксель уходит
  // в бесконечность, поэтому там жест не работает
  radiusFromCenter(x, y) {
    const L = hexMath.layout;
    return Math.hypot(x - L.centerX, y - L.centerY);
  },

  // Разница углов, приведённая к (−π, π]. Без этого протаскивание через левую
  // горизонталь (179° → −179°) давало −358° вместо +2°, и поле проворачивалось
  // почти на полный оборот — это и выглядело как «оно крутится само».
  angleDelta(from, to) {
    let delta = to - from;
    while (delta > Math.PI) delta -= Math.PI * 2;
    while (delta <= -Math.PI) delta += Math.PI * 2;
    return delta;
  },

  // Свободная ячейка под якорем перетаскиваемой стопки (координаты мировые)
  freeCellAt(state, x, y) {
    const a = hexMath.pixelToAxial(x, y);
    const cell = state.cells.get(hexMath.key(a.q, a.r));
    return cell && !cell.stack ? cell : null;
  },

  // Ячейка поля под экранной точкой — любая, занятая или пустая. Координаты
  // экранные, поэтому переводим их в мировые: поле-то повёрнуто.
  cellAt(state, x, y) {
    const world = input.screenToWorld(state, x, y);
    const a = hexMath.pixelToAxial(world.x, world.y);
    return state.cells.get(hexMath.key(a.q, a.r)) || null;
  },


  // Попадание точки в прямоугольник кнопки
  hitRect(rect, x, y) {
    return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
  },

  // Текущий жест вращения поля
  spin: null,

  // --- Экран настроек (Phase 19) --------------------------------------------

  // Регулятор правит CONFIG через Audio: игрок должен слышать результат сразу,
  // ещё не отпустив ползунок.
  setSettingsValue(index, value) {
    if (index === 0) return Audio.setSfxVolume(value);
    return Audio.setMusicVolume(value);
  },

  // Нажатие при открытом экране: ползунки → тумблер → «Назад». Больше на экране
  // ничего нет, поэтому всё остальное просто игнорируется.
  settingsDown(state, point) {
    for (let i = 0; i < 2; i++) {
      if (input.hitRect(render.settingsSliderHitRect(i), point.x, point.y)) {
        state.settings.drag = i;
        input.setSettingsValue(i, render.settingsValueAt(i, point.x));
        requestRender();
        return true;
      }
    }
    const langs = Object.keys(I18N);
    for (let i = 0; i < langs.length; i++) {
      if (input.hitRect(render.langButtonRect(i), point.x, point.y)) {
        setLang(langs[i]);
        persistSettings();     // выбранный руками язык важнее языка браузера
        requestRender();
        return true;
      }
    }
    if (input.hitRect(render.settingsToggleRect(), point.x, point.y)) {
      CONFIG.haptics.enabled = !CONFIG.haptics.enabled;
      // включили — сразу коротко отдаём: иначе на десктопе не понять, работает ли
      if (CONFIG.haptics.enabled) Platform.vibrate(CONFIG.haptics.burn);
      persistSettings();
      requestRender();
      return true;
    }
    if (input.hitRect(render.restartButtonRect(), point.x, point.y)) {
      closeSettings(state);
      return true;
    }
    return false;
  },

  // --- Бусты ---------------------------------------------------------------

  boostConfig(kind) {
    return CONFIG.boosts.find(b => b.kind === kind);
  },

  // Включить или выключить буст. Монеты списываются не здесь, а при применении —
  // кроме instant-бустов, которым нечего выбирать.
  toggleBoost(state, kind) {
    if (state.boost && state.boost.kind === kind) {
      state.boost = null;
      return;
    }
    if (state.isAnimating || state.isGameOver) { Audio.deny(); return; }
    const config = input.boostConfig(kind);
    if (state.coins < config.cost) { Audio.deny(); return; }   // не хватило монет
    // буст несовместим с перетаскиванием стопки из руки
    if (state.drag) {
      state.hand.slots[state.drag.srcSlot] = state.drag.stack;
      state.drag = null;
      state.hoverKey = null;
    }
    if (config.instant) {
      input.applyInstantBoost(state, config);
      return;
    }
    state.boost = { kind, from: null };
  },

  // «Пересдача»: рука меняется целиком, цель выбирать не надо. Модель меняется
  // сразу, анимация показывает переход — как и у остальных бустов.
  applyInstantBoost(state, config) {
    const old = state.hand.slots.map(s => (s ? s.tiles.slice() : null));
    generators.dealHand(state);
    state.boost = null;
    spendCoins(state, config.cost);
    Audio.boost(config.kind);
    state.isAnimating = true;
    state.handAnim = { old, t: 0 };
    animate(state, CONFIG.animation.handSwapMs,
      (t) => { state.handAnim.t = t; },
      () => {
        state.handAnim = null;
        state.isAnimating = false;
        checkGameOver(state);
        requestRender();
      });
  },

  // Годится ли ячейка для текущего шага активного буста
  isBoostTarget(state, cell) {
    const boost = state.boost;
    if (!boost) return false;
    if (boost.kind === 'remove') return !!cell.stack;
    // move: сначала занятая ячейка-источник, потом свободная ячейка-цель
    return boost.from ? !cell.stack : !!cell.stack;
  },

  // Клик по ячейке в режиме буста
  applyBoostTo(state, cell) {
    const boost = state.boost;
    if (!input.isBoostTarget(state, cell)) { Audio.deny(); return; }
    const config = input.boostConfig(boost.kind);

    // Доска меняется сразу, а анимация показывает переход — тот же приём, что и
    // у переливов: planWave тоже снимает фишки до полёта, а рендер прячет их.
    if (boost.kind === 'remove') {
      const tiles = cell.stack.tiles.slice();
      cell.stack = null;
      spawnScatter(state, cell, tiles);
      Audio.boost(boost.kind);
      startFx(state);
      input.finishBoost(state, config.cost, [cell]);
      return;
    }
    if (!boost.from) {                 // «перенос»: сначала ячейка-источник
      boost.from = cell;
      requestRender();
      return;
    }
    const source = boost.from;
    cell.stack = source.stack;
    cell.stack.cell = { q: cell.q, r: cell.r };
    source.stack = null;
    Audio.boost(boost.kind);
    input.finishBoost(state, config.cost, [cell],
      input.boostFlight([{ tiles: cell.stack.tiles, from: source, to: cell }]));
  },

  // Описание перелёта стопок для рендера: ячейки-цели прячутся, пока идёт полёт
  boostFlight(moves) {
    return {
      moves,
      hide: new Set(moves.map(m => hexMath.key(m.to.q, m.to.r))),
      t: 0
    };
  },

  // Списать монеты, проиграть перелёт и только потом разрешать слияния
  finishBoost(state, cost, changedCells, flight) {
    state.boost = null;
    spendCoins(state, cost);
    const resume = () => {
      const starts = changedCells.filter(c => c.stack);
      if (starts.length) {
        runWave(state, starts);
      } else {
        state.isAnimating = false;
        checkGameOver(state);
        requestRender();
      }
    };
    // ввод блокируется на всё время: и на перелёт, и на возможную цепочку
    state.isAnimating = true;
    if (!flight) {
      resume();
      return;
    }
    state.boostAnim = flight;
    animate(state, CONFIG.animation.boostMoveMs,
      (t) => { state.boostAnim.t = t; },
      () => { state.boostAnim = null; resume(); });
  },

  attach(canvas, state) {
    // Нажатие: кнопки → рука → вращение поля (в этом порядке приоритета)
    canvas.addEventListener('pointerdown', (event) => {
      const point = input.toCanvasCoords(canvas, event);
      // первый жест — единственный момент, когда браузер разрешает завести звук.
      // Здесь проходит любое касание канваса, все ранние return идут ниже.
      Audio.unlock();

      // экран настроек лежит поверх всего и забирает ввод целиком
      if (state.settings && state.settings.open) {
        input.settingsDown(state, point);
        return;
      }

      // экран рейтинга поверх всего: реагирует только кнопка «Назад»
      if (state.leaderboard && state.leaderboard.open) {
        if (input.hitRect(render.restartButtonRect(), point.x, point.y)) {
          state.leaderboard.open = false;
          Platform.gameplay(!state.isGameOver);
          requestRender();
        }
        return;
      }
      // шестерёнка работает и в партии, и на оверлее конца: убрать музыку
      // захочется в обоих случаях
      if (input.hitRect(render.settingsButtonRect(), point.x, point.y)) {
        openSettings(state);
        return;
      }
      if (state.isGameOver) {
        if (input.hitRect(render.leaderboardButtonRect(), point.x, point.y)) {
          openLeaderboard(state);
          return;
        }
        if (input.hitRect(render.restartButtonRect(), point.x, point.y)) restart();
        return;
      }
      if (input.hitRect(render.resetCameraButtonRect(), point.x, point.y)) {
        resetCamera(state);
        requestRender();
        return;
      }
      // панель бустов
      const boostIndex = CONFIG.boosts.findIndex((boost, i) =>
        input.hitRect(render.boostButtonRect(i), point.x, point.y));
      if (boostIndex !== -1) {
        input.toggleBoost(state, CONFIG.boosts[boostIndex].kind);
        requestRender();
        return;
      }

      // активный буст: клик по полю выбирает ячейку, а не вращает и не ставит стопку
      if (state.boost) {
        const target = input.cellAt(state, point.x, point.y);
        if (target) input.applyBoostTo(state, target);
        return;
      }

      const slot = state.isAnimating || state.drag ? -1 : input.hitHandSlot(state, point.x, point.y);
      if (slot !== -1) {
        const stack = state.hand.slots[slot];
        const world = input.screenToWorld(state, point.x, point.y);
        state.hand.slots[slot] = null;
        state.drag = {
          stack, srcSlot: slot, pointerId: event.pointerId,
          x: world.x, y: world.y - CONFIG.ui.dragLift
        };
        state.hoverKey = null;
        Audio.pick();
        // захват указателя: события идут сюда, даже если палец ушёл за канвас
        if (canvas.setPointerCapture) canvas.setPointerCapture(event.pointerId);
        requestRender();
        return;
      }

      // Вращать поле можно только от гекса. Иначе жест начинался бы по остаточному
      // принципу — «мимо руки и кнопок», то есть и по счёту, и по панели бустов,
      // и по пустым полям у краёв экрана: промах мимо слота проворачивал доску.
      if (!input.cellAt(state, point.x, point.y)) return;

      input.spin = {
        pointerId: event.pointerId,
        startAngle: input.angleFromCenter(point.x, point.y),
        startRotation: state.camera.rotation,
        startX: point.x, startY: point.y,
        moved: false
      };
    });

    // Движение: перетаскивание стопки либо вращение поля
    canvas.addEventListener('pointermove', (event) => {
      const point = input.toCanvasCoords(canvas, event);

      // ползунок настроек ведут пальцем: индекс 0 — тоже жест, поэтому сравнение
      // именно с null, а не проверка на истинность
      const settings = state.settings;
      if (settings && settings.open && settings.drag !== null) {
        input.setSettingsValue(settings.drag, render.settingsValueAt(settings.drag, point.x));
        requestRender();
        return;
      }

      const d = state.drag;
      if (d && d.pointerId === event.pointerId) {
        const world = input.screenToWorld(state, point.x, point.y);
        d.x = world.x;
        d.y = world.y - CONFIG.ui.dragLift;
        const cell = input.freeCellAt(state, d.x, d.y);
        state.hoverKey = cell ? hexMath.key(cell.q, cell.r) : null;
        requestRender();
        return;
      }

      const spin = input.spin;
      if (spin && spin.pointerId === event.pointerId) {
        const cam = CONFIG.camera;
        // мелкие дрожания курсора не должны крутить поле
        if (!spin.moved &&
            Math.hypot(point.x - spin.startX, point.y - spin.startY) < cam.minDragToRotate) {
          return;
        }
        const angle = input.angleFromCenter(point.x, point.y);
        // Порог пробит — берём отсчёт заново, иначе весь накопленный угол
        // применился бы одним рывком.
        if (!spin.moved) {
          spin.moved = true;
          spin.startAngle = angle;
          spin.startRotation = state.camera.rotation;
          return;
        }
        // У центра поля жест не работает, но отсчёт всё равно сдвигаем:
        // тогда при выходе из мёртвой зоны не будет скачка.
        if (input.radiusFromCenter(point.x, point.y) < cam.minSpinRadius) {
          spin.startAngle = angle;
          spin.startRotation = state.camera.rotation;
          return;
        }
        state.camera.rotation = spin.startRotation +
          input.angleDelta(spin.startAngle, angle) * cam.spinSensitivity;
        requestRender();
      }
    });

    // Отпускание: положить стопку либо довернуть поле до ближайшей грани
    canvas.addEventListener('pointerup', (event) => {
      // в хранилище ходим один раз на жест, а не на каждое движение пальца
      if (state.settings && state.settings.drag !== null) {
        state.settings.drag = null;
        persistSettings();
        return;
      }

      const d = state.drag;
      if (d && d.pointerId === event.pointerId) {
        const cell = input.freeCellAt(state, d.x, d.y);
        if (cell) {
          input.placeStack(state, d.stack, cell);
        } else {
          state.hand.slots[d.srcSlot] = d.stack;   // отмена: занятая ячейка или вне поля
          Audio.deny();
        }
        state.drag = null;
        state.hoverKey = null;
        requestRender();
        return;
      }
      // moved решает ровно один вопрос — доворачивать поле или нет. Со стопкой
      // жест не спорит: если попали в слот руки, input.spin вообще не создаётся.
      if (input.spin && input.spin.pointerId === event.pointerId) {
        const spun = input.spin.moved;
        input.spin = null;
        if (spun) snapRotation(state);
      }
    });

    // Прерванный ввод (системный жест, уход фокуса) — считаем отменой
    canvas.addEventListener('pointercancel', (event) => {
      // системный жест поверх ползунка: значение остаётся, но сохраняем его
      // тем же путём, что и при обычном отпускании
      if (state.settings && state.settings.drag !== null) {
        state.settings.drag = null;
        persistSettings();
        return;
      }
      if (input.spin && input.spin.pointerId === event.pointerId) {
        const spun = input.spin.moved;
        input.spin = null;
        if (spun) snapRotation(state);   // жеста не было — доворачивать нечего
      }
      const d = state.drag;
      if (!d || d.pointerId !== event.pointerId) return;
      state.hand.slots[d.srcSlot] = d.stack;
      Audio.deny();
      state.drag = null;
      state.hoverKey = null;
      requestRender();
    });

    // Клавиатура: R — заново, Esc — закрыть настройки или отменить активный буст
    window.addEventListener('keydown', (event) => {
      Audio.unlock();   // клавиатура — отдельный вход, канваса игрок мог и не касаться
      // настройки лежат поверх всего, поэтому и Esc достаётся сначала им
      if (event.code === 'Escape' && state.settings && state.settings.open) {
        closeSettings(state);
        return;
      }
      if (event.code === 'Escape' && state.boost) {
        state.boost = null;
        requestRender();
        return;
      }
      if (event.code === 'KeyR' && !state.isAnimating) restart();
    });
  },

  // Установка стопки в ячейку → сразу разрешение цепочки.
  // Рука пополняется по завершении волны (см. finishWave), чтобы милосердный
  // генератор видел ячейки, освободившиеся после сгораний.
  placeStack(state, stack, cell) {
    stack.cell = { q: cell.q, r: cell.r };
    cell.stack = stack;
    state.showHint = false;                       // подсказка гаснет после первого хода
    Audio.place();
    // «приземление» стопки, затем разрешение цепочки; ввод заблокирован уже сейчас
    state.isAnimating = true;
    state.landing = { cell, t: 0 };
    animate(state, CONFIG.animation.landingMs,
      (t) => { state.landing.t = render.ease.outBack(t); },   // с лёгким доездом
      () => {
        state.landing = null;
        // волна собирается в соседнюю стопку того же цвета, если она есть
        runWave(state, mergeEngine.mergeTargetFor(state, cell));
      });
  }
};

// ============================================================================
// main — GameState, отрисовка по событию, restart
// ============================================================================
const GameState = {
  cells: null,
  hand: { slots: [null, null, null] },
  score: 0,
  best: 0,
  coins: 0,            // кошелёк: копится между партиями, тратится на бусты (Phase 10)
  activeColors: CONFIG.board.radiusSteps[0].colors,
  isAnimating: false,
  isGameOver: false,
  showHint: true,
  // Драма-менеджер выдачи (Phase 25): сколько раз игра уже выручила в этой партии
  // и не была ли выручка в прошлой раздаче — подряд подыгрывать нельзя (ADR-0008)
  rescuesUsed: 0,
  rescuedLastDeal: false,
  // текущий порог сгорания: растёт со счётом, о повышении игрока предупреждают
  burnThreshold: CONFIG.merge.thresholdSteps[0].threshold,
  drag: null,          // текущее перетаскивание: {stack, srcSlot, pointerId, x, y}
  boost: null,         // активный буст: {kind, from}
  leaderboard: null,   // экран рейтинга: {open, loading, available, entries, playerRank}
  settings: null,      // экран настроек: {open, t, drag} — drag это индекс ползунка
  hoverKey: null,      // ключ подсвеченной свободной ячейки под стопкой
  radius: CONFIG.board.radiusSteps[0].radius,   // текущий радиус поля
  camera: { rotation: 0 },                      // угол поворота поля, радианы
  anim: null,          // анимация перелива: {flows, t} — живёт только внутри волны
  burnAnim: null,      // вспышка сгорания: {burns, t}
  landing: null,       // «приземление» поставленной стопки: {cell, t}
  newRing: null,       // появление нового кольца: {keys, t}
  boostAnim: null,     // перелёт стопки бустом «перенос»: {moves, hide, t}
  handAnim: null,      // смена руки бустом «пересдача»: {old, t}
  // Juice (Phase 15). Живёт в отдельном цикле: эффекты переживают конец волны,
  // а логика игры на них не смотрит.
  fx: { particles: [], floats: [], shake: null },
  scoreShown: 0,       // счёт и кошелёк на экране догоняют настоящие значения
  coinsShown: 0,
  overlayT: 1          // проявление оверлея конца партии
};

let renderQueued = false;

// Отрисовка по событию: в простое канвас не перерисовывается
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render.drawAll(GameState);
  });
}

// --- Juice: частицы, «+N», тряска, догоняющие счётчики (Phase 15) ----------
// Отдельный цикл, потому что эти эффекты переживают конец волны и не должны
// удерживать ввод. Пока идёт волна, кадр рисует её цикл — здесь не дублируем.

let fxRunning = false;
let fxLast = 0;

// Счётчик догоняет цель и защёлкивается вблизи, иначе экспонента не дойдёт
function approach(shown, target, dt, ms) {
  if (shown === target) return target;
  const next = shown + (target - shown) * Math.min(1, (dt / ms) * 3);
  return Math.abs(target - next) < 0.6 ? target : next;
}

function fxAlive(state) {
  return state.fx.particles.length > 0 || state.fx.floats.length > 0 ||
    state.fx.shake !== null ||
    state.scoreShown !== state.score || state.coinsShown !== state.coins ||
    state.overlayT < 1 ||
    (state.leaderboard && state.leaderboard.open && state.leaderboard.t < 1) ||
    (state.settings && state.settings.open && state.settings.t < 1);
}

function stepFx(state, dt) {
  const a = CONFIG.animation;
  state.fx.particles = state.fx.particles.filter(p => (p.age += dt) < a.particleMs);
  state.fx.floats = state.fx.floats.filter(f => (f.age += dt) < a.floatMs);
  if (state.fx.shake && (state.fx.shake.age += dt) >= a.shakeMs) state.fx.shake = null;
  state.scoreShown = approach(state.scoreShown, state.score, dt, a.counterMs);
  state.coinsShown = approach(state.coinsShown, state.coins, dt, a.counterMs);
  if (state.overlayT < 1) state.overlayT = Math.min(1, state.overlayT + dt / a.overlayFadeMs);
  const board = state.leaderboard;
  if (board && board.open && board.t < 1) {
    board.t = Math.min(1, board.t + dt / a.overlayFadeMs);
  }
  const settings = state.settings;
  if (settings && settings.open && settings.t < 1) {
    settings.t = Math.min(1, settings.t + dt / a.overlayFadeMs);
  }
}

function startFx(state) {
  if (fxRunning || !fxAlive(state)) return;
  fxRunning = true;
  fxLast = performance.now();
  const tick = (now) => {
    const dt = Math.max(0, now - fxLast);
    fxLast = now;
    stepFx(state, dt);
    if (!state.isAnimating) render.drawAll(state);
    if (fxAlive(state)) {
      requestAnimationFrame(tick);
    } else {
      fxRunning = false;
      requestRender();
    }
  };
  requestAnimationFrame(tick);
}

// Осколки и «+N очков» на месте сгоревшего блока. Позиция хранится в мировых
// координатах: поле может повернуться, пока эффект живёт.
function spawnBurnFx(state, burn, combo) {
  const a = CONFIG.animation;
  // чем длиннее цепочка, тем гуще осколки — до трёх порций
  const count = a.particlesPerBurn * Math.min(combo || 1, 3);
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + render.noise(i, burn.count);
    const speed = a.particleSpeed * (0.45 + render.noise(i, 7) * 0.75);
    state.fx.particles.push({
      cell: burn.cell, color: burn.color, age: 0,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - a.particleSpeed * 0.35
    });
  }
  state.fx.floats.push({ cell: burn.cell, text: '+' + burn.points, age: 0 });
  // тряска — на крупных сгораниях и на длинной цепочке
  if (burn.count >= a.shakeFromTiles || combo >= 2) state.fx.shake = { age: 0 };
}

// Стопку убрали бустом — она рассыпается осколками своих же цветов
function spawnScatter(state, cell, tiles) {
  const a = CONFIG.animation;
  tiles.forEach((color, index) => {
    for (let i = 0; i < a.boostScatterPerTile; i++) {
      const seed = index * 7 + i;
      const angle = render.noise(seed, 3) * Math.PI * 2;
      const speed = a.particleSpeed * (0.35 + render.noise(seed, 5) * 0.6);
      state.fx.particles.push({
        cell, color, age: 0,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - a.particleSpeed * 0.3
      });
    }
  });
}

// --- Разрешение цепочки с анимацией ---------------------------------------
// Ввод заблокирован флагом isAnimating; RAF работает только пока летят фишки.

// Принимает ячейку или массив ячеек: буст может задеть больше одной
function runWave(state, start) {
  state.isAnimating = true;
  waveStep(state, mergeEngine.createWave(start));
}

// Один шаг волны: план (со снятием фишек) → анимация полёта → фиксация
function waveStep(state, ctx) {
  if (!ctx.queue.length || ctx.iterations >= CONFIG.merge.maxWaveIterations) {
    finishWave(state);
    return;
  }
  ctx.iterations++;
  const plan = mergeEngine.planWave(state, ctx);
  if (plan.flows.length) {
    animateFlows(state, plan, () => waveCommit(state, plan, ctx));
  } else {
    waveCommit(state, plan, ctx);
  }
}

function waveCommit(state, plan, ctx) {
  const res = mergeEngine.commitWave(state, plan, ctx);
  state.score += res.burnPoints;
  if (res.burnCoins) addCoins(state, res.burnCoins);
  updateBest(state);
  updateActiveColors(state);
  render.drawAll(state);
  // вспышка на сгоревших ячейках; она же пауза, иначе цепочка мелькает
  if (res.burns.length) {
    res.burns.forEach(burn => spawnBurnFx(state, burn, res.combo));
    Audio.burn(res.burns[0].count);
    // вибрация — на тех же крупных сгораниях, что и тряска экрана
    if (res.burns[0].count >= CONFIG.animation.shakeFromTiles) {
      Platform.vibrate(CONFIG.haptics.burn);
    }
    // со второго звена цепочки показываем комбо и бонус, который оно принесло
    if (res.combo >= 2) {
      Audio.combo(res.combo);
      Platform.vibrate(CONFIG.haptics.combo);
      state.fx.floats.push({
        cell: res.burns[0].cell, age: 0, accent: true,
        text: t('combo') + res.combo + (res.comboCoins ? '  +' + res.comboCoins : '')
      });
    }
    startFx(state);
    state.burnAnim = { burns: res.burns, t: 0 };
    animate(state, CONFIG.animation.burnFlashMs,
      (t) => { state.burnAnim.t = t; },
      () => { state.burnAnim = null; waveStep(state, ctx); });
  } else {
    waveStep(state, ctx);
  }
}

function animateFlows(state, plan, done) {
  // Куда именно ляжет каждая фишка. Считаем до анимации: в одну ячейку может течь
  // сразу несколько соседей, и они не должны целиться в один и тот же слой.
  const filled = new Map();
  plan.flows.forEach(f => {
    const key = hexMath.key(f.to.q, f.to.r);
    f.baseLayer = filled.has(key)
      ? filled.get(key)
      : (f.to.stack ? f.to.stack.tiles.length : 0);
    filled.set(key, f.baseLayer + f.count);
  });
  plan.flows.forEach(f => { f.finalTotal = filled.get(hexMath.key(f.to.q, f.to.r)); });

  // звук ложится на ту же дугу, что и картинка: шаг между щелчками — это
  // flowStagger от длительности шага волны
  const tiles = plan.flows.reduce((sum, f) => sum + f.count, 0);
  Audio.flow(tiles, CONFIG.animation.flowStagger * CONFIG.animation.waveStepMs / 1000);

  state.anim = { flows: plan.flows, t: 0 };
  animate(state, CONFIG.animation.waveStepMs,
    (t) => { state.anim.t = t; },
    () => { state.anim = null; done(); });
}

// Общий цикл анимации: RAF работает только пока идёт эффект
function animate(state, durationMs, onProgress, done) {
  const start = performance.now();
  const tick = (now) => {
    const t = Math.min(1, (now - start) / durationMs);
    onProgress(t);
    render.drawAll(state);
    if (t < 1) requestAnimationFrame(tick);
    else done();
  };
  requestAnimationFrame(tick);
}

function finishWave(state) {
  state.anim = null;
  state.burnAnim = null;
  state.landing = null;
  state.boostAnim = null;
  // поле растёт до проверки проигрыша: иначе партия закончилась бы за миг до того,
  // как счёт открыл новое кольцо
  const grew = growBoardIfNeeded(state);
  // рука опустела полностью → новая раздача (уже с учётом освободившихся ячеек)
  if (state.hand.slots.every(s => s === null)) {
    generators.dealHand(state);
    Audio.deal();
  }
  updateBest(state);
  announceThreshold(state);    // порог сгорания мог вырасти — об этом надо сказать
  checkGameOver(state);
  updateMusicTension(state);   // после checkGameOver: на проигрыше фон успокаивается

  if (grew) {
    // новое кольцо проявляется, ввод до конца анимации заблокирован
    Audio.ring();
    animate(state, CONFIG.animation.ringGrowMs,
      (t) => { state.newRing.t = render.ease.outCubic(t); },
      () => { state.newRing = null; state.isAnimating = false; requestRender(); });
  } else {
    state.isAnimating = false;
    requestRender();
  }
}

// Порог сгорания растёт со счётом (Phase 28), и об этом обязательно надо сказать:
// молча изменившееся правило читается как поломка — блок из десяти вдруг не горит,
// и непонятно почему. Сообщение идёт тем же путём, что «+N очков» и «Комбо».
// Возвращает показанный текст (или null): в тестах эффект не поймать — часы там
// прыгают на секунду за кадр, и всплывающая надпись умирает в том же вызове.
function announceThreshold(state) {
  const threshold = mergeEngine.thresholdFor(state.score);
  if (threshold === state.burnThreshold) return null;
  const grew = threshold > state.burnThreshold;
  state.burnThreshold = threshold;
  if (!grew) return null;                     // вниз порог не ходит, но на всякий случай
  const text = t('newThreshold') + threshold;
  const center = state.cells.get(hexMath.key(0, 0));
  if (center) {
    state.fx.floats.push({ cell: center, age: 0, accent: true, text });
    startFx(state);
  }
  Audio.ring();                               // тот же голос, что у нового кольца
  return text;
}

// --- Камера ----------------------------------------------------------------

// Вернуть поле в исходную ориентацию
function resetCamera(state) {
  state.camera.rotation = 0;
}

// --- Визуальный стиль (Phase 12/14) ----------------------------------------
// Тема вливает свои цвета в CONFIG.ui и палитру, поэтому остальной render
// не знает, какой стиль включён. Тема сейчас одна и применяется один раз в init;
// функция оставлена, чтобы добавление второго стиля не требовало правок рендера.
function applyTheme(name) {
  if (!THEMES[name]) return false;
  THEME = THEMES[name];
  Object.assign(CONFIG.ui, THEME.ui);
  Object.assign(CONFIG.ui.boostBar, THEME.boostBar);
  Object.assign(CONFIG.tile, THEME.geometry);
  CONFIG.colors.palette = THEME.palette;
  render.backgroundCache = null;             // фон перерисуется в новом стиле
  render.tileCache.clear();                  // и фишки: спрайты запечены со старым
  return true;
}

// --- Вёрстка под высоту экрана (Phase 24) -----------------------------------
// Канвас держит логическую ширину 720, а высоту берёт из формы окна: на телефоне
// 9:19.5 игра прежде шла в полосе посреди экрана, потому что пропорция 720×900
// была прибита в CSS. Базовые числа CONFIG.ui заданы для layout.baseHeight,
// поэтому снимок берётся один раз, а дальше всё считается от него — иначе
// повторный resize складывал бы прирост сам с собой.
let uiBase = null;
function captureUiBase() {
  const ui = CONFIG.ui;
  uiBase = {
    hintY: ui.hintY,
    handY: ui.handY,
    boostBarY: ui.boostBar.y,
    boardBottom: ui.boardArea.bottom,
    settingsTitleY: ui.settings.titleY,
    settingsRowY: ui.settings.rowY.slice()
  };
}

// Логическая высота канваса по размеру окна. Без окна (тесты, замер баланса)
// остаётся базовая — существующие проверки не должны поехать.
function canvasHeightFor(winWidth, winHeight) {
  const L = CONFIG.ui.layout;
  if (!winWidth || !winHeight) return L.baseHeight;
  const wanted = Math.round(CONFIG.canvas.width * winHeight / winWidth);
  return Math.max(L.minHeight, Math.min(L.maxHeight, wanted));
}

// Разложить интерфейс по новой высоте. Верх (счёт, рекорд, кошелёк, шестерёнка)
// не двигается, низ (подсказка, рука, бусты) опускается на весь прирост, а поле
// его забирает целиком — оно и есть главное на экране. Экраны-оверлеи считаются
// от центра, поэтому им хватает половины.
function layoutUi(height) {
  if (!uiBase) captureUiBase();
  const ui = CONFIG.ui;
  const grow = height - ui.layout.baseHeight;
  CONFIG.canvas.height = height;
  ui.hintY = uiBase.hintY + grow;
  ui.handY = uiBase.handY + grow;
  ui.boostBar.y = uiBase.boostBarY + grow;
  ui.boardArea.bottom = uiBase.boardBottom + grow;
  ui.settings.titleY = uiBase.settingsTitleY + grow / 2;
  ui.settings.rowY = uiBase.settingsRowY.map(y => y + grow / 2);
}

// Подогнать канвас под окно. Возвращает true, если что-то изменилось.
function applyCanvasSize(canvas, state) {
  const hasWindow = typeof window !== 'undefined';
  const height = canvasHeightFor(hasWindow ? window.innerWidth : 0,
    hasWindow ? window.innerHeight : 0);
  if (height === CONFIG.canvas.height && canvas.height === height) return false;
  layoutUi(height);
  canvas.width = CONFIG.canvas.width;
  canvas.height = height;
  render.backgroundCache = null;      // фон рисуется во весь канвас
  render.tileCache.clear();           // размер гекса сейчас сменится
  if (state && state.cells) {
    hexMath.fitLayout(state.radius);
    hexMath.expandCells(state.cells, state.radius);   // пересчёт пикселей ячеек
  }
  requestRender();
  return true;
}

// Ближайший угол, кратный шагу примагничивания (60° — симметрия гекса,
// при таком повороте сетка совпадает сама с собой)
function nearestSnapAngle(rotation) {
  const step = CONFIG.camera.snapStepDeg * Math.PI / 180;
  return Math.round(rotation / step) * step;
}

// Доворот поля до ближайшей грани после жеста вращения
function snapRotation(state) {
  const from = state.camera.rotation;
  const to = nearestSnapAngle(from);
  if (Math.abs(to - from) < 1e-6) {
    state.camera.rotation = to;
    requestRender();
    return;
  }
  Audio.snap();
  animate(state, CONFIG.animation.snapMs,
    (t) => { state.camera.rotation = from + (to - from) * render.ease.smooth(t); },
    () => { state.camera.rotation = to; requestRender(); });
}

// Радиус поля, положенный текущему счёту
function radiusForScore(score) {
  let radius = CONFIG.board.radiusSteps[0].radius;
  CONFIG.board.radiusSteps.forEach(step => {
    if (score >= step.fromScore) radius = step.radius;
  });
  return radius;
}

// Дорастить поле, если счёт открыл новое кольцо. Возвращает true, если выросло.
function growBoardIfNeeded(state) {
  const target = radiusForScore(state.score);
  if (target <= state.radius) return false;

  const before = new Set(state.cells.keys());
  state.radius = target;
  hexMath.fitLayout(target);
  hexMath.expandCells(state.cells, target);
  resetCamera(state);        // иначе новое кольцо окажется за кадром
  // ключи новых ячеек — для анимации появления
  const fresh = [];
  state.cells.forEach((cell, key) => { if (!before.has(key)) fresh.push(key); });
  state.newRing = { keys: new Set(fresh), t: 0 };
  return true;
}

// Кривая сложности: набор цветов расширяется вместе с полем — каждое новое кольцо
// приносит +3 цвета (4 -> 7 -> 10). Больше цветов — реже случайные совпадения.
function updateActiveColors(state) {
  let colors = CONFIG.board.radiusSteps[0].colors;
  CONFIG.board.radiusSteps.forEach(step => {
    if (state.score >= step.fromScore) colors = step.colors;
  });
  state.activeColors = Math.min(colors, CONFIG.colors.palette.length);
}

// Рекорд — переживает сессию. Пишем сразу через Platform.
function updateBest(state) {
  if (state.score <= state.best) return;
  state.best = state.score;
  Platform.saveBest(state.best);
}

// Кошелёк тоже переживает сессию: монеты копятся между партиями (ADR-0004)
function addCoins(state, amount) {
  state.coins += amount;
  Platform.saveCoins(state.coins);
  startFx(state);                        // число в кошельке доедет до нового
}

// Плата за буст — тем же путём, что и начисление
function spendCoins(state, amount) {
  state.coins = Math.max(0, state.coins - amount);
  Platform.saveCoins(state.coins);
  startFx(state);
}

// Насколько тревожно звучит фон. Считаем здесь, а не в Audio: это игровое
// правило, а секция звука знает только число 0…1.
//
// Меряем тесноту, а не счёт. Счёт врал бы: он только растёт, и после крупного
// сгорания музыка продолжала бы нагнетать над пустым полем. Свободные ячейки
// падают и растут вместе с реальным положением дел.
function updateMusicTension(state) {
  const m = CONFIG.audio.music;
  if (state.isGameOver) return Audio.setTension(0);   // партия кончилась, нагнетать незачем
  const free = generators.freeCells(state).length;
  if (free >= m.roomyFrom) return Audio.setTension(0);
  if (free <= m.tightAt) return Audio.setTension(1);
  return Audio.setTension((m.roomyFrom - free) / (m.roomyFrom - m.tightAt));
}

// Проигрыш: на поле нет свободных ячеек, а в руке ещё есть стопки
function checkGameOver(state) {
  if (generators.freeCells(state).length > 0) return;
  if (state.hand.slots.every(s => s === null)) return;
  state.isGameOver = true;
  state.overlayT = 0;                     // оверлей проявляется, а не выпрыгивает
  Platform.gameplay(false);               // партия кончилась — платформа должна знать
  // признак рекорда считается так же, как в оверлее: updateBest уже отработал
  Audio.over(state.score >= state.best && state.score > 0);
  Platform.vibrate(CONFIG.haptics.over);
  startFx(state);
  Platform.submitScore(state.score);      // на платформе уйдёт в глобальный рейтинг
}

// Экран рейтинга: данные тянутся при открытии, ошибки не ломают игру (ADR-0005)
function openLeaderboard(state) {
  state.leaderboard = { open: true, loading: true, available: false, entries: [],
                        playerRank: 0, t: 0 };
  Platform.gameplay(false);
  startFx(state);
  Platform.fetchLeaderboard().then(result => {
    // t сохраняем: пока грузились данные, экран уже начал проявляться
    const shown = state.leaderboard ? state.leaderboard.t : 1;
    state.leaderboard = Object.assign({ open: true, loading: false, t: shown }, result);
    requestRender();
  });
}

// --- Экран настроек (Phase 19) ---------------------------------------------
// Своего состояния у регуляторов нет: они правят CONFIG, а хранилище получает
// снимок при каждом изменении. Партию настройки не трогают и restart переживают,
// как кошелёк.

function openSettings(state) {
  state.settings = { open: true, t: 0, drag: null };
  Platform.gameplay(false);   // открытый экран — это пауза с точки зрения платформы
  startFx(state);             // экран проявляется, а не выпрыгивает
  requestRender();
}

function closeSettings(state) {
  state.settings = null;
  persistSettings();
  Platform.gameplay(!state.isGameOver);
  requestRender();
}

function persistSettings() {
  Platform.saveSettings({
    sfx: CONFIG.audio.volumeSfx,
    music: CONFIG.audio.music.volume,
    haptics: CONFIG.haptics.enabled,
    lang: CONFIG.lang
  });
}

// Прочитанное из хранилища раскладывается через те же сеттеры, что и ползунки,
// поэтому живой контекст (если он уже есть) подхватит громкость сразу.
// Пропущенное или битое значение остаётся тем, что стоит в CONFIG.
function applySettings(values) {
  if (!values) return false;
  const clamp = (v) => (typeof v === 'number' && isFinite(v)
    ? Math.min(1, Math.max(0, v)) : null);
  const sfx = clamp(values.sfx);
  const music = clamp(values.music);
  if (sfx !== null) Audio.setSfxVolume(sfx);
  if (music !== null) Audio.setMusicVolume(music);
  if (typeof values.haptics === 'boolean') CONFIG.haptics.enabled = values.haptics;
  if (values.lang) setLang(values.lang);
  return true;
}

function restart() {
  GameState.radius = radiusForScore(0);
  hexMath.fitLayout(GameState.radius);
  GameState.cells = hexMath.generateCells(GameState.radius);
  GameState.score = 0;
  GameState.best = Platform.loadBest();
  GameState.coins = Platform.loadCoins();   // кошелёк не сбрасывается новой партией
  GameState.activeColors = CONFIG.board.radiusSteps[0].colors;
  GameState.isAnimating = false;
  GameState.isGameOver = false;
  GameState.showHint = true;
  GameState.rescuesUsed = 0;       // лимит выручки — на партию, а не на сессию
  GameState.rescuedLastDeal = false;
  GameState.burnThreshold = mergeEngine.thresholdFor(0);
  GameState.drag = null;
  GameState.boost = null;
  GameState.leaderboard = null;
  GameState.settings = null;      // громкости при этом остаются: они не про партию
  GameState.hoverKey = null;
  resetCamera(GameState);
  input.spin = null;
  GameState.anim = null;
  GameState.burnAnim = null;
  GameState.landing = null;
  GameState.newRing = null;
  GameState.boostAnim = null;
  GameState.handAnim = null;
  // эффекты гасим и счётчики ставим сразу: новая партия не должна доезжать до нуля
  GameState.fx = { particles: [], floats: [], shake: null };
  GameState.scoreShown = GameState.score;
  GameState.coinsShown = GameState.coins;
  GameState.overlayT = 1;
  generators.fillStartBoard(GameState);
  generators.dealHand(GameState);
  Platform.gameplay(true);         // новая партия пошла
  // во время init контекста ещё нет — первая раздача проходит молча сама собой
  Audio.deal();
  updateMusicTension(GameState);
  requestRender();
}

// --- QA-хуки (ADR-0002) ----------------------------------------------------
// Только чтение состояния и фиксация seed; на геймплей не влияют.
// Seed можно задать в адресной строке: index.html?seed=42

// Текстовый снимок партии — для автотестов и отладки без скриншотов
function renderGameToText() {
  const lines = [];
  lines.push('score=' + GameState.score + ' best=' + GameState.best +
    ' colors=' + GameState.activeColors +
    ' free=' + generators.freeCells(GameState).length +
    (GameState.isGameOver ? ' GAMEOVER' : '') +
    (GameState.isAnimating ? ' ANIMATING' : ''));
  Array.from(GameState.cells.keys()).sort().forEach(key => {
    const stack = GameState.cells.get(key).stack;
    lines.push(key + ': ' + (stack ? stack.tiles.join('') : '-'));
  });
  lines.push('hand: ' + GameState.hand.slots
    .map(s => (s ? s.tiles.join('') : '-')).join(' | '));
  return lines.join('\n');
}

function applySeedFromUrl() {
  const match = /[?&]seed=(-?\d+)/.exec(location.search);
  if (match) generators.rng.seed(parseInt(match[1], 10));
}

// Замер кадра по адресу `?fps=1`. Кадры игра рисует по событию, поэтому для
// замера их нужно заказывать самим. Именно setInterval, а не самоперезаводящийся
// RAF: в тестах RAF выполняется синхронно и такой цикл ушёл бы в рекурсию —
// та же ловушка, что и у планировщика музыки (Phase 18).
function applyFpsFromUrl() {
  if (!/[?&]fps=1/.test(location.search)) return;
  render.fpsMeter.on = true;
  setInterval(requestRender, 16);
}

function exposeQaHooks() {
  window.__GAME_STATE__ = GameState;
  window.render_game_to_text = renderGameToText;
  window.__SET_SEED__ = (value) => { generators.rng.seed(value); restart(); };
}

function init() {
  const canvas = document.getElementById('game');
  render.ctx = canvas.getContext('2d');
  Platform.migrateEconomy();
  setLang(detectLang());            // язык браузера — пока игрок не выбрал свой
  Platform.initPlatform();          // SDK грузится только на домене платформы
  applyTheme(Object.keys(THEMES)[0]);
  applySettings(Platform.loadSettings());   // громкости и язык до первого звука
  applySeedFromUrl();
  applyFpsFromUrl();
  captureUiBase();                        // снимок базовой вёрстки до правок
  applyCanvasSize(canvas, GameState);       // высота канваса под форму окна
  restart();
  input.attach(canvas, GameState);
  if (typeof window !== 'undefined' && window.addEventListener) {
    // поворот экрана и смена размера окна перестраивают вёрстку без перезагрузки
    const relayout = () => applyCanvasSize(canvas, GameState);
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', relayout);
  }
  exposeQaHooks();
}

init();
</script>
</body>
</html>
