    const b = render.settingsButtonRect();
    render.withPress(state, 'gear', b, () => {
      render.paperCard(b.x, b.y, b.w, b.h, 10, CONFIG.ui.cardFill);
      render.drawIcon('gear', b.x + b.w / 2, b.y + b.h / 2,
        b.w * CONFIG.ui.settings.button.iconScale, CONFIG.ui.text);
    });
  },

  // Быстрая панель настроек (Phase 41, по референсу пользователя): столбик
  // круглых кнопок, выезжающий из шестерёнки вверх. Три тумблера — звуки,
  // музыка, вибрация — и «ещё», открывающее полный экран с ползунками, языком
  // и «Перезапустить». Экран остался: тумблер умеет только вкл/выкл, а
  // громкость игрок настраивает шагами по 5 %.
  quickButtonRect(index) {
    const cfg = CONFIG.ui.quickPanel;
    const gear = render.settingsButtonRect();
    // Размеры считаются от шестерёнки, а не своими числами: низ интерфейса
    // растёт вместе с высотой канваса (Phase 33), и панель обязана расти с ним,
    // иначе на телефоне кружки окажутся мельче нормы в 44 px.
    const size = gear.w * cfg.sizeRatio;
    const gap = size * cfg.gapRatio;
    return {
      x: gear.x + (gear.w - size) / 2,
      y: gear.y - gap - size - index * (size + gap),
      w: size,
      h: size
    };
  },

  // Панель едет снизу вверх и проявляется: t идёт от 0 к 1 в цикле juice.
  // Кнопки рисуются от последней к первой, чтобы верхние ложились под нижние
  // при наложении теней.
  drawQuickPanel(state) {
    const panel = state.quickPanel;
    if (!panel || panel.t <= 0) return;
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.quickPanel;
    const eased = render.ease.outCubic(Math.min(1, panel.t));

    ctx.save();
    ctx.globalAlpha = eased;
    for (let i = cfg.items.length - 1; i >= 0; i--) {
      const item = cfg.items[i];
      const b = render.quickButtonRect(i);
      // «выезд»: пока панель появляется, кнопки поднимаются к своим местам
      const dy = (1 - eased) * (b.y - render.settingsButtonRect().y) * -1;
      const y = b.y - dy;
      render.withPress(state, 'quick:' + item.key, { x: b.x, y, w: b.w, h: b.h }, () => {
        render.paperCard(b.x, y, b.w, b.h, b.w / 2, ui.cardFill);
        const on = item.key === 'more' || quickToggleOn(item.key);
        render.drawIcon(item.icon, b.x + b.w / 2, y + b.h / 2,
          b.w * cfg.iconScale, on ? ui.text : ui.textDim);
        if (!on) render.strikeThrough(b.x + b.w / 2, y + b.h / 2, b.w * cfg.iconScale);
      });
    }
    ctx.restore();
  },

  // Косая черта поверх выключенного тумблера — тот же знак «выключено», что и
  // в референсе. Цвет акцентный: перечёркивание должно читаться сразу.
  strikeThrough(cx, cy, size) {
    const ctx = render.ctx;
    const half = size * 0.42;
    ctx.save();
    ctx.strokeStyle = CONFIG.ui.text;
    ctx.lineWidth = Math.max(2, size * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - half, cy + half);
    ctx.lineTo(cx + half, cy - half);
    ctx.stroke();
    ctx.restore();
  },

  // Дорожка ползунка: 0 — звуки, 1 — музыка
  settingsSliderRect(index) {
    const cfg = CONFIG.ui.settings;
    return {
      x: cfg.sliderX,
      y: cfg.rowY[index] - cfg.sliderH / 2,
      w: cfg.sliderW,
      h: cfg.sliderH
    };
  },

  // Зона попадания заметно шире самой дорожки: пальцем в полоску 10 px не попасть
  settingsSliderHitRect(index) {
    const cfg = CONFIG.ui.settings;
    const rect = render.settingsSliderRect(index);
    return {
      x: rect.x - cfg.knob,
      y: rect.y - cfg.knob * 2,
      w: rect.w + cfg.knob * 2,
      h: rect.h + cfg.knob * 4
    };
  },

  settingsToggleRect() {
    const cfg = CONFIG.ui.settings;
    return {
      x: cfg.sliderX,
      y: cfg.rowY[2] - cfg.toggleH / 2,
      w: cfg.toggleW,
      h: cfg.toggleH
    };
  },

  // Текущее значение регулятора. Регуляторы правят CONFIG напрямую — своего
  // состояния у экрана нет, и рассинхрону взяться неоткуда.
  settingsValue(index) {
    return index === 0 ? CONFIG.audio.volumeSfx : CONFIG.audio.music.volume;
  },

  // Экранный X → значение 0…1. Шаг делает попадание предсказуемым и убирает
  // дробный мусор из хранилища.
  settingsValueAt(index, x) {
    const cfg = CONFIG.ui.settings;
    const rect = render.settingsSliderRect(index);
    const raw = (x - rect.x) / rect.w;
    const stepped = Math.round(raw / cfg.step) * cfg.step;
    return Math.min(1, Math.max(0, Math.round(stepped * 100) / 100));
  },

  drawSlider(index) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.settings;
    const rect = render.settingsSliderRect(index);
    const value = render.settingsValue(index);
    const radius = rect.h / 2;

    render.roundRectPath(rect.x, rect.y, rect.w, rect.h, radius);
    ctx.fillStyle = ui.cellFill;
    ctx.fill();
    if (value > 0) {
      render.roundRectPath(rect.x, rect.y, Math.max(rect.h, rect.w * value), rect.h, radius);
      ctx.fillStyle = ui.buttonFill;
      ctx.fill();
    }

    // ручка — вырезанный кружок с тенью, тем же приёмом, что и монета в HUD
    ctx.save();
    ctx.shadowColor = ui.cardShadow;
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    ctx.arc(rect.x + rect.w * value, rect.y + radius, cfg.knob, 0, Math.PI * 2);
    ctx.fillStyle = ui.cardFill;
    ctx.fill();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = ui.textDim;
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(Math.round(value * 100) + ' %', rect.x + rect.w + cfg.knob + 10,
      rect.y + radius);
  },

  drawToggle() {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.settings;
    const rect = render.settingsToggleRect();
    const on = CONFIG.haptics.enabled;

    render.roundRectPath(rect.x, rect.y, rect.w, rect.h, cfg.toggleRadius);
    ctx.fillStyle = on ? ui.buttonFill : ui.cellFill;
    ctx.fill();

    ctx.save();
    ctx.shadowColor = ui.cardShadow;
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    const knobX = on ? rect.x + rect.w - rect.h / 2 : rect.x + rect.h / 2;
    ctx.arc(knobX, rect.y + rect.h / 2, cfg.toggleKnob, 0, Math.PI * 2);
    ctx.fillStyle = ui.cardFill;
    ctx.fill();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = ui.textDim;
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(t(on ? 'on' : 'off'), rect.x + rect.w + cfg.knob + 10, rect.y + rect.h / 2);
  },

  // Кнопки выбора языка (Phase 23). Подписи — сами коды языков, они не
  // переводятся: «RU» и «EN» понятны на любом языке.
  langButtonRect(index) {
    const cfg = CONFIG.ui.settings;
    return {
      x: cfg.sliderX + index * (cfg.langW + cfg.langGap),
      y: cfg.rowY[3] - cfg.langH / 2,
      w: cfg.langW,
      h: cfg.langH
    };
  },

  drawLangButtons() {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    Object.keys(I18N).forEach((lang, i) => {
      const rect = render.langButtonRect(i);
      const active = CONFIG.lang === lang;
      render.paperCard(rect.x, rect.y, rect.w, rect.h, ui.settings.langRadius,
        active ? ui.buttonFill : ui.cellFill);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = active ? ui.buttonText : ui.textDim;
      ctx.font = 'bold 18px system-ui, sans-serif';
      ctx.fillText(lang.toUpperCase(), rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
    });
  },

  // Экран целиком: проявляется, как оверлей конца и экран рейтинга
  drawSettings(state) {
    const settings = state.settings;
    if (!settings || !settings.open) return;
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.settings;
    const W = CONFIG.canvas.width;

    ctx.globalAlpha = settings.t === undefined ? 1 : settings.t;
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, W, CONFIG.canvas.height);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.overlayText;
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(t('settings'), W / 2, cfg.titleY);

    ['sfx', 'music', 'haptics', 'language'].forEach((key, i) => {
      ctx.textAlign = 'left';
      ctx.fillStyle = ui.text;
      ctx.font = '24px system-ui, sans-serif';
      ctx.fillText(t(key), cfg.labelX, cfg.rowY[i]);
    });
    render.drawSlider(0);
    render.drawSlider(1);
    render.drawToggle();
    render.drawLangButtons();

    // нижний ряд: «Перезапустить» и «Назад» (Phase 32)
    const restartBtn = render.settingsRestartRect();
    render.withPress(state, 'restart', restartBtn, () => {
      render.paperCard(restartBtn.x, restartBtn.y, restartBtn.w, restartBtn.h,
        ui.buttonRadius, ui.buttonFill);
      render.buttonLabelWithHotkey(t('restartGame'), 'R', restartBtn);
    });

    const back = render.settingsBackRect();
    render.withPress(state, 'settingsBack', back, () => {
      render.paperCard(back.x, back.y, back.w, back.h, ui.buttonRadius, ui.buttonFill);
      ctx.textAlign = 'center';
      ctx.fillStyle = ui.buttonText;
      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.fillText(t('back'), back.x + back.w / 2, back.y + back.h / 2 + 1);
    });
    ctx.globalAlpha = 1;
  },

  // Подпись кнопки плюс мелкая подсказка о горячей клавише справа. Обозначение
  // клавиши в I18N не живёт: это не текст на языке, а надпись на кнопке клавиатуры.
  // Группа центрируется целиком — иначе подсказка сдвинула бы основную подпись
  // вбок; тот же приём, что у счёта в HUD и у цены на кнопке буста.
  buttonLabelWithHotkey(label, key, rect) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.settings;
    const hotkey = '[' + key + ']';
    ctx.textAlign = 'left';
    ctx.font = 'bold 24px system-ui, sans-serif';
    const labelW = render.textWidth(label, 13);
    ctx.font = cfg.hotkeySize + 'px system-ui, sans-serif';
    const hotkeyW = render.textWidth(hotkey, cfg.hotkeySize * 0.6);
    const groupX = rect.x + (rect.w - (labelW + cfg.hotkeyGap + hotkeyW)) / 2;
    const centerY = rect.y + rect.h / 2 + 1;

    ctx.fillStyle = ui.buttonText;
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(label, groupX, centerY);

    // подсказка тусклее подписи, но своим же цветом: палитра остаётся у темы
    const alpha = ctx.globalAlpha;
    ctx.globalAlpha = alpha * cfg.hotkeyAlpha;
    ctx.font = cfg.hotkeySize + 'px system-ui, sans-serif';
    ctx.fillText(hotkey, groupX + labelW + cfg.hotkeyGap, centerY);
    ctx.globalAlpha = alpha;
  },

  // Поворот мира вокруг центра поля — общая трансформация для всех мировых слоёв
  applyWorldTransform(state) {
    const ctx = render.ctx;
    const L = hexMath.layout;
    ctx.translate(L.centerX, L.centerY);
    ctx.rotate(state.camera.rotation);
    ctx.translate(-L.centerX, -L.centerY);
  },

  // Фон темы: рисуется один раз в отдельный канвас и дальше просто копируется —
  // бумажная крошка и полутон стоят тысяч операций и не должны идти каждый кадр
  drawBackground(state) {
    const ctx = render.ctx;
    if (!render.backgroundCache) {
      const buffer = document.createElement('canvas');
      buffer.width = CONFIG.canvas.width;
      buffer.height = CONFIG.canvas.height;
      const bufferCtx = buffer.getContext('2d');
      const previous = render.ctx;
      render.ctx = bufferCtx;                 // тема рисует через render.*
      THEME.background(bufferCtx);
      render.ctx = previous;
      render.backgroundCache = buffer;
    }
    ctx.drawImage(render.backgroundCache, 0, 0);
  },

  // Замер кадра (Phase 24), включается адресом `?fps=1`. Инструмент разработки:
  // в обычной партии выключен и ничего не стоит. Непрерывный RAF нужен потому,
  // что игра рисует по событию и в затишье кадров нет вовсе.
  fpsMeter: { on: false, last: 0, times: [] },
  drawFps() {
    const meter = render.fpsMeter;
    if (!meter.on) return;
    const now = performance.now();
    if (meter.last) {
      meter.times.push(now - meter.last);
      if (meter.times.length > 30) meter.times.shift();
    }
    meter.last = now;
    if (!meter.times.length) return;
    const avg = meter.times.reduce((sum, ms) => sum + ms, 0) / meter.times.length;
    const ctx = render.ctx;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = CONFIG.ui.text;
    ctx.fillText(Math.round(1000 / avg) + ' fps  ' + avg.toFixed(1) + ' ms',
      14, CONFIG.canvas.height - 32);
  },

  // Полный кадр: сначала мир под трансформом камеры, затем экранный слой поверх
  drawAll(state) {
    const ctx = render.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    render.drawBackground(state);

    // --- сетка поля: живёт в мировых координатах и поворачивается вместе с полем.
    // Обрезка по игровой области не даёт наезжать на HUD и руку.
    const area = CONFIG.ui.boardArea;
    const clipBoard = () => {
      ctx.beginPath();
      ctx.rect(0, area.top, CONFIG.canvas.width, area.bottom - area.top);
      ctx.clip();
    };
    // тряска двигает только поле: фон — картинка во весь канвас, при сдвиге
    // у краёв открылись бы полосы, а интерфейс дёргать незачем
    const shake = render.shakeOffset(state);

    ctx.save();
    clipBoard();
    ctx.translate(shake.x, shake.y);
    render.applyWorldTransform(state);
    render.drawBoard(state);
    render.drawBoostTargets(state);
    ctx.restore();

    // --- стопки и эффекты: экранные координаты, поэтому слои всегда растут вверх
    // экрана, а не вбок при повороте поля
    ctx.save();
    clipBoard();
    ctx.translate(shake.x, shake.y);
    render.drawStacks(state);
    render.drawBoostAnim(state);
    render.drawFlows(state);
    render.drawBurns(state);
    render.drawRings(state);
    render.drawParticles(state);
    ctx.restore();

    // «+N очков» летит к счёту и выходит за игровую область — рисуем без обрезки
    render.drawFloats(state);

    // Перетаскиваемая стопка — без обрезки: её ведут от руки, которая лежит ниже
    // игровой области
    render.drawDrag(state);

    // --- экран: интерфейс не зависит от камеры ---
    render.drawHand(state);
    render.drawHUD(state);
    render.drawBoostBar(state);
    render.drawResetCameraButton(state);
    render.drawSettingsButton(state);
    if (state.isGameOver) render.drawGameOver(state);
    // быстрая панель лежит выше оверлея конца — оттуда тоже глушат музыку
    render.drawQuickPanel(state);
    render.drawStats(state);
    render.drawRank(state);
    render.drawSettings(state);      // настройки лежат поверх всего
    render.drawAdPrompt(state);      // диалог рекламы — ещё выше: он ждёт ответа
    render.drawAdNotice(state);      // а предупреждение перед роликом — поверх всего
    render.drawFps();                // dev-замер, включается адресом ?fps=1
  }
};

// ============================================================================
// input — Pointer Events: взять / тащить / положить / отменить (Phase 2)
// ============================================================================
const input = {
  // Координаты события → координаты канваса (канвас растянут CSS, поэтому масштабируем)
  toCanvasCoords(canvas, event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * (CONFIG.canvas.width / rect.width),
      y: (event.clientY - rect.top) * (CONFIG.canvas.height / rect.height)
    };
  },

  // Отклик нажатия (Phase 30): помечаем, какую кнопку нажали, и заводим цикл juice.
  // Ввод при этом не блокируется — эффект живёт своей жизнью и гаснет сам.
  // Возвращает ключ нажатой кнопки: в тестах сам эффект не поймать — часы там
  // прыгают на секунду за кадр, и он гаснет в том же вызове (как у announceThreshold)
  pressButton(state, key) {
    state.fx.press = { key, age: 0 };
    startFx(state);
    return key;
  },

  // Какой слот руки под точкой. Зона слота — прямоугольник вокруг гекса,
  // расширенный вверх на высоту псевдо-3D слоёв, чтобы попадать по всей стопке.
  hitHandSlot(state, x, y) {
    const size = CONFIG.ui.handHexSize;
    for (let i = 0; i < 3; i++) {
      const stack = state.hand.slots[i];
      if (!stack) continue;
      const c = render.handSlotCenter(i);
      const layers = Math.min(stack.tiles.length, CONFIG.tile.maxVisibleLayers);
      const top = c.y - size - (layers - 1) * CONFIG.tile.layerOffset;
      if (x >= c.x - size && x <= c.x + size && y >= top && y <= c.y + size) return i;
    }
    return -1;
  },

  // Экран → мир и обратно: мир повёрнут вокруг центра поля, поэтому точку ввода
  // нужно повернуть в обратную сторону. Интерфейс (рука, HUD, кнопки) — в экранных.
  rotatePoint(x, y, angle) {
    const L = hexMath.layout;
    const dx = x - L.centerX;
    const dy = y - L.centerY;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    return { x: L.centerX + dx * cos - dy * sin, y: L.centerY + dx * sin + dy * cos };
  },
  screenToWorld(state, x, y) {
    return input.rotatePoint(x, y, -state.camera.rotation);
  },
  worldToScreen(state, x, y) {
    return input.rotatePoint(x, y, state.camera.rotation);
  },

  // Угол от центра поля до точки — основа жеста вращения
  angleFromCenter(x, y) {
    const L = hexMath.layout;
    return Math.atan2(y - L.centerY, x - L.centerX);
  },

  // Расстояние от центра поля: у самого центра градус на пиксель уходит
  // в бесконечность, поэтому там жест не работает
  radiusFromCenter(x, y) {
    const L = hexMath.layout;
    return Math.hypot(x - L.centerX, y - L.centerY);
  },

  // Разница углов, приведённая к (−π, π]. Без этого протаскивание через левую
  // горизонталь (179° → −179°) давало −358° вместо +2°, и поле проворачивалось
  // почти на полный оборот — это и выглядело как «оно крутится само».
  angleDelta(from, to) {
    let delta = to - from;
    while (delta > Math.PI) delta -= Math.PI * 2;
    while (delta <= -Math.PI) delta += Math.PI * 2;
    return delta;
  },

  // Свободная ячейка под якорем перетаскиваемой стопки (координаты мировые)
  freeCellAt(state, x, y) {
    const a = hexMath.pixelToAxial(x, y);
    const cell = state.cells.get(hexMath.key(a.q, a.r));
    return cell && !cell.stack ? cell : null;
  },

  // Ячейка поля под экранной точкой — любая, занятая или пустая. Координаты
  // экранные, поэтому переводим их в мировые: поле-то повёрнуто.
  cellAt(state, x, y) {
    const world = input.screenToWorld(state, x, y);
    const a = hexMath.pixelToAxial(world.x, world.y);
    return state.cells.get(hexMath.key(a.q, a.r)) || null;
  },


  // Попадание точки в прямоугольник кнопки
  hitRect(rect, x, y) {
    return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
  },

  // Текущий жест вращения поля
  spin: null,

  // --- Экран настроек (Phase 19) --------------------------------------------

  // Регулятор правит CONFIG через Audio: игрок должен слышать результат сразу,
  // ещё не отпустив ползунок.
  setSettingsValue(index, value) {
    if (index === 0) return Audio.setSfxVolume(value);
    return Audio.setMusicVolume(value);
  },

  // Нажатие при открытом экране: ползунки → тумблер → «Назад». Больше на экране
  // ничего нет, поэтому всё остальное просто игнорируется.
  settingsDown(state, point) {
    for (let i = 0; i < 2; i++) {
      if (input.hitRect(render.settingsSliderHitRect(i), point.x, point.y)) {
        state.settings.drag = i;
        input.setSettingsValue(i, render.settingsValueAt(i, point.x));
        requestRender();
        return true;
      }
    }
    const langs = Object.keys(I18N);
    for (let i = 0; i < langs.length; i++) {
      if (input.hitRect(render.langButtonRect(i), point.x, point.y)) {
        setLang(langs[i]);
        // выбранный руками язык важнее и языка браузера, и языка площадки:
        // отметку ставит только этот переключатель (Phase 40)
        Storage.data.langChosen = true;
        persistSettings();
        requestRender();
        return true;
      }
    }
    if (input.hitRect(render.settingsToggleRect(), point.x, point.y)) {
      CONFIG.haptics.enabled = !CONFIG.haptics.enabled;
      // включили — сразу отдаём: иначе не понять, работает ли гаптика на этом
      // устройстве вообще (на iOS её нет, и это не наша поломка)
      if (CONFIG.haptics.enabled) Haptics.vibrate(CONFIG.haptics.burnBig);
      persistSettings();
      requestRender();
      return true;
    }
    // «Перезапустить» закрывает экран до restart(): так пресс кнопки и закрытие
    // экрана успевают отработать на прежнем состоянии, а новая партия начинается
    // уже без оверлея настроек.
    if (input.hitRect(render.settingsRestartRect(), point.x, point.y)) {
      input.pressButton(state, 'restart');
      closeSettings(state);
      restart();
      return true;
    }
    if (input.hitRect(render.settingsBackRect(), point.x, point.y)) {
      input.pressButton(state, 'settingsBack');
      closeSettings(state);
      return true;
    }
    return false;
  },

  // --- Бусты ---------------------------------------------------------------

  boostConfig(kind) {
    return CONFIG.boosts.find(b => b.kind === kind);
  },

  // Включить или выключить буст. Монеты списываются не здесь, а при применении —
  // кроме instant-бустов, которым нечего выбирать.
  toggleBoost(state, kind) {
    if (state.boost && state.boost.kind === kind) {
      state.boost = null;
      return;
    }
    if (state.isAnimating || state.isGameOver) { denyFeedback(); return; }
    const config = input.boostConfig(kind);
    // Не хватило монет — предлагаем ролик за бесплатное применение (Phase 42).
    // Площадки нет или лимит роликов за партию исчерпан — прежний честный отказ.
    if (state.coins < config.cost && state.freeBoost !== kind) {
      if (canOfferAd(state, kind)) { openAdPrompt(state, kind); return; }
      denyFeedback();
      return;
    }
    // буст несовместим с перетаскиванием стопки из руки
    if (state.drag) {
      state.hand.slots[state.drag.srcSlot] = state.drag.stack;
      state.drag = null;
      state.hoverKey = null;
    }
    if (config.instant) {
      input.applyInstantBoost(state, config);
      return;
    }
    state.boost = { kind, from: null };
  },

  // «Пересдача»: рука меняется целиком, цель выбирать не надо. Модель меняется
  // сразу, анимация показывает переход — как и у остальных бустов.
  applyInstantBoost(state, config) {
    const old = state.hand.slots.map(s => (s ? s.tiles.slice() : null));
    generators.dealHand(state);
    state.boost = null;
    spendCoins(state, boostCostFor(state, config.kind));
    Audio.boost(config.kind);
    state.isAnimating = true;
    state.handAnim = { old, t: 0 };
    animate(state, CONFIG.animation.handSwapMs,
      (t) => { state.handAnim.t = t; },
      () => {
        state.handAnim = null;
        state.isAnimating = false;
        checkGameOver(state);
        requestRender();
      });
  },

  // Годится ли ячейка для текущего шага активного буста
  isBoostTarget(state, cell) {
    const boost = state.boost;
    if (!boost) return false;
    if (boost.kind === 'remove') return !!cell.stack;
    // move: сначала занятая ячейка-источник, потом любая другая — пустая
    // (перенос) или занятая (стопки меняются местами). Сама себе цель не годится:
    // это ход в никуда за 30 монет.
    return boost.from ? cell !== boost.from : !!cell.stack;
  },

  // Клик по ячейке в режиме буста
  applyBoostTo(state, cell) {
    const boost = state.boost;
    if (!input.isBoostTarget(state, cell)) { denyFeedback(); return; }

    // Доска меняется сразу, а анимация показывает переход — тот же приём, что и
    // у переливов: planWave тоже снимает фишки до полёта, а рендер прячет их.
    if (boost.kind === 'remove') {
      const tiles = cell.stack.tiles.slice();
      cell.stack = null;
      spawnScatter(state, cell, tiles);
      Audio.boost(boost.kind);
      startFx(state);
      input.finishBoost(state, boost.kind, [cell]);
      return;
    }
    if (!boost.from) {                 // «перестановка»: сначала ячейка-источник
      boost.from = cell;
      requestRender();
      return;
    }
    // Цель пустая — стопка переезжает; занятая — стопки меняются местами. Перелётов
    // тогда два, но описание полёта их принимает массивом, а волна стартует от обеих
    // ячеек: finishBoost сам отберёт те, где стопка осталась.
    const source = boost.from;
    const moved = source.stack;
    const swapped = cell.stack;
    cell.stack = moved;
    moved.cell = { q: cell.q, r: cell.r };
    source.stack = swapped;
    const moves = [{ tiles: moved.tiles, from: source, to: cell }];
    if (swapped) {
      swapped.cell = { q: source.q, r: source.r };
      moves.push({ tiles: swapped.tiles, from: cell, to: source });
    }
    Audio.boost(boost.kind);
    input.finishBoost(state, boost.kind, [cell, source], input.boostFlight(moves));
  },

  // Описание перелёта стопок для рендера: ячейки-цели прячутся, пока идёт полёт
  boostFlight(moves) {
    return {
      moves,
      hide: new Set(moves.map(m => hexMath.key(m.to.q, m.to.r))),
      t: 0
    };
  },

  // Списать монеты, проиграть перелёт и только потом разрешать слияния.
  // Цену считает boostCostFor, а не вызывающий код: применение, оплаченное
  // роликом (Phase 42), бесплатно, и это правило должно жить в одном месте.
  finishBoost(state, kind, changedCells, flight) {
    state.boost = null;
    spendCoins(state, boostCostFor(state, kind));
    const resume = () => {
      const starts = changedCells.filter(c => c.stack);
      if (starts.length) {
        runWave(state, starts);
      } else {
        state.isAnimating = false;
        checkGameOver(state);
        requestRender();
      }
    };
    // ввод блокируется на всё время: и на перелёт, и на возможную цепочку
    state.isAnimating = true;
    if (!flight) {
      resume();
      return;
    }
    state.boostAnim = flight;
    animate(state, CONFIG.animation.boostMoveMs,
      (t) => { state.boostAnim.t = t; },
      () => { state.boostAnim = null; resume(); });
  },

  attach(canvas, state) {
    // Нажатие: кнопки → рука → вращение поля (в этом порядке приоритета)
    canvas.addEventListener('pointerdown', (event) => {
      const point = input.toCanvasCoords(canvas, event);
      // первый жест — единственный момент, когда браузер разрешает завести звук.
      // Здесь проходит любое касание канваса, все ранние return идут ниже.
      Audio.unlock();
      markActivity(state);       // отсчёт простоя для автопоказа (Phase 42.2)

      // Предупреждение перед роликом забирает ввод целиком: тап в этот момент не
      // должен ни делать ход, ни попасть по уже открывшейся рекламе.
      if (state.adNotice) return;

      // Диалог «ролик за буст» ждёт ответа и лежит выше всех экранов: игра под
      // ним стоит, а случайный тап мимо не должен ни закрывать его, ни делать ход.
      if (state.adPrompt) {
        if (input.hitRect(render.adWatchRect(), point.x, point.y)) {
          input.pressButton(state, 'ad:watch');
          watchAdForBoost(state);
        } else if (input.hitRect(render.adCancelRect(), point.x, point.y)) {
          input.pressButton(state, 'ad:cancel');
          closeAdPrompt(state);
        }
        return;
      }

      // экран настроек лежит поверх всего и забирает ввод целиком
      if (state.settings && state.settings.open) {
        input.settingsDown(state, point);
        return;
      }

      // экран статистики поверх всего: реагирует только кнопка «Назад»
      if (state.statsScreen && state.statsScreen.open) {
        if (input.hitRect(render.restartButtonRect(), point.x, point.y)) {
          state.statsScreen.open = false;
          syncGameplay(state);
          requestRender();
        }
        return;
      }
      // Экран лидерборда — так же: «Назад» и «Войти», больше ничего. Окно входа
      // открывается только этой кнопкой (требование 1.2.1): открывать его при
      // входе на экран нельзя, доки приводят это прямым антипримером.
      if (state.rankScreen && state.rankScreen.open) {
        if (input.hitRect(render.restartButtonRect(), point.x, point.y)) {
          state.rankScreen.open = false;
          syncGameplay(state);
          requestRender();
          return;
        }
        if (state.rankScreen.status === 'ready' && !state.rankScreen.authorized &&
            input.hitRect(render.signInButtonRect(), point.x, point.y)) {
          input.pressButton(state, 'signIn');
          signIn(state);
        }
        return;
      }
      // Быстрая панель лежит поверх всего, кроме экранов: пока она открыта,
      // её кнопки важнее и оверлея конца, и поля.
      if (state.quickPanel && state.quickPanel.open) {
        const items = CONFIG.ui.quickPanel.items;
        const hit = items.findIndex((item, i) =>
          input.hitRect(render.quickButtonRect(i), point.x, point.y));
        if (hit !== -1) {
          const key = items[hit].key;
          input.pressButton(state, 'quick:' + key);
          if (key === 'more') openSettings(state);
          else quickToggle(state, key);
          return;
        }
        // шестерёнку обрабатываем ниже (второе нажатие закрывает панель),
        // клик мимо панели — тоже закрытие, но ход при этом не делается
        if (!input.hitRect(render.settingsButtonRect(), point.x, point.y)) {
          closeQuickPanel(state);
          return;
        }
      }
      // шестерёнка работает и в партии, и на оверлее конца: убрать музыку
      // захочется в обоих случаях
      if (input.hitRect(render.settingsButtonRect(), point.x, point.y)) {
        input.pressButton(state, 'gear');
        toggleQuickPanel(state);
        return;
      }
      // плашка лиги открывает таблицу — и в партии, и на оверлее конца
      if (input.hitRect(render.leagueBadgeRect(), point.x, point.y)) {
        input.pressButton(state, 'league');
        openRank(state);
        return;
      }
      if (state.isGameOver) {
        if (input.hitRect(render.rankButtonRect(), point.x, point.y)) {
          input.pressButton(state, t('leaderboard'));
          openRank(state);
          return;
        }
        if (input.hitRect(render.statsButtonRect(), point.x, point.y)) {
          input.pressButton(state, t('stats'));
          openStats(state);
          return;
        }
        if (input.hitRect(render.reviveButtonRect(), point.x, point.y)) {
          input.pressButton(state, 'revive');
          revive(state);
          return;
        }
        if (input.hitRect(render.restartHalfRect(), point.x, point.y)) {
          input.pressButton(state, 'restart');
          // Межстраничная реклама (Phase 42) — только здесь: это единственная
          // логическая пауза между партиями (п. 4.4). Показывать или пропустить,
          // решает Platform; без площадки restart() отработает синхронно.
          Platform.showInterstitial(restart);
        }
        return;
      }
      if (input.hitRect(render.resetCameraButtonRect(), point.x, point.y)) {
        resetCamera(state);
        requestRender();
        return;
      }
      // панель бустов
      const boostIndex = CONFIG.boosts.findIndex((boost, i) =>
        input.hitRect(render.boostButtonRect(i), point.x, point.y));
      if (boostIndex !== -1) {
        input.pressButton(state, 'boost:' + CONFIG.boosts[boostIndex].kind);
        input.toggleBoost(state, CONFIG.boosts[boostIndex].kind);
        requestRender();
        return;
      }

      // активный буст: клик по полю выбирает ячейку, а не вращает и не ставит стопку
      if (state.boost) {
        const target = input.cellAt(state, point.x, point.y);
        if (target) input.applyBoostTo(state, target);
        return;
      }

      const slot = state.isAnimating || state.drag ? -1 : input.hitHandSlot(state, point.x, point.y);
      if (slot !== -1) {
        const stack = state.hand.slots[slot];
        const world = input.screenToWorld(state, point.x, point.y);
        state.hand.slots[slot] = null;
        // shownX/shownY — то, что нарисовано: они догоняют палец в цикле juice.
        // При взятии совпадают с ним, иначе стопка прилетела бы из прошлого места.
        state.drag = {
          stack, srcSlot: slot, pointerId: event.pointerId,
          x: world.x, y: world.y - CONFIG.ui.dragLift,
          shownX: world.x, shownY: world.y - CONFIG.ui.dragLift
        };
        state.hoverKey = null;
        Audio.pick();
        // захват указателя: события идут сюда, даже если палец ушёл за канвас
        if (canvas.setPointerCapture) canvas.setPointerCapture(event.pointerId);
        requestRender();
        return;
      }

      // Вращать поле можно только от гекса. Иначе жест начинался бы по остаточному
      // принципу — «мимо руки и кнопок», то есть и по счёту, и по панели бустов,
      // и по пустым полям у краёв экрана: промах мимо слота проворачивал доску.
      if (!input.cellAt(state, point.x, point.y)) return;

      input.spin = {
        pointerId: event.pointerId,
        startAngle: input.angleFromCenter(point.x, point.y),
        startRotation: state.camera.rotation,
        startX: point.x, startY: point.y,
        moved: false
      };
    });

    // Движение: перетаскивание стопки либо вращение поля
    canvas.addEventListener('pointermove', (event) => {
      const point = input.toCanvasCoords(canvas, event);

      // ползунок настроек ведут пальцем: индекс 0 — тоже жест, поэтому сравнение
      // именно с null, а не проверка на истинность
      const settings = state.settings;
      if (settings && settings.open && settings.drag !== null) {
        input.setSettingsValue(settings.drag, render.settingsValueAt(settings.drag, point.x));
        requestRender();
        return;
      }

      const d = state.drag;
      if (d && d.pointerId === event.pointerId) {
        const world = input.screenToWorld(state, point.x, point.y);
        d.x = world.x;
        d.y = world.y - CONFIG.ui.dragLift;
        const cell = input.freeCellAt(state, d.x, d.y);
        state.hoverKey = cell ? hexMath.key(cell.q, cell.r) : null;
        // картинка стопки догоняет палец в цикле juice — он же и рисует кадр
        startFx(state);
        return;
      }

      const spin = input.spin;
      if (spin && spin.pointerId === event.pointerId) {
        const cam = CONFIG.camera;
        // мелкие дрожания курсора не должны крутить поле
        if (!spin.moved &&
            Math.hypot(point.x - spin.startX, point.y - spin.startY) < cam.minDragToRotate) {
          return;
        }
        const angle = input.angleFromCenter(point.x, point.y);
        // Порог пробит — берём отсчёт заново, иначе весь накопленный угол
        // применился бы одним рывком.
        if (!spin.moved) {
          spin.moved = true;
          spin.startAngle = angle;
          // отсчёт от того, что нарисовано: инерция прошлого жеста могла ещё
          // доезжать, и цель успела уйти вперёд
          state.camera.target = state.camera.rotation;
          state.camera.velocity = 0;
          spin.startRotation = state.camera.rotation;
          spin.lastAt = performance.now();
          return;
        }
        // У центра поля жест не работает, но отсчёт всё равно сдвигаем:
        // тогда при выходе из мёртвой зоны не будет скачка.
        if (input.radiusFromCenter(point.x, point.y) < cam.minSpinRadius) {
          spin.startAngle = angle;
          spin.startRotation = state.camera.target;
          return;
        }
        // Палец задаёт цель, а видимый угол догоняет её в цикле juice. Скорость
        // копим здесь же: после отпускания она станет инерцией. Один рваный кадр
        // не должен давать выброс, поэтому скорость сглаживается пополам.
        const next = spin.startRotation +
          input.angleDelta(spin.startAngle, angle) * cam.spinSensitivity;
        const now = performance.now();
        const dt = now - (spin.lastAt || now);
        if (dt > 0) {
          const speed = Math.max(-cam.spinMaxSpeed,
            Math.min(cam.spinMaxSpeed, (next - state.camera.target) / dt));
          state.camera.velocity = state.camera.velocity * 0.5 + speed * 0.5;
        }
        spin.lastAt = now;
        state.camera.target = next;
        startFx(state);
      }
    });

    // Отпускание: положить стопку либо довернуть поле до ближайшей грани
    canvas.addEventListener('pointerup', (event) => {
      // конец жеста — тоже действие: долгое перетаскивание не должно считаться
      // простоем, иначе реклама выскочит сразу после того, как палец отпустили
      markActivity(state);
      // в хранилище ходим один раз на жест, а не на каждое движение пальца
      if (state.settings && state.settings.drag !== null) {
        state.settings.drag = null;
        persistSettings();
        return;
      }

      const d = state.drag;
      if (d && d.pointerId === event.pointerId) {
        const cell = input.freeCellAt(state, d.x, d.y);
        if (cell) {
          input.placeStack(state, d.stack, cell);
        } else {
          state.hand.slots[d.srcSlot] = d.stack;   // отмена: занятая ячейка или вне поля
          denyFeedback();
        }
        state.drag = null;
        state.hoverKey = null;
        requestRender();
        return;
      }
      // moved решает ровно один вопрос — доворачивать поле или нет. Со стопкой
      // жест не спорит: если попали в слот руки, input.spin вообще не создаётся.
      if (input.spin && input.spin.pointerId === event.pointerId) {
        const spun = input.spin.moved;
        input.spin = null;
        if (spun) releaseSpin(state);
      }
    });

    // Прерванный ввод (системный жест, уход фокуса) — считаем отменой
    canvas.addEventListener('pointercancel', (event) => {
      // системный жест поверх ползунка: значение остаётся, сохраняем его тем же
      // путём, что и при обычном отпускании
      if (state.settings && state.settings.drag !== null) {
        state.settings.drag = null;
        persistSettings();
        return;
      }
      if (input.spin && input.spin.pointerId === event.pointerId) {
        const spun = input.spin.moved;
        input.spin = null;
        if (spun) releaseSpin(state);    // жеста не было — доворачивать нечего
      }
      const d = state.drag;
      if (!d || d.pointerId !== event.pointerId) return;
      state.hand.slots[d.srcSlot] = d.stack;
      denyFeedback();
      state.drag = null;
      state.hoverKey = null;
      requestRender();
    });

    // Долгое нажатие по канвасу не должно открывать контекстное меню браузера —
    // требования площадки 1.6.1.8 (мобильные) и 1.6.2.7 (десктоп)
    canvas.addEventListener('contextmenu', (event) => event.preventDefault());

    // Клавиатура: R — заново, Esc — закрыть настройки или отменить активный буст
    window.addEventListener('keydown', (event) => {
      Audio.unlock();   // клавиатура — отдельный вход, канваса игрок мог и не касаться
      // настройки лежат поверх всего, поэтому и Esc достаётся сначала им
      if (event.code === 'Escape' && state.settings && state.settings.open) {
        closeSettings(state);
        return;
      }
      if (event.code === 'Escape' && state.boost) {
        state.boost = null;
        requestRender();
        return;
      }
      // R перезапускает и из открытого меню — но экран сначала надо закрыть по
      // правилам: restart() обнуляет settings молча, без сохранения настроек
      if (event.code === 'KeyR' && !state.isAnimating) {
        if (state.settings && state.settings.open) closeSettings(state);
        restart();
      }
    });
  },

  // Установка стопки в ячейку → сразу разрешение цепочки.
  // Рука пополняется по завершении волны (см. finishWave), чтобы милосердный
  // генератор видел ячейки, освободившиеся после сгораний.
  placeStack(state, stack, cell) {
    stack.cell = { q: cell.q, r: cell.r };
    cell.stack = stack;
    state.showHint = false;                       // подсказка гаснет после первого хода
    Audio.place();
    // «приземление» стопки, затем разрешение цепочки; ввод заблокирован уже сейчас
    state.isAnimating = true;
    state.landing = { cell, t: 0 };
    animate(state, CONFIG.animation.landingMs,
      (t) => { state.landing.t = render.ease.outBack(t); },   // с лёгким доездом
      () => {
        state.landing = null;
        // волна собирается в соседнюю стопку того же цвета, если она есть
        runWave(state, mergeEngine.mergeTargetFor(state, cell));
      });
  }
};

// ============================================================================
// main — GameState, отрисовка по событию, restart
// ============================================================================
const GameState = {
  cells: null,
  hand: { slots: [null, null, null] },
  score: 0,
  best: 0,
  coins: 0,            // кошелёк: копится между партиями, тратится на бусты (Phase 10)
  activeColors: CONFIG.board.radiusSteps[0].colors,
  isAnimating: false,
  isGameOver: false,
  showHint: true,
  // Драма-менеджер выдачи (Phase 25): сколько раз игра уже выручила в этой партии
  // и не была ли выручка в прошлой раздаче — подряд подыгрывать нельзя (ADR-0008)
  rescuesUsed: 0,
  rescuedLastDeal: false,
  // текущий порог сгорания: растёт со счётом, о повышении игрока предупреждают
  burnThreshold: CONFIG.merge.thresholdSteps[0].threshold,
  drag: null,          // текущее перетаскивание: {stack, srcSlot, pointerId, x, y}
  boost: null,         // активный буст: {kind, from}
  statsScreen: null,   // экран статистики: {open, values, t}
  rankScreen: null,    // экран лидерборда: {open, t, status, entries, authorized}
  rank: 0,             // место в таблице площадки: 0 — неизвестно
  settings: null,      // экран настроек: {open, t, drag} — drag это индекс ползунка
  quickPanel: null,    // быстрая панель у шестерёнки: {open, t} (Phase 41)
  adPrompt: null,      // диалог «ролик за буст»: {kind, t} (Phase 42)
  adNotice: null,      // предупреждение перед межстраничной (Phase 42.2)
  lastActionMs: 0,     // когда игрок в последний раз что-то делал
  freeBoost: null,     // буст, оплаченный роликом: применится бесплатно один раз
  adBoostsUsed: 0,     // сколько роликов за буст показано за эту партию
  hoverKey: null,      // ключ подсвеченной свободной ячейки под стопкой
  pageActive: true,    // вкладка на виду и площадка не показывает рекламу (Phase 40)
  radius: CONFIG.board.radiusSteps[0].radius,   // текущий радиус поля
  // Камера: rotation — что нарисовано, target — куда ведёт палец, velocity —
  // инерция после отпускания (рад/мс). Раздельно они нужны ради плавности:
  // события указателя приходят реже кадров и неровно (Phase 34).
  camera: { rotation: 0, target: 0, velocity: 0 },
  revivesUsed: 0,      // возрождений за партию: каждое следующее дороже (Phase 37)
  // Номер партии. Циклы анимации сверяются с ним и молча умирают, если партия
  // сменилась: иначе незавершённая волна доигрывает done() уже на новой доске и
  // приносит туда очки и стопки из прошлой (Phase 39).
  generation: 0,
  anim: null,          // анимация перелива: {flows, t} — живёт только внутри волны
  burnAnim: null,      // вспышка сгорания: {burns, t}
  landing: null,       // «приземление» поставленной стопки: {cell, t}
  newRing: null,       // появление нового кольца: {keys, t}
  boostAnim: null,     // перелёт стопки бустом «перенос»: {moves, hide, t}
  handAnim: null,      // смена руки бустом «пересдача»: {old, t}
  // Juice (Phase 15). Живёт в отдельном цикле: эффекты переживают конец волны,
  // а логика игры на них не смотрит.
  fx: { particles: [], rings: [], floats: [], shake: null, press: null },
  // Статистика (Phase 20). Счётчики копятся за партию и в конце добавляются к
  // сохранённым; recordBeaten поднимается один раз — иначе вспышка мигала бы
  // на каждом ходу после рекорда.
  recordBeaten: false,
  runStats: { burns: 0, biggestBlock: 0, longestCombo: 0, coins: 0 },
  scoreShown: 0,       // счёт и кошелёк на экране догоняют настоящие значения
  coinsShown: 0,
  overlayT: 1          // проявление оверлея конца партии
};

let renderQueued = false;

// Отрисовка по событию: в простое канвас не перерисовывается
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render.drawAll(GameState);
  });
}

// --- Juice: частицы, «+N», тряска, догоняющие счётчики (Phase 15) ----------
// Отдельный цикл, потому что эти эффекты переживают конец волны и не должны
// удерживать ввод. Пока идёт волна, кадр рисует её цикл — здесь не дублируем.

let fxRunning = false;
let fxLast = 0;

// Счётчик догоняет цель и защёлкивается вблизи, иначе экспонента не дойдёт
function approach(shown, target, dt, ms) {
  if (shown === target) return target;
  const next = shown + (target - shown) * Math.min(1, (dt / ms) * 3);
  return Math.abs(target - next) < 0.6 ? target : next;
}

function fxAlive(state) {
  const drag = state.drag;
  // Инерция считается живой только когда палец отпущен: во время жеста скорость
  // всё время ненулевая, и цикл не смог бы завершиться никогда. Пока палец на
  // экране, кадры заказывает сам pointermove.
  const spinning = !!(input.spin && input.spin.moved);
  return state.fx.particles.length > 0 || state.fx.floats.length > 0 ||
    state.fx.rings.length > 0 || state.fx.shake !== null || !!state.fx.press ||
    state.camera.rotation !== state.camera.target ||
    (!spinning && state.camera.velocity !== 0) ||
    (drag && (drag.shownX !== drag.x || drag.shownY !== drag.y)) ||
    state.scoreShown !== state.score || state.coinsShown !== state.coins ||
    state.overlayT < 1 ||
    (state.statsScreen && state.statsScreen.open && state.statsScreen.t < 1) ||
    (state.rankScreen && state.rankScreen.open && state.rankScreen.t < 1) ||
    (state.settings && state.settings.open && state.settings.t < 1) ||
    (!!state.quickPanel && (state.quickPanel.open ? state.quickPanel.t < 1
      : state.quickPanel.t > 0)) ||
    (!!state.adPrompt && state.adPrompt.t < 1);
}

// Экспоненциальный догон с защёлкиванием: без него значение приближается вечно
// и цикл juice никогда не заканчивается. Тот же приём, что у approach() для счётчиков.
function follow(shown, target, dt, ms, epsilon) {
  if (shown === target) return target;
  const next = shown + (target - shown) * Math.min(1, dt / ms);
  return Math.abs(target - next) < epsilon ? target : next;
}

// Камера: видимый угол догоняет цель, а после отпускания цель едет по инерции.
// Доворот к грани начинается, когда инерция угасла, — им по-прежнему занимается
// snapRotation, здесь только решение о моменте.
function stepCamera(state, dt) {
  const cam = CONFIG.camera;
  const camera = state.camera;
  const spinning = !!(input.spin && input.spin.moved);

  if (!spinning && camera.velocity !== 0) {
    camera.target += camera.velocity * dt;
    // затухание за dt миллисекунд: доля скорости, оставшаяся через миллисекунду,
    // возведённая в степень dt — иначе прыжок часов в тестах остановил бы инерцию
    // не сильнее одного кадра
    camera.velocity *= Math.pow(cam.spinFriction, dt / 1000);
    if (Math.abs(camera.velocity) < cam.spinStopSpeed) {
      camera.velocity = 0;
      camera.rotation = follow(camera.rotation, camera.target, dt, cam.followMs, 1e-4);
      snapRotation(state);
      return;
    }
  }
  camera.rotation = follow(camera.rotation, camera.target, dt, cam.followMs, 1e-4);
}

function stepFx(state, dt) {
  const a = CONFIG.animation;
  stepCamera(state, dt);
  // перетаскиваемая стопка догоняет палец: логика (подсветка, установка) считается
  // по пальцу, отстаёт только картинка
  const drag = state.drag;
  if (drag) {
    drag.shownX = follow(drag.shownX, drag.x, dt, a.dragFollowMs, 0.05);
    drag.shownY = follow(drag.shownY, drag.y, dt, a.dragFollowMs, 0.05);
  }
  state.fx.particles = state.fx.particles.filter(p => (p.age += dt) < a.particleMs);
  state.fx.rings = state.fx.rings.filter(r => (r.age += dt) < a.ringMs);
  state.fx.floats = state.fx.floats.filter(f => (f.age += dt) < a.floatMs);
  if (state.fx.shake && (state.fx.shake.age += dt) >= a.shakeMs) state.fx.shake = null;
  if (state.fx.press && (state.fx.press.age += dt) >= a.pressMs) state.fx.press = null;
  state.scoreShown = approach(state.scoreShown, state.score, dt, a.counterMs);
  state.coinsShown = approach(state.coinsShown, state.coins, dt, a.counterMs);
  if (state.overlayT < 1) state.overlayT = Math.min(1, state.overlayT + dt / a.overlayFadeMs);
  const screen = state.statsScreen;
  if (screen && screen.open && screen.t < 1) {
    screen.t = Math.min(1, screen.t + dt / a.overlayFadeMs);
  }
  const rank = state.rankScreen;
  if (rank && rank.open && rank.t < 1) {
    rank.t = Math.min(1, rank.t + dt / a.overlayFadeMs);
  }
  const settings = state.settings;
  if (settings && settings.open && settings.t < 1) {
    settings.t = Math.min(1, settings.t + dt / a.overlayFadeMs);
  }
  // Быстрая панель ходит в обе стороны: закрытая доезжает до нуля и только
  // тогда исчезает, иначе она пропадала бы скачком.
  const quick = state.quickPanel;
  if (quick) {
    const step = dt / a.quickPanelMs;
    quick.t = quick.open ? Math.min(1, quick.t + step) : Math.max(0, quick.t - step);
    if (!quick.open && quick.t === 0) state.quickPanel = null;
  }
  const prompt = state.adPrompt;
  if (prompt && prompt.t < 1) prompt.t = Math.min(1, prompt.t + dt / a.overlayFadeMs);
}

function startFx(state) {
  if (fxRunning || !fxAlive(state)) return;
  fxRunning = true;
  fxLast = performance.now();
  const tick = (now) => {
    try {
      const dt = Math.max(0, now - fxLast);
      fxLast = now;
      stepFx(state, dt);
      if (!state.isAnimating) render.drawAll(state);
    } catch (e) {
      // цикл juice ввод не держит, но и крутиться после ошибки не должен
      fxRunning = false;
      releaseAfterFailure(state, e);
      return;
    }
    if (fxAlive(state)) {
      requestAnimationFrame(tick);
    } else {
      fxRunning = false;
      requestRender();
    }
  };
  requestAnimationFrame(tick);
}

// Отказ действия: звук и короткая вибрация. Собрано в одном месте, потому что
// поводов отказать четыре (буст недоступен, не хватило монет, неверная цель,
// стопку некуда положить) — по местам отдача разъехалась бы.
function denyFeedback() {
  Audio.deny();
  Haptics.vibrate(CONFIG.haptics.deny);
}

// Осколки и «+N очков» на месте сгоревшего блока. Позиция хранится в мировых
// координатах: поле может повернуться, пока эффект живёт.
// Сила события: 1 — минимальный блок в одиночной волне, дальше растёт от размера
// блока и длины цепочки. Одним числом её берут осколки, кольцо, тряска и вспышка —
// иначе картинка разъезжается: осколков много, а трясёт как от мелочи.
function burnPower(state, burn, combo) {
  const threshold = mergeEngine.thresholdFor(state.score) || 10;
  const bySize = burn.count / threshold;             // 10 из 10 → 1, 25 из 10 → 2.5
  const byCombo = 1 + Math.max(0, (combo || 1) - 1) * 0.35;
  return Math.min(CONFIG.animation.burnPowerMax, bySize * byCombo);
}

function spawnBurnFx(state, burn, combo) {
  const a = CONFIG.animation;
  const power = burnPower(state, burn, combo);
  // Густота осколков идёт от силы события, а не только от цепочки: до Phase 35
  // блок из 10 и из 25 фишек рассыпался одинаково. Потолок обязателен — сотни
  // частиц на кадр кладут телефон.
  const count = Math.min(a.particlesMax, Math.round(a.particlesPerBurn * power));
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + render.noise(i, burn.count);
    const speed = a.particleSpeed * (0.45 + render.noise(i, 7) * 0.75) *
      (0.85 + power * 0.15);
    state.fx.particles.push({
      cell: burn.cell, color: burn.color, age: 0,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - a.particleSpeed * 0.35
    });
  }
  // ударная волна: расходящийся контур цвета сгоревшего блока
  state.fx.rings.push({ cell: burn.cell, color: burn.color, age: 0, power });
  state.fx.floats.push({ cell: burn.cell, text: '+' + burn.points, age: 0 });
  // Тряска — на крупных сгораниях и на длинной цепочке, амплитуда по силе.
  // Прежняя была одна на все случаи, и крупный блок ощущался как минимальный.
  if (burn.count >= a.shakeFromTiles || combo >= 2) {
    const amp = Math.min(a.shakeAmpMax, a.shakeAmp * power);
    // накладывающиеся сгорания не должны гасить друг друга: берём сильнейшее
    if (!state.fx.shake || amp >= state.fx.shake.amp) state.fx.shake = { age: 0, amp };
  }
}

// Стопку убрали бустом — она рассыпается осколками своих же цветов
function spawnScatter(state, cell, tiles) {
  const a = CONFIG.animation;
  tiles.forEach((color, index) => {
    for (let i = 0; i < a.boostScatterPerTile; i++) {
      const seed = index * 7 + i;
      const angle = render.noise(seed, 3) * Math.PI * 2;
      const speed = a.particleSpeed * (0.35 + render.noise(seed, 5) * 0.6);
      state.fx.particles.push({
        cell, color, age: 0,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - a.particleSpeed * 0.3
      });
    }
  });
}

// --- Разрешение цепочки с анимацией ---------------------------------------
// Ввод заблокирован флагом isAnimating; RAF работает только пока летят фишки.

// Принимает ячейку или массив ячеек: буст может задеть больше одной
function runWave(state, start) {
  state.isAnimating = true;
  waveStep(state, mergeEngine.createWave(start));
}

// Один шаг волны: план (со снятием фишек) → анимация полёта → фиксация
function waveStep(state, ctx) {
  if (!ctx.queue.length || ctx.iterations >= CONFIG.merge.maxWaveIterations) {
    finishWave(state);
    return;
  }
  ctx.iterations++;
  const plan = mergeEngine.planWave(state, ctx);
  if (plan.flows.length) {
    animateFlows(state, plan, () => waveCommit(state, plan, ctx));
  } else {
    waveCommit(state, plan, ctx);
  }
}

function waveCommit(state, plan, ctx) {
  const res = mergeEngine.commitWave(state, plan, ctx);
  state.score += res.burnPoints;
  if (res.burnCoins) addCoins(state, res.burnCoins);
  collectRunStats(state, res);      // счётчики партии (Phase 20)
  updateBest(state);
  updateActiveColors(state);
  render.drawAll(state);
  // вспышка на сгоревших ячейках; она же пауза, иначе цепочка мелькает
  if (res.burns.length) {
    res.burns.forEach(burn => spawnBurnFx(state, burn, res.combo));
    Audio.burn(res.burns[0].count);
    // отвечает каждое сгорание, крупное — сильнее. Порог тот же, что у тряски
    // экрана: отдача обязана совпадать с картинкой.
    const h = CONFIG.haptics;
    Haptics.vibrate(res.burns[0].count >= CONFIG.animation.shakeFromTiles
      ? h.burnBig : h.burnSmall);
    // со второго звена цепочки показываем комбо и бонус, который оно принесло
    if (res.combo >= 2) {
      Audio.combo(res.combo);
      Haptics.vibrate(res.combo >= h.comboLongFrom ? h.comboLong : h.combo);
      state.fx.floats.push({
        cell: res.burns[0].cell, age: 0, accent: true,
        text: t('combo') + res.combo + (res.comboCoins ? '  +' + res.comboCoins : '')
      });
    }
    startFx(state);
    state.burnAnim = { burns: res.burns, t: 0 };
    animate(state, CONFIG.animation.burnFlashMs,
      (t) => { state.burnAnim.t = t; },
      () => { state.burnAnim = null; waveStep(state, ctx); });
  } else {
    waveStep(state, ctx);
  }
}

function animateFlows(state, plan, done) {
  // Куда именно ляжет каждая фишка. Считаем до анимации: в одну ячейку может течь
  // сразу несколько соседей, и они не должны целиться в один и тот же слой.
  const filled = new Map();
  plan.flows.forEach(f => {
    const key = hexMath.key(f.to.q, f.to.r);
    f.baseLayer = filled.has(key)
      ? filled.get(key)
      : (f.to.stack ? f.to.stack.tiles.length : 0);
    filled.set(key, f.baseLayer + f.count);
  });
  plan.flows.forEach(f => { f.finalTotal = filled.get(hexMath.key(f.to.q, f.to.r)); });

  // звук ложится на ту же дугу, что и картинка: шаг между щелчками — это задержка
  // между вылетами соседних фишек
  const tiles = plan.flows.reduce((sum, f) => sum + f.count, 0);
  Audio.flow(tiles, CONFIG.animation.flowStepMs / 1000);

  const duration = flowDuration(plan.flows);
  state.anim = { flows: plan.flows, t: 0, duration };
  animate(state, duration,
    (t) => { state.anim.t = t; },
    () => { state.anim = null; done(); });
}

// Сколько длится шаг волны: самая высокая стайка задаёт длительность, потому что
// её фишки вылетают по очереди. Потолок — предохранитель для длинных переливов.
function flowDuration(flows) {
  const a = CONFIG.animation;
  const maxCount = flows.reduce((max, f) => Math.max(max, f.count), 1);
  return Math.min(a.flowMaxMs, a.flowTravelMs + (maxCount - 1) * a.flowStepMs);
}

// Общий цикл анимации: RAF работает только пока идёт эффект.
//
// Цикл помнит, в какой партии он начался, и молча умирает, если она сменилась:
// «Перезапустить» из настроек доступен и во время волны, а незавершённый шаг
// после рестарта дошёл бы до waveCommit со ссылками на ячейки прежней доски.
//
// Исключение внутри цикла разблокирует ввод. Без этого одна ошибка в отрисовке
// оставляла бы isAnimating поднятым навсегда — застывшая картинка, на которую
// игрок не может повлиять, а требования площадки такое относят к зависаниям.
function animate(state, durationMs, onProgress, done) {
  const start = performance.now();
  const generation = state.generation;
  const tick = (now) => {
    if (state.generation !== generation) return;
    let finished = false;
    try {
      const t = Math.min(1, (now - start) / durationMs);
      onProgress(t);
      render.drawAll(state);
      finished = t >= 1;
    } catch (e) {
      releaseAfterFailure(state, e);
      return;
    }
    if (!finished) { requestAnimationFrame(tick); return; }
    // done() ведёт следующий шаг волны и тоже рисует — он под той же защитой
    try {
      done();
    } catch (e) {
      releaseAfterFailure(state, e);
    }
  };
  requestAnimationFrame(tick);
}

// Аварийный выход из цикла: гасим анимации и снимаем блокировку ввода, чтобы
// игрок мог хотя бы начать заново. Сообщение остаётся в консоли — это ошибка,
// а не штатный путь.
function releaseAfterFailure(state, error) {
  if (typeof console !== 'undefined' && console.error) console.error(error);
  state.isAnimating = false;
  state.anim = null;
  state.burnAnim = null;
  state.boostAnim = null;
  state.handAnim = null;
  state.newRing = null;
  state.landing = null;
  return false;
}

function finishWave(state) {
  state.anim = null;
  state.burnAnim = null;
  state.landing = null;
  state.boostAnim = null;
  // поле растёт до проверки проигрыша: иначе партия закончилась бы за миг до того,
  // как счёт открыл новое кольцо
  const grew = growBoardIfNeeded(state);
  // рука опустела полностью → новая раздача (уже с учётом освободившихся ячеек).
  // Новые стопки падают в слоты тем же приёмом, что и у буста «Пересдача»:
  // раньше рука появлялась скачком (бэклог полировки Phase 15).
  if (state.hand.slots.every(s => s === null)) {
    generators.dealHand(state);
    Audio.deal();
    state.handAnim = { old: [null, null, null], t: 0 };
  }
  updateBest(state);
  announceThreshold(state);    // порог сгорания мог вырасти — об этом надо сказать
  checkGameOver(state);
  updateMusicTension(state);   // после checkGameOver: на проигрыше фон успокаивается

  if (grew) {
    // новое кольцо проявляется, ввод до конца анимации заблокирован.
    // Падение руки при этом не анимируем: две анимации разом читаются как каша
    state.handAnim = null;
    Audio.ring();
    animate(state, CONFIG.animation.ringGrowMs,
      (t) => { state.newRing.t = render.ease.outCubic(t); },
      () => { state.newRing = null; state.isAnimating = false; requestRender(); });
  } else if (state.handAnim) {
    animate(state, CONFIG.animation.handSwapMs,
      (t) => { state.handAnim.t = t; },
      () => {
        state.handAnim = null;
        state.isAnimating = false;
        requestRender();
        // рука сменилась целиком — это пауза, в неё и просится реклама (Phase 42.2).
        // Строго после снятия isAnimating: раньше canShowAdNow отсёк бы показ
        maybeAdOnNewHand(state);
      });
  } else {
    state.isAnimating = false;
    requestRender();
  }
}

// Порог сгорания растёт со счётом (Phase 28), и об этом обязательно надо сказать:
// молча изменившееся правило читается как поломка — блок из десяти вдруг не горит,
// и непонятно почему. Сообщение идёт тем же путём, что «+N очков» и «Комбо».
// Возвращает показанный текст (или null): в тестах эффект не поймать — часы там
// прыгают на секунду за кадр, и всплывающая надпись умирает в том же вызове.
function announceThreshold(state) {
  const threshold = mergeEngine.thresholdFor(state.score);
  if (threshold === state.burnThreshold) return null;
  const grew = threshold > state.burnThreshold;
  state.burnThreshold = threshold;
  if (!grew) return null;                     // вниз порог не ходит, но на всякий случай
  const text = t('newThreshold') + threshold;
  const center = state.cells.get(hexMath.key(0, 0));
  if (center) {
    state.fx.floats.push({ cell: center, age: 0, accent: true, text });
    startFx(state);
  }
  Audio.ring();                               // тот же голос, что у нового кольца
  return text;
}

// --- Камера ----------------------------------------------------------------

// Вернуть поле в исходную ориентацию
function resetCamera(state) {
  state.camera.rotation = 0;
  state.camera.target = 0;
  state.camera.velocity = 0;
}

// --- Визуальный стиль (Phase 12/14) ----------------------------------------
// Тема вливает свои цвета в CONFIG.ui и палитру, поэтому остальной render
// не знает, какой стиль включён. Тема сейчас одна и применяется один раз в init;
// функция оставлена, чтобы добавление второго стиля не требовало правок рендера.
function applyTheme(name) {
  if (!THEMES[name]) return false;
  THEME = THEMES[name];
  Object.assign(CONFIG.ui, THEME.ui);
  Object.assign(CONFIG.ui.boostBar, THEME.boostBar);
  Object.assign(CONFIG.tile, THEME.geometry);
  CONFIG.colors.palette = THEME.palette;
  render.backgroundCache = null;             // фон перерисуется в новом стиле
  render.tileCache.clear();                  // и фишки: спрайты запечены со старым
  // Поля вокруг канваса — тоже часть стиля (Phase 41): канвас держит пропорцию,
  // и на широком экране по бокам оставался тёмно-синий фон от прежней темы.
  // Цвет берём из темы, а не из CSS, — иначе второй стиль пришлось бы дублировать.
  if (typeof document !== 'undefined' && document.body) {
    document.body.style.background = CONFIG.ui.bg;
  }
  return true;
}

// --- Вёрстка под высоту экрана (Phase 24) -----------------------------------
// Канвас держит логическую ширину 720, а высоту берёт из формы окна: на телефоне
// 9:19.5 игра прежде шла в полосе посреди экрана, потому что пропорция 720×900
// была прибита в CSS. Базовые числа CONFIG.ui заданы для layout.baseHeight,
// поэтому снимок берётся один раз, а дальше всё считается от него — иначе
// повторный resize складывал бы прирост сам с собой.
let uiBase = null;
function captureUiBase() {
  const ui = CONFIG.ui;
  uiBase = {
    settingsTitleY: ui.settings.titleY,
    settingsRowY: ui.settings.rowY.slice(),
    statsCountersY: ui.stats.countersY,
    rankTitleY: ui.rank.titleY,
    rankRowsY: ui.rank.rowsY,
    rankSignInY: ui.rank.signInY,
    // размеры низа: на высоком экране они растут вместе с высотой, поэтому
    // базовые значения нужно помнить — иначе второй resize умножит их снова
    handHexSize: ui.handHexSize,
    handSlotSpacing: ui.handSlotSpacing,
    boostW: ui.boostBar.w,
    boostH: ui.boostBar.h,
    boostGap: ui.boostBar.gap,
    boostPriceGap: ui.boostBar.priceGap,
    boostPriceSize: ui.boostBar.priceSize
  };
}

// Логическая высота канваса по размеру окна. Без окна (тесты, замер баланса)
// остаётся базовая — существующие проверки не должны поехать.
function canvasHeightFor(winWidth, winHeight) {
  const L = CONFIG.ui.layout;
  if (!winWidth || !winHeight) return L.baseHeight;
  const wanted = Math.round(CONFIG.canvas.width * winHeight / winWidth);
  return Math.max(L.minHeight, Math.min(L.maxHeight, wanted));
}

// Разложить интерфейс по новой высоте. Верх (счёт, рекорд, кошелёк, шестерёнка)
// привязан к верху и не двигается. Низ раскладывается **снизу вверх**, а поле
// забирает весь остаток — оно и есть главное на экране. Экраны-оверлеи считаются
// от центра, поэтому им хватает половины прироста.
//
// Размеры низа при этом **растут вместе с высотой** (Phase 33): рука и кнопки
// бустов заданы в логических единицах от ширины 720, и на узком высоком экране
// кнопка буста получалась около 35 реальных пикселей — пальцем не попасть.
// Множитель зажат потолком: без него на экране 1560 низ съел бы поле.
function uiScaleFor(height) {
  const L = CONFIG.ui.layout;
  return Math.max(1, Math.min(L.maxUiScale, height / L.baseHeight));
}

function layoutUi(height) {
  if (!uiBase) captureUiBase();
  const ui = CONFIG.ui;
  const L = ui.layout;
  const s = uiScaleFor(height);
  CONFIG.canvas.height = height;

  ui.handHexSize = uiBase.handHexSize * s;
  ui.handSlotSpacing = uiBase.handSlotSpacing * s;
  ui.boostBar.w = uiBase.boostW * s;
  ui.boostBar.h = uiBase.boostH * s;
  ui.boostBar.gap = uiBase.boostGap * s;
  ui.boostBar.priceGap = uiBase.boostPriceGap * s;
  ui.boostBar.priceSize = uiBase.boostPriceSize * s;

  // снизу вверх: отступ у края → строка цены → кнопки → рука → подсказка → поле
  ui.boostBar.y = height - (L.padBottom + L.priceRow) * s - ui.boostBar.h;
  ui.handY = ui.boostBar.y - L.gapHandBoost * s - ui.handHexSize;
  ui.hintY = ui.handY - ui.handHexSize - L.gapHintHand * s;
  ui.boardArea.bottom = ui.hintY - L.gapBoardHint * s;

  ui.settings.titleY = uiBase.settingsTitleY + (height - L.baseHeight) / 2;
  ui.settings.rowY = uiBase.settingsRowY.map(y => y + (height - L.baseHeight) / 2);
  // Экран статистики считается от блока счётчиков, а кнопка «Назад» — от центра
  // канваса. Без этого сдвига на высоком экране между ними открывается пустая
  // полоса, а рекорд отрывается от заголовка (требования 1.10.1 и 1.10.3).
  ui.stats.countersY = uiBase.statsCountersY + (height - L.baseHeight) / 2;
  // Экран лидерборда едет тем же полушагом, что и статистика: список считается
  // сверху, а «Назад» — от центра канваса, и без сдвига они разъезжаются.
  const rankShift = (height - L.baseHeight) / 2;
  ui.rank.titleY = uiBase.rankTitleY + rankShift;
  ui.rank.rowsY = uiBase.rankRowsY + rankShift;
  ui.rank.signInY = uiBase.rankSignInY + rankShift;
}

// Подогнать канвас под окно. Возвращает true, если что-то изменилось.
function applyCanvasSize(canvas, state) {
  const hasWindow = typeof window !== 'undefined';
  const height = canvasHeightFor(hasWindow ? window.innerWidth : 0,
    hasWindow ? window.innerHeight : 0);
  if (height === CONFIG.canvas.height && canvas.height === height) return false;
  layoutUi(height);
  canvas.width = CONFIG.canvas.width;
  canvas.height = height;
  render.backgroundCache = null;      // фон рисуется во весь канвас
  render.tileCache.clear();           // размер гекса сейчас сменится
  if (state && state.cells) {
    hexMath.fitLayout(state.radius);
    hexMath.expandCells(state.cells, state.radius);   // пересчёт пикселей ячеек
  }
  requestRender();
  return true;
}

// Ближайший угол, кратный шагу примагничивания (60° — симметрия гекса,
// при таком повороте сетка совпадает сама с собой)
function nearestSnapAngle(rotation) {
  const step = CONFIG.camera.snapStepDeg * Math.PI / 180;
  return Math.round(rotation / step) * step;
}

// Доворот поля до ближайшей грани после жеста вращения
// Палец отпущен. Взмах остаётся жить инерцией — она докрутит поле и сама вызовет
// доворот, когда угаснет (stepCamera). Медленное движение доворачиваем сразу:
// ждать нечего, а лишний кадр задержки читался бы как залипание.
function releaseSpin(state) {
  if (Math.abs(state.camera.velocity) > CONFIG.camera.spinStopSpeed) {
    startFx(state);
    return;
  }
  state.camera.velocity = 0;
  snapRotation(state);
}

// Доворот до ближайшей грани. Своей анимации у него больше нет (Phase 34): угол
// и так каждый кадр догоняет camera.target в stepCamera, поэтому доворот — это
// просто новая цель. Два цикла, тянущие один угол, спорили бы друг с другом.
function snapRotation(state) {
  const to = nearestSnapAngle(state.camera.target);
  const wasOff = Math.abs(to - state.camera.rotation) > 1e-6;
  state.camera.target = to;
  state.camera.velocity = 0;
  if (!wasOff) {
    state.camera.rotation = to;
    requestRender();
    return;
  }
  Audio.snap();
  startFx(state);
}

// Радиус поля, положенный текущему счёту
function radiusForScore(score) {
  let radius = CONFIG.board.radiusSteps[0].radius;
  CONFIG.board.radiusSteps.forEach(step => {
    if (score >= step.fromScore) radius = step.radius;
  });
  return radius;
}

// Дорастить поле, если счёт открыл новое кольцо. Возвращает true, если выросло.
function growBoardIfNeeded(state) {
  const target = radiusForScore(state.score);
  if (target <= state.radius) return false;

  const before = new Set(state.cells.keys());
  state.radius = target;
  hexMath.fitLayout(target);
  hexMath.expandCells(state.cells, target);
  resetCamera(state);        // иначе новое кольцо окажется за кадром
  // ключи новых ячеек — для анимации появления
  const fresh = [];
  state.cells.forEach((cell, key) => { if (!before.has(key)) fresh.push(key); });
  state.newRing = { keys: new Set(fresh), t: 0 };
  return true;
}

// Кривая сложности: набор цветов расширяется вместе с полем — каждое новое кольцо
// приносит +3 цвета (4 -> 7 -> 10). Больше цветов — реже случайные совпадения.
function updateActiveColors(state) {
  let colors = CONFIG.board.radiusSteps[0].colors;
  CONFIG.board.radiusSteps.forEach(step => {
    if (state.score >= step.fromScore) colors = step.colors;
  });
  state.activeColors = Math.min(colors, CONFIG.colors.palette.length);
}

// Рекорд — переживает и партию, и перезагрузку страницы. Пишем сразу: запись
// отложена внутри Storage, поэтому частые вызовы ничего не стоят.
function updateBest(state) {
  if (state.score <= state.best) return;
  // Момент побития рекорда — единственная мета-прогрессия в игре, и раньше игрок
  // узнавал о нём только в конце партии (Phase 20). Вспышка показывается один раз:
  // дальше рекорд растёт с каждым сгоранием, и она мигала бы без остановки.
  const first = !state.recordBeaten && state.best > 0;
  state.best = state.score;
  Storage.put({ best: state.best });
  if (!first) return false;
  state.recordBeaten = true;
  const center = state.cells.get(hexMath.key(0, 0));
  if (center) {
    state.fx.floats.push({ cell: center, age: 0, accent: true, text: t('recordBeaten') });
    startFx(state);
  }
  Audio.ring();
  return true;
}

// Кошелёк тоже переживает партию: монеты копятся между партиями (ADR-0004)
function addCoins(state, amount) {
  state.coins += amount;
  Storage.put({ coins: state.coins });
  startFx(state);                        // число в кошельке доедет до нового
}

// Плата за буст — тем же путём, что и начисление
function spendCoins(state, amount) {
  state.coins = Math.max(0, state.coins - amount);
  Storage.put({ coins: state.coins });
  startFx(state);
}

// Насколько тревожно звучит фон. Считаем здесь, а не в Audio: это игровое
// правило, а секция звука знает только число 0…1.
//
// Меряем тесноту, а не счёт. Счёт врал бы: он только растёт, и после крупного
// сгорания музыка продолжала бы нагнетать над пустым полем. Свободные ячейки
// падают и растут вместе с реальным положением дел.
function updateMusicTension(state) {
  const m = CONFIG.audio.music;
  if (state.isGameOver) return Audio.setTension(0);   // партия кончилась, нагнетать незачем
  const free = generators.freeCells(state).length;
  if (free >= m.roomyFrom) return Audio.setTension(0);
  if (free <= m.tightAt) return Audio.setTension(1);
  return Audio.setTension((m.roomyFrom - free) / (m.roomyFrom - m.tightAt));
}

// Проигрыш: на поле нет свободных ячеек, а в руке ещё есть стопки
// Счётчики партии копятся по ходу волны, а в счётчики сессии уходят один раз —
// в конце партии (Phase 20).
function collectRunStats(state, res) {
  const run = state.runStats;
  run.burns += res.burns.length;
  run.coins += res.burnCoins;
  res.burns.forEach(burn => {
    if (burn.count > run.biggestBlock) run.biggestBlock = burn.count;
  });
  if (res.combo > run.longestCombo) run.longestCombo = res.combo;
}

// Пустые счётчики: с них начинается новое сохранение
function emptyStats() {
  return { games: 0, burns: 0, biggestBlock: 0, longestCombo: 0, coins: 0, best: [] };
}

// Итог партии добавляется к сохранённым счётчикам: топ лучших забегов плюс общие
// суммы. Список режется по CONFIG.ui.stats.topRuns — на экран больше и не влезет.
function saveRunStats(state) {
  // умолчание здесь, а не только в init: хранилище могло не отдать ничего
  const stats = Storage.data.stats || emptyStats();
  const run = state.runStats;
  stats.games++;
  stats.burns += run.burns;
  stats.coins += run.coins;
  if (run.biggestBlock > stats.biggestBlock) stats.biggestBlock = run.biggestBlock;
  if (run.longestCombo > stats.longestCombo) stats.longestCombo = run.longestCombo;
  stats.best = (stats.best || []).concat([{ score: state.score, coins: run.coins }])
    .sort((a, b) => b.score - a.score)
    .slice(0, CONFIG.ui.stats.topRuns);
  Storage.put({ stats });
  return stats;
}

function checkGameOver(state) {
  if (generators.freeCells(state).length > 0) return;
  if (state.hand.slots.every(s => s === null)) return;
  state.isGameOver = true;
  state.overlayT = 0;                     // оверлей проявляется, а не выпрыгивает
  const stats = saveRunStats(state);      // итог партии в статистику (Phase 20)
  Storage.flush();                        // конец партии — момент записать наверняка
  // признак рекорда считается так же, как в оверлее: updateBest уже отработал
  const isRecord = state.score >= state.best && state.score > 0;
  // Оценку просим в лучший момент партии, а не в первый попавшийся (п. 2.13):
  // сразу после личного рекорда и не раньше, чем игрок разобрался в игре.
  // Дальше решает площадка — своего окна у нас нет.
  if (isRecord && stats.games >= CONFIG.ads.reviewMinGames) Platform.askReview();
  // Рекорд — в таблицу (Phase 43). Только рекорд: таблица хранит лучший
  // результат, а у setScore лимит в один запрос в секунду.
  if (isRecord) Platform.submitScore(state.best);
  Audio.over(isRecord);
  Haptics.vibrate(CONFIG.haptics.over);
  syncGameplay(state);                    // геймплей кончился — площадке сообщаем
  startFx(state);
}

// --- Возрождение (Phase 37) -------------------------------------------------
// Цена растёт с каждым возрождением за партию: при переходящем кошельке ровная
// цена делала бы партию бесконечной. Дальше последней ступени цена не растёт.
function reviveCost(state) {
  const costs = CONFIG.revive.costs;
  return costs[Math.min(state.revivesUsed, costs.length - 1)];
}

function canRevive(state) {
  return state.isGameOver && state.coins >= reviveCost(state);
}

// Убирает половину стопок, начиная с самых высоких: они мешают больше всего, а
// случайный выбор давал бы «повезло / не повезло» на ровном месте. Счёт, кольца,
// кошелёк и рекорд остаются — партия продолжается, а не начинается заново.
function revive(state) {
  if (!canRevive(state)) { denyFeedback(); return false; }
  spendCoins(state, reviveCost(state));
  state.revivesUsed++;

  const occupied = [];
  state.cells.forEach(cell => { if (cell.stack) occupied.push(cell); });
  occupied.sort((a, b) => b.stack.tiles.length - a.stack.tiles.length);
  const clearCount = Math.ceil(occupied.length * CONFIG.revive.clearShare);
  occupied.slice(0, clearCount).forEach(cell => {
    const tiles = cell.stack.tiles.slice();
    cell.stack = null;
    spawnScatter(state, cell, tiles);     // тот же разлёт, что у буста «Убрать»
  });

  state.isGameOver = false;
  state.overlayT = 1;
  state.statsScreen = null;
  state.rankScreen = null;
  generators.dealHand(state);             // рука могла остаться неполной
  Audio.deal();
  updateMusicTension(state);
  syncGameplay(state);        // партия продолжается — геймплей снова идёт
  startFx(state);
  requestRender();
  // Падение руки в слоты — тем же приёмом, что у «Пересдачи» и у новой раздачи в
  // finishWave, и обязательно с animate: handAnim без своего цикла остаётся с
  // t = 0, а при живом handAnim рука рисуется его прозрачностью — то есть не
  // рисуется вовсе. Цикл juice эту анимацию не ведёт, он про осколки.
  state.isAnimating = true;
  state.handAnim = { old: [null, null, null], t: 0 };
  animate(state, CONFIG.animation.handSwapMs,
    (t) => { state.handAnim.t = t; },
    () => {
      state.handAnim = null;
      state.isAnimating = false;
      requestRender();
    });
  return true;
}

// Экран статистики (Phase 20). Счётчики берутся ссылкой на объект сессии: он
// меняется только в конце партии, а экран поверх оверлея её и показывает.
function openStats(state) {
  state.statsScreen = { open: true, values: Storage.data.stats, t: 0 };
  syncGameplay(state);
  startFx(state);             // экран проявляется, а не выпрыгивает
  requestRender();
}

// --- Лидерборд и лига (Phase 43) --------------------------------------------
// Дивизион по личному рекорду: он считается офлайн и работает везде, поэтому
// плашке всегда есть что показать, даже когда таблицы нет.
function leagueTier(best) {
  const tiers = CONFIG.league.tiers;
  let tier = tiers[0];
  tiers.forEach(step => { if (best >= step.fromBest) tier = step; });
  return tier;
}

// Что написано на плашке: место в таблице, если площадка его дала, иначе
// дивизион. Место кэшируется в state.rank — плашка рисуется каждый кадр, а
// спрашивать площадку каждый кадр нельзя.
function leagueLabel(state) {
  if (state.rank) return t('leagueRank') + state.rank;
  return t(leagueTier(state.best).key);
}

// Экран открывается сразу, а таблица приезжает в него потом: ждать сеть игра не
// должна нигде, это то же правило, что и у облака сохранений (Phase 40).
function openRank(state) {
  // Демо считается «вошедшим»: приглашению войти отведено то же место, что и
  // строкам, и вместе они наложились бы друг на друга
  state.rankScreen = { open: true, t: 0, status: 'loading', entries: [],
                       authorized: Platform.isAuthorized() || Platform.demoActive() };
  syncGameplay(state);
  startFx(state);
  requestRender();
  Platform.fetchTop((data) => receiveRank(state, data));
  return state.rankScreen;
}

function receiveRank(state, data) {
  const screen = state.rankScreen;
  if (!screen) return false;
  screen.status = data ? 'ready' : 'unavailable';
  screen.entries = (data && data.entries) || [];
  screen.authorized = Platform.isAuthorized() || Platform.demoActive();
  if (data && data.userRank) state.rank = data.userRank;
  requestRender();
  return true;
}

// Вход по кнопке «Войти» — единственное место, где открывается окно авторизации.
// После входа таблицу перезапрашиваем: в ней появилась своя строка.
function signIn(state) {
  Platform.openAuth((ok) => {
    if (state.rankScreen) {
      state.rankScreen.authorized = ok;
      state.rankScreen.status = 'loading';
    }
    if (ok) Platform.fetchTop((data) => receiveRank(state, data));
    else requestRender();
  });
  return true;
}

// --- Ролик за буст (Phase 42) ----------------------------------------------
// Награда за рекламу по требованию 4.5.2 — дополнительный бонус, который не
// влияет на возможность продолжить игру. Поэтому ролик даёт бесплатное
// применение буста, а не монеты: монеты тратятся ещё и на «Возрождение», и
// цепочка «посмотрел ролик — продолжил проигранную партию» была бы нарушением.

// Предлагать ли ролик вместо отказа. Без площадки предложения нет вовсе:
// диалог, за которым ничего не стоит, хуже честного «не хватило монет».
function canOfferAd(state, kind) {
  if (!Platform.hasSdk()) return false;
  if (state.isGameOver || state.isAnimating || state.adPrompt) return false;
