    const cycle = Math.floor(loopBar / m.varyBars);
    if (part.every && loopBar % part.every !== 0) return false;

    if (part.kind === 'chord') {          // пад: весь аккорд разом, только с такта
      if (beat !== 0) return false;
      chord.forEach((semitones, i) => {
        Audio.musicNote(part, semitones, part.octave, part.level, part.attack,
          part.decay, at, out, step + i * 13, part.drop, part.filterOpen);
      });
      return true;
    }
    if (part.kind === 'root') {           // бас: корень аккорда по своему рисунку
      if (part.steps[cycle % part.steps.length].indexOf(beat) === -1) return false;
      Audio.musicNote(part, chord[0], part.octave, part.level, part.attack,
        part.decay, at, out, step, part.drop);
      return true;
    }
    if (part.kind === 'drum') {           // удар: своя частота, гармония ему не указ
      if (part.steps[cycle % part.steps.length].indexOf(beat) === -1) return false;
      Audio.musicVoice(part.type, part.freq, part.drop, part.level, part.attack,
        part.decay, at, out, 0, part.filterOpen);
      return true;
    }
    if (part.kind === 'motif') {          // мелодия: ступени текущего аккорда
      const motif = m.motifs[part.motifs[cycle % part.motifs.length]];
      const hits = motif.filter(note => note.at === beat);
      hits.forEach(note => {
        Audio.musicNote(part, chord[note.deg % chord.length], part.octave, part.level,
          part.attack, part.decay, at, out, step + note.deg);
      });
      return hits.length > 0;
    }
    // шум: перкуссия и фактура. tensionSteps — вся адаптивность, которая
    // осталась: на тесном поле шейкер получает пару лишних позиций, и только.
    let steps = part.steps[cycle % part.steps.length];
    if (part.tensionSteps && Audio.music.tension >= 0.5) {
      steps = steps.concat(part.tensionSteps);
    }
    if (steps.indexOf(beat) === -1) return false;
    Audio.musicRustle(part, at, out);
    return true;
  },

  // Нота-деревяшка: щипок с падающим питчем плюс нецелый обертон. Именно
  // нецелая доля (2.76 — обертон свободного бруска) отличает удар по дереву
  // от синтезатора: у струны обертоны кратные, у бруска нет.
  musicNote(cfg, semitones, octave, peak, attack, decay, at, out, seed, dropOverride, filterOpen) {
    const m = CONFIG.audio.music;
    const drop = dropOverride || cfg.drop;
    const freq = m.tuning * Math.pow(2, octave + semitones / 12);
    // Живой инструмент каждый раз чуть другой: ровные по громкости и всегда
    // центральные ноты и создают ощущение дешёвой машины. Шум детерминированный
    // (тот же render.noise, что и у бумажной фактуры) — партия остаётся повторяемой.
    const key = seed || 0;
    const level = peak * (1 - m.velocityVary * render.noise(key, 17));
    const pan = (render.noise(key, 29) - 0.5) * 2 * m.panSpread;
    Audio.musicVoice(cfg.type, freq, drop, level, attack, decay, at, out, pan, filterOpen);
    if (cfg.overtone) {
      Audio.musicVoice('sine', freq * cfg.overtoneRatio, drop, level * cfg.overtone,
        attack, decay * cfg.overtoneDecay, at, out, pan * 0.6, filterOpen);
    }
  },

  // Голос музыки: пара расстроенных осцилляторов через фильтр, конверт и панораму.
  // Пара — против «дёшево»: один осциллятор всегда звучит тонко и стерильно,
  // а расстройка в несколько центов даёт биения, которые ухо слышит как объём.
  musicVoice(type, freq, drop, peak, attack, decay, at, out, pan, filterOpen) {
    const ctx = Audio.ctx;
    const m = CONFIG.audio.music;
    const filter = ctx.createBiquadFilter();
    const env = ctx.createGain();
    const panner = ctx.createStereoPanner();

    // Фильтр закрывается вместе с нотой: дерево тускнеет, а не звенит ровно до
    // конца. На тесном поле открыт чуть шире — на грани заметного, без драмы.
    // Пад передаёт свой filterOpen: ему нужен заваленный верх, иначе он вылезет
    // на первый план, а бриф отводит ему роль воздуха под инструментами.
    filter.type = 'lowpass';
    filter.Q.value = m.filterQ;
    filter.frequency.setValueAtTime(
      freq * (filterOpen || m.filterOpen) * (1 + Audio.music.tension * m.filterTension), at);
    filter.frequency.exponentialRampToValueAtTime(freq * m.filterClose, at + decay);

    panner.pan.value = pan;
    // экспонентой до нуля нельзя, гасим до тысячной доли
    env.gain.setValueAtTime(peak * 0.001, at);
    env.gain.exponentialRampToValueAtTime(peak, at + attack);
    env.gain.exponentialRampToValueAtTime(peak * 0.001, at + decay);

    filter.connect(env);
    env.connect(panner);
    panner.connect(out);

    for (let i = 0; i < 2; i++) {
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.detune.value = i ? m.detuneCents : -m.detuneCents;
      osc.frequency.setValueAtTime(freq, at);
      osc.frequency.exponentialRampToValueAtTime(freq * drop, at + decay);
      osc.connect(filter);
      osc.start(at);
      osc.stop(at + decay);
    }
  },

  // Бумажный слой музыки — тот же приём, что и у эффектов: полоса шума, не тон.
  // Им же сделаны хэт и малый барабан: у них те же поля, только числа другие.
  musicRustle(spec, at, out) {
    const ctx = Audio.ctx;
    const src = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const env = ctx.createGain();
    src.buffer = Audio.noise;
    filter.type = 'bandpass';
    filter.Q.value = spec.q;
    filter.frequency.setValueAtTime(spec.band * 1.5, at);
    filter.frequency.exponentialRampToValueAtTime(spec.band, at + spec.decay);
    env.gain.setValueAtTime(spec.gain * 0.001, at);
    env.gain.exponentialRampToValueAtTime(spec.gain, at + spec.attack);
    env.gain.exponentialRampToValueAtTime(spec.gain * 0.001, at + spec.decay);
    src.connect(filter);
    filter.connect(env);
    env.connect(out);
    src.start(at);
    src.stop(at + spec.decay);
  },

  // Натяжение 0…1: 0 — спокойный слой, 1 — динамичный. Что именно считать
  // тревогой, решает игра (updateMusicTension), здесь только число.
  // Натяжение 0…1. Слоями оно больше не переключает: бриф запрещает музыке
  // требовать внимания, поэтому теснота поля лишь чуть уплотняет перкуссию
  // (tensionSteps) и чуть приоткрывает фильтр. Что считать тревогой, по-прежнему
  // решает updateMusicTension в main.
  setTension(value) {
    Audio.music.tension = Math.max(0, Math.min(1, value));
    return Audio.music.out !== null;
  }
};

// ============================================================================
// hexMath — axial-математика flat-top гексов (главный техриск, см. спеку §19)
// ============================================================================
const hexMath = {
  // Текущая геометрия поля: размер гекса и центр. Пересчитывается при росте поля.
  layout: { size: CONFIG.hex.maxSize, centerX: 360, centerY: 350, radius: 2 },

  // Вписать поле радиуса R в отведённый коридор: по ширине нужно size*(3R+2),
  // по высоте size*√3*(2R+1). Берём меньшее, но не больше hex.maxSize.
  //
  // Рабочая зона — не весь коридор: сверху вычитается maxRise (высокие стопки растут
  // вверх от ячейки), снизу bottomPad. Поле **центрируется** в этой зоне, а не
  // прижимается к её верху: на высоком экране остаток высоты иначе весь собирался
  // под полем одной пустой полосой.
  fitLayout(radius) {
    const area = CONFIG.ui.boardArea;
    const availWidth = CONFIG.canvas.width - area.sideMargin * 2;
    const zoneTop = area.top + CONFIG.tile.maxRise;
    const zoneBottom = area.bottom - area.bottomPad;
    const size = Math.min(
      CONFIG.hex.maxSize,
      availWidth / (3 * radius + 2),
      (zoneBottom - zoneTop) / (Math.sqrt(3) * (2 * radius + 1))
    );
    // размер гекса сменился — спрайты прежнего размера больше не понадобятся
    if (Math.abs(size - hexMath.layout.size) > 0.01 && render.tileCache) {
      render.tileCache.clear();
    }
    hexMath.layout = {
      size,
      centerX: CONFIG.canvas.width / 2,
      centerY: (zoneTop + zoneBottom) / 2,
      radius
    };
    return hexMath.layout;
  },

  // Ключ ячейки для Map
  key(q, r) {
    return q + ',' + r;
  },

  // Центр ячейки в пикселях. flat-top: x = size*3/2*q, y = size*sqrt(3)*(r + q/2)
  axialToPixel(q, r) {
    const L = hexMath.layout;
    return {
      x: L.centerX + L.size * 1.5 * q,
      y: L.centerY + L.size * Math.sqrt(3) * (r + q / 2)
    };
  },

  // Обратное преобразование: пиксель → ячейка (нужно для перетаскивания, Phase 2)
  pixelToAxial(x, y) {
    const s = hexMath.layout.size;
    const px = x - hexMath.layout.centerX;
    const py = y - hexMath.layout.centerY;
    const qf = (2 / 3) * px / s;
    const rf = (-1 / 3) * px / s + (Math.sqrt(3) / 3) * py / s;
    return hexMath.cubeRound(qf, rf);
  },

  // Округление дробных axial-координат через куб-координаты (иначе на границах врёт)
  cubeRound(qf, rf) {
    const sf = -qf - rf;
    let q = Math.round(qf);
    let r = Math.round(rf);
    let s = Math.round(sf);
    const dq = Math.abs(q - qf);
    const dr = Math.abs(r - rf);
    const ds = Math.abs(s - sf);
    if (dq > dr && dq > ds) {
      q = -r - s;
    } else if (dr > ds) {
      r = -q - s;
    }
    return { q, r };
  },

  // Ячейки поля радиуса R: 3R²+3R+1 штук, условие max(|q|, |r|, |q+r|) <= R
  generateCells(radius) {
    return hexMath.expandCells(new Map(), radius);
  },

  // Дорастить поле до нужного радиуса: существующие ячейки (и их стопки) остаются,
  // недостающие добавляются пустыми. Пиксели пересчитываются у всех — размер гекса
  // после роста меняется.
  expandCells(cells, radius) {
    for (let q = -radius; q <= radius; q++) {
      for (let r = -radius; r <= radius; r++) {
        if (Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)) > radius) continue;
        const key = hexMath.key(q, r);
        if (!cells.has(key)) cells.set(key, { q, r, stack: null, pixelX: 0, pixelY: 0 });
      }
    }
    cells.forEach(cell => {
      const p = hexMath.axialToPixel(cell.q, cell.r);
      cell.pixelX = p.x;
      cell.pixelY = p.y;
    });
    return cells;
  },

  // 6 соседей flat-top гекса (диагоналей у гексов нет)
  NEIGHBOR_OFFSETS: [
    { q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 },
    { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 }
  ],
  neighbors(q, r) {
    return hexMath.NEIGHBOR_OFFSETS.map(o => ({ q: q + o.q, r: r + o.r }));
  },

  // Вершины flat-top гекса: углы 0°, 60°, ... 300°
  hexCorners(cx, cy, size) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i);
      pts.push({ x: cx + size * Math.cos(a), y: cy + size * Math.sin(a) });
    }
    return pts;
  }
};

// ============================================================================
// generators — генерация стопок (mono/duo/tri по весам), стартовое заполнение
// ============================================================================
const generators = {
  // Источник случайности. По умолчанию Math.random; QA может зафиксировать seed
  // (ADR-0002) — тогда партия воспроизводится ход в ход.
  rng: {
    next: Math.random,
    seed(value) {
      let s = value >>> 0;
      this.next = () => {                       // mulberry32 — короткий детерминированный PRNG
        s = (s + 0x6D2B79F5) | 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
  },

  randInt(min, max) {
    return min + Math.floor(generators.rng.next() * (max - min + 1));
  },

  // Случайный цвет из активного набора
  randomColor(activeColors) {
    return generators.randInt(0, activeColors - 1);
  },

  // Текущая ступень сложности стопок по счёту (последняя подходящая)
  stageFor(score) {
    const stages = CONFIG.stack.stages;
    let current = stages[0];
    stages.forEach(stage => { if (score >= stage.fromScore) current = stage; });
    return current;
  },

  // Тип стопки по весам ступени. Перебор идёт по blocksByType, а не по трём
  // именам вручную: новый тип — это строчка в CONFIG, а не правка логики.
  pickStackType(weights) {
    const types = Object.keys(CONFIG.stack.blocksByType);
    const total = types.reduce((sum, type) => sum + (weights[type] || 0), 0);
    let roll = generators.rng.next() * total;
    for (let i = 0; i < types.length; i++) {
      roll -= weights[types[i]] || 0;
      if (roll < 0) return types[i];
    }
    return types[0];
  },

  // Стопка = массив цветов снизу вверх. Многоблочные типы собираются
  // из блоков не меньше minBlockSize, соседние блоки разного цвета.
  // Веса типов и диапазон высоты берутся из ступени по текущему счёту.
  makeStack(activeColors, score, forcedTopColor, stageOverride) {
    const stage = stageOverride || generators.stageFor(score || 0);
    const type = generators.pickStackType(stage.weights);
    const blocks = CONFIG.stack.blocksByType[type];
    const minBlock = CONFIG.stack.minBlockSize;
    // Высота подбирается под тип: на N блоков нужно минимум N * minBlockSize фишек,
    // иначе выпавший duo/tri молча превращался бы в стопку попроще
    const needed = blocks * minBlock;
    const minH = Math.max(stage.minHeight, needed);
    const maxH = Math.max(stage.maxHeight, needed);
    const height = generators.randInt(minH, maxH);

    // Размеры блоков: каждому по минимуму, остаток раздаётся случайным блокам.
    // Раньше весь остаток доставался верхнему блоку — и многоблочная стопка
    // приходила с крупной «шапкой» одного цвета, то есть почти не усложняла игру
    // (Phase 28: верхний блок держался на 2.9 фишки при любом составе).
    const sizes = new Array(blocks).fill(minBlock);
    for (let extra = height - blocks * minBlock; extra > 0; extra--) {
      sizes[generators.randInt(0, blocks - 1)]++;
    }

    const tiles = [];
    const usedColors = new Set();       // цвет не повторяется во всей стопке, а не
    for (let b = 0; b < blocks; b++) {  // только в соседних блоках (правило пользователя)
      const size = sizes[b];
      let color = generators.randomColor(activeColors);
      let guard = 0;
      while (usedColors.has(color) && usedColors.size < activeColors && guard++ < 50) {
        color = generators.randomColor(activeColors);
      }
      usedColors.add(color);
      for (let i = 0; i < size; i++) tiles.push(color);
    }
    // Милосердный генератор навязывает цвет верхнего блока
    if (forcedTopColor !== undefined && forcedTopColor !== null) {
      const top = tiles[tiles.length - 1];
      for (let i = tiles.length - 1; i >= 0 && tiles[i] === top; i--) {
        tiles[i] = forcedTopColor;
      }
    }
    return { tiles, cell: null };
  },

  // Стартовое заполнение: round(19 * 0.30) = 6 случайных ячеек
  fillStartBoard(state) {
    const keys = Array.from(state.cells.keys());
    const count = Math.round(keys.length * CONFIG.board.startFillPercent);
    // перемешивание Фишера—Йетса, чтобы выбрать ячейки без повторов
    for (let i = keys.length - 1; i > 0; i--) {
      const j = generators.randInt(0, i);
      const t = keys[i]; keys[i] = keys[j]; keys[j] = t;
    }
    for (let i = 0; i < count; i++) {
      const cell = state.cells.get(keys[i]);
      // стартовое поле всегда простое — своя ступень, только одноцветные стопки
      const stack = generators.makeStack(state.activeColors, 0,
        generators.startColorFor(state, cell), CONFIG.stack.startBoard);
      stack.cell = { q: cell.q, r: cell.r };
      cell.stack = stack;
    }
  },

  // Цвет стартовой стопки: любой, которого нет у соседей (Phase 42.1, по playtest).
  // Раньше раскладка ставила цвета вслепую, и рядом оказывались две одноцветные
  // стопки — они стоят и ничего не делают, потому что волну запускает только ход
  // игрока, а выглядит это как сломанная игра.
  //
  // Правило действует только на стартовую раскладку: в ходе партии одноцветные
  // соседи появляются после сгораний, и это уже правило игры, а не дефект.
  startColorFor(state, cell) {
    const taken = new Set();
    hexMath.neighbors(cell.q, cell.r).forEach(n => {
      const near = state.cells.get(hexMath.key(n.q, n.r));
      if (near && near.stack) taken.add(near.stack.tiles[near.stack.tiles.length - 1]);
    });
    const free = [];
    for (let color = 0; color < state.activeColors; color++) {
      if (!taken.has(color)) free.push(color);
    }
    // свободных цветов не осталось — ставим любой: цикл важнее правила
    if (!free.length) return undefined;
    return free[generators.randInt(0, free.length - 1)];
  },

  // Свободные ячейки поля
  freeCells(state) {
    const free = [];
    state.cells.forEach(cell => { if (!cell.stack) free.push(cell); });
    return free;
  },

  // Цвета, лежащие наверху стопок поля. По ним решается и спасение (дать такой
  // цвет), и давление (дать какой угодно, кроме них).
  topColorsOnBoard(state) {
    const tops = [];
    state.cells.forEach(cell => {
      if (cell.stack) tops.push(cell.stack.tiles[cell.stack.tiles.length - 1]);
    });
    return tops;
  },

  // Цвет, которым в текущей позиции можно собрать больше всего фишек: для каждой
  // свободной ячейки складываются верхние блоки соседей одного цвета, берётся
  // лучшая пара «ячейка + цвет».
  //
  // Просто «цвет, который лежит наверху» для выручки не годится, и это показал
  // замер: игрок проигрывает от нехватки МЕСТА, а не цвета — стопку и так можно
  // поставить в любую свободную ячейку. Спасает только сгорание, поэтому выручка
  // обязана давать цвет, которым сгорание реально собирается (ADR-0008).
  bestMergeColor(state) {
    let best = null;
    generators.freeCells(state).forEach(cell => {
      const sums = new Map();
      hexMath.neighbors(cell.q, cell.r).forEach(n => {
        const nb = state.cells.get(hexMath.key(n.q, n.r));
        if (!nb || !nb.stack) return;
        const run = mergeEngine.topRun(nb.stack);
        sums.set(run.color, (sums.get(run.color) || 0) + run.length);
      });
      sums.forEach((sum, color) => {
        if (!best || sum > best.sum) best = { color, sum };
      });
    });
    return best;
  },

  // Активный цвет, которого нет ни на одной вершине. undefined, если такого нет:
  // давить нечем, и раздача идёт обычная — насильно портить игру не нужно.
  absentTopColor(state) {
    const busy = new Set(generators.topColorsOnBoard(state));
    const free = [];
    for (let color = 0; color < state.activeColors; color++) {
      if (!busy.has(color)) free.push(color);
    }
    if (!free.length) return undefined;
    return free[generators.randInt(0, free.length - 1)];
  },

  // Нужна ли раздаче помощь или, наоборот, давление (ADR-0008). Решение вынесено
  // из dealHand отдельно, потому что его же меряет tools/balance.js.
  dramaFor(state) {
    const drama = CONFIG.drama;
    const free = generators.freeCells(state).length;
    const canRescue = state.score < drama.rescueUntilScore &&
      state.rescuesUsed < drama.maxRescuesPerGame &&
      !state.rescuedLastDeal;               // два раза подряд — уже поддавки
    if (canRescue && free <= drama.rescueFreeCells) {
      const best = generators.bestMergeColor(state);
      if (best) return { kind: 'rescue', color: best.color, slots: drama.rescueSlots };
    }
    if (state.score >= drama.pressureFromScore &&
        generators.rng.next() < drama.pressureChance) {
      const color = generators.absentTopColor(state);
      if (color !== undefined) return { kind: 'pressure', color, slots: drama.pressureSlots };
    }
    return { kind: 'plain', slots: 0 };
  },

  // Новая раздача из 3 стопок. Сколько из них подчиняется драма-менеджеру, решает
  // он сам (rescueSlots / pressureSlots): хотя бы одна стопка всегда остаётся
  // честным случаем, иначе рука перестала бы быть выбором.
  dealHand(state) {
    const drama = generators.dramaFor(state);
    if (drama.kind === 'rescue') {
      state.rescuesUsed++;
      state.rescuedLastDeal = true;
    } else {
      state.rescuedLastDeal = false;
    }
    const forcedSlots = Math.min(2, drama.slots || 0);
    for (let i = 0; i < 3; i++) {
      state.hand.slots[i] = generators.makeStack(
        state.activeColors, state.score, i < forcedSlots ? drama.color : undefined);
    }
  }
};

// ============================================================================
// mergeEngine — перелив, сгорание, волна BFS (ядро, Phase 3).
// Сейчас реализована только вспомогательная topRun.
// ============================================================================
const mergeEngine = {
  // Верхний одноцветный блок стопки: цвет и длина
  topRun(stack) {
    if (!stack || !stack.tiles.length) return { color: -1, length: 0 };
    const color = stack.tiles[stack.tiles.length - 1];
    let length = 0;
    for (let i = stack.tiles.length - 1; i >= 0 && stack.tiles[i] === color; i--) length++;
    return { color, length };
  },

  // Куда собирать блок после установки стопки в cell (правило пользователя):
  //   • рядом две и больше одноцветных стопок — собираем в поставленную ячейку, потому
  //     что только она соседствует со всеми, и объединятся сразу все;
  //   • рядом ровно одна — новая стопка вливается в неё, а ячейка игрока освобождается;
  //   • рядом ни одной — стопка просто остаётся на месте.
  mergeTargetFor(state, cell) {
    if (!cell.stack) return cell;
    const color = mergeEngine.topRun(cell.stack).color;
    const sameColorNeighbors = [];
    hexMath.neighbors(cell.q, cell.r).forEach(n => {
      const nb = state.cells.get(hexMath.key(n.q, n.r));
      if (!nb || !nb.stack) return;
      if (mergeEngine.topRun(nb.stack).color === color) sameColorNeighbors.push(nb);
    });
    if (sameColorNeighbors.length >= 2) return cell;
    return sameColorNeighbors[0] || cell;
  },

  // Что перельётся в cell: верхние блоки соседей того же цвета, что верх cell.
  // Порядок соседей фиксирован — от него зависит детерминизм волны.
  computeFlows(state, cell) {
    if (!cell.stack) return [];
    const run = mergeEngine.topRun(cell.stack);
    const flows = [];
    hexMath.neighbors(cell.q, cell.r).forEach(n => {
      const nb = state.cells.get(hexMath.key(n.q, n.r));
      if (!nb || !nb.stack) return;
      const nbRun = mergeEngine.topRun(nb.stack);
      if (nbRun.color !== run.color) return;
      flows.push({ from: nb, to: cell, color: nbRun.color, count: nbRun.length });
    });
    return flows;
  },

  // Снять верхние блоки с отдающих соседей; опустевшая ячейка освобождается
  applyFlowRemoval(state, flows) {
    flows.forEach(f => {
      const stack = f.from.stack;
      stack.tiles.length -= f.count;
      if (!stack.tiles.length) f.from.stack = null;
    });
  },

  // Долить фишки в целевую стопку; возвращает число перетёкших фишек.
  //
  // Стопки в ячейке может уже не быть, и это не ошибка: в очереди волны бывают две
  // соседние ячейки, и пока planWave собирал потоки для второй, первая успела отдать
  // ей свой последний блок и опустеть. Раньше здесь падало исключение и партия
  // обрывалась (ловилось замером: seed 114 у бота sloppy). Ячейка просто занимается
  // заново: свой блок она отдала, а этот получила от другого соседа.
  applyFlowArrival(state, cell, flows) {
    let flowed = 0;
    if (!cell.stack && flows.length) {
      cell.stack = { tiles: [], cell: { q: cell.q, r: cell.r } };
    }
    flows.forEach(f => {
      for (let i = 0; i < f.count; i++) cell.stack.tiles.push(f.color);
      flowed += f.count;
    });
    return flowed;
  },

  // Очки за сгоревший блок из N фишек: первые burnBaseTiles по базовой ставке,
  // каждая сверх — по повышенной. Номер волны на очки не влияет (ADR-0004).
  burnPointsFor(tiles) {
    const s = CONFIG.scoring;
    const base = Math.min(tiles, s.burnBaseTiles);
    const over = Math.max(0, tiles - s.burnBaseTiles);
    return base * s.pointsPerTileBase + over * s.pointsPerTileOver;
  },

  // Монеты за сгоревший блок: платят только фишки сверх coinsFreeTiles
  // (ADR-0007). Блок ровно в порог — ноль монет, и это намеренно: иначе доход
  // идёт за сам факт игры, а не за то, что игрок собрал блок крупнее нужного.
  burnCoinsFor(tiles) {
    const s = CONFIG.scoring;
    return Math.max(0, tiles - s.coinsFreeTiles) * s.coinsPerBurnedTile;
  },

  // Порог сгорания растёт со счётом (Phase 28): последняя подходящая ступень —
  // тот же приём, что у radiusForScore и generators.stageFor.
  thresholdFor(score) {
    const steps = CONFIG.merge.thresholdSteps;
    let threshold = steps[0].threshold;
    steps.forEach(step => { if ((score || 0) >= step.fromScore) threshold = step.threshold; });
    return threshold;
  },

  // Сгорание: верхний блок дорос до порога — горит целиком (13 → горят 13)
  burnIfReady(state, cell) {
    if (!cell.stack) return { burned: false };
    const run = mergeEngine.topRun(cell.stack);
    if (run.length < mergeEngine.thresholdFor(state.score)) return { burned: false };
    cell.stack.tiles.length -= run.length;
    if (!cell.stack.tiles.length) cell.stack = null;
    return {
      burned: true, cell, color: run.color, count: run.length,
      points: mergeEngine.burnPointsFor(run.length),
      coins: mergeEngine.burnCoinsFor(run.length)
    };
  },

  // Контекст цепочки: очередь центров притяжения текущей волны.
  // Принимает одну ячейку или сразу несколько: буст может задеть больше одной.
  createWave(start) {
    return {
      queue: Array.isArray(start) ? start.slice() : [start],
      wave: 1,
      iterations: 0,
      combo: 0        // сколько звеньев цепочки уже дали сгорание (Phase 16)
    };
  },

  // Шаг волны, часть 1: посчитать переливы и снять фишки с соседей.
  // Разделено на plan/commit, чтобы между ними проигралась анимация полёта.
  planWave(state, ctx) {
    const plan = { wave: ctx.wave, groups: [], flows: [] };
    ctx.queue.forEach(cell => {
      if (!cell.stack) return;
      const flows = mergeEngine.computeFlows(state, cell);
      if (flows.length) mergeEngine.applyFlowRemoval(state, flows);
      plan.groups.push({ cell, flows });
      flows.forEach(f => plan.flows.push(f));
    });
    return plan;
  },

  // Шаг волны, часть 2: долить фишки, сжечь дозревшие блоки, собрать
  // изменённые ячейки в очередь следующей волны
  commitWave(state, plan, ctx) {
    let burnPoints = 0;
    let burnCoins = 0;
    let flowedTiles = 0;
    const burns = [];
    const changed = new Map();
    const mark = (cell) => changed.set(hexMath.key(cell.q, cell.r), cell);

    plan.groups.forEach(g => {
      if (g.flows.length) {
        // перелив только собирает блок; очки и монеты придут, когда он сгорит
        flowedTiles += mergeEngine.applyFlowArrival(state, g.cell, g.flows);
        mark(g.cell);
        g.flows.forEach(f => mark(f.from));   // сосед открыл следующий цвет
      }
      const burn = mergeEngine.burnIfReady(state, g.cell);
      if (burn.burned) {
        burnPoints += burn.points;
        burnCoins += burn.coins;              // монета за каждую сгоревшую фишку
        burns.push(burn);
        mark(g.cell);
      }
    });

    // Комбо — число звеньев цепочки со сгоранием внутри одного хода. Платит
    // только монетами: очки остаются читаемыми, множитель цепочки по-прежнему
    // отменён (ADR-0004). Счёт ведётся здесь, а не в драйвере, иначе
    // синхронный resolveWave и анимационный путь разошлись бы по монетам.
    let comboCoins = 0;
    if (burns.length) {
      ctx.combo++;
      comboCoins = CONFIG.scoring.comboCoinBonus * (ctx.combo - 1);
      burnCoins += comboCoins;
    }

    // в следующую волну идут только ячейки, где после всех сгораний осталась стопка
    ctx.queue = Array.from(changed.values()).filter(c => c.stack);
    ctx.wave++;
    return { burnPoints, burnCoins, flowedTiles, burns, combo: ctx.combo, comboCoins };
  },

  // Синхронное разрешение цепочки без анимации — источник правды по детерминизму
  // (тот же набор примитивов, что и у анимационного драйвера в main)
  resolveWave(state, startCell) {
    const ctx = mergeEngine.createWave(startCell);
    const steps = [];
    let totalPoints = 0;
    let totalCoins = 0;
    while (ctx.queue.length && ctx.iterations < CONFIG.merge.maxWaveIterations) {
      ctx.iterations++;
      const plan = mergeEngine.planWave(state, ctx);
      const res = mergeEngine.commitWave(state, plan, ctx);
      totalPoints += res.burnPoints;
      totalCoins += res.burnCoins;
      steps.push({
        wave: plan.wave, flows: plan.flows.length, burns: res.burns.length,
        points: res.burnPoints, coins: res.burnCoins, combo: res.combo
      });
    }
    return { steps, totalPoints, totalCoins, waves: ctx.iterations };
  }
};

// ============================================================================
// render — гексы, псевдо-3D стопки, рука, HUD, оверлей
// ============================================================================
const render = {
  ctx: null,
  backgroundCache: null,     // фон темы рисуется один раз и копируется

  // Кривые сглаживания (Phase 15). Раньше smoothstep был заинлайнен в двух местах,
  // а половина анимаций шла линейно — отсюда ощущение дёрганости.
  ease: {
    smooth: (t) => t * t * (3 - 2 * t),
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    // с перелётом: стопка «доезжает» чуть дальше и возвращается
    outBack: (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2)
  },

  // Детерминированный шум — фактура бумаги, полутон, дизеринг
  noise(x, y) {
    const v = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return v - Math.floor(v);
  },

  // Затемнение/осветление цвета: amount < 0 темнее, > 0 светлее
  shade(hex, amount) {
    if (hex[0] !== '#') return hex;       // rgba(...) из темы оставляем как есть
    const num = parseInt(hex.slice(1), 16);
    const ch = [num >> 16 & 255, num >> 8 & 255, num & 255].map(c => {
      const v = amount < 0 ? c * (1 + amount) : c + (255 - c) * amount;
      return Math.max(0, Math.min(255, Math.round(v)));
    });
    return 'rgb(' + ch[0] + ',' + ch[1] + ',' + ch[2] + ')';
  },

  // Контур гекса как path
  hexPath(cx, cy, size) {
    const ctx = render.ctx;
    const pts = hexMath.hexCorners(cx, cy, size);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < 6; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
  },

  // Пустая ячейка поля
  drawHex(cx, cy, size, fill, stroke) {
    const ctx = render.ctx;
    render.hexPath(cx, cy, size);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  },

  // Псевдо-3D стопка: слои снизу вверх, каждый следующий выше на layerOffset.
  // Нижние слои перекрыты — видны только их «бока», верхняя фишка целиком.
  // Стопка рисуется в ЭКРАННЫХ координатах: слои всегда идут вверх экрана, как бы ни
  // было повёрнуто поле. Сама фишка при этом поворачивается вокруг своего центра,
  // чтобы совпадать с ячейкой под ней.
  // Высота слоя над центром ячейки. Вынесена отдельно, потому что по ней же
  // целятся летящие фишки: иначе они падают в центр, а стопка потом «дёргается».
  // Высокая стопка сжимает шаг, поэтому позиция зависит от итоговой высоты.
  layerRise(total, index) {
    const t = CONFIG.tile;
    const visible = Math.min(total, t.maxVisibleLayers);
    const step = visible > 1
      ? Math.min(t.layerOffset, t.maxRise / (visible - 1))
      : t.layerOffset;
    return Math.max(0, index - (total - visible)) * step;
  },

  // Спрайт фишки (Phase 24). THEME.tile() ставит тень с размытием — самую дорогую
  // операцию Canvas 2D, — а кадр рисует до 61 ячейки на 12 слоёв. Рисуем фишку один
  // раз в offscreen и дальше копируем; стиль по-прежнему знает только тема.
  // Кэш той же природы, что backgroundCache: сбрасывается в applyTheme и при смене
  // размера гекса (fitLayout) — размер входит в ключ, но копить мусор незачем.
  tileCache: new Map(),
  tileSprite(color, isTop, variant, size) {
    const key = color + '|' + (isTop ? 1 : 0) + '|' + variant + '|' + Math.round(size);
    let sprite = render.tileCache.get(key);
    if (sprite) return sprite;
    const half = Math.ceil(size + CONFIG.tile.spritePad);
    const buffer = document.createElement('canvas');
    buffer.width = half * 2;
    buffer.height = half * 2;
    const bufferCtx = buffer.getContext('2d');
    const previous = render.ctx;
    render.ctx = bufferCtx;                 // тема рисует через render.*
    THEME.tile(bufferCtx, half, half, size, color, isTop, variant);
    render.ctx = previous;
    sprite = { canvas: buffer, half };
    render.tileCache.set(key, sprite);
    return sprite;
  },

  // Одна фишка с центром в (x, y) — единственная точка, через которую идут все
  // фишки игры: стопки на поле, рука, перетаскивание и летящие в волне.
  drawTile(x, y, size, color, isTop, seed) {
    const t = CONFIG.tile;
    const variants = t.spriteVariants;
    const variant = ((Math.round(seed || 0) % variants) + variants) % variants;
    // спрайт строится в округлённом размере, а до нужного дотягивается drawImage:
    // разница не больше половины шага и на глаз незаметна
    const baseSize = Math.max(t.spriteStep, Math.round(size / t.spriteStep) * t.spriteStep);
    const sprite = render.tileSprite(color, isTop, variant, baseSize);
    const half = sprite.half * (size / baseSize);
    render.ctx.drawImage(sprite.canvas, x - half, y - half, half * 2, half * 2);
  },

  drawStack(stack, cx, cy, cellSize, seed, rotation) {
    const ctx = render.ctx;
    const t = CONFIG.tile;
    const size = cellSize * t.scale;
    const total = stack.tiles.length;
    const visible = Math.min(total, t.maxVisibleLayers);
    const skipped = total - visible;
    const angle = rotation || 0;

    for (let i = 0; i < visible; i++) {
      const color = CONFIG.colors.palette[stack.tiles[skipped + i]];
      const y = cy - render.layerRise(total, skipped + i);
      const isTop = i === visible - 1;
      if (angle) {
        ctx.save();
        ctx.translate(cx, y);
        ctx.rotate(angle);
        ctx.translate(-cx, -y);
      }
      // саму фишку рисует активная тема (Phase 12), но через кэш спрайтов (Phase 24)
      render.drawTile(cx, y, size, color, isTop, (seed || 0) + i * 5);
      if (angle) ctx.restore();
    }
  },

  // Поле: сначала пустые ячейки, потом стопки сверху вниз по экрану,
  // чтобы верхние ряды не перекрывали растущие стопки нижних
  drawBoard(state) {
    const ctx = render.ctx;
    const size = hexMath.layout.size;
    state.cells.forEach(cell => {
      const key = hexMath.key(cell.q, cell.r);
      // ячейка под перетаскиваемой стопкой подсвечивается
      const isHover = state.hoverKey === key;
      // ячейки только что открывшегося кольца проявляются и подрастают
      const ring = state.newRing;
      const fresh = ring && ring.keys.has(key);
      if (fresh) ctx.globalAlpha = ring.t;
      THEME.emptyCell(ctx, cell, fresh ? size * (0.6 + 0.4 * ring.t) : size,
        isHover ? CONFIG.ui.highlightFill : CONFIG.ui.cellFill,
        isHover ? CONFIG.ui.highlightStroke : CONFIG.ui.cellStroke);
      if (fresh) ctx.globalAlpha = 1;
    });
  },

  // Стопки — отдельным слоем в экранных координатах (см. drawStack).
  // Порядок — по экранному Y, иначе при повороте перекрытие пойдёт наоборот.
  drawStacks(state) {
    const size = hexMath.layout.size;
    const rotation = state.camera.rotation;
    // стопки, которые сейчас летят бустом, рисует drawBoostAnim
    const hidden = state.boostAnim ? state.boostAnim.hide : null;
    const occupied = [];
    state.cells.forEach(cell => {
      if (!cell.stack) return;
      if (hidden && hidden.has(hexMath.key(cell.q, cell.r))) return;
      const screen = input.worldToScreen(state, cell.pixelX, cell.pixelY);
      occupied.push({ cell, screen });
    });
    occupied.sort((a, b) => a.screen.y - b.screen.y);
    occupied.forEach(({ cell, screen }) => {
      // «приземление»: только что поставленная стопка приходит из увеличенного масштаба
      const land = state.landing;
      const scale = land && land.cell === cell
        ? 1 + (CONFIG.animation.landingScale - 1) * (1 - land.t)
        : 1;
      render.drawStack(cell.stack, screen.x, screen.y, size * scale,
        cell.q * 31 + cell.r * 57, rotation);
    });
  },

  // Вспышка на месте сгоревшего блока: гекс расходится и гаснет (экранные координаты)
  drawBurns(state) {
    const anim = state.burnAnim;
    if (!anim) return;
    const ctx = render.ctx;
    const t = anim.t;
    const threshold = mergeEngine.thresholdFor(state.score) || 10;
    anim.burns.forEach(b => {
      const screen = input.worldToScreen(state, b.cell.pixelX, b.cell.pixelY);
      // крупный блок и вспыхивает шире: тот же принцип, что у осколков и тряски
      const power = Math.min(2, b.count / threshold);
      const size = hexMath.layout.size *
        (1 + CONFIG.animation.burnFlashGrow * t * power);
      ctx.globalAlpha = 1 - t;
      render.hexPath(screen.x, screen.y, size);
      ctx.fillStyle = render.shade(CONFIG.colors.palette[b.color], 0.65);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  },

  // Перелёт стопок бустом «перестановка»: летят целиком, поэтому переиспользуем
  // drawStack. При обмене стопок перелётов два, и вторую дугу отводим в другую
  // сторону — иначе стопки прошли бы одна сквозь другую посреди экрана.
  drawBoostAnim(state) {
    const anim = state.boostAnim;
    if (!anim) return;
    const a = CONFIG.animation;
    const size = hexMath.layout.size;
    const rotation = state.camera.rotation;
    const eased = render.ease.smooth(anim.t);
    const lift = Math.sin(Math.PI * anim.t);
    anim.moves.forEach((m, index) => {
      const from = input.worldToScreen(state, m.from.pixelX, m.from.pixelY);
      const to = input.worldToScreen(state, m.to.pixelX, m.to.pixelY);
      const arc = index % 2 === 0 ? -a.boostArc : a.boostArc;
      render.drawStack({ tiles: m.tiles },
        from.x + (to.x - from.x) * eased,
        from.y + (to.y - from.y) * eased + lift * arc,
        size, m.from.q * 31 + m.from.r * 57, rotation);
    });
  },

  // Осколки сгоревшего блока: разлетаются, падают и гаснут (экранные координаты)
  drawParticles(state) {
    const list = state.fx.particles;
    if (!list.length) return;
    const ctx = render.ctx;
    const a = CONFIG.animation;
    list.forEach(p => {
      const t = p.age / a.particleMs;
      const sec = p.age / 1000;
      const origin = input.worldToScreen(state, p.cell.pixelX, p.cell.pixelY);
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = CONFIG.colors.palette[p.color];
      const size = a.particleSize * (1 - t * 0.5);
      ctx.fillRect(origin.x + p.vx * sec - size / 2,
        origin.y + p.vy * sec + a.particleGravity * sec * sec / 2 - size / 2,
        size, size);
    });
    ctx.globalAlpha = 1;
  },

  // «+N очков» всплывает от сгоревшего блока к счёту
  drawFloats(state) {
    const list = state.fx.floats;
    if (!list.length) return;
    const ctx = render.ctx;
    const a = CONFIG.animation;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    list.forEach(f => {
      const t = f.age / a.floatMs;
      const origin = input.worldToScreen(state, f.cell.pixelX, f.cell.pixelY);
      ctx.globalAlpha = 1 - render.ease.smooth(t);
      // надпись комбо крупнее, акцентным цветом и выше, чтобы не села на «+N»
      ctx.font = (f.accent ? 'bold 26px' : 'bold 28px') + ' system-ui, sans-serif';
      ctx.fillStyle = f.accent ? CONFIG.ui.buttonFill : CONFIG.ui.text;
      const rise = render.ease.outCubic(t) * a.floatRise + (f.accent ? 42 : 0);
      ctx.fillText(f.text, origin.x, origin.y - rise);
    });
    ctx.globalAlpha = 1;
  },

  // Смещение тряски: затухает к концу и меняет знак каждый кадр
  shakeOffset(state) {
    const shake = state.fx.shake;
    if (!shake) return { x: 0, y: 0 };
    const a = CONFIG.animation;
    const decay = 1 - shake.age / a.shakeMs;
    const phase = shake.age / 26;
    // амплитуду задаёт сила сгорания; старое поведение — значение по умолчанию
    const amp = shake.amp || a.shakeAmp;
    return {
      x: Math.sin(phase) * amp * decay,
      y: Math.cos(phase * 1.4) * amp * decay * 0.6
    };
  },

  // Ударная волна сгорания: контур гекса расходится и гаснет. Отдельно от вспышки
  // (drawBurns) — та заливает ячейку, а это очерчивает удар и видно на крупных.
  drawRings(state) {
    const list = state.fx.rings;
    if (!list.length) return;
    const ctx = render.ctx;
    const a = CONFIG.animation;
    const size = hexMath.layout.size;
    list.forEach(r => {
      const t = r.age / a.ringMs;
      const screen = input.worldToScreen(state, r.cell.pixelX, r.cell.pixelY);
      const grow = 1 + (a.ringGrow - 1) * render.ease.outCubic(t) * r.power;
      ctx.globalAlpha = (1 - t) * 0.8;
      ctx.lineWidth = a.ringWidth * (1 - t * 0.7) * Math.min(2, r.power);
      ctx.strokeStyle = render.shade(CONFIG.colors.palette[r.color], 0.4);
      render.hexPath(screen.x, screen.y, size * grow);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  },

  // Центр слота руки — геометрия нужна и отрисовке, и вводу
  handSlotCenter(index) {
    const ui = CONFIG.ui;
    return {
      x: CONFIG.canvas.width / 2 + (index - 1) * ui.handSlotSpacing,
      y: ui.handY
    };
  },

  // Рука: 3 слота внизу, пустой слот — рамка. При пересдаче старые стопки
  // уезжают вниз и гаснут, новые падают сверху.
  drawHand(state) {
    const ctx = render.ctx;
    const size = CONFIG.ui.handHexSize;
    const a = CONFIG.animation;
    const anim = state.handAnim;
    const eased = anim ? render.ease.outCubic(anim.t) : 1;
    for (let i = 0; i < 3; i++) {
      const c = render.handSlotCenter(i);
      if (anim && anim.old[i]) {
        ctx.globalAlpha = 1 - anim.t;
        render.drawStack({ tiles: anim.old[i] }, c.x, c.y + eased * a.handSwapRise, size);
        ctx.globalAlpha = 1;
      }
      const stack = state.hand.slots[i];
      if (stack) {
        if (anim) ctx.globalAlpha = anim.t;
        render.drawStack(stack, c.x, c.y - (1 - eased) * a.handSwapRise, size);
        if (anim) ctx.globalAlpha = 1;
      } else if (!anim) {
        render.drawHex(c.x, c.y, size, 'transparent', CONFIG.ui.cellStroke);
      }
    }
  },

  // HUD: счёт по центру сверху, рекорд мельче в углу, подсказка под полем
  drawHUD(state) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;

    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.text;
    ctx.font = 'bold 52px system-ui, sans-serif';
    // на экране счёт догоняет настоящий, иначе он прыгает скачком
    const scoreText = String(Math.round(state.scoreShown));
    // Звезда рядом со счётом убрана по playtest (Phase 41): крупное число у
    // верхнего края и так читается как счёт, а значок только сдвигал его вбок.
    ctx.textAlign = 'center';
    ctx.fillText(scoreText, CONFIG.canvas.width / 2, ui.scoreY);

    // Рекорд переехал влево, к монетам (Phase 43.1, по playtest): они родственны
    // — оба про накопленное, — а правый угол вернулся плашке лиги.
    ctx.textAlign = 'left';
    // рекорд, побитый в этой партии, держится акцентным цветом до её конца
    // (Phase 20): вспышка гаснет за секунду, а факт остаётся
    ctx.fillStyle = state.recordBeaten ? ui.text : ui.textDim;
    ctx.font = '20px system-ui, sans-serif';
    const bestText = t(state.recordBeaten ? 'newRecord' : 'record') + state.best;
    ctx.fillText(bestText, ui.bestX, ui.bestY);

    render.drawCoins(state);
    render.drawLeagueBadge(state);

    // активный буст объясняет, что выбирать; иначе стартовая подсказка
    const boostHintKey = state.boost ? input.boostConfig(state.boost.kind).hint : null;
    const boostHint = boostHintKey ? t(boostHintKey) : null;
    if (boostHint || state.showHint) {
      ctx.textAlign = 'center';
      ctx.fillStyle = boostHint ? ui.text : ui.textDim;
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText(boostHint || t('hint'), CONFIG.canvas.width / 2, ui.hintY);
    }
  },

  // Слияние стопок: фишки снимаются с соседа по одной сверху и перелетают дугой,
  // ложась ровно на свои будущие места. Раньше весь блок ехал одним комком по прямой
  // и в конце скачком превращался в выросшую стопку.
  drawFlows(state) {
    const anim = state.anim;
    if (!anim) return;
    const ctx = render.ctx;
    const a = CONFIG.animation;
    const tileSize = hexMath.layout.size * CONFIG.tile.scale;
    const rotation = state.camera.rotation;

    anim.flows.forEach(f => {
      const from = input.worldToScreen(state, f.from.pixelX, f.from.pixelY);
      const to = input.worldToScreen(state, f.to.pixelX, f.to.pixelY);
      // фишки уже сняты с соседа (planWave), поэтому исходную высоту восстанавливаем
      const leftBehind = f.from.stack ? f.from.stack.tiles.length : 0;
      const fromTotal = leftBehind + f.count;
      // Доли от общей длительности шага: своя фишка летит travel, соседняя
      // трогается на step позже. Длительность посчитана в flowDuration по самой
      // высокой стайке, поэтому у низких остаётся запас — они успевают раньше.
      const duration = anim.duration || a.flowTravelMs;
      const travelPart = a.flowTravelMs / duration;
      const stepPart = a.flowStepMs / duration;
      const color = CONFIG.colors.palette[f.color];

      for (let i = 0; i < f.count; i++) {
        // верхняя фишка снимается первой — у неё нулевая задержка
        const delay = (f.count - 1 - i) * stepPart;
        const local = Math.max(0, Math.min(1, (anim.t - delay) / travelPart));
        const eased = render.ease.smooth(local);
        const lift = Math.sin(Math.PI * local);

        const startY = from.y - render.layerRise(fromTotal, leftBehind + i);
        const endY = to.y - render.layerRise(f.finalTotal, f.baseLayer + i);
        const x = from.x + (to.x - from.x) * eased;
        const y = startY + (endY - startY) * eased - lift * a.flowArc;

        // тень на поле под фишкой: пока она в воздухе, тень мельче и слабее
        if (lift > 0.02) {
          ctx.save();
          ctx.globalAlpha = a.flowShadow * (1 - lift * 0.55);
          ctx.fillStyle = CONFIG.ui.cardShadow;
          ctx.beginPath();
          ctx.ellipse(x, y + lift * a.flowArc, tileSize * (0.72 - lift * 0.18),
            tileSize * (0.30 - lift * 0.08), 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(x, y);
        // бумага чуть покачивается в полёте и приближается на вершине дуги
        ctx.rotate(rotation + lift * a.flowFlutter * (i % 2 ? -1 : 1));
        const grow = 1 + lift * a.flowLift;
        ctx.scale(grow, grow);
        render.drawTile(0, 0, tileSize, color, i === f.count - 1,
          f.from.q * 31 + f.from.r * 57 + i * 5);
        ctx.restore();
      }
    });
  },

  // Перетаскиваемая стопка — поверх всего, в размере ячейки поля (экранные координаты)
  drawDrag(state) {
    const d = state.drag;
    if (!d) return;
    // рисуем догоняющую позицию, а не палец: ячейку под стопкой при этом
    // по-прежнему считает input по пальцу, поэтому точность не страдает
    const screen = input.worldToScreen(state, d.shownX, d.shownY);
    render.drawStack(d.stack, screen.x, screen.y, hexMath.layout.size, 0,
      state.camera.rotation);
  },

  // --- Значки: векторные пути (Phase 22, переписаны на Path2D в Phase 23) ----
  // Отдельных SVG-файлов быть не может (ADR-0001: один файл, работает офлайн),
  // но язык путей SVG доступен и без файлов: Path2D принимает ту же строку «M…»,
  // что и атрибут d. Системные эмодзи отвергнуты: они разные на каждой ОС и
  // глянцевые поверх матовой бумаги.
  //
  // Все пути нарисованы в квадрате 24×24 с отступом 2 — как принято в любом наборе
  // иконок. Метафоры выбраны узнаваемые: подписи с кнопок бустов убраны, и значок
  // должен объяснять действие сам.
  //
  // Набор пересобран в Phase 31 по выбору пользователя из dev-песочницы
  // icons-preview.html (там же лежат генераторы гекса и шестерёнки: считать их
  // вершины руками — гарантированная ошибка, а в игру уезжает готовая строка).
  iconPaths: {
    // монета: гекс-жетон с гекс-чеканкой — валюта игры про соты
    coin: { fill: 'M21.4 12L16.7 20.14L7.3 20.14L2.6 12L7.3 3.86L16.7 3.86Z',
            stroke: 'M16.6 12L14.3 15.98L9.7 15.98L7.4 12L9.7 8.02L14.3 8.02Z',
            lineWidth: 1.5 },
    // рекорд: кубок, чаша срезана гексом
    trophy: { fill: 'M6.4 3.8h11.2v3.4L14.8 12H9.2L6.4 7.2zM10.9 12.6h2.2V17h-2.2zM7.6 17.6h8.8v2.6H7.6z',
              stroke: 'M6.4 5.2H3.8v2a3.4 3.4 0 0 0 3 3.4M17.6 5.2h2.6v2a3.4 3.4 0 0 1-3 3.4',
              lineWidth: 1.7 },
    // настройки: шестерёнка, но зубцов шесть — рифма с гекс-сеткой поля.
    // Дырка — второй контур в обратную сторону: заливка nonzero вычитает его сама,
    // поэтому отверстие не стоит второй операции fill.
    gear: { fill: 'M21.96 10.32L21.96 13.68L18.94 14.58L17.7 16.72L18.44 19.78L15.52 21.47L13.23 19.3L10.77 19.3L8.48 21.47L5.56 19.78L6.3 16.72L5.06 14.58L2.04 13.68L2.04 10.32L5.06 9.42L6.3 7.28L5.56 4.22L8.48 2.53L10.77 4.7L13.23 4.7L15.52 2.53L18.44 4.22L17.7 7.28L18.94 9.42ZM8.6 12a3.4 3.4 0 1 0 6.8 0a3.4 3.4 0 1 0 -6.8 0Z' },
    // Значки быстрой панели (Phase 41). Метафоры общепринятые — панель без
    // подписей, объяснять действие больше нечем.
    // звуки: динамик с двумя волнами
    sound: { fill: 'M4 9.4h3.6L12.4 5v14L7.6 14.6H4z',
             stroke: 'M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8',
             lineWidth: 1.8 },
    // музыка: восьмая нота
    note: { fill: 'M11.2 4.2h2.2v10.2h-2.2zM13.4 4.2c1.6.6 4 1.4 4.6 3.6-1-1.2-2.8-1.6-4.6-1.8z',
            stroke: 'M11.2 14.6a2.9 2.9 0 1 0 0 4.2 2.9 2.9 0 1 0 0-4.2Z',
            lineWidth: 1.8 },
    // вибрация: телефон и по волне с каждой стороны
    vibro: { fill: 'M8.4 3.6h7.2a1.6 1.6 0 0 1 1.6 1.6v13.6a1.6 1.6 0 0 1-1.6 1.6H8.4a1.6 1.6 0 0 1-1.6-1.6V5.2a1.6 1.6 0 0 1 1.6-1.6zM9.4 6h5.2v12H9.4z',
             stroke: 'M3.6 9.4v5.2M20.4 9.4v5.2',
             lineWidth: 1.8 },
    // «ещё»: три точки — общепринятый знак «остальные настройки»
    more: { fill: 'M12 4.4a2 2 0 1 0 0 4 2 2 0 1 0 0-4zM12 10a2 2 0 1 0 0 4 2 2 0 1 0 0-4zM12 15.6a2 2 0 1 0 0 4 2 2 0 1 0 0-4z' },
    // Экран с «плей» и объективом сбоку (Phase 42): метка «этот буст можно
    // взять за ролик». Рисуется вместо цены на кнопке, до которой не хватило монет.
    video: { fill: 'M7.6 9.4l4.6 2.6-4.6 2.6z',
             stroke: 'M3 6.6h11.4a1.4 1.4 0 0 1 1.4 1.4v8a1.4 1.4 0 0 1-1.4 1.4H3a1.4 1.4 0 0 1-1.4-1.4V8a1.4 1.4 0 0 1 1.4-1.4zM17 10.6l4-2.6v8l-4-2.6z' },
    // перестановка: две стрелки навстречу — общепринятый знак обмена
    move: { stroke: 'M4 9h14.4M15 5.6L18.4 9 15 12.4M20 15H5.6M9 11.6L5.6 15 9 18.4',
            lineWidth: 2.2 },
    // пересдача: круговая стрелка — общепринятый «обновить»
    reroll: { stroke: 'M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.8 4.4v3.6h-3.6',
              lineWidth: 2.2 },
    // убрать: молоток. Корзина говорила «удалить файл», а стопку игрок ломает
    remove: { fill: 'M4.6 4.2h14.8a1.6 1.6 0 0 1 1.6 1.6v3.4a1.6 1.6 0 0 1-1.6 1.6H4.6a1.6 1.6 0 0 1-1.6-1.6V5.8a1.6 1.6 0 0 1 1.6-1.6zM10.7 10.8h2.6v10.4h-2.6z',
              lineWidth: 2 }
  },

  // Path2D строится один раз на путь: кнопок три, а кадров шестьдесят в секунду.
  // Кэш той же природы, что backgroundCache и gradientCache.
  iconCache: new Map(),
  iconPath(d) {
    let path = render.iconCache.get(d);
    if (!path) {
      path = new Path2D(d);
      render.iconCache.set(d, path);
    }
    return path;
  },

  // Нарисовать значок с центром в (x, y). Цвета приходят снаружи, поэтому
  // значки меняются вместе с темой.
  drawIcon(name, x, y, size, fill, stroke) {
    const icon = render.iconPaths[name];
    if (!icon || typeof Path2D === 'undefined') return false;
    const ctx = render.ctx;
    const k = size / 24;
    ctx.save();
    ctx.translate(x - size / 2, y - size / 2);
    ctx.scale(k, k);
    ctx.lineWidth = icon.lineWidth || 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (icon.fill) {
      ctx.fillStyle = fill;
      ctx.fill(render.iconPath(icon.fill));
    }
    if (icon.stroke) {
      ctx.strokeStyle = stroke || fill;
      ctx.stroke(render.iconPath(icon.stroke));
    }
    ctx.restore();
    return true;
  },

  // Монета: тень остаётся мягкой — та же матовость, что и у фишек
  coinIcon(x, y, r) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    ctx.save();
    ctx.shadowColor = ui.cardShadow;
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 2;
    render.drawIcon('coin', x, y, r * 2.4, ui.coinColor,
      render.shade(ui.coinColor, -0.32));
    ctx.restore();
  },

  trophyIcon(x, y, size) {
    render.drawIcon('trophy', x, y, size, CONFIG.ui.coinColor,
      render.shade(CONFIG.ui.coinColor, -0.3));
  },

  boostIcon(kind, x, y, size) {
    render.drawIcon(kind, x, y, size, CONFIG.ui.text, CONFIG.ui.text);
  },

  // Ширина строки: measureText есть не во всяком контексте (в тестах канвас —
  // заглушка), поэтому на этот случай считаем по средней ширине символа.
  textWidth(text, perChar) {
    const ctx = render.ctx;
    const measured = ctx.measureText ? ctx.measureText(text) : null;
    return measured && measured.width ? measured.width : text.length * perChar;
  },

  // Кошелёк: монетка и число слева сверху
  drawCoins(state) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cx = ui.coinsX + ui.coinRadius;

    render.coinIcon(cx, ui.coinsY, ui.coinRadius);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.text;
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText(String(Math.round(state.coinsShown)), cx + ui.coinRadius + 8, ui.coinsY);
  },

  // Прямоугольник кнопки «Заново» — геометрия нужна и отрисовке, и вводу
  restartButtonRect() {
    const ui = CONFIG.ui;
    return {
      x: CONFIG.canvas.width / 2 - ui.buttonW / 2,
      y: CONFIG.canvas.height / 2 + ui.buttonOffsetY,
      w: ui.buttonW,
      h: ui.buttonH
    };
  },

  // Нижний ряд экрана настроек (Phase 32): «Перезапустить» и «Назад». Кнопки
  // полноразмерные, а не половинки, как «Возрождение» с «Заново» на оверлее конца:
  // там ряд жмёт третья строка, а здесь 240×2 плюс зазор свободно влезают в 720.
  // Высоту и низ берём у restartButtonRect — она уже ездит вместе с канвасом.
  settingsRestartRect() {
    const ui = CONFIG.ui;
    const row = render.restartButtonRect();
    const total = ui.buttonW * 2 + ui.settings.buttonGap;
    return { x: (CONFIG.canvas.width - total) / 2, y: row.y, w: ui.buttonW, h: row.h };
  },
  settingsBackRect() {
    const left = render.settingsRestartRect();
    return { x: left.x + left.w + CONFIG.ui.settings.buttonGap, y: left.y,
             w: left.w, h: left.h };
  },

  // Нижний ряд оверлея конца делят «Возрождение» и «Заново» (Phase 37), а над
  // ними — «Рейтинг» и «Статистика» (Phase 43): четвёртой строки оверлей не
  // выдерживает, она наезжает на строку кошелька, поэтому вход в лидерборд встал
  // половинкой рядом со статистикой, а не отдельной кнопкой.
  //
  // Ряд шире кнопки «Заново» (Phase 41, по playtest): половинки от 240 давали
  // 115 px, и слово «Возрождение» вылезало за края плашки. Ширину задаёт
  // CONFIG.ui.gameOverRow — она же зажата тестом по длине самой длинной подписи.
  reviveButtonRect() {
    const row = CONFIG.ui.gameOverRow;
    const btn = render.restartButtonRect();
    const half = (row.w - row.gap) / 2;
    return { x: (CONFIG.canvas.width - row.w) / 2, y: btn.y, w: half, h: btn.h };
  },
  restartHalfRect() {
    const left = render.reviveButtonRect();
    return { x: left.x + left.w + CONFIG.ui.gameOverRow.gap, y: left.y,
             w: left.w, h: left.h };
  },
  // Верхний ряд оверлея: «Рейтинг» слева, «Статистика» справа. Ширина и зазор —
  // те же, что у ряда «Возрождение»/«Заново», иначе кнопки не встали бы в столбик.
  rankButtonRect() {
    const row = CONFIG.ui.gameOverRow;
    const btn = render.restartButtonRect();
    const half = (row.w - row.gap) / 2;
    return { x: (CONFIG.canvas.width - row.w) / 2, y: btn.y - btn.h - 2,
             w: half, h: btn.h - 12 };
  },
  statsButtonRect() {
    const left = render.rankButtonRect();
    return { x: left.x + left.w + CONFIG.ui.gameOverRow.gap, y: left.y,
             w: left.w, h: left.h };
  },

  // --- Экран лидерборда (Phase 43) -------------------------------------------
  // Устроен как экран статистики: заливка цветом темы, заголовок, кнопка «Назад»
  // по той же геометрии. Аватары не грузим (ADR-0001 запрещает внешние картинки,
  // да и глянцевое фото поверх бумаги смотрится чужеродно) — вместо них кружок с
  // первой буквой имени, нарисованный кодом.
  signInButtonRect() {
    const btn = render.restartButtonRect();
    return { x: btn.x, y: CONFIG.ui.rank.signInY, w: btn.w, h: btn.h - 8 };
  },

  // Строки идут сверху вниз; между топом и окрестностью игрока просвет, в
  // котором рисуется многоточие — иначе «8-е место, 41-е место» читается как
  // ошибка. gap считается по первой строке, чей номер оторвался от предыдущего.
  rankRowY(rows, i) {
    const cfg = CONFIG.ui.rank;
    let y = cfg.rowsY;
    for (let n = 0; n < i; n++) {
      y += cfg.rowStep;
      if (rows[n + 1] && rows[n + 1].gapBefore) y += cfg.gapAfterTop;
    }
    return y;
  },

  // Разрыв в нумерации — это граница между топом и окрестностью игрока
  rankRows(screen) {
    const rows = (screen.entries || []).map(e => ({ ...e }));
    rows.forEach((row, i) => {
      row.gapBefore = i > 0 && row.rank > rows[i - 1].rank + 1;
    });
    return rows;
  },

  drawRank(state) {
    const screen = state.rankScreen;
    if (!screen || !screen.open) return;
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.rank;
    const W = CONFIG.canvas.width;

    ctx.globalAlpha = screen.t === undefined ? 1 : screen.t;
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, W, CONFIG.canvas.height);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.overlayText;
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(t('leaderboard'), W / 2, cfg.titleY);

    const rows = render.rankRows(screen);
    if (screen.status !== 'ready' || rows.length === 0) {
      const keys = { loading: 'lbLoading', unavailable: 'lbUnavailable' };
      ctx.fillStyle = ui.textDim;
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText(t(keys[screen.status] || 'lbEmpty'), W / 2, cfg.rowsY + cfg.rowStep);
    } else {
      rows.forEach((row, i) => {
        const y = render.rankRowY(rows, i);
        if (row.gapBefore) {
          ctx.textAlign = 'center';
          ctx.fillStyle = ui.textDim;
          ctx.font = '20px system-ui, sans-serif';
          ctx.fillText('•••', W / 2, y - cfg.gapAfterTop / 2 - cfg.rowStep / 2);
        }
        // своя строка — плашкой: в списке из одиннадцати строк её иначе не найти
        if (row.me) {
          render.paperCard(cfg.rankX - 40, y - cfg.rowH / 2,
            cfg.scoreRight - cfg.rankX + 80, cfg.rowH, ui.buttonRadius, ui.cardFill);
        }
        ctx.fillStyle = row.me ? ui.text : ui.textDim;
        ctx.textAlign = 'right';
        ctx.font = 'bold 20px system-ui, sans-serif';
        ctx.fillText(String(row.rank), cfg.rankX, y);
        render.rankAvatar(row, cfg.nameX - cfg.avatarR - 10, y);
        ctx.textAlign = 'left';
        ctx.font = '20px system-ui, sans-serif';
        ctx.fillText(render.clipText(row.name || t('lbHidden'),
          CONFIG.leaderboard.nameWidth), cfg.nameX, y);
        ctx.textAlign = 'right';
        ctx.font = 'bold 20px system-ui, sans-serif';
        ctx.fillText(String(row.score), cfg.scoreRight, y);
      });
    }

    // Приглашение войти — только текстом и кнопкой, и только для гостя.
    // Само окно входа откроется по нажатию, не раньше (требование 1.2.1).
    if (screen.status === 'ready' && !screen.authorized) {
      ctx.textAlign = 'center';
      ctx.fillStyle = ui.textDim;
      ctx.font = '19px system-ui, sans-serif';
      ctx.fillText(t('lbSignInWhy'), W / 2, cfg.signInY - 34);
      const btn = render.signInButtonRect();
      render.withPress(state, 'signIn', btn, () => {
        render.paperCard(btn.x, btn.y, btn.w, btn.h, ui.buttonRadius, ui.buttonFill);
        ctx.fillStyle = ui.buttonText;
        ctx.textAlign = 'center';
        ctx.font = 'bold 22px system-ui, sans-serif';
        ctx.fillText(t('signIn'), btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
      });
    }

    const back = render.restartButtonRect();
    render.paperCard(back.x, back.y, back.w, back.h, ui.buttonRadius, ui.buttonFill);
    ctx.textAlign = 'center';
    ctx.fillStyle = ui.buttonText;
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(t('back'), back.x + back.w / 2, back.y + back.h / 2 + 1);
    ctx.globalAlpha = 1;
  },

  // Кружок с первой буквой имени вместо аватара
  rankAvatar(row, x, y) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const r = ui.rank.avatarR;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = row.me ? ui.buttonFill : ui.cardFill;
    ctx.fill();
    ctx.fillStyle = ui.text;
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText((row.name || '?').slice(0, 1).toUpperCase(), x, y + 1);
  },

  // Длинное имя обрезается с многоточием: имена игроков площадки бывают любыми,
  // а колонка одна на всех
  clipText(text, maxWidth) {
    let out = String(text);
    if (render.textWidth(out, 11) <= maxWidth) return out;
    while (out.length > 1 && render.textWidth(out + '…', 11) > maxWidth) {
      out = out.slice(0, -1);
    }
    return out + '…';
  },

  // Плашка лиги (Phase 37, вернулась в Phase 43). На площадке показывает место в
  // таблице, без неё — дивизион по личному рекорду: игрок должен видеть одно и
  // то же место интерфейса везде, а не пустоту там, где лидерборда нет.
  leagueBadgeRect() {
    const c = CONFIG.ui.league;
    return { x: CONFIG.canvas.width - c.w - c.margin, y: c.top, w: c.w, h: c.h };
  },

  // Кубок красится цветом ступени (Phase 43.1): слово «Бронза» само по себе
  // ничего не обещает, а лестница кубков видна с одного взгляда. Значок и
  // подпись центрируются как одна группа — иначе на длинном слове плашка
  // выглядит перекошенной.
  drawLeagueBadge(state) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.league;
    const b = render.leagueBadgeRect();
    const label = leagueLabel(state);
    const color = leagueTier(state.best).color;
    render.withPress(state, 'league', b, () => {
      render.paperCard(b.x, b.y, b.w, b.h, cfg.radius, ui.cardFill);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 17px system-ui, sans-serif';
      const cy = b.y + b.h / 2;
      const textW = render.textWidth(label, 10);
      const groupW = cfg.iconSize + cfg.iconGap + textW;
      const left = b.x + (b.w - groupW) / 2;
      render.drawIcon('trophy', left + cfg.iconSize / 2, cy, cfg.iconSize,
        color, render.shade(color, -0.3));
      ctx.fillStyle = ui.text;
      ctx.fillText(label, left + cfg.iconSize + cfg.iconGap, cy + 1);
    });
  },

  // Экран статистики поверх оверлея конца партии
  drawStats(state) {
    const screen = state.statsScreen;
    if (!screen || !screen.open) return;
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const W = CONFIG.canvas.width;
    const H = CONFIG.canvas.height;

    // тот же приём, что и на оверлее конца: заливка цветом темы, а не тёмная
    ctx.globalAlpha = screen.t === undefined ? 1 : screen.t;
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.overlayText;
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.fillText(t('stats'), W / 2, CONFIG.ui.stats.titleY);

    // Личные счётчики (Phase 20) переехали сюда из отдельного экрана статистики
    // (Phase 37): оверлей конца не выдерживал четвёртой кнопки, а данные
    // родственные — всё про «как я играю».
    const stats = screen.values || emptyStats();
    const cfg = ui.stats;

    // Рекорд стоит отдельно и крупнее счётчиков: это единственная мета-прогрессия.
    // Отсчитываем его от блока счётчиков, а не от центра канваса: блок задан
    // абсолютными числами и на высоком экране центр от него уезжает.
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText(t('yourRecord') + state.best, W / 2,
      cfg.countersY - cfg.counterStep * 3);
    ctx.textAlign = 'center';
    ctx.fillStyle = ui.overlayText;
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText(t('statsTitle'), W / 2, cfg.countersY - cfg.counterStep);
    ctx.fillStyle = ui.textDim;
    ctx.font = '19px system-ui, sans-serif';
    [[t('statsGames'), stats.games],
     [t('statsBurns'), stats.burns],
     [t('statsBiggest'), stats.biggestBlock],
     [t('statsCombo'), stats.longestCombo],
     [t('statsCoins'), stats.coins]].forEach((row, i) => {
      ctx.fillText(row[0] + row[1], W / 2, cfg.countersY + i * cfg.counterStep);
    });

    const back = render.restartButtonRect();
    render.paperCard(back.x, back.y, back.w, back.h, ui.buttonRadius, ui.buttonFill);
    ctx.textAlign = 'center';
    ctx.fillStyle = ui.buttonText;
    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(t('back'), back.x + back.w / 2, back.y + back.h / 2 + 1);
    ctx.globalAlpha = 1;
  },

  // --- Диалог «ролик за буст» (Phase 42) ------------------------------------
  // Требование 4.5.1: из текста и кнопки должно быть однозначно понятно, что
  // сейчас будет реклама и что именно игрок за неё получит. Поэтому на плашке
  // и вопрос про рекламу, и название буста, который применится бесплатно.

  adPromptRect() {
    const cfg = CONFIG.ui.adPrompt;
    return {
      x: (CONFIG.canvas.width - cfg.w) / 2,
      y: (CONFIG.canvas.height - cfg.h) / 2,
      w: cfg.w, h: cfg.h
    };
  },

  // Кнопки в ряд внизу плашки: «Смотреть» слева, «Отмена» справа
  adButtonRect(index) {
    const cfg = CONFIG.ui.adPrompt;
    const card = render.adPromptRect();
    const total = cfg.buttonW * 2 + cfg.buttonGap;
    const left = card.x + (card.w - total) / 2;
    return {
      x: left + index * (cfg.buttonW + cfg.buttonGap),
      y: card.y + card.h - cfg.buttonH - 24,
      w: cfg.buttonW, h: cfg.buttonH
    };
  },
  adWatchRect() { return render.adButtonRect(0); },
  adCancelRect() { return render.adButtonRect(1); },

  drawAdPrompt(state) {
    const prompt = state.adPrompt;
    if (!prompt) return;
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const cfg = ui.adPrompt;
    const card = render.adPromptRect();
    const cx = card.x + card.w / 2;
    const cy = card.y + card.h / 2;

    ctx.globalAlpha = prompt.t === undefined ? 1 : prompt.t;
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);
    render.paperCard(card.x, card.y, card.w, card.h, cfg.radius, ui.cardFill);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.text;
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText(t('adTitle'), cx, cy + cfg.titleY);
    ctx.fillStyle = ui.textDim;
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText(t('adBody'), cx, cy + cfg.bodyY);

    // значок и название буста: игрок должен видеть ровно то, что получит
    const config = input.boostConfig(prompt.kind);
    render.boostIcon(prompt.kind, cx, cy + cfg.boostY, 40);
    ctx.fillStyle = ui.text;
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText(t(config.label), cx, cy + cfg.boostY + 42);

    const watch = render.adWatchRect();
    render.withPress(state, 'ad:watch', watch, () => {
      render.paperCard(watch.x, watch.y, watch.w, watch.h, ui.buttonRadius, ui.buttonFill);
      ctx.fillStyle = ui.buttonText;
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillText(t('adWatch'), watch.x + watch.w / 2, watch.y + watch.h / 2 + 1);
    });
    const cancel = render.adCancelRect();
    render.withPress(state, 'ad:cancel', cancel, () => {
      render.roundRectPath(cancel.x, cancel.y, cancel.w, cancel.h, ui.buttonRadius);
      ctx.lineWidth = 2;
      ctx.strokeStyle = ui.text;
      ctx.stroke();
      ctx.fillStyle = ui.text;
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText(t('adCancel'), cancel.x + cancel.w / 2, cancel.y + cancel.h / 2 + 1);
    });
    ctx.globalAlpha = 1;
  },

  // Предупреждение перед межстраничной (Phase 42.2). Плашка узкая и без кнопок:
  // отвечать не надо, через noticeMs она сама сменится роликом. Смысл её в том,
  // чтобы игрок убрал палец — тап по внезапной рекламе доки считают фродом.
  adNoticeRect() {
    const cfg = CONFIG.ui.adPrompt;
    return {
      x: (CONFIG.canvas.width - cfg.w) / 2,
      y: (CONFIG.canvas.height - cfg.buttonH * 2) / 2,
      w: cfg.w, h: cfg.buttonH * 2
    };
  },

  drawAdNotice(state) {
    if (!state.adNotice) return;
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const card = render.adNoticeRect();
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);
    render.paperCard(card.x, card.y, card.w, card.h, ui.adPrompt.radius, ui.cardFill);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.text;
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillText(t('adNotice'), card.x + card.w / 2, card.y + card.h / 2);
  },

  // Бумажный лист: заливка и тень, обводка — только если нужна акцентная рамка.
  // Главный приём стиля «Слои бумаги»: глубину даёт тень, а не контур.
  paperCard(x, y, w, h, r, fill, stroke) {
    const ctx = render.ctx;
    ctx.save();
    // тень мягкая и почти без смещения: матовая бумага лежит на столе,
    // а не парит над ним (Phase 22)
    ctx.shadowColor = CONFIG.ui.cardShadow;
    ctx.shadowBlur = 9;
    ctx.shadowOffsetY = 4;
    render.roundRectPath(x, y, w, h, r);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
    if (stroke) {
      render.roundRectPath(x, y, w, h, r);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }
  },

  // Скруглённый прямоугольник (roundRect есть не везде — рисуем сами)
  roundRectPath(x, y, w, h, r) {
    const ctx = render.ctx;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },

  // Оверлей конца игры: счёт, рекорд, кнопка «Заново»
  drawGameOver(state) {
    const ctx = render.ctx;
    const ui = CONFIG.ui;
    const W = CONFIG.canvas.width;
    const H = CONFIG.canvas.height;

    ctx.globalAlpha = state.overlayT;      // оверлей проявляется, а не выпрыгивает
    ctx.fillStyle = ui.overlayBg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ui.overlayText;
    ctx.font = 'bold 46px system-ui, sans-serif';
    ctx.fillText(t('gameOver'), W / 2, H / 2 - 120);

    ctx.font = 'bold 64px system-ui, sans-serif';
    ctx.fillText(String(state.score), W / 2, H / 2 - 55);
    ctx.font = '22px system-ui, sans-serif';
    ctx.fillStyle = ui.textDim;
    ctx.fillText(t('points'), W / 2, H / 2 - 12);

    // новый рекорд отмечаем явно — это единственная мета-прогрессия в игре
    const isRecord = state.score >= state.best && state.score > 0;
    ctx.font = '24px system-ui, sans-serif';
    ctx.fillStyle = isRecord ? ui.overlayText : ui.textDim;
    ctx.fillText(t(isRecord ? 'newRecord' : 'record') + state.best, W / 2, H / 2 + 26);

    ctx.font = '20px system-ui, sans-serif';
    ctx.fillStyle = ui.textDim;
    ctx.fillText(t('wallet') + state.coins, W / 2, H / 2 + 58);

    const outlineButton = (rect, label) => render.withPress(state, label, rect, () => {
      render.roundRectPath(rect.x, rect.y, rect.w, rect.h, ui.buttonRadius);
      ctx.lineWidth = 2;
      ctx.strokeStyle = ui.overlayText;
      ctx.stroke();
      ctx.fillStyle = ui.overlayText;
      ctx.font = '18px system-ui, sans-serif';
      ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
    });
    outlineButton(render.rankButtonRect(), t('leaderboard'));
    outlineButton(render.statsButtonRect(), t('stats'));

    // «Возрождение»: цена растёт с каждым разом за партию, поэтому она написана
    // прямо на кнопке. Не хватило монет — кнопка приглушена, как у бустов.
    const reviveBtn = render.reviveButtonRect();
    const cost = reviveCost(state);
    const affordable = state.coins >= cost;
    render.withPress(state, 'revive', reviveBtn, () => {
      ctx.globalAlpha = state.overlayT * (affordable ? 1 : 0.45);
      render.paperCard(reviveBtn.x, reviveBtn.y, reviveBtn.w, reviveBtn.h,
        ui.buttonRadius, ui.buttonFillDark);
      ctx.fillStyle = ui.buttonText;
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.fillText(t('revive'), reviveBtn.x + reviveBtn.w / 2,
        reviveBtn.y + reviveBtn.h / 2 - 9);
      // цена с монеткой: группа по центру кнопки, приём тот же, что у счёта в HUD
      ctx.font = '17px system-ui, sans-serif';
      const costText = String(cost);
      const costW = render.textWidth(costText, 9);
      const groupX = reviveBtn.x + (reviveBtn.w - (costW + 20)) / 2;
      render.coinIcon(groupX + 7, reviveBtn.y + reviveBtn.h / 2 + 14, 7);
      ctx.textAlign = 'left';
      ctx.fillText(costText, groupX + 20, reviveBtn.y + reviveBtn.h / 2 + 14);
      ctx.textAlign = 'center';
      ctx.globalAlpha = state.overlayT;
    });

    const btn = render.restartHalfRect();
    render.withPress(state, 'restart', btn, () => {
      render.paperCard(btn.x, btn.y, btn.w, btn.h, ui.buttonRadius, ui.buttonFill);
      ctx.fillStyle = ui.buttonText;
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillText(t('restart'), btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
    });
    ctx.globalAlpha = 1;
  },

  // Отклик нажатия (Phase 30): кнопка вдавливается и отходит. Ключ — что именно
  // нажали, чтобы соседние кнопки не дёргались вместе с ней.
  pressScaleFor(state, key) {
    const press = state.fx && state.fx.press;
    if (!press || press.key !== key) return 1;
    const a = CONFIG.animation;
    const t = Math.min(1, press.age / a.pressMs);
    // вниз и обратно: sin даёт мягкий возврат без отдельной кривой
    return 1 - (1 - a.pressScale) * Math.sin(Math.PI * t);
  },

  // Нарисовать содержимое кнопки вдавленным: масштаб вокруг её центра
  withPress(state, key, rect, draw) {
    const scale = render.pressScaleFor(state, key);
    const ctx = render.ctx;
    if (scale === 1) { draw(); return; }
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);
    draw();
    ctx.restore();
  },

  // Прямоугольник кнопки буста по индексу — нужен и отрисовке, и вводу
  boostButtonRect(index) {
    const bar = CONFIG.ui.boostBar;
    const count = CONFIG.boosts.length;
    const totalWidth = count * bar.w + (count - 1) * bar.gap;
    const left = (CONFIG.canvas.width - totalWidth) / 2;
    return { x: left + index * (bar.w + bar.gap), y: bar.y, w: bar.w, h: bar.h };
  },

  // Панель бустов: название, цена и монетка. Недоступный буст приглушён,
  // активный — подсвечен.
  drawBoostBar(state) {
    const ctx = render.ctx;
    const bar = CONFIG.ui.boostBar;
    CONFIG.boosts.forEach((boost, index) => {
      const rect = render.boostButtonRect(index);
      const active = state.boost && state.boost.kind === boost.kind;
      const affordable = state.coins >= boost.cost;
      const press = render.pressScaleFor(state, 'boost:' + boost.kind);
      if (press !== 1) {
        ctx.save();
        ctx.translate(rect.x + rect.w / 2, rect.y + rect.h / 2);
        ctx.scale(press, press);
        ctx.translate(-(rect.x + rect.w / 2), -(rect.y + rect.h / 2));
      }

      // активный буст выделяется акцентной рамкой, обычный — только тенью
      render.paperCard(rect.x, rect.y, rect.w, rect.h, bar.radius,
        active ? bar.fillActive : bar.fill, active ? bar.strokeActive : null);

      ctx.globalAlpha = affordable ? 1 : 0.4;
      // значок занимает всю плашку: три буста различаются с одного взгляда
      render.boostIcon(boost.kind, rect.x + rect.w / 2, rect.y + rect.h / 2,
        rect.h * bar.iconScale);

      // цена — под кнопкой, а не внутри неё (Phase 33): внутри она отнимала у
      // значка половину плашки. Одно число без монетки — решение пользователя.
      //
      // Монет не хватило, но за буст можно посмотреть ролик (Phase 42) — вместо
      // цены рисуем значок видео: приглушённую кнопку игрок иначе не нажмёт и
      // про рекламу не узнает.
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const byAd = !affordable && canOfferAd(state, boost.kind);
      if (byAd) {
        ctx.globalAlpha = 1;
        render.drawIcon('video', rect.x + rect.w / 2, rect.y + rect.h + bar.priceGap,
          bar.priceSize * 1.3, CONFIG.ui.text, CONFIG.ui.text);
      } else {
        ctx.font = Math.round(bar.priceSize) + 'px system-ui, sans-serif';
        ctx.fillStyle = affordable ? CONFIG.ui.text : CONFIG.ui.textDim;
        ctx.fillText(String(boost.cost), rect.x + rect.w / 2,
          rect.y + rect.h + bar.priceGap);
      }
      ctx.globalAlpha = 1;
      if (press !== 1) ctx.restore();
    });
  },

  // Подсветка ячеек, доступных для выбора активным бустом
  drawBoostTargets(state) {
    const boost = state.boost;
    if (!boost) return;
    const ctx = render.ctx;
    const size = hexMath.layout.size;
    state.cells.forEach(cell => {
      if (!input.isBoostTarget(state, cell)) return;
      render.hexPath(cell.pixelX, cell.pixelY, size * 0.97);
      ctx.lineWidth = 3;
      ctx.strokeStyle = CONFIG.ui.highlightStroke;
      ctx.stroke();
    });
    // уже выбранная ячейка отмечается ярче
    if (boost.from) {
      render.hexPath(boost.from.pixelX, boost.from.pixelY, size * 0.97);
      ctx.lineWidth = 4;
      ctx.strokeStyle = CONFIG.ui.text;
      ctx.stroke();
    }
  },

  // Кнопка возврата обзора — в правом нижнем углу игрового поля
  resetCameraButtonRect() {
    const c = CONFIG.camera.resetButton;
    return {
      x: CONFIG.canvas.width - c.size - c.margin,
      y: CONFIG.ui.boardArea.bottom - c.size,
      w: c.size,
      h: c.size
    };
  },

  // Значок возврата: виден только когда поле повёрнуто
  drawResetCameraButton(state) {
    if (Math.abs(state.camera.rotation) < 1e-6) return;
    const ctx = render.ctx;
    const b = render.resetCameraButtonRect();
    render.paperCard(b.x, b.y, b.w, b.h, 10, CONFIG.ui.cardFill);
    render.hexPath(b.x + b.w / 2, b.y + b.h / 2, b.w * 0.26);
    ctx.fillStyle = CONFIG.ui.text;
    ctx.fill();
  },

  // --- Экран настроек (Phase 19) --------------------------------------------
  // Своих цветов у экрана нет: всё из палитры темы, иначе стиль пришлось бы
  // поддерживать в двух местах. Геометрия — в CONFIG.ui.settings.

  // Шестерёнка стоит в ряду бустов (Phase 37, схема пользователя), но прижата
  // к самому правому краю (Phase 41, по playtest): от ряда бустов её отделяет
  // зазор, и она читается как отдельная кнопка, а не как четвёртый буст.
  // Высота и низ берутся у кнопок бустов, поэтому она едет вместе с ними при
  // масштабировании низа (Phase 33).
  settingsButtonRect() {
    const bar = CONFIG.ui.boostBar;
    const last = render.boostButtonRect(CONFIG.boosts.length - 1);
    const size = bar.h;
    return {
      x: CONFIG.canvas.width - size - CONFIG.ui.settings.button.margin,
      y: last.y,
      w: size,
      h: size
    };
  },

  // Значок — шестерёнка из общего набора (Phase 31). Раньше он рисовался мимо
  // системы значков, гексом с вырезанной серединой, и был единственным местом,
  // где стиль набора приходилось поддерживать отдельно.
  drawSettingsButton(state) {
