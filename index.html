  if (state.adBoostsUsed >= CONFIG.ads.freeBoostsPerRun) return false;
  return !!input.boostConfig(kind);
}

function openAdPrompt(state, kind) {
  state.adPrompt = { kind, t: 0 };
  state.boost = null;         // выбор ячейки подождёт ответа на вопрос
  syncGameplay(state);        // ролик — это пауза геймплея (пп. 1.19.3, 4.7)
  startFx(state);             // плашка проявляется, а не выпрыгивает
  requestRender();
  return kind;
}

function closeAdPrompt(state) {
  state.adPrompt = null;
  syncGameplay(state);
  requestRender();
  return true;
}

// «Смотреть»: плашка уходит сразу, дальше всё решают колбэки площадки. Буст
// выдаётся только по onRewarded — onClose приходит и тогда, когда игрок закрыл
// ролик на середине.
function watchAdForBoost(state) {
  const prompt = state.adPrompt;
  if (!prompt) return false;
  const kind = prompt.kind;
  closeAdPrompt(state);
  Platform.showRewarded(
    () => grantFreeBoost(state, kind),
    () => requestRender());
  return true;
}

// Награда пришла: следующее применение этого буста бесплатно, и он сразу
// становится активным — лишний тап после рекламы игрок бы не понял.
function grantFreeBoost(state, kind) {
  state.adBoostsUsed++;
  state.freeBoost = kind;
  Audio.ring();               // награда пришла: тот же голос, что у нового кольца
  input.toggleBoost(state, kind);
  requestRender();
  return kind;
}

// --- Автопоказ рекламы в паузе (Phase 42.2) --------------------------------
// Пользователь хотел ролик «раз в пять минут сам». Таймер посреди хода делать
// нельзя: доки приводят setInterval(showFullscreenAdv, …) как антипример, а
// п. 4.4 требует логических пауз — случайный тап по всплывшей рекламе считается
// фродом и режет доход. Поэтому созревший показ ждёт паузу: игрок ничего не
// делает idleMs или только что получил новую руку.

function markActivity(state) {
  state.lastActionMs = Date.now();
  return state.lastActionMs;
}

// Можно ли показать ролик прямо сейчас. Список длинный намеренно: реклама поверх
// диалога, перетаскиваемой стопки или анимации — это ровно то, что запрещает п. 4.4.
function canShowAdNow(state) {
  if (!Platform.hasSdk() || !Platform.adReady()) return false;
  if (state.pageActive === false) return false;
  if (state.isGameOver || state.isAnimating) return false;
  if (state.adNotice || state.adPrompt || state.boost || state.drag) return false;
  if (state.settings && state.settings.open) return false;
  if (state.statsScreen && state.statsScreen.open) return false;
  if (state.rankScreen && state.rankScreen.open) return false;
  if (state.quickPanel && state.quickPanel.open) return false;
  return true;
}

// Предупреждение перед роликом. Анимации у плашки нет намеренно: juice длиннее
// 1000 мс уходит в бесконечную рекурсию RAF (в тестах часы прыгают на секунду за
// кадр), а ждать надо полторы. Плашка просто висит и забирает ввод.
function showAdNotice(state) {
  if (!canShowAdNow(state)) return false;
  state.adNotice = { since: Date.now() };
  syncGameplay(state);        // для площадки геймплей уже кончился (пп. 1.19.3, 4.7)
  requestRender();
  setTimeout(() => runNoticedAd(state), CONFIG.ads.noticeMs);
  return true;
}

function runNoticedAd(state) {
  if (!state.adNotice) return false;
  Platform.showInterstitial(() => {
    state.adNotice = null;
    markActivity(state);      // отсчёт простоя начинается заново
    syncGameplay(state);
    requestRender();
  });
  return true;
}

// Повод первый: игрок ничего не делает. Зовётся из setInterval — именно из него,
// а не из самоперезаводящегося setTimeout: тот в тестах немедленный и зациклил бы
// сборку (та же ловушка, что у планировщика музыки).
function checkIdleAd(state) {
  if (Date.now() - state.lastActionMs < CONFIG.ads.idleMs) return false;
  return showAdNotice(state);
}

// Повод второй: рука опустела и раздана новая. Зовётся из finishWave после того,
// как анимация падения руки закончилась и снят isAnimating.
function maybeAdOnNewHand(state) {
  return showAdNotice(state);
}

// Цена применения. Единственная точка, где решается, платный ход или нет:
// списаний два (обычные бусты и «Пересдача»), и правило должно быть одно.
function boostCostFor(state, kind) {
  const config = input.boostConfig(kind);
  if (!config) return 0;
  if (state.freeBoost !== kind) return config.cost;
  state.freeBoost = null;     // оплаченное роликом применение тратится один раз
  return 0;
}

// --- Экран настроек (Phase 19) ---------------------------------------------
// Своего состояния у регуляторов нет: они правят живой CONFIG, а хранилище
// получает снимок при каждом изменении. Партию настройки не трогают и restart
// переживают, как кошелёк.

function openSettings(state) {
  state.settings = { open: true, t: 0, drag: null };
  state.quickPanel = null;    // полный экран заменяет быструю панель целиком
  syncGameplay(state);        // меню — это пауза (п. 1.19.3)
  startFx(state);             // экран проявляется, а не выпрыгивает
  requestRender();
}

// Быстрая панель (Phase 41). Шестерёнка теперь открывает её, а не экран
// настроек: три самых частых переключателя должны быть в один тап.
function toggleQuickPanel(state) {
  if (state.quickPanel && state.quickPanel.open) {
    closeQuickPanel(state);
    return false;
  }
  state.quickPanel = { open: true, t: 0 };
  startFx(state);             // панель выезжает, а не появляется скачком
  requestRender();
  return true;
}

// Панель не обнуляется сразу: ей нужно уехать обратно, поэтому open снимается,
// а сам объект убирает stepFx, когда t дойдёт до нуля.
function closeQuickPanel(state) {
  if (!state.quickPanel) return;
  state.quickPanel.open = false;
  startFx(state);
  requestRender();
}

// Включён ли тумблер. Громкости живут числами 0…1, вибрация — флагом.
function quickToggleOn(key) {
  if (key === 'sfx') return CONFIG.audio.volumeSfx > 0;
  if (key === 'music') return CONFIG.audio.music.volume > 0;
  if (key === 'haptics') return CONFIG.haptics.enabled;
  return true;
}

// Последняя ненулевая громкость: без неё включение после выключения давало бы
// ноль и тумблер выглядел бы сломанным. Хранится в CONFIG, а не в хранилище, —
// это память одной сессии, а не настройка.
const quickLastVolume = { sfx: 1, music: 1 };

function quickToggle(state, key) {
  if (key === 'haptics') {
    CONFIG.haptics.enabled = !CONFIG.haptics.enabled;
    // отдача на включение: игрок должен почувствовать, что оно работает
    if (CONFIG.haptics.enabled) Haptics.vibrate(CONFIG.haptics.burnBig);
  } else if (key === 'sfx') {
    const on = CONFIG.audio.volumeSfx > 0;
    if (on) quickLastVolume.sfx = CONFIG.audio.volumeSfx;
    Audio.setSfxVolume(on ? 0 : quickLastVolume.sfx || 1);
  } else if (key === 'music') {
    const on = CONFIG.audio.music.volume > 0;
    if (on) quickLastVolume.music = CONFIG.audio.music.volume;
    Audio.setMusicVolume(on ? 0 : quickLastVolume.music || 1);
  }
  persistSettings();
  requestRender();
}

function closeSettings(state) {
  state.settings = null;
  persistSettings();
  syncGameplay(state);
  requestRender();
}

function persistSettings() {
  Storage.put({ settings: {
    sfx: CONFIG.audio.volumeSfx,
    music: CONFIG.audio.music.volume,
    haptics: CONFIG.haptics.enabled,
    lang: CONFIG.lang
  } });
}

// Прочитанное из хранилища раскладывается через те же сеттеры, что и ползунки,
// поэтому живой контекст (если он уже есть) подхватит громкость сразу.
// Пропущенное или битое значение остаётся тем, что стоит в CONFIG.
function applySettings(values) {
  if (!values || typeof values !== 'object') return false;
  const clamp = (v) => (typeof v === 'number' && isFinite(v)
    ? Math.min(1, Math.max(0, v)) : null);
  const sfx = clamp(values.sfx);
  const music = clamp(values.music);
  if (sfx !== null) Audio.setSfxVolume(sfx);
  if (music !== null) Audio.setMusicVolume(music);
  if (typeof values.haptics === 'boolean') CONFIG.haptics.enabled = values.haptics;
  if (values.lang) setLang(values.lang);
  return true;
}

function restart() {
  // новое поколение: циклы прежней партии, если они ещё крутятся, теперь молчат
  GameState.generation++;
  GameState.radius = radiusForScore(0);
  hexMath.fitLayout(GameState.radius);
  GameState.cells = hexMath.generateCells(GameState.radius);
  GameState.score = 0;
  GameState.best = Storage.data.best;
  GameState.coins = Storage.data.coins;   // кошелёк не сбрасывается новой партией
  GameState.activeColors = CONFIG.board.radiusSteps[0].colors;
  GameState.isAnimating = false;
  GameState.isGameOver = false;
  GameState.showHint = true;
  GameState.rescuesUsed = 0;       // лимит выручки — на партию, а не на сессию
  GameState.revivesUsed = 0;       // цена возрождения тоже считается за партию
  GameState.rescuedLastDeal = false;
  GameState.recordBeaten = false;
  GameState.runStats = { burns: 0, biggestBlock: 0, longestCombo: 0, coins: 0 };
  GameState.burnThreshold = mergeEngine.thresholdFor(0);
  GameState.drag = null;
  GameState.boost = null;
  GameState.statsScreen = null;
  GameState.rankScreen = null;    // место в таблице (GameState.rank) переживает
                                  // партию: оно про игрока, а не про эту доску
  GameState.settings = null;      // громкости при этом остаются: они не про партию
  GameState.quickPanel = null;
  GameState.adPrompt = null;
  GameState.adNotice = null;
  GameState.lastActionMs = Date.now();
  GameState.freeBoost = null;
  GameState.adBoostsUsed = 0;     // лимит роликов — на партию, как у возрождения
  GameState.hoverKey = null;
  resetCamera(GameState);
  input.spin = null;
  GameState.anim = null;
  GameState.burnAnim = null;
  GameState.landing = null;
  GameState.newRing = null;
  GameState.boostAnim = null;
  GameState.handAnim = null;
  // эффекты гасим и счётчики ставим сразу: новая партия не должна доезжать до нуля
  GameState.fx = { particles: [], rings: [], floats: [], shake: null, press: null };
  GameState.scoreShown = GameState.score;
  GameState.coinsShown = GameState.coins;
  GameState.overlayT = 1;
  generators.fillStartBoard(GameState);
  generators.dealHand(GameState);
  // во время init контекста ещё нет — первая раздача проходит молча сама собой
  Audio.deal();
  updateMusicTension(GameState);
  syncGameplay(GameState);        // новая партия — геймплей начался (Phase 40)
  requestRender();
}

// --- QA-хуки (ADR-0002) ----------------------------------------------------
// Только чтение состояния и фиксация seed; на геймплей не влияют.
// Seed можно задать в адресной строке: index.html?seed=42

// Текстовый снимок партии — для автотестов и отладки без скриншотов
function renderGameToText() {
  const lines = [];
  lines.push('score=' + GameState.score + ' best=' + GameState.best +
    ' colors=' + GameState.activeColors +
    ' free=' + generators.freeCells(GameState).length +
    (GameState.isGameOver ? ' GAMEOVER' : '') +
    (GameState.isAnimating ? ' ANIMATING' : ''));
  Array.from(GameState.cells.keys()).sort().forEach(key => {
    const stack = GameState.cells.get(key).stack;
    lines.push(key + ': ' + (stack ? stack.tiles.join('') : '-'));
  });
  lines.push('hand: ' + GameState.hand.slots
    .map(s => (s ? s.tiles.join('') : '-')).join(' | '));
  return lines.join('\n');
}

function applySeedFromUrl() {
  const match = /[?&]seed=(-?\d+)/.exec(location.search);
  if (match) generators.rng.seed(parseInt(match[1], 10));
}

// Замер кадра по адресу `?fps=1`. Кадры игра рисует по событию, поэтому для
// замера их нужно заказывать самим. Именно setInterval, а не самоперезаводящийся
// RAF: в тестах RAF выполняется синхронно и такой цикл ушёл бы в рекурсию —
// та же ловушка, что и у планировщика музыки (Phase 18).
function applyFpsFromUrl() {
  if (!/[?&]fps=1/.test(location.search)) return;
  render.fpsMeter.on = true;
  setInterval(requestRender, 16);
}

// QA-хуки живут за адресом `?debug=1` (Phase 43). Раньше они висели на window
// всегда, и это было безобидно, пока счёт никуда не уходил: с лидербордом
// __GAME_STATE__.score и __SET_SEED__ становятся способом накрутить таблицу из
// консоли браузера. `?seed=` и `?fps=1` остались открытыми — ими ничего не
// накрутишь.
function qaHooksAllowed() {
  return /[?&]debug=1/.test(location.search);
}

function exposeQaHooks() {
  if (!qaHooksAllowed()) return false;
  window.__GAME_STATE__ = GameState;
  window.render_game_to_text = renderGameToText;
  window.__SET_SEED__ = (value) => { generators.rng.seed(value); restart(); };
  return true;
}

// Вкладка ушла из виду или вернулась. На эту же функцию с Phase 40 повешены
// game_api_pause/resume площадки: у них та же работа — реклама и сворачивание
// браузера для игры неразличимы.
function setPageActive(active) {
  GameState.pageActive = active;
  syncGameplay(GameState);
  if (active) {
    Audio.resume();
    return true;
  }
  Audio.suspend();
  Storage.flush();     // отложенная запись до закрытия вкладки могла не успеть
  return false;
}

// Идёт ли прямо сейчас то, что площадка считает геймплеем (п. 1.19.3). Считаем
// из состояния, а не расставляем парные start/stop по коду: экраны открываются
// поверх оверлея конца, и вручную чередование не удержать — а два start подряд
// это замечание модерации.
function gameplayActive(state) {
  return state.pageActive !== false && !state.isGameOver &&
    !state.adPrompt && !state.adNotice &&
    !(state.settings && state.settings.open) &&
    !(state.statsScreen && state.statsScreen.open) &&
    !(state.rankScreen && state.rankScreen.open);
}

function syncGameplay(state) {
  return Platform.setPlaying(gameplayActive(state));
}

// Облако площадки приехало и слилось с локальным снимком: партия уже идёт, и
// живые рекорд с кошельком надо подтянуть на месте.
function adoptStorageProgress() {
  if (Storage.data.best > GameState.best) GameState.best = Storage.data.best;
  if (Storage.data.coins > GameState.coins) GameState.coins = Storage.data.coins;
  requestRender();
  return true;
}

function init() {
  const canvas = document.getElementById('game');
  render.ctx = canvas.getContext('2d');
  Storage.load();
  if (!Storage.data.stats) Storage.data.stats = emptyStats();
  setLang(detectLang());            // язык браузера — пока игрок не выбрал свой
  applyTheme(Object.keys(THEMES)[0]);
  applySettings(Storage.data.settings);   // громкости и язык до первого звука
  applySeedFromUrl();
  applyFpsFromUrl();
  captureUiBase();                        // снимок базовой вёрстки до правок
  applyCanvasSize(canvas, GameState);       // высота канваса под форму окна
  restart();
  input.attach(canvas, GameState);
  if (typeof window !== 'undefined' && window.addEventListener) {
    // поворот экрана и смена размера окна перестраивают вёрстку без перезагрузки
    const relayout = () => applyCanvasSize(canvas, GameState);
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', relayout);
  }
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange',
      () => setPageActive(!document.hidden));
  }
  // Простой игрока — повод показать созревшую рекламу (Phase 42.2). Кадры игра
  // рисует по событию, RAF в затишье стоит, поэтому нужен свой таймер; без
  // площадки он каждый раз упирается в canShowAdNow и ничего не делает.
  setInterval(() => checkIdleAd(GameState), CONFIG.ads.checkMs);
  exposeQaHooks();
  // Площадка подключается последней и параллельно: ресурсов у игры нет, ждать
  // сеть ей незачем — она уже готова, о чём и сообщает markGameReady (Phase 40).
  Platform.markGameReady();
  Platform.load();
}

init();
</script>
</body>
</html>
